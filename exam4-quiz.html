function featureClick(t, ds){
  if(gameClick(t, ds)) return true;
  if('plsave' in ds){
    var v = (document.getElementById('pl-date') || {}).value || '';
    if(!/^\d{4}-\d{2}-\d{2}$/.test(v)){ toast('Pick a date first'); return true; }
    S.plan.date = v; S.plan.cleared = false; S.plan.editing = false; S.plan.today = null; persist(); render();
    toast('📅 Plan set: ' + fmtDate(v)); return true;
  }
  if('plclear' in ds){ S.plan.date = ''; S.plan.cleared = true; S.plan.editing = false; S.plan.today = null; persist(); render(); return true; }
  if('pledit' in ds){ S.plan.editing = !S.plan.editing; render(); return true; }
  if(ds.goal){ S.plan.goal = +ds.goal; S.plan.today = null; persist(); render(); return true; }
  if('tfmode' in ds){ S.settings.sataTF = !S.settings.sataTF; persist(); render(); return true; }
  if(ds.ncards){ S.settings.newCards = +ds.ncards; persist(); render(); return true; }
  if('cstart' in ds){ startCards(); return true; }
  if('cshow' in ds){ if(CS){ CS.show = true; render(); } return true; }
  if(ds.crate){ rateCard(+ds.crate); return true; }
  if('cend' in ds){ if(CS) CS.i = CS.q.length; render(); return true; }
  if('coach' in ds){ coachRun(); return true; }
  if(route === 'q' && R && R.cur){
    var c = R.cur;
    if(ds.tf && c.phase === 'ask'){
      var kv = ds.tf.split(':'), p = +kv[0], v2 = kv[1] === '1';
      if(c.tf[p] === v2) delete c.tf[p]; else c.tf[p] = v2;
      c.sel = Object.keys(c.tf).filter(function(k){ return c.tf[k] === true; }).map(Number);
      render(); return true;
    }
    if(ds.ai && c.phase === 'rev'){
      if(ds.ai === 'send'){ var inp = document.getElementById('ai-in'); aiRun('send', inp ? inp.value : ''); return true; }
      if(ds.ai === 'stop'){ if(c.ai && c.ai.ctl) try { c.ai.ctl.abort(); } catch(e){} return true; }
      aiRun(ds.ai); return true;
    }
    if(ds.aipick !== undefined && c.ai && c.ai.q && c.ai.pick == null){ c.ai.pick = +ds.aipick; render(); return true; }
  }
  return false;
}
document.addEventListener('keydown', function(e){

};
function seeded(seed){ var x = (hashN(seed) % 2147483646) + 1; return function(){ x = (x * 16807) % 2147483647; return (x - 1) / 2147483646; }; }
function weakestSec(){
  var best = null, bm = 70;
  D.sections.forEach(function(s){ var m = mastery(s.id); if(m != null && m < bm && D.items.some(function(it){ return it.s === s.id && baseAllowed(it); })){ bm = m; best = s.id; } });
  return best;
}
function makeQuests(){
  // slot 1: volume · slot 2: the biggest learning need · slot 3: a game
  var dk = dayKey(), rnd = seeded('quests ' + dk), g = todayGoal(), c = planCounts();
  var list = [{ id:'ans', goal:clamp(Math.round(g.goal * 0.35 / 5) * 5, 15, 50) }], learn = [], play = [];
  if(c.unseen > 20) learn.push({ id:'fresh', w:3, goal:10 });
  learn.push({ id:'sata', w:recentSataMisses() > 0 ? 3 : 1.5, goal:3 });
  if(D.items.filter(function(it){ return baseAllowed(it) && isWeak(it); }).length >= 3) learn.push({ id:'prove', w:2.5, goal:3 });
  var untried = D.items.filter(function(it){ return it.b && baseAllowed(it) && !(st(it) && st(it).n); }).length;
  if(untried >= 3) learn.push({ id:'book', w:2.5, goal:Math.min(5, untried) });
  var ws = weakestSec(); if(ws) learn.push({ id:'weak', w:2, goal:5, sec:ws });
  play.push({ id:'boss', w:2, goal:1 }, { id:'blitz', w:2, goal:15 }, { id:'combo', w:1, goal:5 }, { id:'twin', w:0.8, goal:2 });
  if(CARDS.length) play.push({ id:'cards', w:1.2, goal:20 });
  var pick = function(L){ var tot = L.reduce(function(a, x){ return a + x.w; }, 0), r = rnd() * tot, k = 0; for(; k < L.length - 1; k++){ r -= L[k].w; if(r <= 0) break; } return L[k]; };
  [pick(learn), pick(play)].forEach(function(q){ list.push({ id:q.id, goal:q.goal, sec:q.sec }); });
  list.forEach(function(q){ q.prog = 0; q.done = false; });
  return { day:dk, list:list, chest:0, msg:'' };
}
function quests(){ var g = GM(); if(!g.q || g.q.day !== dayKey() || !Array.isArray(g.q.list)) g.q = makeQuests(); return g.q; }
function questBump(id, n, absolute, sec){
  var Q = quests(), hit = false;
  Q.list.forEach(function(q){
    if(q.id !== id || q.done) return;
    if(id === 'weak' && q.sec !== sec) return;
    q.prog = absolute ? Math.max(q.prog, n || 0) : q.prog + (n || 1);
    if(q.prog >= q.goal){
      q.prog = q.goal; q.done = true; hit = true;
      var x = addXP(QDEF[q.id].xp, 'quest');
      banner('📜 Quest done: ' + esc(QDEF[q.id].txt(q)) + ' <b>+' + x + ' XP</b>', 'quest'); sfx('chest');
    }
  });
  if(hit && Q.chest === 0 && Q.list.every(function(q){ return q.done; })){
    Q.chest = 1; var g = GM(); g.cnt.qdays = (g.cnt.qdays || 0) + 1;
    banner('🎁 All 3 quests done: open your chest on the home screen', 'quest'); confetti(40);

}

function comboNow(){ if(Date.now() - GC.t > 30 * MIN) GC.n = 0; return GC.n; }
function gameAnswer(it, res, guess, c, prev){
  var g = GM(), right = res === 'ok' || res === 'lucky', x = res === 'ok' ? 10 : res === 'lucky' ? 7 : (guess ? 4 : 0), bits = [];
  comboNow(); GC.n = right ? GC.n + 1 : 0; GC.t = Date.now();
  if(GC.n > (g.bestCombo || 0)) g.bestCombo = GC.n;
  if(R) R.bestCombo = Math.max(R.bestCombo || 0, GC.n);
  var cb = GC.n >= 3 ? Math.min(5, GC.n - 2) : 0; x += cb;
  if(it.m && right){ x += 3; bits.push('☑️ select-all +3'); g.cnt.sata = (g.cnt.sata || 0) + 1; questBump('sata'); }
  var wasWeak = !!(prev && (prev.res === 'wrong' || prev.res === 'lucky' || prev.res === 'skip'));
  if(res === 'ok' && prev && prev.res === 'wrong'){ x += 5; bits.push('💪 comeback +5'); g.cnt.prove = (g.cnt.prove || 0) + 1; }
  if(res === 'ok' && wasWeak) questBump('prove');
  if(!guess) g.sureRun = res === 'ok' ? (g.sureRun || 0) + 1 : 0;
  if(!prev || !prev.n) questBump('fresh');
  if(it.b && (!prev || !prev.n)) questBump('book');
  if(c.twin && right) questBump('twin');
  questBump('weak', 1, false, it.s);
  questBump('combo', GC.n, true);
  questBump('ans');
  var boosted = (g.boost || 0) > 0, got = addXP(x, 'ans');
  c.gx = { xp:got, combo:GC.n, cb:cb, bits:bits, boosted:boosted && got > 0, conf:(!guess && res === 'wrong') };
  if(R && R.boss){
    var B = R.boss;
    if(right){ B.hp = Math.max(0, B.hp - 1); B.hits++; c.gx.hit = res === 'ok' ? 'crit' : 'lucky'; }
    else { B.hearts = Math.max(0, B.hearts - 1); c.gx.hurt = true; }
  }
  sfx(c.gx.hurt ? 'hurt' : res === 'ok' ? (R && R.boss ? 'hit' : 'ok') : res === 'lucky' ? 'lucky' : 'wrong');
  checkBadges(); persist();
}

/* ---------- boss battles ---------- */
/* BOSSES is built from config.bosses near the top of the engine. */
function bossItems(ch){ return D.items.filter(function(it){ return baseAllowed(it) && (ch === 'all' || chOf(it.s) === ch); }); }
function bossRest(P){ return P.filter(function(it){ return !it.b && it.k !== 'hall' && it.k !== 'sign'; }); }
function bossSize(ch){
  var P = bossItems(ch), book = P.filter(function(it){ return it.b; }).length;
  if(book) return ch === 'all' ? { hp:15, n:20 } : { hp:book, n:book + 4 };   // built around the book questions (unchanged)
  // no book questions here: the hardest items mixed with his weak ones ({ hp:8, n:12 } per chapter, { hp:15, n:20 } for all).
  // A bank with fewer eligible items than n shrinks the fight: HP stays at least 2 below the question count,
  // so every fight still ends in a win or a loss (n - hp >= 2 means 3 misses come before the questions run out).
  var sz = ch === 'all' ? { hp:15, n:20 } : { hp:8, n:12 }, n = Math.min(sz.n, bossRest(P).length);
  return { hp:Math.min(sz.hp, Math.max(n ? 1 : 0, n - 2)), n:n, mixed:true };
}
function bossMixed(P, n, ch){
  // up to half the fight is his weak items, the rest the hardest items (highest d); jitter (same size as the
  // book-boss ranking's) lets a rematch reshuffle among items of similar difficulty
  var hardFirst = function(L){ return L.map(function(it){ return [(+it.d || 0) + Math.random() * 0.3, it]; }).sort(function(a, b){ return b[0] - a[0]; }).map(function(x){ return x[1]; }); };
  var weak = hardFirst(P.filter(isWeak)).slice(0, Math.ceil(n / 2)), rest = P.filter(function(it){ return weak.indexOf(it) < 0; }), hard;
  if(ch === 'all'){   // the final boss takes the hardest from every chapter in turn
    var per = CHIDS.map(function(c){ return hardFirst(rest.filter(function(it){ return chOf(it.s) === c; })); }); hard = [];
    for(var r = 0, more = true; more; r++){ more = false; per.forEach(function(L){ if(r < L.length){ hard.push(L[r]); more = true; } }); }
  } else hard = hardFirst(rest);
  return shuffle(weak.concat(hard.slice(0, n - weak.length)));
}
function startBoss(ch){
  if(!BOSSES[ch]) return;
  var P = bossItems(ch);
  var book = shuffle(P.filter(function(it){ return it.b; }));
  var rank = function(it){ var s = st(it); return (isWeak(it) ? 0 : !s ? 1 : 2) - it.d * 2 + Math.random() * 0.6; };
  var rest = bossRest(P).map(function(it){ return [rank(it), it]; })
    .sort(function(a, b){ return a[0] - b[0]; }).map(function(x){ return x[1]; });
  var sz = bossSize(ch), q;
  if(sz.mixed) q = bossMixed(bossRest(P), sz.n, ch);
  else if(ch === 'all'){ var bk = book.slice(0, 12); q = shuffle(bk.concat(rest.slice(0, sz.n - bk.length))); }
  else q = shuffle(book.concat(rest.slice(0, 4)));
  if(!q.length || !sz.hp){ toast('Not enough questions for this boss yet'); return; }
  var snap = {}; D.sections.forEach(function(s){ snap[s.id] = mastery(s.id); });
  R = { mode:'boss', arg:ch, filter:null, used:{}, requeue:[], i:0, n:q.length, res:[], lastSec:null, cur:null, streak:0, start:snap, t0:Date.now(), gxp:0,
    boss:{ ch:ch, q:q.map(function(it){ return it.id; }), hp:sz.hp, max:sz.hp, hearts:3, hits:0 } };
  sfx('hit'); nextQ();
}
function bossPick(R){
  var id = R.boss.q[R.i]; if(!id || !ITEM[id]) return null;
  var it = ITEM[id];
  return { it:it, why:'👾 Boss fight · ' + (it.b ? 'book question ' + it.b : (isWeak(it) ? 'one of your weak spots' : 'one of your hardest') + ', from ' + secName(it.s)) };
}
function bossOver(){ return !!(R && R.boss && (R.boss.hp <= 0 || R.boss.hearts <= 0)); }
function bossResult(){
  var B = R.boss, bo = BOSSES[B.ch];
  if(B.won) return '<div class="card boss-res win"><div class="br-em" aria-hidden="true">' + bo.em + '🏆</div><h1>You beat ' + esc(bo.name) + '!</h1><p>' + B.hits + ' hits, ' + (3 - B.hearts) + ' ❤️ lost. <b>+' + (B.xp || 0) + ' XP</b> and a new badge.</p></div>';
  if(B.hearts <= 0) return '<div class="card boss-res lose"><div class="br-em" aria-hidden="true">' + bo.em + '</div><h1>' + esc(bo.name) + ' wins this one</h1><p>You landed <b>' + B.hits + ' of ' + B.max + '</b> hits. Read the misses below, then hit Rematch: the questions reshuffle.</p></div>';
  return '<div class="card boss-res"><div class="br-em" aria-hidden="true">🏳️</div><h1>You left the fight</h1><p>' + esc(bo.name) + ' still has ' + B.hp + ' of ' + B.max + ' HP. Rematch any time.</p></div>';
}

/* ---------- Select-All Blitz ---------- */
var BZLEN = 60000;
/* Short "source" rationales ("Book.", "On your professor’s slide.") get a full sentence in Blitz; any other rationale shows as written.
   bzKey() reads any one-word possessive in a slide/table cite ("On the slide.", older banks' pronoun forms) as "your professor’s". */
var BZGEN = { 'Book.':1, 'On the list.':1, 'On the same list.':1, 'On your professor’s slide.':2, 'On your professor’s table.':2, 'Highlighted on your professor’s slide.':2, 'Not on the list.':0, 'Not listed.':0, 'Not in your book.':0 };
function bzKey(w){ return w.trim().replace(/'/g, '’').replace(/^(On|Highlighted on) (?:\S+ )?(?:professor’s |instructor’s )?(slide|table)\.$/i, '$1 your professor’s $2.'); }
function bzWhy(it, oi, truth){
  var w = String(it.w[oi] || ''), k = BZGEN[bzKey(w)];
  if(k === undefined) return w;
  if(truth) return k === 2 ? 'Your professor’s slide lists it for this question.' : 'Your book lists it for this question.';
  return 'Your book doesn’t list it for this question.';
}
function blitzPool(ch){ return D.items.filter(function(it){ return it.m && baseAllowed(it) && !it.c && !it.img && strip(it.q).length <= 240 && (ch === 'all' || chOf(it.s) === ch); }); }
function blitzBest(ch){ return (GM().blitz[ch] || {}).best || 0; }
function blitzStart(){
