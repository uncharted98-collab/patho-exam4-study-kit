14-infert-labs", "ch": "14", "s": "r-fert", "topic": "Infertility", "f": "Infertility · labs & diagnosis?", "b": "★ Semen analysis (first test for male): Low count or poor motility if male factor (Checks sperm quantity and quality); ★ Basal body temperature for 2–3 months: About 0.3 °C (0.5 °F) rise at ovulation (Progesterone rises after ovulation and warms the body); Cervical mucus check: Thin, watery, copious near ovulation (Estrogen makes mucus receptive to sperm); Home ovulation kit: Detects LH surge (LH surge comes just before ovulation); Hysterosalpingography (Fig 14.13): Dye flows freely, or stops at a blockage (Shows if uterus and tubes are open (patent)); Laparoscopy: Adhesions, endometriosis outside uterus (Scope looks at structures outside uterus and tubes); Amenorrhea work-up (Fig 14.12): hCG, PRL, TSH, FSH steps (Rules out pregnancy, prolactin and thyroid causes, ovarian failure)", "k": "table"}, {"id": "cd-dz-c14-infert-risk", "ch": "14", "s": "r-fert", "topic": "Infertility", "f": "Infertility · risk factors?", "b": "STIs/pelvic infection (high risk); Endometriosis; PCOS; Cryptorchidism; Scrotal heat", "k": "table"}, {"id": "cd-dz-c14-infert-comp", "ch": "14", "s": "r-fert", "topic": "Infertility", "f": "Infertility · complications?", "b": "Emotional distress; ovarian hyperstimulation with ovulation drugs; Prognosis: Not given as a number in this file; Clomiphene leads to ovulation in 75–80% of women, but pregnancy rate is at most 40–50%", "k": "table"}, {"id": "cd-dz-c14-infert-tx", "ch": "14", "s": "r-fert", "topic": "Infertility", "f": "Infertility · treatment?", "b": "Supportive counseling; Teaching about intercourse frequency; avoid lubricants (can act as spermicide); Basic health; Treat infections fast and fully; Surgery for leiomyomas, endometriosis, adhesions; Clomiphene citrate to induce ovulation; Drugs to lower prolactin if hyperprolactinemia; Artificial insemination; In vitro fertilization; letrozole or clomiphene are first options for ovulatory dysfunction; Gonadotropins if these fail", "k": "table"}, {"id": "cd-dz-c14-infert-nurse", "ch": "14", "s": "r-fert", "topic": "Infertility", "f": "Infertility · nursing priorities?", "b": "Use a private, calm space and open questions; Rationale: Infertility is \"highly complex and emotionally charged.\"; Teach both partners together when possible; Rationale: Either or both partners can be the cause; Teach BBT charting and ovulation kit use; Rationale: Helps time intercourse and confirm ovulation; Teach to avoid lubricants and scrotal heat (hot tubs); Rationale: Lubricants can kill sperm; Heat stops sperm making; Screen for STI symptoms and urge early care; Rationale: Pelvic infection is a top cause of tubal scarring", "k": "table"}, {"id": "cd-dz-c14-endo-patho", "ch": "14", "s": "r-pelvic", "topic": "Endometriosis", "f": "Endometriosis · what goes wrong?", "b": "Endometrial tissue grows outside the uterus (Fig 14.11, red-blue nodules on the ovary); It reacts to hormones; This causes pelvic adhesions; Pelvic structures get distorted; Result: dysmenorrhea, pelvic pain, and infertility; Merck theories: retrograde menstruation through the tubes, coelomic metaplasia, Müllerian rests, spread through lymph or blood", "k": "table"}, {"id": "cd-dz-c14-endo-etiology", "ch": "14", "s": "r-pelvic", "topic": "Endometriosis", "f": "Endometriosis · causes?", "b": "File does not give a cause; Merck theories above", "k": "table"}, {"id": "cd-dz-c14-endo-signs", "ch": "14", "s": "r-pelvic", "topic": "Endometriosis", "f": "Endometriosis · signs (objective)?", "b": "Red-blue nodules seen on laparoscopy; Ovarian cyst consistent with an endometrioma on ultrasound or MRI", "k": "table"}, {"id": "cd-dz-c14-endo-symptoms", "ch": "14", "s": "r-pelvic", "topic": "Endometriosis", "f": "Endometriosis · symptoms (what they report)?", "b": "Dysmenorrhea; Dyspareunia; Pelvic pain; Cyclic midline pelvic pain before or during menses; New painful periods after years of easy periods is a clue", "k": "table"}, {"id": "cd-dz-c14-endo-labs", "ch": "14", "s": "r-pelvic", "topic": "Endometriosis", "f": "Endometriosis · labs & diagnosis?", "b": "Laparoscopy (views structures outside uterus); Diagnosis is often clinical; laparoscopy with biopsy confirms; transvaginal ultrasound or MRI can support; CA-125 can be elevated in endometriosis", "k": "table"}, {"id": "cd-dz-c14-endo-risk", "ch": "14", "s": "r-pelvic", "topic": "Endometriosis", "f": "Endometriosis · risk factors?", "b": "Infertility; Adhesions", "k": "table"}, {"id": "cd-dz-c14-endo-tx", "ch": "14", "s": "r-pelvic", "topic": "Endometriosis", "f": "Endometriosis · treatment?", "b": "Surgery may be needed; NSAIDs for pain; Continuous combined contraceptives; Progestins; GnRH agonists (leuprolide) limited to 6 months or less due to bone loss; GnRH antagonists (elagolix, relugolix); Surgery to remove implants; Hysterectomy ± bilateral salpingo-oophorectomy is definitive", "k": "table"}, {"id": "cd-dz-c14-endo-comp", "ch": "14", "s": "r-pelvic", "topic": "Endometriosis", "f": "Endometriosis · complications?", "b": "Prognosis:", "k": "table"}, {"id": "cd-dz-c14-endo-nurse", "ch": "14", "s": "r-pelvic", "topic": "Endometriosis", "f": "Endometriosis · nursing priorities?", "b": "Pain scale with each period (tracks pattern); Teach NSAID timing as ordered; Teach bone health if on GnRH drugs; Offer fertility counseling referral (infertility link)", "k": "table"}, {"id": "cd-dz-c14-pid-patho", "ch": "14", "s": "r-pelvic", "topic": "Pelvic inflammatory disease (PID)", "f": "Pelvic inflammatory disease (PID) · what goes wrong?", "b": "Sexual intercourse pushes germs into the vagina; Infection climbs up: cervix → uterus → uterine tubes → ovaries → even the peritoneal cavity; Germs attach to the epithelial cells lining the tract; Acute inflammation and immune response start; Tissue becomes hyperemic (too much blood, red) and edematous (swollen); Tubes fill with purulent exudate (pus) and get blocked; Repeated or chronic infection → scar tissue, worst in tubes and ovaries; Scars block ovulation and egg travel → ectopic pregnancy, tubo-ovarian abscess, adhesions, infertility", "k": "table"}, {"id": "cd-dz-c14-pid-etiology", "ch": "14", "s": "r-pelvic", "topic": "Pelvic inflammatory disease (PID)", "f": "Pelvic inflammatory disease (PID) · causes?", "b": "STI, most often Chlamydia trachomatis + Neisseria gonorrhoeae; Merck adds Mycoplasma genitalium and vaginal bacteria including those of bacterial vaginosis; In males, STIs cause similar problems in the urethra, epididymis, testes", "k": "table"}, {"id": "cd-dz-c14-pid-signs", "ch": "14", "s": "r-pelvic", "topic": "Pelvic inflammatory disease (PID)", "f": "Pelvic inflammatory disease (PID) · signs (objective)?", "b": "Purulent cervical discharge; Cervical motion tenderness; Adnexal tenderness; Lower abdominal tenderness; Fever; Cervicitis; Friable cervix (bleeds easily); A palpable adnexal mass suggests tubo-ovarian abscess", "k": "table"}, {"id": "cd-dz-c14-pid-symptoms", "ch": "14", "s": "r-pelvic", "topic": "Pelvic inflammatory disease (PID)", "f": "Pelvic inflammatory disease (PID) · symptoms (what they report)?", "b": "Pelvic and lower abdominal pain, malaise; Early infection is often silent → spreads to others", "k": "table"}, {"id": "cd-dz-c14-pid-labs", "ch": "14", "s": "r-pelvic", "topic": "Pelvic inflammatory disease (PID)", "f": "Pelvic inflammatory disease (PID) · labs & diagnosis?", "b": "★ Pelvic exam (minimum criteria): Lower abdominal + adnexal + cervical motion tenderness (Core signs of upper tract infection); ESR, CRP: Elevated (Nonspecific signs of inflammation); Cultures of genitourinary secretions: Positive for bacteria (Identifies the germ); NAAT for gonorrhea/chlamydia: Positive (preferred test of cervical specimens); Pregnancy test: Rule out pregnancy (do in reproductive-age women; pregnancy changes treatment setting); Ultrasound: Abscess, fluid (preferred first imaging if exam is too painful); Laparoscopy: Inflamed tubes (Confirms diagnosis if needed); Treat presumptively if a sexually active young woman has pelvic pain, no other cause, and 1 or more of cervical motion, uterine, or adnexal tenderness", "k": "table"}, {"id": "cd-dz-c14-pid-risk", "ch": "14", "s": "r-pelvic", "topic": "Pelvic inflammatory disease (PID)", "f": "Pelvic inflammatory disease (PID) · risk factors?", "b": "Age under 25, first sex before 15, new partner in past 12 months or 2 or more prior partners, recent discharge or pelvic pain, being single, low socioeconomic status", "k": "table"}, {"id": "cd-dz-c14-pid-comp", "ch": "14", "s": "r-pelvic", "topic": "Pelvic inflammatory disease (PID)", "f": "Pelvic inflammatory disease (PID) · complications?", "b": "Ectopic pregnancy, tubo-ovarian abscess, pelvic adhesions, infertility; Merck adds Fitz-Hugh-Curtis syndrome (perihepatitis with right upper quadrant pain); Prognosis: Goal is preventing complications; Repeated infection raises scarring and infertility risk", "k": "table"}, {"id": "cd-dz-c14-pid-tx", "ch": "14", "s": "r-pelvic", "topic": "Pelvic inflammatory disease (PID)", "f": "Pelvic inflammatory disease (PID) · treatment?", "b": "Immediate and often long course of oral or IV antibiotics; Hospitalize with IV antibiotics and fluids if: pregnant; Immunodeficient; Severe illness, nausea, vomiting, or high fever; Can't follow or tolerate oral treatment; May need emergency surgery (e.g., appendicitis); Tubo-ovarian abscess; Treat partners; No intercourse until patient and partners are treated and cured; If no response to oral therapy in 72 hours, reevaluate and give IV therapy", "k": "table"}, {"id": "cd-dz-c14-pid-nurse", "ch": "14", "s": "r-pelvic", "topic": "Pelvic inflammatory disease (PID)", "f": "Pelvic inflammatory disease (PID) · nursing priorities?", "b": "Give antibiotics on time and finish the full course; Rationale: \"Treated quickly and completely\" prevents scarring; Monitor temp, pain, and abdominal tenderness; Rationale: Worsening suggests abscess or failure of oral therapy; Teach abstinence until all partners are cured; Rationale: Prevents reinfection; Teach condom use and STI screening; Rationale: Early infection is silent; Teach ectopic pregnancy warning signs for future pregnancies; Rationale: Tubal scarring raises ectopic risk", "k": "table"}, {"id": "cd-dz-c14-pcos-patho", "ch": "14", "s": "r-pelvic", "topic": "Polycystic ovary syndrome (PCOS)", "f": "Polycystic ovary syndrome (PCOS) · what goes wrong?", "b": "Pituitary secretes high LH; Ovaries make excess androgens; FSH is still present, so follicles start to grow, but they never mature; No ovulation → no corpus luteum → low progesterone; estrogen is constant (acyclic); Estrogen alters GnRH → even higher LH → more androgens, FSH suppressed (a vicious cycle); Chronic anovulation → both ovaries become enlarged and full of cysts (Fig 14.17); Insulin resistance: extra insulin pushes ovaries to make even more androgens; Androgens in fat convert to estrogen → obesity link", "k": "table"}, {"id": "cd-dz-c14-pcos-etiology", "ch": "14", "s": "r-pelvic", "topic": "Polycystic ovary syndrome (PCOS)", "f": "Polycystic ovary syndrome (PCOS) · causes?", "b": "Unknown; Genetic link: more likely if mother or sister has PCOS; Possible abnormal cytochrome P450c17 enzyme raising androgen production", "k": "table"}, {"id": "cd-dz-c14-pcos-signs", "ch": "14", "s": "r-pelvic", "topic": "Polycystic ovary syndrome (PCOS)", "f": "Polycystic ovary syndrome (PCOS) · signs (objective)?", "b": "Hirsutism (Fig 14.16), acne, male-pattern baldness, obesity (about half), acanthosis nigricans (dark velvety skin on neck, armpits, inner thighs, vulva, under breasts), hypertension, enlarged cystic ovaries on ultrasound", "k": "table"}, {"id": "cd-dz-c14-pcos-symptoms", "ch": "14", "s": "r-pelvic", "topic": "Polycystic ovary syndrome (PCOS)", "f": "Polycystic ovary syndrome (PCOS) · symptoms (what they report)?", "b": "Irregular or prolonged periods, cycles longer than 35 days or fewer than 8 per year, infertility; Merck adds fatigue; Mood swings; Depression; Anxiety; Sleep problems", "k": "table"}, {"id": "cd-dz-c14-pcos-labs", "ch": "14", "s": "r-pelvic", "topic": "Polycystic ovary syndrome (PCOS)", "f": "Polycystic ovary syndrome (PCOS) · labs & diagnosis?", "b": "★ Rotterdam criteria: 2 of 3 — androgen excess, ovulatory dysfunction, polycystic ovaries; Labs to find hormone changes and rule out hyperprolactinemia and ovarian/adrenal tumors; Transvaginal ultrasound; Fasting cholesterol and triglycerides; Glucose tolerance test (insulin resistance); Polycystic ovaries on ultrasound = 12 or more follicles per ovary 2–9 mm, and/or ovarian volume over 10 mL; labs include testosterone, DHEAS, prolactin, TSH, FSH", "k": "table"}, {"id": "cd-dz-c14-pcos-risk", "ch": "14", "s": "r-pelvic", "topic": "Polycystic ovary syndrome (PCOS)", "f": "Polycystic ovary syndrome (PCOS) · risk factors?", "b": "Long-term cardiovascular risk; Diabetes; Hypertension; Obstructive sleep apnea; Merck adds endometrial hyperplasia and endometrial cancer; Fatty liver disease; Depression; Eating disorders", "k": "table"}, {"id": "cd-dz-c14-pcos-tx", "ch": "14", "s": "r-pelvic", "topic": "Polycystic ovary syndrome (PCOS)", "f": "Polycystic ovary syndrome (PCOS) · treatment?", "b": "Want pregnancy: clomiphene citrate (watch ovarian hyperstimulation); metformin (often with clomiphene); Injectable FSH and LH if needed; Laparoscopic laser puncture of follicles; Not wanting pregnancy: low-dose birth control pills; Progesterone 10–14 days a month (regulates periods, not androgens); spironolactone for hair and acne; Hair removal methods; Manage weight, lipids, diabetes, BP; Lifestyle and weight loss; Letrozole may work better than clomiphene in women with obesity and PCOS; Eflornithine cream for facial hair; spironolactone needs effective contraception because it may cause birth defects", "k": "table"}, {"id": "cd-dz-c14-pcos-comp", "ch": "14", "s": "r-pelvic", "topic": "Polycystic ovary syndrome (PCOS)", "f": "Polycystic ovary syndrome (PCOS) · complications?", "b": "Prognosis: Chronic condition; outcome depends on managing metabolic risks; Not given as a number", "k": "table"}, {"id": "cd-dz-c14-pcos-nurse", "ch": "14", "s": "r-pelvic", "topic": "Polycystic ovary syndrome (PCOS)", "f": "Polycystic ovary syndrome (PCOS) · nursing priorities?", "b": "Weigh and measure BP each visit (cardiometabolic risk); Teach diet and activity (weight loss improves insulin resistance, Merck); Screen mood and body image; Teach contraception with spironolactone (teratogenic risk, Merck); Teach signs of ovarian hyperstimulation with fertility drugs", "k": "table"}, {"id": "cd-dz-c14-ovca-patho", "ch": "14", "s": "r-ovary", "topic": "Ovarian cancer", "f": "Ovarian cancer · what goes wrong?", "b": "Genes + environment combine; Each ovulation breaks the ovary surface → inflammation → repair; More ovulations over life = more \"wear and tear\" = more risk; Mutations (BRCA1, BRCA2, TP53) let cells grow out of control; Tumor types: epithelial (surface; serous adenocarcinoma most common), germ cell (25%; mostly benign in adults, more malignant in children/young adults), sex cord (10%); Spread: cells shed into the peritoneal cavity → seed and implant on the peritoneum → invade bowel and bladder → pelvic lymph nodes; The open peritoneum lets tumors grow big without blocking organs → few early symptoms → late diagnosis (Fig 14.18); Staging: I = one or both ovaries; II = into pelvis; III = peritoneum outside pelvis; IV = distant; SEER groups: localized, regional, distant", "k": "table"}, {"id": "cd-dz-c14-ovca-etiology", "ch": "14", "s": "r-ovary", "topic": "Ovarian cancer", "f": "Ovarian cancer · causes?", "b": "5–10% hereditary (ovarian alone, breast–ovarian, ovarian–colon patterns); BRCA1 (chromosome 17q21) risk 15–45%; BRCA2 (13q14); Both autosomal dominant; BRCA1 lifetime ovarian cancer risk 20–40%, BRCA2 11–20%", "k": "table"}, {"id": "cd-dz-c14-ovca-signs", "ch": "14", "s": "r-ovary", "topic": "Ovarian cancer", "f": "Ovarian cancer · signs (objective)?", "b": "Abdominal distention; Enlarged ovary on bimanual exam; Ascites", "k": "table"}, {"id": "cd-dz-c14-ovca-symptoms", "ch": "14", "s": "r-ovary", "topic": "Ovarian cancer", "f": "Ovarian cancer · symptoms (what they report)?", "b": "Often none early; Vague bloating; Pressure or pain with large tumors; Dyspepsia; Early satiety; Change in bowel habits; Urinary frequency", "k": "table"}, {"id": "cd-dz-c14-ovca-labs", "ch": "14", "s": "r-ovary", "topic": "Ovarian cancer", "f": "Ovarian cancer · labs & diagnosis?", "b": "History, bimanual pelvic exam, laparoscopy or laparotomy, cytology of ovarian epithelial cells, CA-125; Ultrasound first if early cancer suspected; CT or MRI if advanced; CA-125 elevated in 80% of advanced epithelial cancers but may be normal early; germ cell markers include beta-hCG, LDH, alpha-fetoprotein, inhibin", "k": "table"}, {"id": "cd-dz-c14-ovca-risk", "ch": "14", "s": "r-ovary", "topic": "Ovarian cancer", "f": "Ovarian cancer · risk factors?", "b": "First-degree relative (mother, daughter, sister); 2 or more relatives raises risk more; BRCA; Breast cancer history; Many ovulations; Postmenopausal hormone therapy; Age (over 48% of cases over 65); Protective: pregnancy, contraceptives (anything that stops ovulation); Merck adds nulliparity; Early menarche; Late menopause", "k": "table"}, {"id": "cd-dz-c14-ovca-comp", "ch": "14", "s": "r-ovary", "topic": "Ovarian cancer", "f": "Ovarian cancer · complications?", "b": "Bowel/bladder invasion, metastasis; Prognosis: Curable if found early; but 3 of 4 have spread at diagnosis; more than half stage III or higher; Merck 5-year survival: stage I 85–95%, II 70–78%, III 40–60%, IV 15–20%; No screening test exists; CA-125 is not a screening test for average-risk women", "k": "table"}, {"id": "cd-dz-c14-ovca-tx", "ch": "14", "s": "r-ovary", "topic": "Ovarian cancer", "f": "Ovarian cancer · treatment?", "b": "By stage; Stage I–II well/moderately differentiated: remove uterus, both ovaries, omentum; Biopsy diaphragm and lymph nodes; Debulking = remove as much tumor as possible; optimal debulked (no visible tumor) has a better prognosis than suboptimally debulked; Fertility-sparing option for stage I well-differentiated; Advanced/less-differentiated: surgery + radiation + combination chemotherapy; Standard chemo is paclitaxel + carboplatin; PARP inhibitors as maintenance", "k": "table"}, {"id": "cd-dz-c14-ovca-nurse", "ch": "14", "s": "r-ovary", "topic": "Ovarian cancer", "f": "Ovarian cancer · nursing priorities?", "b": "Take a careful family history (hereditary risk); Teach to report persistent bloating (vague early sign); Post-op monitoring for bleeding and infection (major surgery); Chemo safety and neutropenic precautions (chemo lowers immunity); Emotional support and referral for genetic counseling (BRCA affects relatives)", "k": "table"}, {"id": "cd-dz-c14-meno-patho", "ch": "14", "s": "r-ovary", "topic": "Menopause", "f": "Menopause · what goes wrong?", "b": "Ovaries age; follicles run out; Ovaries can't answer FSH/LH anymore; Low ovarian hormones → hypothalamus makes more GnRH; Pituitary makes more FSH and LH (negative feedback is lost) — but it doesn't help; Low estrogen → target tissues atrophy (shrink): vagina, uterus, ovaries, breasts, bladder, skin; Bone: osteoclasts (bone breakers) live longer; osteoblasts (bone builders) die sooner → bone loss", "k": "table"}, {"id": "cd-dz-c14-meno-etiology", "ch": "14", "s": "r-ovary", "topic": "Menopause", "f": "Menopause · causes?", "b": "Normal biologic stage, about age 48–55; Perimenopause = 4–5-year transition; First sign is subtle bleeding changes; Average age in the US is 51", "k": "table"}, {"id": "cd-dz-c14-meno-signs", "ch": "14", "s": "r-ovary", "topic": "Menopause", "f": "Menopause · signs (objective)?", "b": "No periods for 12 months; Reddened skin and sweating with hot flashes; Thin vaginal walls; Smaller breasts; Less skin elasticity; Bone demineralization; LDL:HDL ratio up", "k": "table"}, {"id": "cd-dz-c14-meno-symptoms", "ch": "14", "s": "r-ovary", "topic": "Menopause", "f": "Menopause · symptoms (what they report)?", "b": "Hot flashes (30 seconds to 5 minutes); Breast tenderness; Moodiness; Irritability; Anxiety; Vaginal dryness; Dyspareunia; Sleep disruption; Fatigue; Low libido; Urinary urgency and stress incontinence (Fig 14.19)", "k": "table"}, {"id": "cd-dz-c14-meno-labs", "ch": "14", "s": "r-ovary", "topic": "Menopause", "f": "Menopause · labs & diagnosis?", "b": "★ Amenorrhea for at least 12 months with no other cause; No single test; FSH rises (most significant marker); FSH rises higher than LH; estradiol and inhibin fall; FSH rarely needed; a single level can mislead because it fluctuates", "k": "table"}, {"id": "cd-dz-c14-meno-risk", "ch": "14", "s": "r-ovary", "topic": "Menopause", "f": "Menopause · risk factors?", "b": "Osteoporosis, cardiovascular disease (stroke, heart attack); Depression (higher if prior depression)", "k": "table"}, {"id": "cd-dz-c14-meno-tx", "ch": "14", "s": "r-ovary", "topic": "Menopause", "f": "Menopause · treatment?", "b": "Individualized; HRT: estrogen, progesterone, or both — only for severe symptoms, short term, lowest effective dose, topical when possible; Do not start HRT over age 65 (dementia); Estrogen alone raised endometrial cancer risk; Raloxifene (SERM) to prevent osteoporosis; Nonhormone measures (see Y); Add a progestogen if the woman has a uterus; Risks include breast cancer, VTE, stroke, CAD, gallbladder disease, dementia; Avoid starting at over 60 or 10–20 years past menopause; Nonhormone drug options include SSRIs, SNRIs, gabapentin, oxybutynin, neurokinin receptor antagonists; Merck says the start-age cutoff is over 60", "k": "table"}, {"id": "cd-dz-c14-meno-comp", "ch": "14", "s": "r-ovary", "topic": "Menopause", "f": "Menopause · complications?", "b": "Prognosis: Expected life stage; symptoms last 6 months to over 10 years", "k": "table"}, {"id": "cd-dz-c14-meno-nurse", "ch": "14", "s": "r-ovary", "topic": "Menopause", "f": "Menopause · nursing priorities?", "b": "Teach hot flash measures (reduce triggers); Teach pelvic floor exercises (stress incontinence); Teach water-based lubricant (vaginal atrophy); Teach fall and bone safety, weight-bearing activity (bone loss); Screen mood and sleep (depression risk); Report any vaginal bleeding after menopause (Case 14.2: endometrial cancer)", "k": "table"}, {"id": "cd-dz-c14-ed-patho", "ch": "14", "s": "r-male", "topic": "Erectile dysfunction (ED)", "f": "Erectile dysfunction (ED) · what goes wrong?", "b": "Arousal; Parasympathetic nerves at S2–S4 fire; Blood flow to the penis rises; Smooth muscle relaxes and squeezes the veins shut (veno-occlusion); Blood is trapped in the corpora cavernosa → erection; Nerves release nitric oxide → more cGMP → smooth muscle relaxes → more blood flows in; PDE5 breaks down cGMP; Any break in nerves, hormones, mind, or blood vessels → ED", "k": "table"}, {"id": "cd-dz-c14-ed-etiology", "ch": "14", "s": "r-male", "topic": "Erectile dysfunction (ED)", "f": "Erectile dysfunction (ED) · causes?", "b": "Hormonal (hypogonadism, hypothyroidism, adrenal problems); Neurologic (spinal cord or perineal nerve injury); Psychological (anxiety, low self-esteem, depression); Vascular (hypertension, atherosclerosis, smoking); Poor veno-occlusion; Medications (antihypertensives); Lifestyle: obesity, smoking, alcohol (research note)", "k": "table"}, {"id": "cd-dz-c14-ed-signs", "ch": "14", "s": "r-male", "topic": "Erectile dysfunction (ED)", "f": "Erectile dysfunction (ED) · signs (objective)?", "b": "Hypertension; Obesity; Low testosterone on labs", "k": "table"}, {"id": "cd-dz-c14-ed-symptoms", "ch": "14", "s": "r-male", "topic": "Erectile dysfunction (ED)", "f": "Erectile dysfunction (ED) · symptoms (what they report)?", "b": "Cannot get or keep an erection", "k": "table"}, {"id": "cd-dz-c14-ed-labs", "ch": "14", "s": "r-male", "topic": "Erectile dysfunction (ED)", "f": "Erectile dysfunction (ED) · labs & diagnosis?", "b": "History and physical; testosterone, LH, thyroid hormone, prolactin; Morning testosterone; if low, check prolactin and LH; check for diabetes and lipids; new vascular ED can be the first sign of heart disease → cardiology referral", "k": "table"}, {"id": "cd-dz-c14-ed-risk", "ch": "14", "s": "r-male", "topic": "Erectile dysfunction (ED)", "f": "Erectile dysfunction (ED) · risk factors?", "b": "Increases with age", "k": "table"}, {"id": "cd-dz-c14-ed-tx", "ch": "14", "s": "r-male", "topic": "Erectile dysfunction (ED)", "f": "Erectile dysfunction (ED) · treatment?", "b": "Treat cause; Testosterone replacement; Mental health care; sildenafil, vardenafil, tadalafil; Penile implants or devices; Weight loss + exercise (2-year study improved sexual function); Vacuum device; Intracavernosal alprostadil", "k": "table"}, {"id": "cd-dz-c14-ed-comp", "ch": "14", "s": "r-male", "topic": "Erectile dysfunction (ED)", "f": "Erectile dysfunction (ED) · complications?", "b": "Prognosis: Lifestyle change improved function in the study; Not given as a number", "k": "table"}, {"id": "cd-dz-c14-ed-nurse", "ch": "14", "s": "r-male", "topic": "Erectile dysfunction (ED)", "f": "Erectile dysfunction (ED) · nursing priorities?", "b": "Ask about nitrate use before PDE5 drugs; Review med list for antihypertensives (can cause ED); Teach smoking cessation and weight loss (research note); Private, nonjudgmental talk (psychological factors); Teach that an erection over 4 hours is an emergency", "k": "table"}, {"id": "cd-dz-c14-bph-patho", "ch": "14", "s": "r-male", "topic": "Benign prostatic hyperplasia (BPH)", "f": "Benign prostatic hyperplasia (BPH) · what goes wrong?", "b": "Aging lowers testosterone → relatively more estrogen → prostate cells multiply; Testosterone turns into DHT; DHT builds up → more growth of epithelial cells, smooth muscle, and stromal fibroblasts; Growth is mostly periurethral (around the urethra); The urethra gets squeezed → urine can't flow well; Total blockage → acute retention → renal failure if untreated; BPH is not a precursor to prostate cancer.", "k": "table"}, {"id": "cd-dz-c14-bph-etiology", "ch": "14", "s": "r-male", "topic": "Benign prostatic hyperplasia (BPH)", "f": "Benign prostatic hyperplasia (BPH) · causes?", "b": "Unknown; Aging hormones; Over 50% of men over 60; Up to 90% over 70", "k": "table"}, {"id": "cd-dz-c14-bph-signs", "ch": "14", "s": "r-male", "topic": "Benign prostatic hyperplasia (BPH)", "f": "Benign prostatic hyperplasia (BPH) · signs (objective)?", "b": "Enlarged, soft prostate on DRE (Fig 14.21); Distended bladder with retention; Rubbery; Nontender; May lose the median furrow", "k": "table"}, {"id": "cd-dz-c14-bph-symptoms", "ch": "14", "s": "r-male", "topic": "Benign prostatic hyperplasia (BPH)", "f": "Benign prostatic hyperplasia (BPH) · symptoms (what they report)?", "b": "Frequency; Dribbling; Hesitancy; Incontinence; Urgency; Retention; Merck splits these: storage (nocturia, urgency, frequency, incontinence) vs voiding (weak stream, straining, hesitancy, dribbling, incomplete emptying)", "k": "table"}, {"id": "cd-dz-c14-bph-labs", "ch": "14", "s": "r-male", "topic": "Benign prostatic hyperplasia (BPH)", "f": "Benign prostatic hyperplasia (BPH) · labs & diagnosis?", "b": "DRE; PSA (biopsy if high, to rule out cancer); AUA Symptom Index (7 questions; total 20–35 = severe); urodynamic tests; Urinalysis and urine culture; postvoid residual by bladder ultrasound", "k": "table"}, {"id": "cd-dz-c14-bph-comp", "ch": "14", "s": "r-male", "topic": "Benign prostatic hyperplasia (BPH)", "f": "Benign prostatic hyperplasia (BPH) · complications?", "b": "Acute urinary retention, renal failure, death if untreated; Stasis → stones and infection; hydronephrosis; Retention can be triggered by delaying voiding, immobility, cold, UTI, and anesthetics, anticholinergics, sympathomimetics (many OTC), opioids, alcohol; Prognosis: Good with treatment; dangerous if complete obstruction ignored", "k": "table"}, {"id": "cd-dz-c14-bph-tx", "ch": "14", "s": "r-male", "topic": "Benign prostatic hyperplasia (BPH)", "f": "Benign prostatic hyperplasia (BPH) · treatment?", "b": "Only if significant symptoms; Drugs that relax smooth muscle of arteries, prostate, bladder neck (alpha-blockers per Merck: terazosin, doxazosin, tamsulosin, alfuzosin, silodosin); Drugs that block conversion to DHT (5-alpha-reductase inhibitors per Merck: finasteride, dutasteride; work over months) → prostate shrinks; Laser/heat therapy; TURP (most common surgery); Urethral stent if not a candidate for others; Daily tadalafil if ED too; Combination therapy beats single drug", "k": "table"}, {"id": "cd-dz-c14-bph-nurse", "ch": "14", "s": "r-male", "topic": "Benign prostatic hyperplasia (BPH)", "f": "Benign prostatic hyperplasia (BPH) · nursing priorities?", "b": "Monitor intake/output and bladder distention (retention); Bladder scan for postvoid residual as ordered; Review OTC cold medicines; After TURP watch urine color and bleeding (surgical bleeding); Teach not to delay voiding and limit alcohol", "k": "table"}, {"id": "cd-dz-c14-bph-risk", "ch": "14", "s": "r-male", "topic": "Benign prostatic hyperplasia (BPH)", "f": "Benign prostatic hyperplasia (BPH) · risk factors?", "b": "Age: over 50% of men over 60, up to 90% over 70; Aging hormone shift: lower testosterone, relatively more estrogen; DHT (made from testosterone) builds up in the prostate over time", "k": "table"}, {"id": "cd-dz-c14-prca-patho", "ch": "14", "s": "r-mcancer", "topic": "Prostate cancer", "f": "Prostate cancer · what goes wrong?", "b": "Initiator + promoter events (genes + environment); Proliferative inflammatory atrophy (hypothesized); Prostatic intraepithelial neoplasia (atypical cells lining ducts) = premalignant; Adenocarcinoma (over 95%) in the peripheral gland; Urethra is not squeezed until late → silent early; Spread to lymph nodes, then bone (most common distant site)", "k": "table"}, {"id": "cd-dz-c14-prca-etiology", "ch": "14", "s": "r-mcancer", "topic": "Prostate cancer", "f": "Prostate cancer · causes?", "b": "Exact cause often unknown: a series of genetic and environmental initiator and promoter events transforms prostate epithelial cells; 5–10% inherited; HPC1 gene site at chromosome 1q24 → younger age, higher grade, later stage at diagnosis; Androgens and estrogens support prostate epithelial growth (cancer growth)", "k": "table"}, {"id": "cd-dz-c14-prca-signs", "ch": "14", "s": "r-mcancer", "topic": "Prostate cancer", "f": "Prostate cancer · signs (objective)?", "b": "Hard; Asymmetric; Cobblestone prostate on DRE; Elevated PSA", "k": "table"}, {"id": "cd-dz-c14-prca-symptoms", "ch": "14", "s": "r-mcancer", "topic": "Prostate cancer", "f": "Prostate cancer · symptoms (what they report)?", "b": "Often none; Later same as BPH (frequency, dribbling, hesitancy, incontinence, urgency, retention); Bone pain with spread; Hematuria; Spinal cord compression from bone metastasis", "k": "table"}, {"id": "cd-dz-c14-prca-labs", "ch": "14", "s": "r-mcancer", "topic": "Prostate cancer", "f": "Prostate cancer · labs & diagnosis?", "b": "Screen: DRE, transrectal ultrasound, PSA; Confirm: biopsy (fine needle, usually transrectal); Pelvic lymph node dissection; bone scan; TNM: T1 not palpable/visible; T2 confined to prostate; T3 through capsule; T4 fixed or invades nearby structures (other than seminal vesicles); Low free PSA vs total PSA → suggests cancer; high free PSA → suggests BPH or inflammation. Gleason score = most common pattern grade + second most common grade (each 1–5) → 2 to 10; most tumors 4–7 (Fig 14.23); PSA ≥ 4 ng/mL often prompts biopsy; free PSA under 10–20% warrants biopsy; MRI helps target biopsy", "k": "table"}, {"id": "cd-dz-c14-prca-comp", "ch": "14", "s": "r-mcancer", "topic": "Prostate cancer", "f": "Prostate cancer · complications?", "b": "Metastasis; treatment effects; Prognosis: 5-year survival over 99% local/regional; 33.5% with distant metastases; Lower Gleason = better", "k": "table"}, {"id": "cd-dz-c14-prca-tx", "ch": "14", "s": "r-mcancer", "topic": "Prostate cancer", "f": "Prostate cancer · treatment?", "b": "Radical prostatectomy (often under 70, healthy); Radiation and chemo; androgen-deprivation therapy; watchful waiting for slow tumors in men without symptoms; ADT agents include leuprolide, goserelin, degarelix, relugolix; ADT causes loss of libido, ED, hot flushes, osteoporosis, anemia, muscle loss", "k": "table"}, {"id": "cd-dz-c14-prca-nurse", "ch": "14", "s": "r-mcancer", "topic": "Prostate cancer", "f": "Prostate cancer · nursing priorities?", "b": "Teach shared decision-making about PSA screening; Post-prostatectomy catheter care and Kegel teaching (incontinence); Assess bone pain and back pain with leg weakness (bone mets, cord compression); Support for sexual changes (ED after surgery/ADT)", "k": "table"}, {"id": "cd-dz-c14-prca-risk", "ch": "14", "s": "r-mcancer", "topic": "Prostate cancer", "f": "Prostate cancer · risk factors?", "b": "Advancing age (about 85% diagnosed after 65); Family history; Smoking; High fat and meat intake; Low lycopene (tomato products) and low fruit intake; High dietary calcium; Highest risk in Black men; BRCA1/2 and Lynch syndrome", "k": "table"}, {"id": "cd-dz-c14-testca-patho", "ch": "14", "s": "r-mcancer", "topic": "Testicular cancer", "f": "Testicular cancer · what goes wrong?", "b": "A germ cell mutation happens, likely during fetal development; Puberty hormones then promote growth (autonomy and anaplasia); Stage 1: carcinoma in situ inside the seminiferous tubules; Stage 2: invasive carcinoma; Seminomas (most common): immature spermatogonia pile up → testis enlarges and becomes fibrotic; Nonseminomas (embryonic carcinoma, yolk sac, choriocarcinoma, teratocarcinoma): look like embryonic or body tissue (skin, bone); grow faster, invade more, spread more", "k": "table"}, {"id": "cd-dz-c14-testca-etiology", "ch": "14", "s": "r-mcancer", "topic": "Testicular cancer", "f": "Testicular cancer · causes?", "b": "About 90% from germ cells; Rest sex cord or metastases; Possible chromosome 14 change; Cryptorchidism: 20–40× more likely. Ages 20–40; Most common solid cancer in males 15–35", "k": "table"}, {"id": "cd-dz-c14-testca-signs", "ch": "14", "s": "r-mcancer", "topic": "Testicular cancer", "f": "Testicular cancer · signs (objective)?", "b": "Small painless testicular mass; Slightly enlarged testis; Enlarged scrotum", "k": "table"}, {"id": "cd-dz-c14-testca-symptoms", "ch": "14", "s": "r-mcancer", "topic": "Testicular cancer", "f": "Testicular cancer · symptoms (what they report)?", "b": "Heaviness, mild discomfort", "k": "table"}, {"id": "cd-dz-c14-testca-labs", "ch": "14", "s": "r-mcancer", "topic": "Testicular cancer", "f": "Testicular cancer · labs & diagnosis?", "b": "Monthly self-testicular exam; physical exam; radical orchiectomy for diagnosis; no transscrotal biopsy (may seed tumor into scrotum or spread to inguinal nodes); tumor markers; ultrasound, CT, MRI; Markers are AFP, beta-hCG, LDH; pure seminoma does not raise AFP; orchiectomy is done through an inguinal approach", "k": "table"}, {"id": "cd-dz-c14-testca-comp", "ch": "14", "s": "r-mcancer", "topic": "Testicular cancer", "f": "Testicular cancer · complications?", "b": "Worse prognosis with bone, liver, or brain metastases; high tumor markers; primary mediastinal nonseminoma; many lung metastases; Treatment risks: infertility, secondary leukemias, kidney impairment; Prognosis: Highly curable; Seminoma without spread: 95% 5-year survival; Mediastinal nonseminoma with spread or high markers: 73%; Even widespread disease may be cured", "k": "table"}, {"id": "cd-dz-c14-testca-tx", "ch": "14", "s": "r-mcancer", "topic": "Testicular cancer", "f": "Testicular cancer · treatment?", "b": "Remove tumor and testicle(s); Radiation and chemo; Cisplatin-based chemo (e.g., bleomycin, etoposide, cisplatin); sperm banking before radiation or chemo", "k": "table"}, {"id": "cd-dz-c14-testca-nurse", "ch": "14", "s": "r-mcancer", "topic": "Testicular cancer", "f": "Testicular cancer · nursing priorities?", "b": "Teach monthly TSE (early detection); Offer sperm banking talk before treatment (infertility risk, Merck); Monitor kidney function on chemo; Body-image support (young men, loss of a testicle)", "k": "table"}, {"id": "cd-dz-c14-testca-risk", "ch": "14", "s": "r-mcancer", "topic": "Testicular cancer", "f": "Testicular cancer · risk factors?", "b": "Cryptorchidism (undescended testis): 20–40× more likely; Age 15–35 (most common solid cancer in young males); book range 20–40; Possible chromosome 14 change", "k": "table"}, {"id": "cd-dz-c19-osteo-patho", "ch": "19", "s": "a-bone", "topic": "Osteoporosis", "f": "Osteoporosis · what goes wrong?", "b": "Bone is always being rebuilt; Osteoclasts break bone down. Osteoblasts build it. In osteoporosis, breakdown wins → bone mass drops → spongy (trabecular) bone loses its support beams and compact (cortical) bone gets thin and full of holes → bone breaks easily (Fig 19.7); Spine has lots of spongy bone, so vertebral fractures are common; Menopausal bone loss: low estrogen → more IL-6 (a cytokine, a signal protein) → osteoclasts live longer and osteoblasts die sooner → fast loss; Senescent bone loss (both sexes, slower): fewer osteoblasts are made → slower bone building", "k": "table"}, {"id": "cd-dz-c19-osteo-etiology", "ch": "19", "s": "a-bone", "topic": "Osteoporosis", "f": "Osteoporosis · causes?", "b": "Primary (aging, menopause); Secondary (less common): caused by another disease, hormone or genetic problem, or drug (Table 19.1); Marked by poor osteoblast function; Merck examples of secondary causes: long-term corticosteroids, hyperparathyroidism, hyperthyroidism, low testosterone, chronic kidney or liver disease", "k": "table"}, {"id": "cd-dz-c19-osteo-signs", "ch": "19", "s": "a-bone", "topic": "Osteoporosis", "f": "Osteoporosis · signs (objective)?", "b": "Loss of height; Hyperkyphosis (\"hunchback\", Fig 19.4); Fractures (vertebrae, hip, wrist); Low T score", "k": "table"}, {"id": "cd-dz-c19-osteo-symptoms", "ch": "19", "s": "a-bone", "topic": "Osteoporosis", "f": "Osteoporosis · symptoms (what they report)?", "b": "Back pain, stiffness; Often NO symptoms until a fracture.", "k": "table"}, {"id": "cd-dz-c19-osteo-labs", "ch": "19", "s": "a-bone", "topic": "Osteoporosis", "f": "Osteoporosis · labs & diagnosis?", "b": "★ Central DEXA (hip + lumbar spine) → T score → shows bone density; repeat yearly or every 2 years to track change.; ★ Quantitative ultrasound (QUS) of heel → bone quality → cheap and fast but less accurate; heel may not match hip/spine.; Labs for secondary causes: CBC; chemistry (calcium, phosphorus, total protein, liver enzymes, alkaline phosphatase, electrolytes); urine calcium; hormones (TSH, vitamin D, PTH, cortisol); Z score less than −1.5 → think secondary cause.", "k": "table"}, {"id": "cd-dz-c19-osteo-risk", "ch": "19", "s": "a-bone", "topic": "Osteoporosis", "f": "Osteoporosis · risk factors?", "b": "Genetics; First-degree relative with osteoporosis; Low peak bone mass; BMI less than 25; Loss of estrogen; Aging; Low calcium and vitamin D; Smoking; Too much alcohol; Sedentary life; Females 8× more often.", "k": "table"}, {"id": "cd-dz-c19-osteo-comp", "ch": "19", "s": "a-bone", "topic": "Osteoporosis", "f": "Osteoporosis · complications?", "b": "Hip and vertebral fractures, hyperkyphosis, falls, loss of independence; Prognosis:; Hip fractures carry high illness and death risk in older adults, and treatment lowers fracture risk", "k": "table"}, {"id": "cd-dz-c19-osteo-tx", "ch": "19", "s": "a-bone", "topic": "Osteoporosis", "f": "Osteoporosis · treatment?", "b": "Short-term: fall-proof the home, pain control after fracture; Long-term: ★ prevention first: calcium + vitamin D, weight-bearing exercise, no smoking, limit alcohol, bone density test, meds when needed; Meds: antiresorptives (bisphosphonates alendronate and risedronate, calcitonin, estrogen, raloxifene) + anabolic teriparatide (D Drug Cards); Merck adds denosumab and zoledronic acid; Therapeutic: weight-bearing exercise (walking, stair climbing, dancing); Palliative: pain control and bracing after vertebral fracture", "k": "table"}, {"id": "cd-dz-c19-osteo-nurse", "ch": "19", "s": "a-bone", "topic": "Osteoporosis", "f": "Osteoporosis · nursing priorities?", "b": "Fall-risk check + clear walkways, night lights, non-slip shoes, because one fall can mean a hip fracture; Teach and encourage weight-bearing exercise, because loading the bone stimulates osteoblasts; Teach calcium + vitamin D foods and sun exposure, because they are the bone's raw materials; Measure height at each visit, because lost height is an early sign of vertebral collapse; Gentle handling and log-rolling when moving frail patients, because bones can break with little force", "k": "table"}, {"id": "cd-dz-c19-ad-patho", "ch": "19", "s": "a-ad", "topic": "Alzheimer disease (AD)", "f": "Alzheimer disease (AD) · what goes wrong?", "b": "★ APP (amyloid precursor protein) sits in the neuron's membrane; Enzymes beta-secretase and gamma-secretase cut it → amyloid beta (Aβ) fragment → clumps grow: oligomers → fibrils → beta-sheets → senile plaques OUTSIDE neurons in hippocampus and cortex (Fig 19.9, 19.10); ★ Tau normally holds microtubules steady like a backbone; In AD, tau gets \"sticky\" → neurofibrillary tangles INSIDE neurons → microtubules fall apart → no nutrient transport → neuron dies; Tangles start in the temporal lobe → medial temporal lobe and hippocampus (memory) → spread over the cortex (executive, motor, sensory); Loss of the cholinergic (acetylcholine) system → memory failure, ADL loss, personality change; Dementia severity matches the number and location of tangles. Brain shrinks (atrophy, Fig 19.11)", "k": "table"}, {"id": "cd-dz-c19-ad-etiology", "ch": "19", "s": "a-ad", "topic": "Alzheimer disease (AD)", "f": "Alzheimer disease (AD) · causes?", "b": "Genes + environment; Sporadic late-onset AD is most common; About 20% of cases cluster in families; Genes: APP, presenilin-1 (PS1), presenilin-2 (PS2).", "k": "table"}, {"id": "cd-dz-c19-ad-symptoms", "ch": "19", "s": "a-ad", "topic": "Alzheimer disease (AD)", "f": "Alzheimer disease (AD) · symptoms (what they report)?", "b": "Memory loss; Confusion; Restlessness; Mood swings; Trouble reading visual information", "k": "table"}, {"id": "cd-dz-c19-ad-signs", "ch": "19", "s": "a-ad", "topic": "Alzheimer disease (AD)", "f": "Alzheimer disease (AD) · signs (objective)?", "b": "Poor mental status scores; Word-finding trouble; Wandering; Incontinence; Impaired swallowing late", "k": "table"}, {"id": "cd-dz-c19-ad-labs", "ch": "19", "s": "a-ad", "topic": "Alzheimer disease (AD)", "f": "Alzheimer disease (AD) · labs & diagnosis?", "b": "★ Definitive: autopsy (plaques + tangles seen); Supportive: full neuro exam, mental status exam (time and place, communication, memory, comprehension, simple math), reasoning, balance, visual-motor coordination; Brain scan, MRI, or CT to rule out other causes. Merck adds amyloid PET and CSF or blood biomarkers in selected patients", "k": "table"}, {"id": "cd-dz-c19-ad-risk", "ch": "19", "s": "a-ad", "topic": "Alzheimer disease (AD)", "f": "Alzheimer disease (AD) · risk factors?", "b": "Older age; Family history; Obesity; Dyslipidemia; Hypertension; Down syndrome; Traumatic brain injury; Lead exposure; Depression", "k": "table"}, {"id": "cd-dz-c19-ad-tx", "ch": "19", "s": "a-ad", "topic": "Alzheimer disease (AD)", "f": "Alzheimer disease (AD) · treatment?", "b": "No cure. Supportive care for patient and family; Quality of life is the cornerstone; ★ Cholinesterase inhibitors (ChEIs) replace lost acetylcholine effect; Others for secondary symptoms: antidepressants, antianxiety drugs, antipsychotics; Memantine (NMDA antagonist) for moderate–severe, and anti-amyloid monoclonal antibodies in selected patients; Palliative: late-stage comfort, feeding and swallowing support", "k": "table"}, {"id": "cd-dz-c19-ad-comp", "ch": "19", "s": "a-ad", "topic": "Alzheimer disease (AD)", "f": "Alzheimer disease (AD) · complications?", "b": "Falls; Wandering; Aspiration (impaired swallowing); Malnutrition; Incontinence; Caregiver strain; Prognosis: Long, progressive course with eventual complete loss of function; Survival after diagnosis often about 7 years, varies widely", "k": "table"}, {"id": "cd-dz-c19-ad-nurse", "ch": "19", "s": "a-ad", "topic": "Alzheimer disease (AD)", "f": "Alzheimer disease (AD) · nursing priorities?", "b": "Keep a calm, structured routine, because change raises confusion and agitation; Safety: door alarms, ID bracelet, remove hazards, because wandering and poor judgment cause injury; Short, simple sentences, one step at a time, because processing is slow; Reorient gently with clocks, calendars, photos, because time and place fade first; Swallow checks, upright for meals, because late AD impairs swallowing (aspiration risk); Support and teach caregivers, because burnout is common", "k": "table"}, {"id": "cd-dz-c19-prog-patho", "ch": "19", "s": "a-progeria", "topic": "Progeria (HGPS)", "f": "Progeria (HGPS) · what goes wrong?", "b": "A rare genetic disease where children age very fast; A new (de novo) point mutation in the LMNA gene makes progerin, a faulty form of lamin A (a nuclear support protein); Progerin builds up and damages the cell nucleus → early aging of tissues, especially blood vessels; The file's key terms list \"progerin\" and the treatment section mentions \"mutant LMNA\"", "k": "table"}, {"id": "cd-dz-c19-prog-etiology", "ch": "19", "s": "a-progeria", "topic": "Progeria (HGPS)", "f": "Progeria (HGPS) · causes?", "b": "Genetic (LMNA); Usually not inherited from parents; It is a new mutation", "k": "table"}, {"id": "cd-dz-c19-prog-signs", "ch": "19", "s": "a-progeria", "topic": "Progeria (HGPS)", "f": "Progeria (HGPS) · signs (objective)?", "b": "Prominent scalp veins; Scleroderma (shiny tight skin) and wrinkled skin; Loss of fat under skin and muscle; Delayed teeth; Hearing loss; High-pitched voice; Short stature and skeletal dysplasia; Incomplete sexual maturation", "k": "table"}, {"id": "cd-dz-c19-prog-symptoms", "ch": "19", "s": "a-progeria", "topic": "Progeria (HGPS)", "f": "Progeria (HGPS) · symptoms (what they report)?", "b": "Feeding difficulties; ★ NOT seen: more tumors; Cataracts; Senility", "k": "table"}, {"id": "cd-dz-c19-prog-comp", "ch": "19", "s": "a-progeria", "topic": "Progeria (HGPS)", "f": "Progeria (HGPS) · complications?", "b": "Later: osteoporosis, atherosclerosis, fibrosis, hypertension, arthritis; Prognosis:; Average life expectancy is about 14.5 years", "k": "table"}, {"id": "cd-dz-c19-prog-labs", "ch": "19", "s": "a-progeria", "topic": "Progeria (HGPS)", "f": "Progeria (HGPS) · labs & diagnosis?", "b": "History + physical; ★ Hyaluronic acid levels give clues (high); Imaging for bone and vessel damage; special heart tests; Genetic testing confirms the LMNA mutation", "k": "table"}, {"id": "cd-dz-c19-prog-risk", "ch": "19", "s": "a-progeria", "topic": "Progeria (HGPS)", "f": "Progeria (HGPS) · risk factors?", "b": "★ Death most often from atherosclerosis (heart attack, stroke)", "k": "table"}, {"id": "cd-dz-c19-prog-tx", "ch": "19", "s": "a-progeria", "topic": "Progeria (HGPS)", "f": "Progeria (HGPS) · treatment?", "b": "\"There is no approved therapy for progeria.\" Research: gene therapy (stop mutant LMNA) and rapamycin; Supportive: feeding and nutrition, activity and joint mobility, vascular monitoring, family support; Merck says: lonafarnib, an oral farnesyltransferase inhibitor, is FDA-approved and lowers progerin build-up and death rates; (Your file is older here; answer by your textbook on the exam.)", "k": "table"}, {"id": "cd-dz-c19-prog-nurse", "ch": "19", "s": "a-progeria", "topic": "Progeria (HGPS)", "f": "Progeria (HGPS) · nursing priorities?", "b": "Small frequent high-calorie meals, because feeding is hard and fat stores are low; Range-of-motion and activity, because joints stiffen; Watch for chest pain or stroke signs, because atherosclerosis is the killer; Family emotional support, because the course is short and hard", "k": "table"}, {"id": "cd-gap-somato-270", "ch": "12", "s": "somato", "topic": "Touch receptors in the skin (Fig. 12.2)", "f": "Touch receptors in the skin (Fig. 12.2) · key points?", "b": "Touch travels on large, myelinated fibers — faster than temperature. Free nerve endings → Touch and pressure; Meissner corpuscle → Highly developed sense of touch; Merkel disks → Light objects moving over skin; vibration; Pacinian corpuscles → Vibration; Hair follicle receptors → Movement on the body's surface; Ruffini endings → Heavy, continuous touch and pressure", "k": "concept"}, {"id": "cd-gap-somato-271", "ch": "12", "s": "somato", "topic": "Position sense (proprioception)", "f": "Position sense (proprioception) · key points?", "b": "Knowing where your limbs/body are without looking.; Main sensors: proprioceptors, muscle spindles, Golgi tendon organs.; Skin stretch receptors help too: Ruffini endings, Pacinian corpuscles, Merkel disks.; Signals travel the posterior column + vestibular system → processed in thalamus and cortex.", "k": "concept"}, {"id": "cd-gap-somato-272", "ch": "12", "s": "somato", "topic": "Two-point discrimination & the two pathways", "f": "Two-point discrimination & the two pathways · key points?", "b": "Discriminative pathway: fine touch, spatial orientation, vibration, joint movement. Lets you identify an object by touch or tell two touched spots apart (two-point discrimination).; Anterolateral pathway (anterior + lateral spinothalamic): many synapses, slow. Carries pain, temperature, crude touch, pressure that doesn't need an exact location.", "k": "concept"}, {"id": "cd-gap-somato-273", "ch": "12", "s": "somato", "topic": "Somatosensory modalities", "f": "Somatosensory modalities · key points?", "b": "A modality is the specific kind of sensation perceived (e.g., temperature vs touch). It depends on (1) the receptor detecting the stimulus, (2) transmitting it to the CNS, and (3) interpreting the refined impulse.", "k": "concept"}, {"id": "cd-gap-pain-274", "ch": "12", "s": "pain", "topic": "Opioids & endogenous opioids (Box 12.3)", "f": "Opioids & endogenous opioids (Box 12.3) · key points?", "b": "Opioid analgesics (e.g., morphine, codeine) bind mu, delta, kappa receptors → modulate pain at the spinal cord.; They also stimulate release of the body's own opioids: enkephalins, endorphins, dynorphins.; Non-opioids (aspirin, NSAIDs, acetaminophen) block COX → fewer prostaglandins.; Adjuvant: tricyclic antidepressants block serotonin reuptake — useful in chronic pain.", "k": "concept"}, {"id": "cd-gap-pain-275", "ch": "12", "s": "pain", "topic": "TENS, acupuncture, heat & cold", "f": "TENS, acupuncture, heat & cold · key points?", "b": "TENS (transcutaneous electrical nerve stimulation) → Electrical impulses across skin to peripheral nerves; stimulates large fibers to close the gate; Acupuncture → Needles at specific points; ↑ endorphins; large-fiber stimulation; Heat → ↑ local circulation, ↓ ischemia; releases endogenous opioids; Cold → Vasoconstriction ↓ swelling; ↓ afferent activity", "k": "concept"}, {"id": "cd-gap-pain-276", "ch": "12", "s": "pain", "topic": "Pain in newborns", "f": "Pain in newborns · key points?", "b": "Newborns have complex behavioral, physiologic, and biochemical responses to pain.; Common painful procedures: heel-stick, circumcision.; Best-evidence non-drug comfort: nonnutritive sucking (pacifier), swaddling, rocking, holding.", "k": "concept"}, {"id": "cd-gap-vision1-277", "ch": "12", "s": "vision1", "topic": "From retina to brain (optic chiasm)", "f": "From retina to brain (optic chiasm) · key points?", "b": "Rods/cones → bipolar neurons → ganglion neurons.; Ganglion axons meet at the optic disk → optic nerve.; Optic chiasm: the medial (inner) halves of each optic nerve cross over.; Optic tract → thalamus → occipital lobe.; Each eye sends a slightly different, upside-down, mirror-reversed image; the brain merges them during visual processing.", "k": "concept"}, {"id": "cd-gap-vision1-278", "ch": "12", "s": "vision1", "topic": "Types of eye movement", "f": "Types of eye movement · key points?", "b": "Saccades: jumping from object A to object B.; Pursuit: smoothly following a moving object.; Convergence/divergence: both eyes turn inward / outward.; Vestibular: eyes adjust to head movement (inner-ear link).; Fixation maintenance: tiny movements that keep both eyes positioned and focused.", "k": "concept"}, {"id": "cd-gap-vision1-279", "ch": "12", "s": "vision1", "topic": "Tears and drainage path", "f": "Tears and drainage path · key points?", "b": "Lacrimal glands make tears, which fight infection, provide nutrients/moisture, and remove debris.; Drainage: blink → puncta (duct openings) → lacrimal canaliculi → lacrimal sac → nasolacrimal duct → nose.", "k": "concept"}, {"id": "cd-gap-vision2-280", "ch": "12", "s": "vision2", "topic": "Vision screening & acuity charts", "f": "Vision screening & acuity charts · key points?", "b": "Far vision: Snellen or E chart, reported as 6/X (US: 20/X). 6/12 (US: 20/40) = you see at 6 m (20 ft) what an average eye sees at 12 m (40 ft).; Near vision: handheld card; Jaeger chart held 12–14 in, 10 lines (4- to 14-point type).; Other screening items: binocular fusion (using both eyes together), stereopsis (depth perception), convergence/eye teaming, color vision, tracking, visual memory.; Normal intraocular pressure: 10–21 mm Hg.", "k": "concept"}, {"id": "cd-gap-vision2-281", "ch": "12", "s": "vision2", "topic": "Treating vision problems", "f": "Treating vision problems · key points?", "b": "Muscle imbalance: glasses, patching, or surgery.; Refractive errors: glasses, contacts, or surgery — LASIK (laser-assisted in situ keratomileusis) treats myopia, hyperopia, astigmatism.; Cataract: remove and replace with a clear prosthetic lens.; Glaucoma: surgical or drug management.", "k": "concept"}, {"id": "cd-gap-vision2-282", "ch": "12", "s": "vision2", "topic": "Glaucoma extras: PERG & cyclophotocoagulation", "f": "Glaucoma extras: PERG & cyclophotocoagulation · key points?", "b": "Pattern electroretinogram (PERG): electrical signal from retinal ganglion cells; used to check the effect of IOP-lowering eye drops in early glaucoma. Ganglion-cell function may partly recover once IOP drops.; Cyclophotocoagulation: treats the ciliary tissue to decrease fluid (aqueous) production.", "k": "concept"}, {"id": "cd-gap-vision2-283", "ch": "12", "s": "vision2", "topic": "Wet macular degeneration", "f": "Wet macular degeneration · key points?", "b": "Also called exudative MD: new blood vessels grow under the retina and macula (choroidal neovascularization). Causes far more vision loss than dry MD.", "k": "concept"}, {"id": "cd-gap-hearing-284", "ch": "12", "s": "hearing", "topic": "Fluids of the inner ear & balance organs", "f": "Fluids of the inner ear & balance organs · key points?", "b": "Bony labyrinth is filled with perilymph; the membranous labyrinth inside the cochlea holds endolymph. The ion difference creates the current that sensitizes cochlear hair cells.; Vestibular apparatus = 3 semicircular canals + vestibule (utricle, saccule). Detects head position and acceleration.; Vestibular hair cells → vestibular branch of the vestibulocochlear nerve → cerebellum (balance).; Auditory (eustachian) tube links middle ear to nasopharynx to equalize pressure; shorter and narrower in children.", "k": "concept"}, {"id": "cd-gap-hearing-285", "ch": "12", "s": "hearing", "topic": "Barotrauma & noise-induced loss", "f": "Barotrauma & noise-induced loss · key points?", "b": "Barotrauma: injury when the ear can't equalize to sudden pressure change (air travel, diving). Higher risk with an upper respiratory infection blocking the auditory tube.; Tinnitus (ringing) causes include noise-induced hearing loss, presbycusis, hypertension, atherosclerosis, head injury, cochlear infection.; Mixed hearing loss = conductive + sensorineural together.", "k": "concept"}, {"id": "cd-gap-hearing-286", "ch": "12", "s": "hearing", "topic": "Hearing tests", "f": "Hearing tests · key points?", "b": "Auditory acuity → Basic overall hearing check; Pure-tone audiometry → Thresholds by frequency (hertz, Hz = pitch) and loudness (decibels, dB); normal −10 to +15 dB; Acoustic immittance: tympanometry → Eardrum movement → middle-ear fluid, perforation, cerumen; Acoustic reflex → Eardrum movement in response to sound; VEMP (vestibular evoked myogenic potential) → Loud sound triggers a reflex; tests the saccule, vestibular nerve, and related tracts", "k": "concept"}, {"id": "cd-gap-hearing-287", "ch": "12", "s": "hearing", "topic": "Hearing treatment", "f": "Hearing treatment · key points?", "b": "Hearing aids and assistive listening devices amplify sound.; Cochlear implant (if aids don't help): electrodes in the cochlea stimulate the cochlear nerve, bypassing outer/middle ear. Gives a sense of sound, not normal hearing.; Early screening/implants in young children support language and cognitive development.", "k": "concept"}, {"id": "cd-gap-other-288", "ch": "12", "s": "other", "topic": "Taste disorders", "f": "Taste disorders · key points?", "b": "Often involve smell. Include phantom taste perception (lingering unpleasant taste), reduced ability to taste one or all five basic tastes, or distorted flavor such as a persistent metallic taste.", "k": "concept"}, {"id": "cd-gap-other-289", "ch": "12", "s": "other", "topic": "Myofascia (trigger points)", "f": "Myofascia (trigger points) · key points?", "b": "Trigger points are tender, tight bands of muscle fibers that refer pain elsewhere — thought to come from fibrous bands pressing on vessels and nerves and tightening the myofascia (outer membrane of muscle tissue).", "k": "concept"}, {"id": "cd-gl-vision1-290", "ch": "12", "s": "vision1", "topic": "Key terms", "f": "Visual processing · definition?", "b": "Brain coordinates the two eyes' slightly different, inverted images into one picture.", "k": "term"}, {"id": "cd-gl-somato-291", "ch": "12", "s": "somato", "topic": "Key terms", "f": "Somatosensory modalities · definition?", "b": "The specific type of sensation perceived (e.g., touch vs temperature).", "k": "term"}, {"id": "cd-gap-basics-292", "ch": "13", "s": "basics", "topic": "Hypothalamic hormones to the anterior pituitary", "f": "Hypothalamic hormones to the anterior pituitary · key points?", "b": "GHRH (growth hormone–releasing) TRH (thyrotropin-releasing) CRH (corticotropin-releasing) GnRH (gonadotropin-releasing) → Somatostatin → inhibits GH and TSH Dopamine → inhibits prolactin", "k": "concept"}, {"id": "cd-gap-basics-293", "ch": "13", "s": "basics", "topic": "Secretion patterns (rhythms)", "f": "Secretion patterns (rhythms) · key points?", "b": "28-day cycle: estrogens (estrone, estradiol, estriol), progesterone, LH, FSH regulate the menstrual cycle.; 24-hour diurnal: growth hormone ↑ during sleep, ↓ while awake.", "k": "concept"}, {"id": "cd-gap-basics-294", "ch": "13", "s": "basics", "topic": "Diagnosing hormone problems (general)", "f": "Diagnosing hormone problems (general) · key points?", "b": "Start with history + physical exam; measure hormones in blood or urine.; Suppression or stimulation tests check how a gland responds.; Levels fluctuate, so urine is often a 24-hour collection.; Electrolytes, glucose, calcium give indirect clues; CT/MRI to find a tumor; genetic testing when needed.", "k": "concept"}, {"id": "cd-gap-stress-295", "ch": "13", "s": "stress", "topic": "General adaptation syndrome (3 stages)", "f": "General adaptation syndrome (3 stages) · key points?", "b": "Alarm (\"fight or flight\"): catecholamines + cortisol released via SNS, HPA axis, adrenals.; Resistance: cortisol falls by negative feedback. Long-term hypercortisolism exhausts immune/inflammatory responses, breaks down protein, causes glucose intolerance. Suppressed thyroid, GH, and reproductive hormones; persistent ↑ ADH → fluid retention and hypertension.; Exhaustion: energy depletion and degeneration of cells, tissues, organs.", "k": "concept"}, {"id": "cd-gap-pituitary-296", "ch": "13", "s": "pituitary", "topic": "Hypo-, hyper-, and panhypopituitarism", "f": "Hypo-, hyper-, and panhypopituitarism · key points?", "b": "Hypopituitarism: too little of one or more pituitary hormones; gradual; vague signs (fatigue, weakness, anorexia, sexual dysfunction, growth problems, dry skin, constipation, cold intolerance).; Hyperpituitarism: excess of one or more pituitary hormones.; Panhypopituitarism: all pituitary hormones decreased.; Causes of axis damage: infection, inflammation, tumors, degeneration, hypoxia, hemorrhage, genetic defects.", "k": "concept"}, {"id": "cd-gap-pituitary-297", "ch": "13", "s": "pituitary", "topic": "Gland failure & ectopic tumors", "f": "Gland failure & ectopic tumors · key points?", "b": "Glands can fail from genetics, autoimmunity, degeneration, atrophy, infection, inflammation, neoplasm, hypoxia, radiation, medications.; Overstimulation → hyperplasia → too much hormone.; Some neoplasms secrete hormones ectopically and ignore negative feedback → hypersecretion. Most common: ADH and ACTH. Removing the tumor usually fixes it.", "k": "concept"}, {"id": "cd-gap-thyroid-298", "ch": "13", "s": "thyroid", "topic": "Graves: thyrocytes & thyroid storm", "f": "Graves: thyrocytes & thyroid storm · key points?", "b": "IgG antibodies bind the TSH receptor on thyrocytes (thyroid cells) → excess hormone (thyrotoxicosis).; Thyrotoxic crisis (thyroid storm): sudden, severe worsening of hyperthyroidism; can be fatal.", "k": "concept"}, {"id": "cd-gap-thyroid-299", "ch": "13", "s": "thyroid", "topic": "Acquired hypothyroidism", "f": "Acquired hypothyroidism · key points?", "b": "Results from (1) deficient hormone synthesis, (2) thyroid destruction, or (3) impaired TSH/TRH secretion. Common causes: autoimmunity (Hashimoto), iodine deficiency, surgery or radiation to the thyroid, gland-destroying medications.", "k": "concept"}, {"id": "cd-gap-adrenal-300", "ch": "13", "s": "adrenal", "topic": "Addison disease: labs & acute treatment", "f": "Addison disease: labs & acute treatment · key points?", "b": "Labs: hyponatremia + hyperkalemia; cortisol stays low even after ACTH is given.; Acute: isotonic IV fluids + hydrocortisone sodium succinate (or sodium phosphate); BP should improve in 4–6 h.; Then lifelong oral glucocorticoid + mineralocorticoid; may need ↑ salt in hot weather.; Exception: TB-caused Addison — treat TB; adrenal function returns.", "k": "concept"}, {"id": "cd-gap-adrenal-301", "ch": "13", "s": "adrenal", "topic": "ACTH-dependent vs adrenal hypercortisolism", "f": "ACTH-dependent vs adrenal hypercortisolism · key points?", "b": "Pituitary or ectopic tumor → excess ACTH → adrenal hyperplasia → excess cortisol (ACTH-dependent).; Adrenal tumors make cortisol directly, not driven by ACTH.", "k": "concept"}, {"id": "cd-gl-basics-302", "ch": "13", "s": "basics", "topic": "Key terms", "f": "Endocrine pathway · definition?", "b": "Hormone travels through blood to distant cells with receptors.", "k": "term"}, {"id": "cd-gl-basics-303", "ch": "13", "s": "basics", "topic": "Key terms", "f": "Synaptic pathway · definition?", "b": "Neurotransmitter released at a synapse and taken up by a nearby neuron.", "k": "term"}, {"id": "cd-gl-basics-304", "ch": "13", "s": "basics", "topic": "Key terms", "f": "Neuroendocrine pathway · definition?", "b": "Neurohormone released at a synapse, enters the blood, acts on distant cells.", "k": "term"}, {"id": "cd-n14-305", "ch": "14", "s": "r-fert", "topic": "Rapid-fire", "f": "Hormone that triggers ovulation", "b": "LH surge", "k": "concept"}, {"id": "cd-n14-306", "ch": "14", "s": "r-basics", "topic": "Rapid-fi ary", "topic": "Rapid-fire", "f": "Menopause diagnosis", "b": "12 months amenorrhea, no other cause", "k": "concept"}, {"id": "cd-n14-332", "ch": "14", "s": "r-basics", "topic": "Rapid-fire", "f": "Best lab marker of ovarian failure", "b": "Elevated FSH", "k": "concept"}, {"id": "cd-n14-333", "ch": "14", "s": "r-ovary", "topic": "Rapid-fire", "f": "HRT not started after what age (file)?", "b": "65 (dementia risk)", "k": "concept"}, {"id": "cd-n14-334", "ch": "14", "s": "r-ovary", "topic": "Rapid-fire", "f": "SERM for osteoporosis", "b": "Raloxifene", "k": "concept"}, {"id": "cd-n14-335", "ch": "14", "s": "r-male", "topic": "Rapid-fire", "f": "Spinal level for erection", "b": "S2–S4 parasympathetic", "k": "concept"}, {"id": "cd-n14-336", "ch": "14", "s": "r-male", "topic": "Rapid-fire", "f": "PDE5 inhibitor contraindication (Merck)", "b": "Nitrates", "k": "concept"}, {"id": "cd-n14-337", "ch": "14", "s": "r-male", "topic": "Rapid-fire", "f": "BPH growth location", "b": "Periurethral", "k": "concept"}, {"id": "cd-n14-338", "ch": "14", "s": "r-mcancer", "topic": "Rapid-fire", "f": "Prostate cancer location", "b": "Peripheral gland", "k": "concept"}, {"id": "cd-n14-339", "ch": "14", "s": "r-male", "topic": "Rapid-fire", "f": "Most common BPH surgery", "b": "TURP", "k": "concept"}, {"id": "cd-n14-340", "ch": "14", "s": "r-mcancer", "topic": "Rapid-fire", "f": "Gleason score range", "b": "2–10; lower = better", "k": "concept"}, {"id": "cd-n14-341", "ch": "14", "s": "r-mcancer", "topic": "Rapid-fire", "f": "Low free PSA vs total suggests", "b": "Cancer", "k": "concept"}, {"id": "cd-n14-342", "ch": "14", "s": "r-mcancer", "topic": "Rapid-fire", "f": "Most common site of prostate cancer distant spread", "b": "Bone", "k": "concept"}, {"id": "cd-n14-343", "ch": "14", "s": "r-mcancer", "topic": "Rapid-fire", "f": "Testicular cancer biggest risk", "b": "Cryptorchidism (20–40×)", "k": "concept"}, {"id": "cd-n14-344", "ch": "14", "s": "r-mcancer", "topic": "Rapid-fire", "f": "How function weightedPick(list, ws){ var t = ws.reduce(function(a, b){ return a + b; }, 0), r = Math.random() * t; for(var i = 0; i < list.length; i++){ r -= ws[i]; if(r <= 0) return list[i]; } return list[list.length - 1]; }

  var lowest = tried.sort(function(a, b){ return mastery(a) - mastery(b); })[0];
  if(m != null && sec === lowest) return 'Your weakest area right now: ' + name + ' (' + m + '%).';

function pickNext(R){
  var now = Date.now();
  if(R.requeue.length){
    var force = R.i >= R.n;
    for(var j = 0; j < R.requeue.length; j++){
      if(force || R.requeue[j].at <= R.i){ var q = R.requeue.splice(j, 1)[0]; return { it:ITEM[q.id], why:q.why, re:true, twin:!!q.twin }; }
    }

    P.sort(function(a, b){ var x = st(a), y = st(b); var rank = function(s){ return s.res === 'wrong' ? 0 : s.res === 'skip' ? 1 : 2; }; return (rank(x) - rank(y)) || (x.last - y.last); });

  var total = {}; pool(R.filter).forEach(function(it){ total[it.s] = (total[it.s] || 0) + 1; });

/* ================= MOCK EXAM COMPOSER ================= */
function composeExam(n, mix){
  var P = pool(), book = P.filter(function(it){ return it.b; }), other = P.filter(function(it){ return !it.b && it.k !== 'hall' && it.k !== 'sign'; });
  var nb = mix === 'book' ? Math.min(book.length, Math.round(n * 0.6)) : Math.min(book.length, Math.round(n * 0.3));
  var rank = function(it){ var s = st(it); return (!s ? 0 : isWeak(it) ? 0.2 : 0.6) + Math.random(); };
  var pickB = book.slice().sort(function(a, b){ return rank(a) - rank(b); }).slice(0, nb);
  var need = n - pickB.length, bySec = {};
  other.forEach(function(it){ (bySec[it.s] = bySec[it.s] || []).push(it); });
  Object.keys(bySec).forEach(function(s){ bySec[s].sort(function(a, b){ return rank(a) - rank(b); }); });
  var picks = [];
  while(picks.length < need){
    var secs = Object.keys(bySec).filter(function(s){ return bySec[s].length; }); if(!secs.length) break;
    var s = weightedPick(secs, secs.map(function(x){ return Math.sqrt(bySec[x].length + 1); }));
    picks.push(bySec[s].shift());
  }
  return shuffle(pickB.concat(picks)).map(function(it){ return it.id; });

/* ---------- rounds ---------- */
function modeFilter(mode, arg){
  if(mode === 'book') return function(it){ return !!it.b; };
  if(mode === 'weak') return isWeak;
  if(mode === 'topic') return function(it){ return it.s === arg; };
  if(mode === 'mc') return function(it){ return !!it.mc; };
  if(mode === 'cram') return function(it){ return !(S.cramDone || {})[it.id]; };
  return null;
}
function startRound(mode, arg){
  if(mode === 'cram' && !pool(modeFilter('cram')).length){ if(confirm('You have gone through every question in this view. Start the cram pass over from the beginning?')){ S.cramDone = {}; persist(); } else return; }
  if(mode === 'weak' && !pool(isWeak).length){ toast('Nothing to retest yet. Start a regular round.'); return; }
  var snap = {}; D.sections.forEach(function(s){ snap[s.id] = mastery(s.id); });
  R = { mode:mode, arg:arg, filter:modeFilter(mode, arg), used:{}, requeue:[], i:0, n:S.settings.round, res:[], lastSec:null, cur:null, streak:0, start:snap, t0:Date.now() };
  if(mode === 'cram'){ R.cram = true; R.n = pool(R.filter).length; }
  nextQ();
}
function nextQ(){
  if(bossOver()) return roundDone();
  if(R.i >= R.n && (!R.requeue.length || R.i >= R.n + 4)) return roundDone();
  var pk = pickNext(R);
  if(!pk || !pk.it) return roundDone();
  var idx = pk.it.o.map(function(_, i){ return i; });
  R.cur = { it:pk.it, why:pk.why, order:(pk.it.fx ? idx : shuffle(idx)), sel:[], phase:'ask', re:!!pk.re, twin:!!pk.twin, tf:{}, ai:null };
  R.used[pk.it.id] = 1; R.lastSec = pk.it.s;
  go('q');
}
function segHTML(){
  if(R.cram){ var tot = pool().length, dn = tot - pool(modeFilter('cram')).length; return '<i class="ok" style="flex:' + Math.max(dn,0.001) + '"></i><i style="flex:' + Math.max(tot - dn,0.001) + '"></i>'; }
  var total = Math.max(R.n, R.res.length + 1), h = '';
  for(var i = 0; i < total; i++){ h += '<i class="' + (i < R.res.length ? R.res[i].res : (i === R.res.length ? 'cur' : '')) + '"></i>'; }
  return h;
}
function optHTML(it, c, oi, pos, reveal){
  if(!reveal && tfMode(it)) return tfOptHTML(it, c, oi, pos);
  var sel = c.sel.indexOf(pos) >= 0, cls = 'opt' + (it.m ? ' sq' : ''), rat = '';
  if(reveal){
    var ok = it.a.indexOf(oi) >= 0, picked = c.chosen.indexOf(oi) >= 0;
    cls += ok ? ' right' + (picked ? '' : ' missed') : (picked ? ' wrong' : '');
    var showAll = c.res !== 'ok';
    if(ok || picked || showAll) rat = '<span class="rat">' + esc(it.w[oi]) + '</span>';
  }
  return '<button class="' + cls + '" type="button" data-pos="' + pos + '" aria-pressed="' + (reveal ? c.chosen.indexOf(oi) >= 0 : sel) + '"' + (reveal ? ' disabled' : '') + '>' +
    '<span class="k">' + LET.charAt(pos) + '</span><span>' + it.o[oi] + rat + '</span></button>';
}
function qscreen(){
  var c = R.cur, it = c.it, rev = c.phase === 'rev';
  var opts = c.order.map(function(oi, pos){ return optHTML(it, c, oi, pos, rev); }).join('');
  var foot = '', v = '';
  if(!rev){
    foot = tfHint(c) + '<div class="conf"><button class="btn good" type="button" data-conf="sure"' + (canSubmit(c) ? '' : ' disabled') + '>Sure: check it</button>' +
      '<button class="btn lucky" type="button" data-conf="guess"' + (canSubmit(c) ? '' : ' disabled') + '>Guessing: check it</button></div>' +
      '<button class="skip" type="button" data-skip>Skip for now (it comes back)</button>';
  } else {
    if(c.res === 'ok') v = '<div class="verdict ok pop">Correct.' + '' + '</div>';
    else if(c.res === 'lucky') v = '<div class="verdict lucky pop">Right, but you were guessing.<p>That’s a lucky guess, so it comes back later this round to be proven.' + (c.twinNext ? ' First, a 🔁 twin question on the same idea.' : '') + '</p></div>';
    else {
      var blur = '';
      if(!it.m){ var ch = c.chosen[0]; blur = '<p><b>Blur:</b> you chose “' + esc(strip(it.o[ch])) + '”. ' + esc(it.w[ch]) + '</p><p>The answer is “' + esc(strip(it.o[it.a[0]])) + '”.</p>'; }
      else {
        var got = it.a.filter(function(i){ return c.chosen.indexOf(i) >= 0; }).length, extra = c.chosen.filter(function(i){ return it.a.indexOf(i) < 0; }).length;
        blur = '<p>Select-all needs every correct choice and nothing else. You found <b>' + got + ' of ' + it.a.length + '</b> correct choices' + (extra ? ' and picked <b>' + extra + '</b> wrong one' + (extra > 1 ? 's' : '') : '') + '. Dashed green = the ones you left out.</p>';
      }
      v = '<div class="verdict wrong pop">Not quite.' + blur + (c.twinNext ? '<p>🔁 Next: a twin question on the same idea. This one comes back later too.</p>' : '<p>It comes back in a few questions.</p>') + '</div>';
    }
    v += gameReveal(c);
    var others = '';
    if(c.res === 'ok'){
      var rest = c.order.filter(function(oi){ return it.a.indexOf(oi) < 0; });
      if(rest.length) others = '<details class="others"><summary>Why the others are wrong</summary><ul class="plain">' + rest.map(function(oi){ return '<li><b>' + esc(strip(it.o[oi])) + ':</b> ' + esc(it.w[oi]) + '</li>'; }).join('') + '</ul></details>';
    }
    var hook = it.h ? '<div class="hook pop"><b>💡 ' + (it.hc ? esc(it.hc) : 'Memory aid') + '</b><p>' + esc(it.h) + '</p></div>' : '';
    foot = tfNote(c) + hook + (it.ev ? '<div class="evq pop"><b>📖 From your book</b><p>' + esc(strip(it.ev)) + '</p></div>' : '') + aiPanel(it, c) + others + '<div class="next"><button class="btn block" type="button" data-next>' + nextLabel() + '</button></div>';
  }
  app.innerHTML = '<div class="qbar"><button class="x" type="button" data-exit aria-label="End round">✕</button><div class="segs" aria-hidden="true">' + segHTML() + '</div><span class="qn">' + (R.res.length + (rev ? 0 : 1)) + ' / ' + Math.max(R.n, R.res.length + (rev ? 0 : 1)) + '</span></div>' +
    gameQBar() + '<div class="why-chip"><span class="ic" aria-hidden="true">⟳</span><span>' + esc(c.why) + '</span></div>' + tagsHTML(it) + contextHTML(it) +
    '<p class="stem">' + esc(it.q) + '</p>' + v + '<div class="opts" role="group" aria-label="Answer choices">' + opts + '</div>' + foot;
}
function submit(guess){
  var c = R.cur, it = c.it; if(!canSubmit(c) || c.phase !== 'ask') return;
  var chosen = c.sel.map(function(pos){ return c.order[pos]; }), ok = sameSet(chosen, it.a);
  var res = ok ? (guess ? 'lucky' : 'ok') : 'wrong';
  var prevS = S.items[it.id] ? Object.assign({}, S.items[it.id]) : null;
  record(it, res, chosen);
  c.phase = 'rev'; c.res = res; c.chosen = chosen;
  if(tfMode(it)){ var jr = 0; c.order.forEach(function(oi, pos){ if((c.tf[pos] === true) === (it.a.indexOf(oi) >= 0)) jr++; }); c.tfJudged = [jr, c.order.length]; }
  R.res.push({ id:it.id, res:res, s:it.s, chosen:chosen });
  if(res === 'ok'){ R.streak++; if(R.streak > S.best){ S.best = R.streak; persist(); } } else R.streak = 0;
  if(res === 'wrong' && !c.re && !R.boss && !R.cram) R.requeue.push({ id:it.id, at:R.i + 4, why:'Retest: you missed this a few questions ago.' });
  if(res === 'lucky' && !c.re && !R.boss && !R.cram) R.requeue.push({ id:it.id, at:R.i + 6, why:'Retest: that was a lucky guess. Prove it.' });
  if((res === 'wrong' || res === 'lucky') && !c.twin && !R.boss && !R.cram) c.twinNext = addTwin(it);
  if(R.cram){ S.cramDone = S.cramDone || {}; S.cramDone[it.id] = 1; persist(); }
  gameAnswer(it, res, guess, c, prevS);
  render();
}
function skipQ(){
  var c = R.cur, it = c.it; record(it, 'skip');
  R.res.push({ id:it.id, res:'skip', s:it.s, chosen:[] });
  if(!c.re && !R.boss && !R.cram) R.requeue.push({ id:it.id, at:R.i + 5, why:'You skipped this one. It’s back.' });
  R.streak = 0; gameSkip(); R.i++; nextQ();
}
function roundDone(){
  if(R && R.res.length){
    var cnt = function(r){ return R.res.filter(function(x){ return x.res === r; }).length; };
    S.rounds.push({ t:Date.now(), mode:R.mode, n:R.res.length, ok:cnt('ok'), lucky:cnt('lucky'), wrong:cnt('wrong'), skip:cnt('skip') });
    if(S.rounds.length > 80) S.rounds = S.rounds.slice(-80);
    persist();
  }
  gameRoundDone();
  go('sum');
}
function summary(){
  if(!R || !R.res.length){ go('home'); return; }

  var ok = cnt('ok'), lucky = cnt('lucky'), wrong = cnt('wrong'), skip = cnt('skip'), answered = ok + lucky + wrong;
  var touched = {}; R.res.forEach(function(r){ touched[r.s] = 1; });
  var deltas = Object.keys(touched).map(function(s){
    var a = R.start[s], b = mastery(s);

      (d ? ' <span class="delta ' + (d > 0 ? 'up' : 'down') + '">' + (d > 0 ? '+' : '') + d + '</span>' : '') + '</em></div>';
  }).join('');
  var blurs = R.res.filter(function(r){ return r.res === 'wrong'; }).map(function(r){

    if(!it.m) return '<div class="blur">You chose “' + esc(short(it.o[r.chosen[0]], 80)) + '” instead of “' + esc(short(it.o[it.a[0]], 80)) + '”<small>' + esc(secName(it.s)) + ' · ' + esc(short(it.q, 90)) + '</small></div>';
    return '<div class="blur">Select-all miss on: ' + esc(short(it.q, 100)) + '<small>' + esc(secName(it.s)) + '</small></div>';

  var avoid = Object.keys(skipped).map(function(s){ return skipped[s] + ' from ' + secName(s); });
  app.innerHTML = (R.boss ? bossResult() : '<h1>Round done</h1>') +
    '<div class="card"><div class="score"><b>' + ok + '/' + answered + '</b><span class="muted">real score</span></div>' +
    '<p style="margin:4px 0 0">' + (lucky ? 'You also got <b>' + lucky + '</b> right by guessing. Lucky guesses don’t count until you prove them. ' : '') +
    (wrong ? '<b>' + wrong + '</b> missed. ' : 'No misses. ') + (skip ? '<b>' + skip + '</b> skipped.' : '') + '</p></div>' +
    (blurs ? '<div class="card"><h3>Blurs this round</h3>' + blurs + '</div>' : '') +

    '<div class="card"><h3>Topic scores</h3><div class="bars">' + deltas + '</div><p class="small muted" style="margin:8px 0 0">' + esc(nextFocus()) + '</p></div>' +
    gameSumCard() + todaySumLine() + coachCard() + '<div class="row"><button class="btn" type="button" data-again>' + (R.mode === 'today' ? 'Next Today set' : R.boss ? 'Rematch' : 'Another round') + '</button><button class="btn ghost" type="button" data-go="home">Home</button></div>';
}

function fmtT(ms){ ms = Math.max(0, ms); var s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), ss = s % 60; return (h ? h + ':' + ('0' + m).slice(-2) : m) + ':' + ('0' + ss).slice(-2); }

function examQ(){

function findTwin(it){

var SECRANK = {}; D.sections.forEach(function(s, i){ ['s:' + s.id, 't:' + s.nav, 't:' + s.title].forEach(function(k){ if(!(k in SECRANK)) SECRANK[k] = i; }); });
