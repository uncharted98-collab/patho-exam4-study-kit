or role of hormones?", "o": ["Growth stimulation", "Platelet synthesis", "Fluid balance and regulation", "Metabolic rate regulation"], "a": [1], "w": ["Growth and development is a hormone role.", "Correct. Hormones regulate metabolism, growth, fluid/electrolytes, sexual development and reproduction; platelet synthesis isn't listed.", "Fluid and electrolyte balance is a hormone role.", "Metabolism is a hormone role."], "m": false, "b": "Ch 13 #1", "x": false, "r": false, "d": 0.3, "t": "basics", "ev": "Hormones have many important regulatory functions, including metabolism, growth and development, muscle and fat distribution, fluid and electrolyte balance, sexual development, and reproduction."}, {"id": "q-basics-02", "s": "basics", "k": "bank", "q": "The release of hormones from glands is most often controlled by", "o": ["negative feedback mechanisms.", "nephrogenic mechanisms.", "ectopic hormone production.", "active transport."], "a": [0], "w": ["Correct. Negative feedback works like a thermostat and is the most common control mechanism.", "Nephrogenic refers to the kidney (as in nephrogenic DI).", "Ectopic production escapes normal control.", "Not a control mechanism for release."], "m": false, "b": "Ch 13 #2", "x": false, "r": false, "d": 0.3, "t": "basics", "ev": "The most common mechanism is negative feedback, which is like an internal thermostat (Fig."}, {"id": "q-basics-03", "s": "basics", "k": "bank", "q": "The most common cause of endocrine disorders is", "o": ["surgical removal of endocrine glands.", "infection.", "adenomas.", "immunodeficiency."], "a": [2], "w": ["Surgery is one cause but not the most common.", "Infection can damage glands but isn't the most common cause.", "Correct. Adenomas (benign gland tumors) are the most common cause; the chapter shows them driving excess hormone, e.g., a pituitary adenoma making TSH or ACTH.", "Not the most common cause."], "m": false, "b": "Ch 13 #3", "x": false, "r": false, "d": 0.6, "t": "basics", "ev": "End-of-chapter question. The chapter text gives examples rather than a one-line answer, e.g.: “Hyperthyroidism can result from … excess production of TSH by a pituitary adenoma.”"}, {"id": "q-adrenal-01", "s": "adrenal", "k": "bank", "q": "Excess cortisol is represented by which condition?", "o": ["Addison disease", "Cushing syndrome", "Diabetes insipidus", "Hyperthyroidism"], "a": [1], "w": ["Addison = too little cortisol and aldosterone.", "Correct. Cushing syndrome = prolonged exposure to high glucocorticoids.", "DI = insufficient ADH.", "Hyperthyroidism = excess thyroid hormone."], "m": false, "b": "Ch 13 #4", "x": false, "r": false, "d": 0.2, "t": "adrenal", "ev": "Cushing syndrome refers to a condition of prolonged exposure to elevated levels of either endogenous (from the adrenal cortex or cortisol-producing tumors) or exogenous glucocorticoids (as when taking glucocorticoid drugs)."}, {"id": "q-pituitary-01", "s": "pituitary", "k": "bank", "q": "Diabetes insipidus, if left untreated, will rapidly develop into", "o": ["malignant hypertension.", "diabetic coma.", "dehydration.", "metabolic alkalosis."], "a": [2], "w": ["DI causes volume loss, not hypertension.", "Diabetic coma relates to diabetes mellitus.", "Correct. Polyuria with dilute urine → hyperosmolality and severe dehydration; shock and death if untreated.", "Not the main consequence."], "m": false, "b": "Ch 13 #5", "x": false, "r": false, "d": 0.3, "t": "pituitary", "ev": "Loss of fluids leads to serum hyperosmolality and severe dehydration."}, {"id": "q-basics-04", "s": "basics", "k": "bank", "q": "A patient is asked to collect a 24-hour urine test to check a hormone level. Why is the 24-hour urine needed?", "o": ["This is done to measure female reproductive hormone levels.", "This is done to obtain a measurement of hormone secretion over time.", "It is easier than obtaining a blood sample.", "Urine is not an effective method of measuring hormone levels."], "a": [1], "w": ["It isn't limited to reproductive hormones.", "Correct. Secretion rates fluctuate, so a 24-hour collection captures the total.", "Ease isn't the reason.", "Urine is used to measure hormones."], "m": false, "b": "Ch 13 #6", "x": false, "r": false, "d": 0.3, "t": "basics", "ev": "Because secretion rates can fluctuate over time, urine hormone levels are often collected over a 24-hour period."}, {"id": "q-thyroid-01", "s": "thyroid", "k": "bank", "q": "You are experiencing constipation, dry skin, weight gain, and cold intolerance. Which condition are you most likely experiencing?", "o": ["Hyperthyroidism", "Addison disease", "Cushing syndrome", "Hypothyroidism"], "a": [3], "w": ["Hyperthyroidism causes weight loss, heat intolerance, diarrhea.", "Addison causes weight loss, hypotension, hyperpigmentation.", "Cushing causes central obesity, but not cold intolerance and constipation as a set.", "Correct. Low thyroid hormone slows metabolism: cold intolerance, weight gain, dry skin, constipation."], "m": false, "b": "Ch 13 #7", "x": false, "r": false, "d": 0.2, "t": "thyroid", "ev": "CLINICAL MANIFESTATIONS · Clinical manifestations are often gradual and include fatigue, cold intolerance, weakness, weight gain, dry skin, coarse hair, constipation, lethargy, impaired reproduction, and impaired memory (Fig."}, {"id": "q-adrenal-02", "s": "adrenal", "k": "bank", "q": "Which of the following occurs with elevated levels of cortisol?", "o": ["Fatty acids are mobilized.", "Glucose levels are suppressed.", "Plasma protein levels increase.", "Inflammation increases."], "a": [0], "w": ["Correct. Glucocorticoids increase fat mobilization.", "Cortisol raises glucose.", "Cortisol breaks down proteins.", "Cortisol suppresses inflammation."], "m": false, "b": "Ch 13 #8", "x": false, "r": false, "d": 0.5, "t": "adrenal", "ev": "Glucocorticoids function to: Stimulate glucose production · Decrease tissue glucose utilization · Increase breakdown and circulation of plasma proteins · Increase fat mobilization · Prevent the release of chemical mediators that trigger the inflammatory response …"}, {"id": "q-adrenal-03", "s": "adrenal", "k": "bank", "q": "Which type of hormone is not produced in the adrenal cortex?", "o": ["Mineralocorticoids", "Glucocorticoids", "Adrenal sex hormones", "Neurotransmitters"], "a": [3], "w": ["Aldosterone is made in the cortex.", "Cortisol is made in the cortex.", "Androgens are made in the cortex.", "Correct. Epinephrine and norepinephrine come from the adrenal medulla."], "m": false, "b": "Ch 13 #9", "x": false, "r": false, "d": 0.3, "t": "adrenal", "ev": "The adrenal medulla secretes epinephrine and norepinephrine."}, {"id": "q-pituitary-02", "s": "pituitary", "k": "bank", "q": "Diagnosis of SIADH is based on which of the following?", "o": ["Hyponatremia", "Hypertonicity", "Increased urine volume", "Dilute urine with a low sodium content"], "a": [0], "w": ["Correct. Serum sodium below 135 mEq/L is a key criterion.", "SIADH causes hypotonicity (osmolality < 280).", "Urine volume decreases.", "Urine is concentrated with high sodium."], "m": false, "b": "Ch 13 #10", "x": false, "r": false, "d": 0.4, "t": "pituitary", "ev": "Diagnosis is based on: Hyponatremia (serum sodium less than 135 mEq/L) · Hypotonicity (plasma osmolality less than 280 mOsm/kg) · Decreased urine volume · Highly concentrated urine with a high sodium content · Absence of renal, adrenal, or thyroid abnormalities"}, {"id": "q-basics-05", "s": "basics", "k": "bank", "q": "Release of hormones from the anterior pituitary differs from those released by the posterior pituitary. What is the major way in which these are different?", "o": ["The posterior pituitary is much less complicated.", "The anterior pituitary releases only two hormones.", "The posterior pituitary follows the positive feedback loop.", "The anterior pituitary is controlled by the hypothalamus."], "a": [3], "w": ["Not the key difference.", "The posterior releases two (ADH, oxytocin); the anterior releases many.", "Most hormones use negative feedback.", "Correct. Hypothalamic releasing/inhibiting hormones travel the portal blood vessels to control the anterior pituitary; the posterior only stores and releases ADH and oxytocin made in the hypothalamus."], "m": false, "b": "Ch 13 #11", "x": false, "r": false, "d": 0.6, "t": "basics", "ev": "More specifically, to get from the hypothalamus to the anterior pituitary, prolactin, releasing hormones, and inhibiting hormones travel through the hypophyseal portal system (blood vessels)."}, {"id": "q-basics-06", "s": "basics", "k": "bank", "q": "Which major pathway occurs when a hormone is produced in a cell and can affect neighboring cells and its own cell?", "o": ["Paracrine pathway", "Autocrine pathway", "Synaptic pathway", "Neuroendocrine pathway"], "a": [1], "w": ["Paracrine acts only on nearby cells.", "Correct. Autocrine = paracrine plus the secreting cell is also a receptor, so it affects itself.", "Synaptic involves neurotransmitters at a synapse.", "Neuroendocrine hormones enter the blood to act on distant cells."], "m": false, "b": "Ch 13 #12", "x": false, "r": false, "d": 0.5, "t": "basics", "ev": "Autocrine pathway: the same as the paracrine pathway except that the receptor cells are also secretory cells so, in essence, the cell is able to produce the hormone and exert an effect on itself."}, {"id": "q-pituitary-03", "s": "pituitary", "k": "bank", "q": "A patient presents with SIADH and a serum sodium level of 100 mEq/L. What would you expect for clinical manifestations?", "o": ["Polyuria, polydipsia, polyphagia", "Nausea, vomiting, headache", "Muscle cramps, weakness, irritability", "Seizures, psychosis, gait disturbances"], "a": [3], "w": ["That triad suggests diabetes mellitus.", "Early symptoms (higher sodium).", "Early symptoms (higher sodium).", "Correct. Below 110 mEq/L: psychosis, gait disturbances, seizures, coma."], "m": false, "b": "Ch 13 #13", "x": false, "r": false, "d": 0.5, "t": "pituitary", "ev": "As serum sodium level drops below 110 mEq/L, additional symptoms emerge, including psychosis, gait disturbances, seizures, or coma."}, {"id": "q-thyroid-02", "s": "thyroid", "k": "bank", "q": "A patient presents with exophthalmos. What condition are they likely experiencing?", "o": ["Addison disease", "Cushing disease", "Graves disease", "Diabetes insipidus"], "a": [2], "w": ["Addison → hyperpigmentation.", "Cushing → moon face.", "Correct. Exophthalmos (bulging eyes) is characteristic of Graves disease.", "DI → polyuria."], "m": false, "b": "Ch 13 #14", "x": false, "r": false, "d": 0.2, "t": "thyroid", "ev": "Exophthalmos (protrusion of the eyeballs) is also characteristic of Graves disease."}, {"id": "q-basics-07", "s": "basics", "k": "bank", "q": "Which hormone is regulated by positive feedback?", "o": ["Thyroid hormone", "Cortisol", "Oxytocin", "ADH"], "a": [2], "w": ["Thyroid hormone uses negative feedback (TRH/TSH).", "Cortisol uses negative feedback on CRH/ACTH.", "Correct. Oxytocin during labor stimulates more oxytocin until birth interrupts the cycle.", "ADH responds to osmolality (negative feedback)."], "m": false, "b": null, "x": false, "r": false, "d": 0.3, "t": "basics.feedback", "ev": "Oxytocin levels during labor and delivery increase release of additional oxytocin until the birth of the baby, which decreases stretching of the cervix and the cycle is interrupted."}, {"id": "q-basics-08", "s": "basics", "k": "bank", "q": "Thyroid hormone (T3/T4) levels rise. Through negative feedback, what happens?", "o": ["TRH and TSH decrease", "TRH and TSH increase", "TSH rises while TRH falls", "Nothing; thyroid hormone isn't feedback-controlled"], "a": [0], "w": ["Correct. ", "That would happen with low thyroid hormone.", "Both fall together.", "It is the textbook's example of negative feedback."], "m": false, "b": null, "x": false, "r": false, "d": 0.4, "t": "basics.feedback", "ev": "Circulating thyroid hormone (TH) levels (T3 \\+ T4) alert the hypothalamus and anterior pituitary to increase or decrease thyrotropin-releasing hormone (TRH) and thyroid-stimulating hormone (TSH) secretion."}, {"id": "q-basics-09", "s": "basics", "k": "bank", "q": "Which hormones are made in the hypothalamus and released from the posterior pituitary? Select all that apply.", "o": ["ADH", "Oxytocin", "TSH", "ACTH", "Growth hormone"], "a": [0, 1], "w": ["True.", "True.", "False. TSH comes from the anterior pituitary.", "False. Anterior pituitary.", "False. Anterior pituitary."], "m": true, "b": null, "x": false, "r": false, "d": 0.4, "t": "basics.axis", "ev": "In contrast, the hypothalamus produces antidiuretic hormone (ADH) and oxytocin, which then travel along nerve axons to the posterior pituitary for unchanged release into the systemic · BOX 13.1 Release of Hormones from the Hypothalamus to the Anterior Pituitary · Action 1: · The hypothalamus produces the hormone."}, {"id": "q-basics-10", "s": "basics", "k": "bank", "q": "What happens when a hormone reaches a cell that has no receptor for it?", "o": ["It moves along and has no effect on that cell", "It forces its way in", "It triggers the opposite effect", "It is converted into a neurotransmitter"], "a": [0], "w": ["Correct. Like a key needing a lock: skeletal muscle has GH receptors but ignores ADH.", "Hormones need receptors.", "No effect occurs.", "No."], "m": false, "b": null, "x": false, "r": false, "d": 0.3, "t": "basics.receptor", "ev": "Without the appropriate receptor, the hormone moves along and has no impact on that cell."}, {"id": "q-basics-11", "s": "basics", "k": "bank", "q": "Which can cause impaired receptor binding? Select all that apply.", "o": ["Fewer receptors", "Receptors less sensitive to the hormone", "Antibodies that block or mimic the hormone at the receptor", "Tumor cells with receptor activity that steal the hormone", "Increased hormone elimination by the liver"], "a": [0, 1, 2, 3], "w": ["True.", "True.", "True.", "True.", "False. That is a metabolism/elimination problem, not a receptor problem."], "m": true, "b": null, "x": false, "r": false, "d": 0.6, "t": "basics.receptor", "ev": "Disorders of receptor binding may involve: 1. A decreased number of receptors 2. The lack of receptor sensitivity to the hormone 3. The presence of antibodies that block receptor sites or occupy the receptor site and mimic the hormone 4. The presence of tumor cells with receptor activity that deprives the unaffected cells of the hormone"}, {"id": "q-basics-12", "s": "basics", "k": "bank", "q": "A patient with cirrhosis has high circulating levels of a hormone. What best explains this?", "o": ["The liver can't inactivate (metabolize) the hormone", "The hormone's receptors increased", "Positive feedback took over", "The hypothalamus stopped working"], "a": [0], "w": ["Correct. Impaired metabolism or elimination (liver or kidney disease) causes excess circulating hormone.", "Receptor numbers don't raise blood levels.", "Not the mechanism.", "Not indicated."], "m": false, "b": null, "x": false, "r": false, "d": 0.5, "t": "basics.metab", "ev": "Impaired ability to metabolize or eliminate hormones, such as with liver or kidney disease, will result in excess circulating hormone."}, {"id": "q-basics-13", "s": "basics", "k": "bank", "q": "Why do ectopic hormone-secreting tumors cause hypersecretion?", "o": ["They aren't part of the negative feedback loop", "They have no blood supply", "They block the hormone's receptors", "They only secrete during sleep"], "a": [0], "w": ["Correct. The tumor keeps secreting despite high blood levels; removing it often resolves the problem.", "No.", "That would cause deficit effects.", "No."], "m": false, "b": null, "x": false, "r": false, "d": 0.5, "t": "basics.feedback", "ev": "The tumor is not part of the negative feedback mechanism and continues to produce and secrete excessive hormones despite high blood serum levels."}, {"id": "q-basics-14", "s": "basics", "k": "bank", "q": "Growth hormone rising during sleep and falling while awake is an example of:", "o": ["A 24-hour diurnal secretion pattern", "Positive feedback", "A 28-day cycle", "Ectopic secretion"], "a": [0], "w": ["Correct. ", "Not positive feedback.", "That is the menstrual cycle hormones.", "No tumor here."], "m": false, "b": null, "x": false, "r": false, "d": 0.3, "t": "basics.patterns", "ev": "For example, growth hormone levels increase during sleeping hours and decrease during waking hours."}, {"id": "q-basics-15", "s": "basics", "k": "bank", "q": "Which hypothalamic hormone inhibits prolactin release?", "o": ["Somatostatin", "Dopamine", "TRH", "CRH"], "a": [1], "w": ["Somatostatin inhibits GH and TSH.", "Correct. ", "TRH stimulates TSH.", "CRH stimulates ACTH."], "m": false, "b": null, "x": false, "r": false, "d": 0.6, "t": "basics.axis", "ev": "Hypothalamic inhibiting hormones (Box 13.1/Table): somatostatin inhibits GH and TSH; dopamine inhibits prolactin."}, {"id": "q-stress-01", "s": "stress", "k": "bank", "q": "Which are fight-or-flight effects of the autonomic nervous system during stress? Select all that apply.", "o": ["Increased heart rate and BP", "Pupil dilation", "Increased sweating", "Decreased gastric function", "Constricted airways"], "a": [0, 1, 2, 3], "w": ["True.", "True.", "True.", "True. Blood is shunted away from the gut.", "False. Blood flow to lungs increases; airways aren't constricted."], "m": true, "b": null, "x": false, "r": false, "d": 0.4, "t": "stress.ans", "ev": "Specific structures in the CNS that play a major role include: · Autonomic nervous system: heart rate, blood pressure, and respiratory rate increase; pupils dilate; and sweating increases."}, {"id": "q-stress-02", "s": "stress", "k": "bank", "q": "A critically ill client is at risk for stress ulcers. Which findings should the nurse report immediately? Select all that apply.", "o": ["Coffee-ground gastric drainage", "Black, tarry stool", "Falling blood pressure with a rising heart rate", "Temperature 37 °C (98.6 °F)", "Mild thirst"], "a": [0, 1, 2], "w": ["Correct. That suggests upper GI bleeding.", "Correct. Melena suggests GI bleeding.", "Correct. That can signal blood loss.", "That's normal.", "Not urgent."], "m": true, "b": null, "x": false, "r": false, "d": 0.5, "t": "stress.ans", "ev": "Altered blood flow, decreased oxygenation to gastric tissues, and prolonged cortisol exposure may result in “stress ulcers” of the gastrointestinal tract."}, {"id": "q-stress-03", "s": "stress", "k": "bank", "q": "Put the stress hormone cascade in order:", "o": ["CRH (hypothalamus) → ACTH (pituitary) → cortisol (adrenal cortex)", "ACTH → CRH → cortisol", "Cortisol → ACTH → CRH", "TSH → ACTH → cortisol"], "a": [0], "w": ["Correct. ", "CRH comes first.", "Reversed; cortisol feeds back to suppress them.", "TSH is the thyroid axis."], "m": false, "b": null, "x": false, "r": false, "d": 0.3, "t": "stress.hpa", "ev": "CRH stimulates the pituitary gland to secrete adrenocorticotropic hormone (ACTH), which in turn stimulates the cortex of the adrenal glands to secrete cortisol.", "fx": 1}, {"id": "q-stress-04", "s": "stress", "k": "bank", "q": "Match general adaptation syndrome stages in order.", "o": ["Alarm → resistance → exhaustion", "Resistance → alarm → exhaustion", "Alarm → exhaustion → resistance", "Exhaustion → alarm → resistance"], "a": [0], "w": ["Correct. Alarm (fight or flight) → resistance (adapting, cortisol by feedback) → exhaustion (energy depleted, cells and organs degenerate).", "Alarm comes first.", "Exhaustion is last.", "Exhaustion is last."], "m": false, "b": null, "x": false, "r": false, "d": 0.3, "t": "stress.gas", "ev": "General Adaptation Syndrome · The neuroendocrine response is often initiated by a stressor.", "fx": 1}, {"id": "q-stress-05", "s": "stress", "k": "bank", "q": "Long-term stress with chronic hypercortisolism causes which effects? Select all that apply.", "o": ["Weakened immune and inflammatory responses", "Protein breakdown", "Glucose intolerance", "Fluid retention and hypertension from persistent ADH", "Increased growth hormone and reproductive hormones"], "a": [0, 1, 2, 3], "w": ["True.", "True.", "True.", "True.", "False. Thyroid, GH and reproductive hormones are suppressed."], "m": true, "b": null, "x": false, "r": false, "d": 0.6, "t": "stress.gas", "ev": "Glucose intolerance, from excess circulating glucose and loss of tissue utilization, can lead to diabetes mellitus."}, {"id": "q-stress-06", "s": "stress", "k": "case", "q": "Which nursing interpretation fits best?", "o": ["Prolonged stress and cortisol are suppressing immunity, so infections are more likely", "Cortisol strengthens immunity, so this is unrelated", "This is Addison disease", "This is normal alarm-stage physiology"], "a": [0], "w": ["Correct. Chronic stress = resistance/exhaustion with hypercortisolism, which suppresses immune response.", "Cortisol inhibits the immune response.", "Addison is cortisol deficiency.", "Weeks of stress is beyond alarm."], "m": false, "b": null, "x": false, "r": false, "d": 0.5, "t": "stress.gas", "ev": "…ecrease capillary permeability and inhibit edema formation · Inhibit the immune response · Inhibit bone formation · Stimulate gastric acid secretions · Contribute to emotional behavior · Contribute to an effective stress response · PATHOPHYSIOLOGY · Four major processes can lead to Cushing syndrome: · 1\\.…", "c": "A nursing student working nights while caring for a sick parent has had three colds this semester, poor sleep, and fasting glucose 108 mg/dL on a routine check.", "cn": "Stressed student, frequent colds"}, {"id": "q-pituitary-04", "s": "pituitary", "k": "bank", "q": "A client with small cell lung cancer develops a low serum sodium. What should the nurse suspect first?", "o": ["SIADH from the tumor secreting ectopic ADH", "Diabetes insipidus", "Addison disease", "Dehydration"], "a": [0], "w": ["Correct. Ectopic ADH from a tumor is the most common cause of SIADH.", "DI raises sodium.", "Possible, but the tumor makes SIADH the first thought.", "Dehydration raises sodium."], "m": false, "b": null, "x": false, "r": false, "d": 0.4, "t": "pituitary.siadh", "ev": "The most common cause of SIADH is a tumor, somewhere in the body, which is secreting ectopic ADH."}, {"id": "q-pituitary-05", "s": "pituitary", "k": "bank", "q": "A client with SIADH has a serum sodium of 108 mmol/L (mEq/L). What should the nurse watch for first?", "o": ["Seizures, gait changes or coma", "Peripheral edema", "Dilute, high-volume urine", "Hyperpigmented skin"], "a": [0], "w": ["Correct. Below 110, psychosis, gait disturbance, seizures or coma emerge.", "Edema is uncommon because water moves into cells.", "SIADH concentrates urine.", "That's Addison disease."], "m": false, "b": null, "x": false, "r": false, "d": 0.6, "t": "pituitary.siadh", "ev": "As serum sodium level drops below 110 mEq/L, additional symptoms emerge, including psychosis, gait disturbances, seizures, or coma."}, {"id": "q-pituitary-06", "s": "pituitary", "k": "bank", "q": "Which findings support SIADH? Select all that apply.", "o": ["Serum sodium 126 mEq/L", "Plasma osmolality 268 mOsm/kg", "Low urine output", "Concentrated urine with high sodium", "Urine specific gravity 1.002"], "a": [0, 1, 2, 3], "w": ["True (< 135).", "True (< 280).", "True.", "True.", "False. Very dilute urine fits DI."], "m": true, "b": null, "x": false, "r": false, "d": 0.6, "t": "pituitary.siadh", "ev": "…dings: · Hyponatremia (serum sodium less than 135 mEq/L) · Hypotonicity (plasma osmolality less than 280 mOsm/kg) · Decreased urine volume · Highly concentrated urine with a high sodium content · Absence of renal, adrenal, or thyroid abnormalities · TREATMENT · Treatment focuses on removing the cause of SIADH if p…"}, {"id": "q-pituitary-07", "s": "pituitary", "k": "bank", "q": "What is the first-line treatment for mild hyponatremia from SIADH?", "o": ["Fluid restriction", "Hypotonic IV fluids", "Desmopressin", "Increasing water intake"], "a": [0], "w": ["Correct. ", "Hypotonic fluids would worsen hyponatremia.", "Desmopressin is ADH; that worsens SIADH.", "That worsens dilution."], "m": false, "b": null, "x": false, "r": false, "d": 0.3, "t": "pituitary.siadh", "ev": "For patients with mild symptoms of hyponatremia, water restriction is often the only necessary therapy."}, {"id": "q-pituitary-08", "s": "pituitary", "k": "case", "q": "Which order is priority?", "o": ["Initiate seizure precautions and expect hypertonic saline", "Encourage oral fluids", "Give desmopressin", "Prepare for 24-hour urine first"], "a": [0], "w": ["Correct. Sodium 112 with confusion is severe; hypertonic IV saline is reserved for severe hyponatremia with mental status changes, and seizures can occur below 110.", "More water worsens dilution.", "Desmopressin adds ADH effect.", "Treat the emergency first."], "m": false, "b": null, "x": false, "r": false, "d": 0.6, "t": "pituitary.siadh", "ev": "Hypertonic intravenous (IV) solutions are reserved for those individuals with severe hyponatremia who display alterations in mental status.", "c": "A 64-year-old smoker with newly found small cell lung cancer is confused and has vomited twice. Na 112 mEq/L, urine output 20 mL/hr, no edema.", "cn": "Confused smoker, sodium 112"}, {"id": "q-pituitary-09", "s": "pituitary", "k": "bank", "q": "Which causes of diabetes insipidus are described? Select all that apply.", "o": ["Insufficient ADH from the hypothalamus/posterior pituitary", "Kidneys don't respond to ADH (nephrogenic)", "Extremely large fluid intake lowering ADH", "Ectopic ADH from lung cancer", "Excess cortisol"], "a": [0, 1, 2], "w": ["True (central DI).", "True.", "True (psychogenic).", "False. That causes SIADH.", "False. Excess cortisol is Cushing syndrome, not a cause of DI."], "m": true, "b": null, "x": false, "r": false, "d": 0.5, "t": "pituitary.di", "ev": "Rarely, nephrogenic DI is inherited as an X-linked disorder."}, {"id": "q-pituitary-10", "s": "pituitary", "k": "bank", "q": "A client on lithium reports large volumes of dilute urine and constant thirst. What should the nurse suspect first?", "o": ["Nephrogenic diabetes insipidus", "SIADH", "Cushing syndrome", "Addison disease"], "a": [0], "w": ["Correct. Lithium can cause nephrogenic DI, where the kidney ignores ADH.", "SIADH causes concentrated urine and water retention.", "Not the pattern.", "Not the pattern."], "m": false, "b": null, "x": false, "r": false, "d": 0.4, "t": "pituitary.di", "ev": "Nephrogenic DI can be observed in those with chronic renal insufficiency, lithium (a drug used to treat manic-depressive disorder) toxicity, hypercalcemia, hypokalemia, or with disease of the renal tubules."}, {"id": "q-pituitary-11", "s": "pituitary", "k": "bank", "q": "Which findings fit diabetes insipidus? Select all that apply.", "o": ["Large volumes of dilute urine", "Excessive thirst", "Urine specific gravity 1.005 or less", "Serum hyperosmolality", "Serum sodium 125 mEq/L with concentrated urine"], "a": [0, 1, 2, 3], "w": ["True.", "True.", "True.", "True.", "False. That pattern fits SIADH."], "m": true, "b": null, "x": false, "r": false, "d": 0.5, "t": "pituitary.di", "ev": "A urine specific gravity of 1.005 or less and a urine osmolality less than 200 mOsm/kg are often found in DI."}, {"id": "q-pituitary-12", "s": "pituitary", "k": "case", "q": "What does the nurse anticipate?", "o": ["Diabetes insipidus; replace fluids and give desmopressin as ordered", "SIADH; restrict fluids", "Normal post-op diuresis", "Diabetes mellitus; give insulin"], "a": [0], "w": ["Correct. Brain surgery near the hypothalamus is the most common setup for DI; desmopressin is a synthetic vasopressin.", "SIADH lowers urine output.", "Too extreme to be normal.", "No hyperglycemia described."], "m": false, "b": null, "x": false, "r": false, "d": 0.6, "t": "pituitary.di", "ev": "Pharmacologic treatment may include desmopressin (sold under the trade name DDAVP), a synthetic vasopressin analog, which acts as a potent antidiuretic.", "c": "One day after surgery to remove a pituitary tumor, a patient has 500 mL/hr of pale urine for 3 hours, is very thirsty, and has urine specific gravity 1.002. Glucose is normal.", "cn": "Huge pale urine after brain surgery"}, {"id": "q-pituitary-13", "s": "pituitary", "k": "bank", "q": "General manifestations of hypopituitarism include which? Select all that apply.", "o": ["Fatigue and weakness", "Cold intolerance", "Sexual dysfunction", "Constipation and dry skin", "Rapid onset with dramatic symptoms"], "a": [0, 1, 2, 3], "w": ["True.", "True.", "True.", "True.", "False. Onset is usually gradual; signs show only when most of the gland is destroyed."], "m": true, "b": null, "x": false, "r": false, "d": 0.5, "t": "pituitary.hypo", "ev": "It usually has a gradual onset, and clinical manifestations are not evident until most of the pituitary gland has been destroyed."}, {"id": "q-pituitary-14", "s": "pituitary", "k": "bank", "q": "Panhypopituitarism means:", "o": ["All pituitary hormones are decreased", "One pituitary hormone is excessive", "Only ADH is low", "The adrenal glands are destroyed"], "a": [0], "w": ["Correct. ", "That's hyperpituitarism.", "Too narrow.", "That's adrenal insufficiency."], "m": false, "b": null, "x": false, "r": false, "d": 0.3, "t": "pituitary.hypo", "ev": "Panhypopituitarism indicates a decrease in production and secretion of all pituitary gland hormones."}, {"id": "q-thyroid-03", "s": "thyroid", "k": "bank", "q": "Graves disease causes hyperthyroidism by:", "o": ["IgG antibodies binding TSH receptors and stimulating hormone release", "Antibodies destroying the thyroid gland", "Iodine deficiency", "A tumor secreting cortisol"], "a": [0], "w": ["Correct. Antibodies mimic TSH on thyrocytes → thyrotoxicosis.", "That is Hashimoto (hypothyroid).", "Iodine deficiency usually causes hypothyroidism.", "No."], "m": false, "b": null, "x": false, "r": false, "d": 0.4, "t": "thyroid.graves", "ev": "In Graves disease, IgG antibodies bind to the TSH receptor on thyrocytes (thyroid cells) and stimulate excessive thyroid hormone secretion, causing a state of thyrotoxicosis."}, {"id": "q-thyroid-04", "s": "thyroid", "k": "bank", "q": "Which findings fit hyperthyroidism? Select all that apply.", "o": ["Weight loss", "Heat intolerance and sweating", "Tachycardia and palpitations", "Tremors", "Constipation"], "a": [0, 1, 2, 3], "w": ["True.", "True.", "True.", "True.", "False. Hyperthyroidism causes diarrhea."], "m": true, "b": null, "x": false, "r": false, "d": 0.3, "t": "thyroid.hyper", "ev": "Weight loss, agitation, restlessness, sweating, heat intolerance, diarrhea, tachycardia, heart palpitations, tremors, fine hair, oily skin, irregular menstrual cycle in females, and weakness are common findings."}, {"id": "q-thyroid-05", "s": "thyroid", "k": "bank", "q": "Which findings fit Graves disease? Select all that apply.", "o": ["Low TSH", "High free T4", "Exophthalmos", "High TSH", "Myxedema"], "a": [0, 1, 2], "w": ["Correct. High T4 suppresses TSH.", "Correct. Hormone output is high.", "Correct. Protruding eyes are characteristic.", "That's primary hypothyroidism.", "That's hypothyroidism."], "m": true, "b": null, "x": false, "r": false, "d": 0.5, "t": "thyroid.hyper", "ev": "In thyrotoxicosis, TSH levels are greatly suppressed."}, {"id": "q-thyroid-06", "s": "thyroid", "k": "bank", "q": "Which can trigger hyperthyroidism in thyroid-sensitive people? Select all that apply.", "o": ["Iodinated contrast dye", "Seaweed supplements", "Iodine-containing cough expectorants", "Levothyroxine taken correctly", "Lithium"], "a": [0, 1, 2], "w": ["True.", "True.", "True.", "False at proper doses.", "False. Not listed here."], "m": true, "b": null, "x": false, "r": false, "d": 0.5, "t": "thyroid.hyper", "ev": "Certain medications containing large amounts of iodine, such as cough expectorants, health food supplements that contain seaweed, and iodinated contrast dyes, can induce hyperthyroidism in thyroid-sensitive individuals."}, {"id": "q-thyroid-07", "s": "thyroid", "k": "bank", "q": "After total thyroid ablation for Graves disease, what is the most important teaching?", "o": ["Take oral thyroid hormone every day for life", "Get radioactive iodine every year", "No further treatment is needed", "Take desmopressin for life"], "a": [0], "w": ["Correct. Full ablation requires lifelong oral thyroid hormone.", "Ablation is a one-time step.", "Without a thyroid, replacement is required.", "Desmopressin treats DI."], "m": false, "b": null, "x": false, "r": false, "d": 0.3, "t": "thyroid.hyper", "ev": "Full ablation (removal) of the thyroid gland requires lifelong supplementation with oral thyroid hormone."}, {"id": "q-thyroid-08", "s": "thyroid", "k": "bank", "q": "Thyroid storm (thyrotoxic crisis) is:", "o": ["A sudden, severe worsening of hyperthyroidism that can be fatal", "Myxedema in an older adult", "A thyroid nodule", "The usual Graves exophthalmos"], "a": [0], "w": ["Correct. ", "Myxedema is hypothyroid.", "Not a crisis.", "Not a crisis."], "m": false, "b": null, "x": false, "r": false, "d": 0.4, "t": "thyroid.hyper", "ev": "Thyrotoxic crisis, or thyroid storm, is a sudden, severe worsening of hyperthyroidism that may result in death."}, {"id": "q-thyroid-09", "s": "thyroid", "k": "bank", "q": "Hashimoto thyroiditis is:", "o": ["Autoimmune hypothyroidism that can destroy the thyroid", "The most common cause of hyperthyroidism", "Thyroid cancer", "A pituitary adenoma"], "a": [0], "w": ["Correct. ", "That's Graves.", "No.", "No."], "m": false, "b": null, "x": false, "r": false, "d": 0.3, "t": "thyroid.hypo", "ev": "Hashimoto thyroiditis is an autoimmune hypothyroidism that can result in total destruction of the thyroid gland."}, {"id": "q-thyroid-10", "s": "thyroid", "k": "bank", "q": "Which finding is unique to hypothyroidism?", "o": ["Myxedema (swelling of skin and underlying tissue)", "Exophthalmos", "Buffalo hump", "Bronze skin"], "a": [0], "w": ["Correct. Protein–carbohydrate complexes draw water into tissues.", "Graves.", "Cushing.", "Addison."], "m": false, "b": null, "x": false, "r": false, "d": 0.4, "t": "thyroid.hypo", "ev": "Myxedema, swelling of the skin and underlying tissues, is a unique characteristic finding of hypothyroidism."}, {"id": "q-thyroid-11", "s": "thyroid", "k": "bank", "q": "A newborn looks healthy. Why is the thyroid screen most important anyway?", "o": ["Maternal T4 crossed the placenta, so congenital hypothyroidism is hidden at birth", "The newborn's thyroid always works at birth", "TSH doesn't matter in newborns", "Breast milk supplies enough thyroid hormone"], "a": [0], "w": ["Correct. Maternal hormone masks the problem, so only the screen catches it early.", "It may not.", "TSH is the screening marker.", "Breast milk doesn't fix it."], "m": false, "b": null, "x": false, "r": false, "d": 0.5, "t": "thyroid.hypo", "ev": "In utero, maternal T4 crosses the placenta; therefore, the newborn appears unaffected at birth."}, {"id": "q-thyroid-12", "s": "thyroid", "k": "bank", "q": "Which lab pattern supports primary hypothyroidism?", "o": ["High TSH, low T4", "Low TSH, high T4", "Low TSH, low T4 always", "High cortisol"], "a": [0], "w": ["Correct. The pituitary pushes harder (TSH up) when thyroid hormone is low.", "That's hyperthyroidism.", "Suggests a pituitary cause, not typical primary.", "Unrelated."], "m": false, "b": null, "x": false, "r": false, "d": 0.5, "t": "thyroid.hypo", "ev": "Serum thyroid hormones may be decreased, and TSH is often elevated."}, {"id": "q-thyroid-13", "s": "thyroid", "k": "bank", "q": "Levothyroxine teaching: which statements are correct? Select all that apply.", "o": ["It is synthetic T4", "Therapy is usually lifelong", "The dose is increased gradually", "Stop it once symptoms improve", "It treats Graves disease"], "a": [0, 1, 2], "w": ["True.", "True.", "True.", "False. Replacement is lifelong.", "False. It replaces low hormone."], "m": true, "b": null, "x": false, "r": false, "d": 0.4, "t": "thyroid.hypo", "ev": "The most common drug used to treat hypothyroidism is levothyroxine (Synthroid, Levoxyl)."}, {"id": "q-thyroid-14", "s": "thyroid", "k": "case", "q": "Which is most likely?", "o": ["Hypothyroidism (likely Hashimoto)", "Graves disease", "Addison disease", "SIADH"], "a": [0], "w": ["Correct. Fatigue, cold intolerance, weight gain, dry skin, constipation and slowed memory, plus high TSH.", "Graves → weight loss, heat intolerance, low TSH.", "Addison → weight loss, hyperpigmentation, hypotension.", "SIADH → hyponatremia."], "m": false, "b": null, "x": false, "r": false, "d": 0.3, "t": "thyroid.hypo", "ev": "CLINICAL MANIFESTATIONS · Clinical manifestations are often gradual and include fatigue, cold intolerance, weakness, weight gain, dry skin, coarse hair, constipation, lethargy, impaired reproduction, and impaired memory (Fig.", "c": "An 82-year-old woman reports months of fatigue, feeling cold, 4.5-kg (10-lb) weight gain, constipation and forgetfulness. Skin is dry and hair coarse. TSH 14 mIU/L (high).", "cn": "Tired, cold, slowed down"}, {"id": "q-thyroid-15", "s": "thyroid", "k": "case", "q": "Which nursing finding should be reported immediately?", "o": ["HR 148, temperature 39.8 °C (103.6 °F), agitation and confusion", "Mild tremor of the hands", "Bulging eyes present for a year", "Heat intolerance"], "a": [0], "w": ["Correct. Fever, extreme tachycardia and altered mental status suggest thyroid storm, which can be fatal.", "Expected in hyperthyroidism.", "Chronic exophthalmos.", "Expected."], "m": false, "b": null, "x": false, "r": false, "d": 0.6, "t": "thyroid.hyper", "ev": "Thyrotoxic crisis, or thyroid storm, is a sudden, severe worsening of hyperthyroidism that may result in death.", "c": "A 31-year-old woman with untreated Graves disease is admitted with pneumonia. She has had a fine tremor, weight loss and heat intolerance for months.", "cn": "Graves patient with pneumonia"}, {"id": "q-adrenal-04", "s": "adrenal", "k": "bank", "q": "Which processes can cause Cushing syndrome? Select all that apply.", "o": ["Long-term prednisone", "Pituitary tumor making excess ACTH", "Adrenal tumor making cortisol", "Ectopic ACTH from small cell lung cancer", "Autoimmune destruction of the adrenal cortex"], "a": [0, 1, 2, 3], "w": ["True. The most common cause overall.", "True.", "True.", "True.", "False. That causes Addison disease."], "m": true, "b": null, "x": false, "r": false, "d": 0.5, "t": "adrenal.cushing", "ev": "Ectopic production of ACTH or CRH from a tumor at a distant site, such as small cell carcinoma of the lung · Long-term administration of corticosteroid medications is indicated for a wide variety of chronic inflammatory and autoimmune conditions."}, {"id": "q-adrenal-05", "s": "adrenal", "k": "bank", "q": "Which findings fit Cushing syndrome? Select all that apply.", "o": ["Moon face and buffalo hump", "Purple striae", "Thin skin and muscle wasting in the limbs", "Hyperglycemia", "Hyperpigmented skin"], "a": [0, 1, 2, 3], "w": ["True.", "True.", "True.", "True.", "False. That's Addison (high ACTH stimulating melanocytes)."], "m": true, "b": null, "x": false, "r": false, "d": 0.4, "t": "adrenal.cushing", "ev": "Obesity of the face and posterior neck and back has been characterized by the terms “moon face” and “buffalo hump” (Fig."}, {"id": "q-adrenal-06", "s": "adrenal", "k": "bank", "q": "A client with Cushing syndrome has a potassium of 2.9 mmol/L (mEq/L). What should the nurse do first?", "o": ["Report the low potassium now", "Encourage a high-salt diet", "Hold all fluids", "Recheck it next week"], "a": [0], "w": ["Correct. Excess aldosterone drives hypokalemia; a low potassium can cause arrhythmias.", "Salt worsens hypertension.", "Not indicated.", "Too slow."], "m": false, "b": null, "x": false, "r": false, "d": 0.6, "t": "adrenal.cushing", "ev": "Excess aldosterone results in hypertension and hypokalemia."}, {"id": "q-adrenal-07", "s": "adrenal", "k": "bank", "q": "A client on long-term prednisone wants to stop it today. What is the nurse's best response?", "o": ["“Don't stop suddenly. Your adrenal glands are suppressed, so the dose must be lowered gradually.”", "“It's safe to stop any time.”", "“Stopping may cause thyroid storm.”", "“Stopping causes diabetes insipidus.”"], "a": [0], "w": ["Correct. Steroids must be withdrawn gradually; sudden stops risk adrenal crisis.", "Abrupt withdrawal is dangerous.", "Not the risk.", "Not the risk."], "m": false, "b": null, "x": false, "r": false, "d": 0.4, "t": "adrenal.cushing", "ev": "Corticosteroid medications may be needed to avert an adrenal crisis during acute illness and then they must be gradually withdrawn."}, {"id": "q-adrenal-08", "s": "adrenal", "k": "bank", "q": "A client is ordered a 24-hour urine cortisol test. What is the most important teaching?", "o": ["Save every void for the full 24 hours", "Collect only the first morning sample", "Drink nothing during the test", "Discard the urine from the night"], "a": [0], "w": ["Correct. Cushing diagnosis often rests on 24-hour cortisol excretion, so every void counts.", "One sample isn't a 24-hour collection.", "Don't restrict fluids.", "Every void is kept."], "m": false, "b": null, "x": false, "r": false, "d": 0.3, "t": "adrenal.cushing", "ev": "DIAGNOSTIC CRITERIA · Diagnosis of Cushing syndrome is often based on a 24-hour urine collection during which elevations in cortisol excretion are noted."}, {"id": "q-adrenal-09", "s": "adrenal", "k": "case", "q": "Which condition is most likely?", "o": ["Cushing syndrome from long-term corticosteroids", "Addison disease", "Hypothyroidism", "Graves disease"], "a": [0], "w": ["Correct. Years of prednisone → central obesity, moon face, striae, easy bruising, high glucose.", "Addison causes weight loss and hypotension.", "Doesn't explain striae and high glucose.", "Graves causes weight loss."], "m": false, "b": null, "x": false, "r": false, "d": 0.3, "t": "adrenal.cushing", "ev": "Ectopic production of ACTH or CRH from a tumor at a distant site, such as small cell carcinoma of the lung · Long-term administration of corticosteroid medications is indicated for a wide variety of chronic inflammatory and autoimmune conditions.", "c": "A 45-year-old has taken prednisone for 3 years for lupus. She has a round face, fat pad between the shoulders, purple stretch marks on her abdomen, bruises easily, and fasting glucose 142 mg/dL.", "cn": "Round face on long-term prednisone"}, {"id": "q-adrenal-10", "s": "adrenal", "k": "bank", "q": "The most common cause of Addison disease is:", "o": ["Autoimmune destruction of the adrenal cortex", "Pituitary tumor", "Long-term prednisone", "Lithium"], "a": [0], "w": ["Correct. ", "That would be secondary insufficiency or Cushing.", "That causes Cushing (and suppression).", "Lithium → nephrogenic DI."], "m": false, "b": null, "x": false, "r": false, "d": 0.3, "t": "adrenal.addison", "ev": "Autoimmune destruction of the layers of the adrenal cortex is the most common cause of the disease."}, {"id": "q-adrenal-11", "s": "adrenal", "k": "bank", "q": "Which findings support Addison disease? Select all that apply.", "o": ["Low sodium", "High potassium", "Hyperpigmented skin", "Buffalo hump", "High sodium"], "a": [0, 1, 2], "w": ["Correct. Hyponatremia is typical.", "Correct. Hyperkalemia is typical.", "Correct. High ACTH stimulates melanocytes.", "That's Cushing syndrome.", "Sodium is low."], "m": true, "b": null, "x": false, "r": false, "d": 0.4, "t": "adrenal.addison", "ev": "Elevations in ACTH levels stimulate skin melanocytes, resulting in a characteristic hyperpigmentation, or darkening, of the skin and mucous membranes (Fig.13.15)."}, {"id": "q-adrenal-12", "s": "adrenal", "k": "bank", "q": "A client with Addison disease has labs drawn. Which result should the nurse report first?", "o": ["Potassium 6.4 mmol/L (mEq/L)", "Sodium 138 mmol/L (mEq/L)", "Glucose 5.3 mmol/L (95 mg/dL)", "Calcium 2.35 mmol/L (9.4 mg/dL)"], "a": [0], "w": ["Correct. Addison disease causes hyperkalemia, and a high potassium can cause dangerous arrhythmias.", "That's normal.", "That's normal.", "That's normal."], "m": false, "b": null, "x": false, "r": false, "d": 0.3, "t": "adrenal.addison", "ev": "Judi Nath.) · DIAGNOSTIC CRITERIA · Diagnosis of Addison disease is based on the clinical presentation and laboratory analysis of electrolyte levels demonstrating hyponatremia and hyperkalemia."}, {"id": "q-adrenal-13", "s": "adrenal", "k": "case", "q": "What does the nurse prepare to give first?", "o": ["Isotonic IV fluids with IV hydrocortisone", "Hypertonic saline only", "IV potassium", "Levothyroxine"], "a": [0], "w": ["Correct. Adrenal crisis: replace volume and cortisol; BP should improve within 4–6 hours.", "Not the book's treatment.", "Potassium is already high.", "Not indicated."], "m": false, "b": null, "x": false, "r": false, "d": 0.6, "t": "adrenal.addison", "ev": "TREATMENT · In acute illness, isotonic IV fluid replacement is infused along with hydrocortisone sodium succinate or hydrocortisone sodium phosphate.", "c": "A 38-year-old with Addison disease has had the flu for 3 days and couldn't keep her pills down. BP 78/44, HR 124, confused. Na 126, K 6.1.", "cn": "Addison patient with the flu"}, {"id": "q-adrenal-14", "s": "adrenal", "k": "bank", "q": "Addison teaching: which statements are correct? Select all that apply.", "o": ["Replacement of glucocorticoids and mineralocorticoids is lifelong", "Salt intake may need to increase in hot weather", "Don't skip doses", "Stop medicine when you feel well", "Restrict salt strictly"], "a": [0, 1, 2], "w": ["True.", "True. Sodium excretion is high.", "True. Missed doses can trigger crisis.", "False. Stopping steroid replacement can trigger adrenal crisis.", "False. Aldosterone is missing, so sodium is lost; salt may need to go up, not down."], "m": true, "b": null, "x": false, "r": false, "d": 0.5, "t": "adrenal.addison", "ev": "Because of elevations in sodium excretion, salt intake may need to be increased in hot weather."}, {"id": "q-adrenal-15", "s": "adrenal", "k": "bank", "q": "Addison disease usually appears when what percent of the adrenal cortex is destroyed?", "o": ["25%", "50%", "75%", "90% or more"], "a": [3], "w": ["Too low.", "Too low.", "Too low.", "Correct. "], "m": false, "b": null, "x": false, "r": false, "d": 0.5, "t": "adrenal.addison", "ev": "Disease typically presents when 90% or more of the adrenal cortices are destroyed or nonfunctional."}, {"id": "q-r-ovary-01", "s": "r-ovary", "k": "bank", "q": "Your patient is complaining of menopausal hot flashes and other symptoms. Which of the following would you recommend as a nonpharmacologic method for relief of these symptoms?", "o": ["Increase spicy foods", "Increase caffeine intake", "Use relaxation techniques", "Avoid soy products containing phytoestrogens"], "a": [2], "w": ["Spicy foods should be avoided.", "Caffeine and alcohol should be avoided.", "Correct. Relaxation and deep breathing at the start of a hot flash are on the book's list.", "The book says to ADD soy products with phytoestrogens."], "m": false, "b": "Ch 14 #1", "x": false, "r": false, "d": 0.3, "t": "meno.nonpharm", "ev": "…nitiate deep breathing measures at the start of a hot flash Use relaxation techniques Incorporate soy products containing phytoestrogens in the diet Perform pelvic floor exercises to strengthen muscles of the pelvis and vagina Use water-based lubricants during intercourse Erectile Dysfunction Sexual dysfunction is one…"}, {"id": "q-r-basics-01", "s": "r-basics", "k": "bank", "q": "Your neighbor asks what would happen if a person did not have ovarian interstitial cells. What would you say?", "o": ["The person would be lacking ovarian support structures.", "The person would not be able to secrete estrogen.", "The person would not have a place to house germ cells.", "The person would have no difficulties as interstitial cells are not located in the ovaries."], "a": [1], "w": ["Not their role.", "Correct. Thecal (interstitial) endocrine cells in the ovary secrete estrogens.", "Follicles house the oocytes.", "They are in the ovaries."], "m": false, "b": "Ch 14 #2", "x": false, "r": false, "d": 0.5, "t": "basics.ovary", "ev": "Within the ovary, thecal endocrine cells secrete estrogens and the cells of the corpus luteum secrete estrogens and progesterone."}, {"id": "q-r-basics-02", "s": "r-basics", "k": "bank", "q": "Your cousin has a testosterone deficiency. What would you notice for clinical manifestations?", "o": ["Increased skin thickness", "Clear skin, free of acne", "Excessive chest and facial hair", "Bulky skeletal muscle development"], "a": [1], "w": ["Testosterone thickens skin, so a deficit thins it.", "Correct. Testosterone drives sebaceous (oil) glands; without it there is less acne.", "Testosterone grows body hair; a deficit means less.", "Testosterone builds muscle; a deficit means less."], "m": false, "b": "Ch 14 #3", "x": false, "r": false, "d": 0.5, "t": "basics.testo", "ev": "…n metabolism Muscle mass promotion Skin thickness promotion Sebaceous gland activity Growth of pubic, chest, and facial hair Maturation of the larynx, resulting in a deeper voice tone Excess testosterone levels alert the hypothalamus to decrease GnRH secretion and the pituitary to decrease LH production.…"}, {"id": "q-r-basics-03", "s": "r-basics", "k": "bank", "q": "Your pregnant friend has nausea, headaches, constipation, indigestion, and swelling. What hormone is wreaking havoc in her body?", "o": ["Progesterone", "Estrogen", "Thyroid-stimulating hormone", "Human chorionic gonadotropin hormone"], "a": [0], "w": ["Correct. Progesterone raises core temperature slightly and can induce nausea, headaches, constipation, indigestion and swelling.", "Not the one the book links to these.", "Not a pregnancy hormone in this chapter.", "hCG keeps the corpus luteum going; the book doesn't tie it to these symptoms."], "m": false, "b": "Ch 14 #4", "x": false, "r": false, "d": 0.4, "t": "basics.prog", "ev": "Progesterone elevates the core body temperature slightly and can induce nausea, headaches, constipation, indigestion, and swelling during pregnancy."}, {"id": "q-r-fert-01", "s": "r-fert", "k": "bank", "q": "Your 16-year-old niece has not had a period for 2 months. She is not pregnant and denies intercourse. What is another likely explanation?", "o": ["Endometrial cancer", "Severe emotional stress", "Lack of physical activity", "FSH deficiency"], "a": [1], "w": ["Very unlikely at 16.", "Correct. Amenorrhea can result from emotional stress or prolonged strenuous exercise.", "Too MUCH exercise causes amenorrhea, not too little.", "Possible but less likely than stress."], "m": false, "b": "Ch 14 #5", "x": false, "r": false, "d": 0.4, "t": "fert.amen", "ev": "Amenorrhea can also result from emotional stress or prolonged strenuous exercise."}, {"id": "q-r-basics-04", "s": "r-basics", "k": "bank", "q": "Dave is trying to conceive and wants to sit in the hot tub. Why is this not recommended?", "o": ["LH and FSH release are inhibited with exposure to chlorinated water.", "Temperature does not make a difference; he can freely enjoy the hot tub.", "Spermatogenesis requires a higher body temperature than core body temperature.", "Spermatogenesis requires a cooler body temperature than core body temperature."], "a": [3], "w": ["Not true.", "Heat does matter.", "Backwards.", "Correct. The scrotum must be 2 to 3 degrees cooler than core temperature; a hot tub impairs sperm production."], "m": false, "b": "Ch 14 #6", "x": false, "r": false, "d": 0.3, "t": "basics.heat", "ev": "Spermatogenesis requires scrotal temperatures to be two to three degrees cooler than core body temperature."}, {"id": "q-r-fert-02", "s": "r-fert", "k": "bank", "q": "Which of the following would be illustrative of a motility impairment leading to infertility?", "o": ["Anovulation", "Presence of leiomyomas", "Low sperm production", "Menopause"], "a": [1], "w": ["That is a hormone problem.", "Correct. Leiomyomas (fibrous uterine tumors) distort the cavity and block the path, like adhesions.", "That is a hormone problem (low testosterone).", "Not a motility impairment."], "m": false, "b": "Ch 14 #15", "x": false, "r": false, "d": 0.6, "t": "fert.cause", "ev": "Leiomyomas, fibrous tumors in the uterus, distort the endometrial cavity."}, {"id": "q-r-basics-05", "s": "r-basics", "k": "bank", "q": "Which hormone surge causes ovulation?", "o": ["FSH", "LH", "Progesterone", "Inhibin"], "a": [1], "w": ["FSH falls as the dominant follicle makes estrogen.", "Correct. LH surges at peak estrogen and the oocyte breaks out of the follicle.", "Progesterone rises after ovulation.", "Inhibin suppresses FSH and LH."], "m": false, "b": null, "x": false, "r": false, "d": 0.3, "t": "basics.cycle", "ev": "Luteinizing hormone levels remain elevated and then surge at the peak of estrogen secretion from the dominant follicle, causing the oocyte to break through the fluid-filled follicle."}, {"id": "q-r-basics-06", "s": "r-basics", "k": "bank", "q": "If pregnancy does not occur, what happens about 14 days after ovulation?", "o": ["The corpus luteum grows", "Progesterone and estrogen drop and menstruation begins", "LH surges again", "hCG rises"], "a": [1], "w": ["It breaks down.", "Correct. Without a pregnancy the corpus luteum disintegrates, hormones fall, and the lining sheds.", "Not then.", "hCG appears only with implantation."], "m": false, "b": null, "x": false, "r": false, "d": 0.3, "t": "basics.cycle", "ev": "If pregnancy does not occur, progesterone and estrogen levels drop within about 14 days after ovulation and menstruation begins."}, {"id": "q-r-basics-07", "s": "r-basics", "k": "bank", "q": "Which hormone does a home pregnancy test measure?", "o": ["Progesterone", "LH", "hCG", "Prolactin"], "a": [2], "w": ["No.", "Ovulation kits measure LH.", "Correct. hCG appears 2 to 3 days after implantation and keeps the corpus luteum making hormones.", "Prolactin is for lactation."], "m": false, "b": null, "x": false, "r": false, "d": 0.2, "t": "basics.preg", "ev": "Home pregnancy tests measure the presence of hCG in the urine."}, {"id": "q-r-basics-08", "s": "r-basics", "k": "bank", "q": "Which endometrial phase runs from ovulation to the start of menstruation?", "o": ["Proliferative", "Secretory", "Menstrual", "Follicular"], "a": [1], "w": ["Proliferative = end of menstruation to ovulation (estrogen).", "Correct. Secretory: progesterone + estrogen make the lining thick, vascular and swollen.", "Menstrual = shedding.", "Follicular is an ovarian phase, not endometrial."], "m": false, "b": null, "x": false, "r": false, "d": 0.4, "t": "basics.endo", "ev": "Secretory (ovulation to the beginning of menstruation) phase: Progesterone, in addition to estrogen, further supports proliferation of the endometrium."}, {"id": "q-r-basics-09", "s": "r-basics", "k": "bank", "q": "In males, which cells make testosterone and which hormone tells them to?", "o": ["Sertoli cells; FSH", "Leydig (interstitial) cells; LH", "Sertoli cells; LH", "Leydig cells; inhibin"], "a": [1], "w": ["Sertoli (nurse) cells respond to FSH and make inhibin.", "Correct. LH acts on Leydig cells to make testosterone.", "Mixed up.", "Inhibin suppresses gonadotropins."], "m": false, "b": null, "x": false, "r": false, "d": 0.4, "t": "basics.male", "ev": "Luteinizing hormone acts on the interstitial endocrine cells (Leydig cells) in the testes to produce testosterone, the primary male sex hormone."}, {"id": "q-r-basics-10", "s": "r-basics", "k": "bank", "q": "Which actions belong to estrogen? Select all that apply.", "o": ["Decreased bone resorption", "Thin, watery cervical mucus that is more receptive to sperm", "Raises core body temperature", "Retention of sodium and water", "Relaxes uterine smooth muscle to keep the pregnancy"], "a": [0, 1, 3], "w": ["True.", "True.", "False. Progesterone raises temperature (the 0.3 °C (0.5 °F) rise).", "True.", "False. That is progesterone."], "m": true, "b": null, "x": false, "r": false, "d": 0.5, "t": "basics.estro", "ev": "…e to sperm) Axillary and pubic hair growth Skin maintenance Decreased bone resorption; maintenance of bone integrity Retention of sodium and water Progesterone is another important female sex hormone, secreted in large amounts from ovulation to the onset of menstruation.…"}, {"id": "q-r-basics-11", "s": "r-basics", "k": "bank", "q": "What does inhibin do?", "o": ["Stimulates sperm release", "Tells the pituitary to suppress FSH and LH", "Triggers the LH surge", "Makes testosterone"], "a": [1], "w": ["Nurse cells release sperm, but that isn't inhibin's role.", "Correct. Inhibin (from Sertoli cells and the ovary) is negative feedback on the gonadotropins.", "No.", "Leydig cells make testosterone."], "m": false, "b": null, "x": false, "r": false, "d": 0.5, "t": "basics.male", "ev": "When gonadotropin (FSH, LH) levels increase, FSH acts on the nurse cells (Sertoli cells) within the seminiferous tubules to secrete inhibin, a hormone that alerts the pituitary to suppress secretion of the gonadotropins."}, {"id": "q-r-fert-03", "s": "r-fert", "k": "bank", "q": "How is infertility defined?", "o": ["No pregnancy after 6 months of trying", "No pregnancy after 1 year of regular unprotected intercourse", "Absent periods for 3 months", "Low sperm count"], "a": [1], "w": ["Too short.", "Correct. About 10% to 15% of couples are infertile.", "That is amenorrhea.", "One possible cause, not the definition."], "m": false, "b": null, "x": false, "r": false, "d": 0.2, "t": "fert.def", "ev": "Infertility, defined as the inability to achieve pregnancy after 1 year of unprotected regular intercourse, can result from problems in any of these steps."}, {"id": "q-r-fert-04", "s": "r-fert", "k": "bank", "q": "What are the first tests for an infertile couple?", "o": ["Laparoscopy for both", "Semen analysis for the male and an ovulation check for the female", "Hysterosalpingography first", "Genetic testing"], "a": [1], "w": ["Invasive; not first.", "Correct. Start simple: semen analysis plus ovulation tracking.", "Comes later to check patency.", "Not first."], "m": false, "b": null, "x": false, "r": false, "d": 0.3, "t": "fert.dx", "ev": "Initially, a semen analysis must be completed in the male along with an analysis of ovulation in the female."}, {"id": "q-r-fert-05", "s": "r-fert", "k": "bank", "q": "Which findings show ovulation happened? Select all that apply.", "o": ["A 0.3 °C (0.5 °F) rise in basal body temperature", "A positive home LH (ovulation predictor) kit", "Cervical mucus changes at mid-cycle", "A drop in progesterone", "A rise in hCG"], "a": [0, 1, 2], "w": ["True: progesterone rises after ovulation.", "True: detects the LH surge just before ovulation.", "True.", "False. Progesterone rises.", "False. hCG means implantation/pregnancy."], "m": true, "b": null, "x": false, "r": false, "d": 0.4, "t": "fert.dx", "ev": "…vical mucus changes at the time of ovulation, measuring the basal body temperature over 2 to 3 months (noting the 0.3 °C (0.5 °F) increase at the time of ovulation as progesterone levels rise), or using a home ovulation predictor kit, which measures the LH surge just prior to ovulation.…"}, {"id": "q-r-fert-06", "s": "r-fert", "k": "bank", "q": "Which teaching helps a couple trying to conceive? Select all that apply.", "o": ["Use plenty of lubricant", "The partner should avoid hot tubs", "Chart basal body temperature", "Treat any STI quickly and completely", "Use a home LH kit"], "a": [1, 2, 3, 4], "w": ["False. Lubricants can act as a spermicide.", "True: heat impairs spermatogenesis.", "True.", "True: pelvic infection is a high infertility risk.", "True."], "m": true, "b": null, "x": false, "r": false, "d": 0.4, "t": "fert.teach", "ev": "Treatment involves supportive counseling, education about intercourse frequency, avoidance of lubricants that can act as a spermicide, and basic health maintenance."}, {"id": "q-r-fert-07", "s": "r-fert", "k": "bank", "q": "Which test uses dye injected into the uterus to look for blocked tubes?", "o": ["Laparoscopy", "Hysterosalpingography", "Semen analysis", "Transvaginal ultrasound"], "a": [1], "w": ["Laparoscopy views structures outside the uterus through an abdominal incision.", "Correct. Radiopaque dye + fluoroscopy shows obstructions along the pathway.", "Male test.", "Ultrasound doesn't use dye."], "m": false, "b": null, "x": false, "r": false, "d": 0.4, "t": "fert.dx", "ev": "Patency of reproductive structures can be visualized using hysterosalpingography (Fig."}, {"id": "q-r-fert-08", "s": "r-fert", "k": "bank", "q": "Which drug induces ovulation?", "o": ["Raloxifene", "Clomiphene citrate", "Spironolactone", "Finasteride"], "a": [1], "w": ["A SERM for bone.", "Correct. Clomiphene induces ovulation (also used in PCOS).", "Blocks androgen skin effects.", "Used for BPH."], "m": false, "b": null, "x": false, "r": false, "d": 0.3, "t": "fert.tx", "ev": "Some individuals may require clomiphene citrate, a medication that induces ovulation."}, {"id": "q-r-fert-09", "s": "r-fert", "k": "bank", "q": "A pituitary adenoma causing hyperprolactinemia leads to infertility because it causes:", "o": ["Excess ovulation", "Anovulation and amenorrhea", "Blocked tubes", "Antibodies to sperm"], "a": [1], "w": ["Opposite.", "Correct. High prolactin → no ovulation → no periods.", "That is a motility problem.", "That is an immune problem."], "m": false, "b": null, "x": false, "r": false, "d": 0.5, "t": "fert.amen", "ev": "For example, a pituitary adenoma may induce hyperprolactinemia, a condition that results in anovulation and subsequently produces amenorrhea."}, {"id": "q-r-pelvic-01", "s": "r-pelvic", "k": "bank", "q": "Endometriosis is best described as:", "o": ["Infection of the uterine tubes", "Endometrial tissue growing outside the uterus", "Many cysts on the ovaries", "A fibrous tumor in the uterus"], "a": [1], "w": ["That is PID.", "Correct. It causes pelvic adhesions, distorted structures and dysmenorrhea; implants look like red-blue nodules.", "That is PCOS.", "That is a leiomyoma."], "m": false, "b": null, "x": false, "r": false, "d": 0.2, "t": "pel.endo", "ev": "Endometriosis, a condition involving endometrial tissue that is located outside of the uterus, can result in pelvic adhesions, distortion of pelvic structures, and dysmenorrhea (Fig."}, {"id": "q-r-pelvic-02", "s": "r-pelvic", "k": "bank", "q": "Which organisms most often cause PID? Select all that apply.", "o": ["Chlamydia trachomatis", "Neisseria gonorrhoeae", "Staphylococcus aureus", "Candida albicans", "Herpes simplex virus"], "a": [0, 1], "w": ["Correct. Chlamydia is one of the two most frequent.", "Correct. Gonorrhea is the other.", "Not the usual cause.", "Yeast doesn't cause PID.", "Not the usual cause."], "m": true, "b": null, "x": false, "r": false, "d": 0.3, "t": "pel.pid", "ev": "The most frequent cause is a combination of sexually transmitted microorganisms including Chlamydia trachomatis and Neisseria gonorrhoeae."}, {"id": "q-r-pelvic-03", "s": "r-pelvic", "k": "bank", "q": "Which are the minimum criteria for diagnosing PID? Select all that apply.", "o": ["Lower abdominal tenderness", "Adnexal tenderness", "Cervical motion tenderness", "Positive pregnancy test", "Elevated CA-125"], "a": [0, 1, 2], "w": ["True.", "True.", "True.", "False.", "False. CA-125 is an ovarian cancer marker."], "m": true, "b": null, "x": false, "r": false, "d": 0.4, "t": "pel.pid", "ev": "The minimum criteria for PID diagnosis include lower abdominal tenderness on palpation, adnexal (tissues supporting the uterus) tenderness, and cervical motion tenderness."}, {"id": "q-r-pelvic-04", "s": "r-pelvic", "k": "case", "q": "A 23-year-old with PID has a fever of 39.2 °C (102.6 °F) and is vomiting. Which finding means she must be hospitalized?", "o": ["Purulent cervical discharge", "Lower abdominal pain", "Vomiting and inability to tolerate oral antibiotics", "Age under 25"], "a": [2], "w": ["A diagnostic sign, not a hospital criterion.", "Common to all PID.", "Correct. Severe illness, vomiting, high fever, or being unable to take oral antibiotics → IV antibiotics in hospital.", "A risk factor, not a hospital criterion."], "m": false, "b": null, "x": false, "r": false, "d": 0.5, "t": "pel.pidtx", "ev": "…ng with severe illness, nausea, vomiting, or a high fever · Unable to follow or tolerate the outpatient treatment with oral antibiotics · Potentially in need of emergency surgery, such as appendicitis · Diagnosed with a tubo-ovarian abscess Treatment of sexual partners for those with sexually transmitted infections is…", "c": "A 23-year-old comes to the ED with lower abdominal pain, purulent cervical discharge, cervical motion tenderness, temperature 39.2 °C (102.6 °F), and has vomited three times in 2 hours.", "cn": "Pelvic pain, fever, vomiting"}, {"id": "q-r-pelvic-05", "s": "r-pelvic", "k": "bank", "q": "A client with PID feels better after 2 days of antibiotics and wants to stop. What is the nurse's best response?", "o": ["“Finish the full course. Untreated PID can scar the tubes and cause ectopic pregnancy or infertility.”", "“It's fine to stop when you feel better.”", "“PID always turns into cancer.”", "“PID causes early menopause.”"], "a": [0], "w": ["Correct. Treatment aims to prevent adhesions, ectopic pregnancy, abscess and infertility.", "Stopping early risks those complications.", "Not true.", "Not true."], "m": false, "b": null, "x": false, "r": false, "d": 0.3, "t": "pel.pidtx", "ev": "The goal of treatment is to prevent complications such as pelvic adhesions, ectopic pregnancy, abscesses, and infertility."}, {"id": "q-r-pelvic-06", "s": "r-pelvic", "k": "bank", "q": "Which teaching is most important for a client being treated for PID?", "o": ["Resume intercourse once pain stops", "Abstain from intercourse until treatment ends and partners are treated and cured", "Partners don't need treatment", "Stop antibiotics when the fever breaks"], "a": [1], "w": ["Not until partners are cured.", "Correct. Treating partners prevents reinfection.", "They do.", "Finish the full course."], "m": false, "b": null, "x": false, "r": false, "d": 0.3, "t": "pel.pidtx", "ev": "The patient must abstain from intercourse during the treatment regimen and until partners are treated and cured."}, {"id": "q-r-pelvic-07", "s": "r-pelvic", "k": "bank", "q": "Which hormone findings fit PCOS? Select all that apply.", "o": ["High LH", "High androgens", "Low progesterone", "Low LH", "High progesterone"], "a": [0, 1, 2], "w": ["Correct. LH is high.", "Correct. Androgens are high.", "Correct. Without ovulation, progesterone is low.", "LH is high.", "Progesterone is low."], "m": true, "b": null, "x": false, "r": false, "d": 0.4, "t": "pel.pcos", "ev": "In PCOS, the pituitary gland secretes high levels of LH and the ovaries make excess androgens."}, {"id": "q-r-pelvic-08", "s": "r-pelvic", "k": "bank", "q": "Which are expected in polycystic ovary syndrome? Select all that apply.", "o": ["Hirsutism", "Acanthosis nigricans", "Increased progesterone", "Anovulation", "Obesity in about half", "Low androgens"], "a": [0, 1, 3, 4], "w": ["True: androgen excess.", "True: insulin resistance.", "False. Progesterone is decreased.", "True.", "True.", "False. Androgens are high."], "m": true, "b": null, "x": false, "r": false, "d": 0.4, "t": "pel.pcos", "ev": "Acanthosis nigricans (darkened, velvety discoloration of the skin) on the nape of the neck, armpits, inner thighs, vulva, or under the breasts can occur as a result of insulin resistance."}, {"id": "q-r-pelvic-09", "s": "r-pelvic", "k": "bank", "q": "What do the Rotterdam criteria require to diagnose PCOS?", "o": ["All three of: androgen excess, ovulatory dysfunction, polycystic ovaries", "Two of the three", "A positive CA-125", "A laparoscopy"], "a": [1], "w": ["Only two are needed.", "Correct. Two of: androgen excess, ovulatory dysfunction, polycystic ovaries.", "Not used.", "Not required."], "m": false, "b": null, "x": false, "r": false, "d": 0.5, "t": "pel.pcos", "ev": "In those guidelines, the Rotterdam criteria should be used for diagnosis."}, {"id": "q-r-pelvic-10", "s": "r-pelvic", "k": "bank", "q": "Why is metformin used in PCOS?", "o": ["It blocks LH", "It lowers insulin, which improves ovulation and regulates cycles", "It removes cysts", "It raises androgens"], "a": [1], "w": ["No.", "Correct. Insulin excess drives ovarian androgen production; lowering insulin helps.", "No.", "Opposite."], "m": false, "b": null, "x": false, "r": false, "d": 0.4, "t": "pel.pcostx", "ev": "Metformin is an oral medication that lowers insulin levels and improves ovulation, thereby regulating menstrual cycles."}, {"id": "q-r-pelvic-11", "s": "r-pelvic", "k": "bank", "q": "A client with PCOS does not want pregnancy. Which treatment should the nurse expect first to lower androgens and regulate bleeding?", "o": ["Clomiphene", "Low-dose birth control pills", "Progesterone alone", "Injectable FSH and LH"], "a": [1], "w": ["Induces ovulation for pregnancy.", "Correct. Low-dose pills decrease androgen production and correct bleeding.", "Regulates periods but doesn't improve androgens.", "For pregnancy induction."], "m": false, "b": null, "x": false, "r": false, "d": 0.5, "t": "pel.pcostx", "ev": "If pregnancy is not desired, low-dose birth control pills decrease androgen production and correct irregular bleeding."}, {"id": "q-r-ovary-02", "s": "r-ovary", "k": "bank", "q": "Why is ovarian cancer often diagnosed late?", "o": ["It causes severe early pain", "Early disease is often silent; the peritoneum lets tumors grow without early obstruction", "It only occurs in children", "It is found on routine Pap tests"], "a": [1], "w": ["Early disease is often asymptomatic.", "Correct. Three of every four women have spread at diagnosis.", "Most cases are over 65.", "Pap tests screen the cervix."], "m": false, "b": null, "x": false, "r": false, "d": 0.3, "t": "ov.late", "ev": "…to distant sites beyond the ovaries CLINICAL MANIFESTATIONS Ovarian cancer is often asymptomatic in the early stages.…"}, {"id": "q-r-ovary-03", "s": "r-ovary", "k": "bank", "q": "Which statement about CA-125 is correct?", "o": ["It predicts survival at diagnosis", "It is a screening test for all women", "It helps monitor treatment and recurrence", "It is only elevated in ovarian cancer"], "a": [2], "w": ["No prognostic significance at diagnosis.", "Not a screening test.", "Correct. Most useful for tracking response and recurrence when it was high at diagnosis.", "Also up in endometriosis and other conditions."], "m": false, "b": null, "x": false, "r": false, "d": 0.5, "t": "ov.ca125", "ev": "This tumor marker has greater utility in monitoring treatment efficacy and determining recurrence of disease in those with an elevated CA-125 at diagnosis."}, {"id": "q-r-ovary-04", "s": "r-ovary", "k": "bank", "q": "Which are risk factors for ovarian cancer? Select all that apply.", "o": ["BRCA1 or BRCA2 mutation", "A mother or sister with ovarian cancer", "Postmenopausal hormone therapy", "Multiple pregnancies", "Long-term oral contraceptive use"], "a": [0, 1, 2], "w": ["True.", "True: most important hereditary risk.", "True.", "False. Pregnancy suppresses ovulation and is protective.", "False. Contraceptives are protective."], "m": true, "b": null, "x": false, "r": false, "d": 0.4, "t": "ov.risk", "ev": "The BRCA1 gene, located on chromosome 17q21, has been linked to families affected with ovarian cancer and in the breast–ovarian cancer combination."}, {"id": "q-r-ovary-05", "s": "r-ovary", "k": "bank", "q": "Based on ovulation history, which client has the highest ovarian cancer risk?", "o": ["A 55-year-old who was never pregnant and never used birth control pills", "A mother of three", "A woman who used birth control pills for 10 years", "A woman who breastfed two children"], "a": [0], "w": ["Correct. Uninterrupted ovulation means more surface injury and repair.", "Pregnancy suppresses ovulation.", "The pill suppresses ovulation.", "Fewer ovulations than the first client."], "m": false, "b": null, "x": false, "r": false, "d": 0.5, "t": "ov.risk", "ev": "Pregnancy, the use of contraceptives, and other events that suppress ovulation may have a protective effect."}, {"id": "q-r-ovary-06", "s": "r-ovary", "k": "bank", "q": "Which is the most common type of ovarian cancer?", "o": ["Germ cell tumor", "Serous adenocarcinoma (epithelial)", "Sex cord tumor", "Seminoma"], "a": [1], "w": ["25% of tumors, mostly benign in adults.", "Correct. Epithelial tumors arise from the ovary surface; serous adenocarcinoma is most common.", "10% of tumors.", "A testicular cancer."], "m": false, "b": null, "x": false, "r": false, "d": 0.5, "t": "ov.type", "ev": "Serous adenocarcinoma, an epithelial tumor that resembles the epithelial tissue of the uterine tube, is the most common type."}, {"id": "q-r-ovary-07", "s": "r-ovary", "k": "bank", "q": "A 54-year-old asks which lab best shows ovarian failure (menopause). The nurse answers:", "o": ["Low FSH", "Elevated FSH", "Elevated progesterone", "Elevated inhibin"], "a": [1], "w": ["Wrong direction.", "Correct. A rise in serum FSH is the most significant marker.", "Progesterone falls.", "Inhibin falls."], "m": false, "b": null, "x": false, "r": false, "d": 0.4, "t": "meno.dx", "ev": "Laboratory markers for menopause include an increase in serum FSH; this is the most significant marker for ovarian failure."}, {"id": "q-r-ovary-08", "s": "r-ovary", "k": "bank", "q": "A 49-year-old hasn't had a period in 4 months and asks if she is in menopause. What is the nurse's best response?", "o": ["“Menopause is confirmed after 12 months without a period and no other cause.”", "“One high FSH result proves it.”", "“A pelvic ultrasound will confirm it.”", "“Hot flashes for 3 months confirm it.”"], "a": [0], "w": ["Correct. The diagnosis needs 12 months of amenorrhea with no other cause, such as pregnancy.", "FSH supports but doesn't confirm.", "Ultrasound isn't the criterion.", "Symptoms aren't the criterion."], "m": false, "b": null, "x": false, "r": false, "d": 0.3, "t": "meno.dx", "ev": "DIAGNOSTIC CRITERIA The diagnosis of menopause is based on history of amenorrhea for at least 12 months in the absence of any other causes, such as pregnancy."}, {"id": "q-r-ovary-09", "s": "r-ovary", "k": "bank", "q": "Why do FSH and LH rise in menopause?", "o": ["The pituitary is overactive from a tumor", "Ovaries stop making estrogen and progesterone, so negative feedback is lost", "Estrogen levels rise", "Inhibin rises"], "a": [1], "w": ["Not a tumor.", "Correct. Exhausted follicles can't respond; GnRH, FSH and LH climb with no effect.", "Estrogen falls.", "Inhibin falls."], "m": false, "b": null, "x": false, "r": false, "d": 0.5, "t": "meno.patho", "ev": "As the ovaries age, the follicles become exhausted and unable to respond to functional demands despite adequate stimulation."}, {"id": "q-r-ovary-10", "s": "r-ovary", "k": "bank", "q": "Which are effects of estrogen loss after menopause? Select all that apply.", "o": ["Faster bone loss", "Vaginal dryness and dyspareunia", "Urgency and stress incontinence", "Higher LDL-to-HDL ratio", "Larger breast size"], "a": [0, 1, 2, 3], "w": ["True.", "True.", "True: bladder cell atrophy.", "True: more cardiovascular risk.", "False. Breast size decreases."], "m": true, "b": null, "x": false, "r": false, "d": 0.4, "t": "meno.effects", "ev": "Urinary difficulties, such as urgency and stress incontinence, can be attributed to atrophy of bladder cells as a result of the loss of hormonal stimulation necessary for optimal cell functioning."}, {"id": "q-r-ovary-11", "s": "r-ovary", "k": "bank", "q": "A 67-year-old with mild hot flashes asks to start estrogen. Best response:", "o": ["\"Estrogen alone long-term is ideal.\"", "\"Hormone therapy isn't started after 65 because of dementia risk; let's try layers, avoiding triggers, and relaxation.\"", "\"Hot flashes mean you need more FSH.\"", "\"Spicy food will help.\""], "a": [1], "w": ["Estrogen alone raises endometrial cancer risk; long-term use isn't recommended.", "Correct. Starting HRT after 65 isn't recommended (dementia risk); use nonpharmacologic steps.", "FSH is already high.", "Avoid spicy foods."], "m": false, "b": null, "x": false, "r": false, "d": 0.5, "t": "meno.hrt", "ev": "…cream) to avoid systemic effects Initiation of HRT in women older than 65 years is not recommended because of the increased associated risk of dementia in this age group.…"}, {"id": "q-r-ovary-12", "s": "r-ovary", "k": "bank", "q": "Which HRT criteria does the book list? Select all that apply.", "o": ["Only for severe symptoms", "Short-term use", "Lowest effective dose", "Topical forms to avoid systemic effects", "Estrogen alone for lifelong heart protection"], "a": [0, 1, 2, 3], "w": ["True.", "True.", "True.", "True.", "False. Estrogen alone lacked the expected protection and raised endometrial cancer risk."], "m": true, "b": null, "x": false, "r": false, "d": 0.5, "t": "meno.hrt", "ev": "…symptoms that require treatment Short-term duration of HRT Lowest effective dose of HRT Topical application (such as with a vaginal cream) to avoid systemic effects Initiation of HRT in women older than 65 years is not recommended because of the increased associated risk of dementia in this age group.…"}, {"id": "q-r-ovary-13", "s": "r-ovary", "k": "bank", "q": "Raloxifene is used after menopause mainly to:", "o": ["Stop hot flashes", "Prevent osteoporosis", "Induce ovulation", "Treat vaginal dryness"], "a": [1], "w": ["Not its main use.", "Correct. A SERM: decreases bone breakdown and LDL, antagonist in breast and endometrium.", "Clomiphene does that.", "Topical estrogen does that."], "m": false, "b": null, "x": false, "r": false, "d": 0.4, "t": "meno.serm", "ev": "The drug raloxifene is often used to prevent osteoporosis in postmenopausal women."}, {"id": "q-r-male-01", "s": "r-male", "k": "case", "q": "A 66-year-old man who takes sildenafil arrives with chest pain. Which action comes first?", "o": ["Give sublingual nitroglycerin", "Ask when he last took sildenafil", "Obtain a PSA", "Give oral aspirin and discharge"], "a": [1], "w": ["Nitrates + PDE5 inhibitors can drop blood pressure dangerously.", "Correct. Check the last PDE5 dose before any nitrate.", "Irrelevant to chest pain.", "Unsafe."], "m": false, "b": null, "x": false, "r": false, "d": 0.5, "t": "male.ed", "ev": "Medications, such as sildenafil (Viagra), vardenafil, and tadalafil, are often prescribed for men with ED. These drugs promote smooth muscle relaxation and vascular congestion in the corpora cavernosa. (Nitrate warning from your notes, Merck Manual.)", "c": "A 66-year-old man with hypertension and ED takes sildenafil. He arrives at urgent care with crushing chest pain that started 20 minutes ago. BP 142/88.", "cn": "Chest pain, on sildenafil"}, {"id": "q-r-male-02", "s": "r-male", "k": "bank", "q": "Which causes of erectile dysfunction does the book list? Select all that apply.", "o": ["Hypogonadism or hypothyroidism", "Spinal cord or perineal nerve injury", "Anxiety or depression", "Atherosclerosis, hypertension and smoking", "Antihypertensive medications"], "a": [0, 1, 2, 3, 4], "w": ["True: hormonal.", "True: neurologic.", "True: psychological.", "True: vascular obstruction.", "True."], "m": true, "b": null, "x": false, "r": false, "d": 0.4, "t": "male.edcause", "ev": "…rap blood within the corpora cavernosa Certain medications: Antihypertensives can inhibit hormone and erectile function DIAGNOSTIC CRITERIA Diagnosis of ED is based on a comprehensive history and physical examination to identify the potential cause.…"}, {"id": "q-r-male-03", "s": "r-male", "k": "bank", "q": "How do sildenafil, vardenafil and tadalafil work?", "o": ["Raise testosterone", "Relax smooth muscle so blood stays trapped in the corpora cavernosa", "Block DHT", "Stimulate sympathetic nerves"], "a": [1], "w": ["Not their action.", "Correct. Smooth muscle r
