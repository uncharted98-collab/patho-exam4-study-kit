elaxation and vascular congestion maintain the erection.", "That is finasteride (BPH).", "Erection is parasympathetic."], "m": false, "b": null, "x": false, "r": false, "d": 0.4, "t": "male.ed", "ev": "These drugs promote smooth muscle relaxation and vascular congestion in the corpora cavernosa, thereby maintaining an erection."}, {"id": "q-r-male-04", "s": "r-male", "k": "bank", "q": "In the research note, what improved erectile function?", "o": ["Testosterone injections", "Two years of weight loss and exercise", "Penile implants", "Alcohol"], "a": [1], "w": ["Not the study.", "Correct. Less weight, BP, glucose and cholesterol → better sexual function (less inflammation).", "Not the study.", "Alcohol worsens ED."], "m": false, "b": null, "x": false, "r": false, "d": 0.3, "t": "male.edlife", "ev": "After a 2-year diet and exercise intervention, those males who had significant decreases in body weight, body mass index, waist-to-hip ratio, blood pressure, glucose levels, and total cholesterol demonstrated a statistically significant improvement in sexual function."}, {"id": "q-r-male-05", "s": "r-male", "k": "bank", "q": "BPH causes urinary symptoms early because the growth is mainly:", "o": ["In the peripheral prostate", "Periurethral (around the urethra)", "In the bladder", "In the seminal vesicles"], "a": [1], "w": ["That is where prostate CANCER usually starts.", "Correct. Periurethral growth squeezes the urethra.", "No.", "No."], "m": false, "b": null, "x": false, "r": false, "d": 0.4, "t": "male.bph", "ev": "The cell proliferation occurs primarily in the periurethral part of the gland."}, {"id": "q-r-male-06", "s": "r-male", "k": "bank", "q": "Which symptoms are caused by BPH? Select all that apply.", "o": ["Frequency", "Hesitancy", "Dribbling", "Urgency", "Painless testicular lump"], "a": [0, 1, 2, 3], "w": ["True.", "True.", "True.", "True.", "False. That is testicular cancer."], "m": true, "b": null, "x": false, "r": false, "d": 0.3, "t": "male.bph", "ev": "This results in urinary frequency, dribbling, hesitancy, incontinence, urgency, and retention."}, {"id": "q-r-male-07", "s": "r-male", "k": "case", "q": "A 70-year-old with BPH has not voided in 9 hours and is restless with suprapubic pain. Why is this the priority patient?", "o": ["It is a teaching need", "Complete obstruction → acute retention can cause severe pain and renal failure", "BPH turns into cancer", "He needs a PSA"], "a": [1], "w": ["It is an emergency.", "Correct. Acute retention needs fast relief (catheter per order).", "BPH is not a precursor to cancer.", "Not now."], "m": false, "b": null, "x": false, "r": false, "d": 0.4, "t": "male.bphret", "ev": "Complete obstruction leads to acute urinary retention and an absolute inability to urinate.", "c": "On a med-surg floor: a 70-year-old with BPH has not voided in 9 hours, is restless, and has suprapubic pain; his bladder is palpable above the pubis.", "cn": "No void in 9 hours", "fx": 1}, {"id": "q-r-male-08", "s": "r-male", "k": "bank", "q": "On a digital rectal exam, which finding should the nurse report first?", "o": ["A hard, asymmetric, cobblestone prostate", "A soft, enlarged prostate", "A smooth, normal-sized prostate", "Mild discomfort during the exam"], "a": [0], "w": ["Correct. That texture points to prostate cancer.", "That fits BPH.", "That's normal.", "Mild discomfort is expected."], "m": false, "b": null, "x": false, "r": false, "d": 0.3, "t": "male.dre", "ev": "Benign enlargement of the prostate tissue is soft; malignant tissue is hard, asymmetrical, and often has a cobblestone texture."}, {"id": "q-r-male-09", "s": "r-male", "k": "bank", "q": "Which BPH drug class shrinks the prostate over time?", "o": ["Alpha-blockers", "Drugs that block testosterone conversion to DHT", "PDE5 inhibitors", "Anticholinergics"], "a": [1], "w": ["They relax smooth muscle; they don't shrink it.", "Correct. Less DHT → prostate atrophy.", "Used for ED (daily tadalafil can help both).", "Can trigger retention."], "m": false, "b": null, "x": false, "r": false, "d": 0.5, "t": "male.bphtx", "ev": "Because the prostate also depends on hormonal stimulation, drugs may be prescribed that inhibit the action of testosterone by restricting conversion to DHT."}, {"id": "q-r-male-10", "s": "r-male", "k": "bank", "q": "What is the most common surgery for BPH?", "o": ["Radical prostatectomy", "Transurethral resection of the prostate (TURP)", "Orchiectomy", "Urethral stent"], "a": [1], "w": ["That is for prostate cancer.", "Correct. Part of the prostate is removed through the penile urethra.", "For testicular cancer.", "For patients who can't have other treatments."], "m": false, "b": null, "x": false, "r": false, "d": 0.3, "t": "male.bphtx", "ev": "The most common procedure is the transurethral resection of the prostate (TURP)."}, {"id": "q-r-mcancer-01", "s": "r-mcancer", "k": "bank", "q": "A 65-year-old has no urinary symptoms and asks why he should be screened for prostate cancer. What is the nurse's best response?", "o": ["“Early cancer starts in the outer prostate, so it often causes no symptoms.”", "“Prostate cancer always causes symptoms early.”", "“It only grows in the bladder.”", "“It grows so fast that screening doesn't help.”"], "a": [0], "w": ["Correct. Peripheral growth doesn't squeeze the urethra, so early disease is silent.", "It's often silent.", "Not true.", "It's usually slow-growing."], "m": false, "b": null, "x": false, "r": false, "d": 0.5, "t": "mca.pc", "ev": "This peripheral location is clinically significant in that the tumor does not compress the urethra until later in its progression."}, {"id": "q-r-mcancer-02", "s": "r-mcancer", "k": "bank", "q": "Which are risk factors for prostate cancer? Select all that apply.", "o": ["Advancing age", "Family history", "High fat and meat intake", "Low lycopene (tomato) intake", "Low dietary calcium"], "a": [0, 1, 2, 3], "w": ["True.", "True.", "True.", "True.", "False. HIGH dietary calcium is the risk."], "m": true, "b": null, "x": false, "r": false, "d": 0.4, "t": "mca.pcrisk", "ev": "Risk factors for prostate cancer include advancing age, family history of prostate cancer, and smoking along with nutritional factors, such as high intake of fats and meat, low intake of lycopene (found primarily in tomato-based products) and fruit, and high dietary calcium."}, {"id": "q-r-mcancer-03", "s": "r-mcancer", "k": "bank", "q": "A Gleason score of 9 means:", "o": ["Very well-differentiated cells and a good prognosis", "Very abnormal cells and a worse prognosis", "The tumor is in the testis", "PSA is normal"], "a": [1], "w": ["That would be a low score (2).", "Correct. Two grades (1–5) are added; higher = more abnormal, worse prognosis.", "No.", "Not related."], "m": false, "b": null, "x": false, "r": false, "d": 0.4, "t": "mca.gleason", "ev": "The Gleason score is based on two grades, with the first grade referring to the most predominant cellular pattern and the second grade referring to the second most predominant pattern; the two scores are then added together (Fig."}, {"id": "q-r-mcancer-04", "s": "r-mcancer", "k": "bank", "q": "Which PSA result is most suggestive of prostate cancer?", "o": ["A low free PSA compared with total PSA", "A high free PSA compared with total PSA", "A normal total PSA", "A PSA that falls after treatment"], "a": [0], "w": ["Correct. Malignant cells raise the bound fraction, so free PSA is low.", "That pattern fits BPH.", "Not suggestive.", "That suggests response to treatment."], "m": false, "b": null, "x": false, "r": false, "d": 0.6, "t": "mca.psa", "ev": "Some studies suggest that malignant prostate cells produce more bound PSA; therefore, a low level of free PSA compared to total PSA may indicate malignant prostatic neoplasia."}, {"id": "q-r-mcancer-05", "s": "r-mcancer", "k": "bank", "q": "A man with prostate cancer reports new back pain. What should the nurse suspect first?", "o": ["Spread to bone", "Muscle strain", "Kidney stones", "BPH"], "a": [0], "w": ["Correct. Bone is the most common site of distant spread.", "Don't assume a benign cause.", "Not the first concern.", "BPH doesn't cause back pain."], "m": false, "b": null, "x": false, "r": false, "d": 0.3, "t": "mca.pc", "ev": "Radionucleotide bone scans are used to detect metastases to the bone, the most common site of distant spread."}, {"id": "q-r-mcancer-06", "s": "r-mcancer", "k": "bank", "q": "An 82-year-old with slow-growing, symptom-free prostate cancer asks about treatment. Which plan should the nurse expect first?", "o": ["Emergency radical prostatectomy", "Watchful waiting", "Orchiectomy", "No follow-up at all"], "a": [1], "w": ["Surgery is mostly for younger, healthier men.", "Correct. It avoids treatment complications; many men die of other causes.", "That is testicular cancer surgery.", "Watchful waiting still means monitoring."], "m": false, "b": null, "x": false, "r": false, "d": 0.4, "t": "mca.pctx", "ev": "Because prostate cancer is considered a slow-growing tumor and is typically diagnosed later in life, “watchful waiting” may be the treatment of choice in those without clinical symptoms."}, {"id": "q-r-mcancer-07", "s": "r-mcancer", "k": "case", "q": "A 26-year-old has a painless firm testicular lump. Which order should the nurse question?", "o": ["Scrotal ultrasound", "Serum tumor markers", "Transscrotal needle biopsy", "CT scan"], "a": [2], "w": ["Appropriate.", "Appropriate.", "Correct. Transscrotal biopsy can seed tumor into the scrotum or inguinal nodes; diagnosis is by radical orchiectomy.", "Appropriate for spread."], "m": false, "b": null, "x": false, "r": false, "d": 0.5, "t": "mca.tc", "ev": "Transscrotal biopsy is not recommended because it may result in seeding of the tumor into the scrotum or spread to inguinal lymph nodes.", "c": "A 26-year-old notices a small, painless, firm lump on his left testicle and a heavy feeling in the scrotum for 3 weeks.", "cn": "Painless testicular lump"}, {"id": "q-r-mcancer-08", "s": "r-mcancer", "k": "bank", "q": "Which is the biggest risk factor for testicular cancer?", "o": ["Smoking", "Cryptorchidism (undescended testis)", "High-fat diet", "Vasectomy"], "a": [1], "w": ["Not named.", "Correct. 20 to 40 times more likely.", "A prostate cancer risk.", "Not named."], "m": false, "b": null, "x": false, "r": false, "d": 0.3, "t": "mca.tcrisk", "ev": "Those with cryptorchidism are 20 to 40 times more likely to develop testicular cancer."}, {"id": "q-r-mcancer-09", "s": "r-mcancer", "k": "bank", "q": "Which statement about seminomas and nonseminomas is correct?", "o": ["Nonseminomas are the most common", "Nonseminomas grow faster and spread more than seminomas", "Seminomas never respond to treatment", "Both resemble mature sperm"], "a": [1], "w": ["Seminomas are most common.", "Correct. Nonseminomas are faster, more invasive and more likely to metastasize.", "Seminomas without spread have 95% 5-year survival.", "Seminomas resemble primitive sperm cells."], "m": false, "b": null, "x": false, "r": false, "d": 0.5, "t": "mca.tctype", "ev": "The nonseminomas grow faster, are more invasive, and are more likely to metastasize than the seminomas.", "fx": 1}, {"id": "q-r-mcancer-10", "s": "r-mcancer", "k": "bank", "q": "What should the nurse teach every male about testicular cancer screening?", "o": ["Yearly PSA after 20", "Monthly testicular self-exam", "Ultrasound every 5 years", "No screening is needed"], "a": [1], "w": ["PSA is for prostate cancer.", "Correct. Self-exam monthly is key to early detection.", "Not recommended.", "Self-exam is recommended."], "m": false, "b": null, "x": false, "r": false, "d": 0.2, "t": "mca.tcteach", "ev": "DIAGNOSTIC CRITERIA Self-testicular examination is an important aspect of early detection and should be practiced by all males on a monthly basis."}, {"id": "q-a-theory-01", "s": "a-theory", "k": "bank", "q": "Genetic influences as the major determinants of aging are the focus of which of the following theories?", "o": ["Developmental theory", "Stochastic theory", "Free radical theory", "Error theory"], "a": [0], "w": ["Correct. Developmental theories point to genetics as the major determinant of aging.", "Stochastic theories say aging comes from random, cumulative cell damage.", "Free radical theory is a stochastic theory (damage from reactive oxygen species).", "Error (somatic mutation) theory is also stochastic: damage, not a genetic program."], "m": false, "b": "Ch 19 #1", "x": false, "r": false, "d": 0.2, "t": "theory.dev", "ev": "Developmental theories point to the influence of genetics as the major determinant of aging."}, {"id": "q-a-systems-01", "s": "a-systems", "k": "bank", "q": "Typical changes in total body water in older people include:", "o": ["increased total body water caused by increase in muscle mass.", "increased total body water caused by increased fat mass.", "decreased total body water caused by decrease in muscle mass.", "decreased total body water caused by decreased fat mass."], "a": [2], "w": ["Muscle mass decreases with age, and body water goes down, not up.", "Fat increases, but fat holds little water, so total body water falls.", "Correct. Aging means less muscle and more fat, so total body water drops.", "Fat mass goes up with age, not down."], "m": false, "b": "Ch 19 #2", "x": false, "r": false, "d": 0.4, "t": "sys.water", "ev": "These changes contribute to a decrease in total body water, further enhanced by the kidney’s diminished sodium and water balance regulation, which is important for maintaining extracellular fluid volume and tonicity."}, {"id": "q-a-systems-02", "s": "a-systems", "k": "bank", "q": "Immune senescence is characterized by:", "o": ["increased antigenic immune response.", "enhanced T-cell function.", "enhanced IgE-mediated hypersensitivity.", "enhanced autoimmune response."], "a": [3], "w": ["Antigenic responses diminish with age.", "T-cell function decreases (even though T-cell numbers stay about the same).", "IgE-mediated responses decrease, so allergy symptoms lessen.", "Correct. More autoantibodies and immune complexes circulate, so autoimmune responses are enhanced."], "m": false, "b": "Ch 19 #3", "x": false, "r": false, "d": 0.5, "t": "sys.immune", "ev": "Autoimmune responses may become enhanced because of increased circulation of autoantibodies and immune complexes."}, {"id": "q-a-systems-03", "s": "a-systems", "k": "bank", "q": "Age-related changes affecting neurologic function include:", "o": ["increased myelin.", "decreased number of neurons.", "enhanced nerve conduction.", "improved axonal repair mechanisms."], "a": [1], "w": ["Myelin decreases.", "Correct. Brain mass drops and the number of neurons, dendrites and synapses decreases.", "Nerve conduction slows.", "Axon response to injury and repair becomes less efficient."], "m": false, "b": "Ch 19 #4", "x": false, "r": false, "d": 0.3, "t": "sys.neuro", "ev": "…: Decrease in brain mass Enlargement of cerebral ventricles Decrease in number of neurons, dendritic processes, and synapses Decrease in myelin Altered production of neurotransmitters Histologically, in the brain, findings of lipofuscin pigment in nerve cells and amyloid in the vascular tissue are consistent with aging…"}, {"id": "q-a-bone-01", "s": "a-bone", "k": "bank", "q": "An imbalance in bone remodeling characteristic of osteoporosis is caused by:", "o": ["enhanced bone formation caused by increased activity of osteoclasts.", "enhanced bone formation caused by increased activity of osteoblasts.", "increased bone resorption caused by increased activity of osteoclasts.", "increased bone resorption caused by increased activity of osteoblasts."], "a": [2], "w": ["Osteoclasts break bone down; they don't form it.", "That would build bone, the opposite of osteoporosis.", "Correct. Resorption by osteoclasts is favored over formation by osteoblasts, so bone mass is lost.", "Osteoblasts build bone; they don't resorb it."], "m": false, "b": "Ch 19 #5", "x": false, "r": false, "d": 0.4, "t": "bone.remodel", "ev": "PATHOPHYSIOLOGY Osteoporosis (brittle bone disease) occurs because of an imbalance in the bone remodeling process; bone resorption by osteoclasts is favored over bone formation by osteoblasts, resulting in loss of bone mass (Fig."}, {"id": "q-a-systems-04", "s": "a-systems", "k": "bank", "q": "Age-related changes contributing to impaired healing include:", "o": ["increased skin elasticity.", "enhanced subcutaneous fat.", "decreased superficial capillary perfusion.", "atrophied capillary support to dermis."], "a": [3], "w": ["Collagen elasticity decreases with age.", "Subcutaneous fat is lost with age.", "Close, but the book's wording is atrophied epidermis and supporting capillaries.", "Correct. The book lists loss of subcutaneous fat, less elastic collagen, and atrophied epidermis and supporting capillaries."], "m": false, "b": "Ch 19 #6", "x": false, "r": false, "d": 0.6, "t": "sys.heal", "ev": "Typical physical changes of aging, including loss of subcutaneous fat, decreased elasticity of collagen, and atrophied epidermis and supporting capillaries, also contribute to impaired healing."}, {"id": "q-a-bone-02", "s": "a-bone", "k": "bank", "q": "Osteoporosis is the result of an imbalance favoring increased:", "o": ["osteoblastic activity.", "osteoclastic activity.", "vitamin D absorption.", "calcium absorption."], "a": [1], "w": ["Osteoblasts build bone; more of them would protect bone.", "Correct. Osteoclasts resorb bone; when they win, bone mass is lost.", "Vitamin D protects bone.", "Calcium absorption protects bone."], "m": false, "b": "Ch 19 #7", "x": false, "r": false, "d": 0.3, "t": "bone.remodel", "ev": "PATHOPHYSIOLOGY Osteoporosis (brittle bone disease) occurs because of an imbalance in the bone remodeling process; bone resorption by osteoclasts is favored over bone formation by osteoblasts, resulting in loss of bone mass (Fig."}, {"id": "q-a-progeria-01", "s": "a-progeria", "k": "bank", "q": "Mortality for patients with progeria is most commonly a result of:", "o": ["rapid aging.", "atherosclerosis.", "scleroderma.", "psychosis."], "a": [1], "w": ["Rapid aging is the disease itself, not the usual cause of death.", "Correct. Children with progeria develop atherosclerosis early; heart attack and stroke are the usual cause of death.", "Scleroderma-like skin is a sign, not the cause of death.", "Progeria is not linked with psychosis or senility."], "m": false, "b": "Ch 19 #8", "x": false, "r": false, "d": 0.4, "t": "prog.death", "ev": "…al dysplasia Incomplete sexual maturation Affected children often develop osteoporosis, atherosclerosis, fibrosis, hypertension, and arthritis.…"}, {"id": "q-a-progeria-02", "s": "a-progeria", "k": "bank", "q": "Which of the following is a characteristic finding in progeria?", "o": ["High levels of hyaluronic acid", "Low levels of calcitonin", "High levels of thyroxine", "Low levels of glutamate"], "a": [0], "w": ["Correct. Hyaluronic acid levels can provide clues to the presence of HGPS.", "Calcitonin isn't a progeria marker.", "Thyroxine isn't a progeria marker.", "Glutamate isn't a progeria marker."], "m": false, "b": "Ch 19 #9", "x": false, "r": false, "d": 0.4, "t": "prog.dx", "ev": "Hyaluronic acid levels can provide clues to the presence of HGPS."}, {"id": "q-a-ad-01", "s": "a-ad", "k": "bank", "q": "Memory loss in Alzheimer disease results from impaired neural conduction in the:", "o": ["frontal lobe.", "basal ganglia.", "limbic system.", "hippocampus."], "a": [3], "w": ["The frontal lobe handles executive function, but memory formation is the hippocampus.", "Basal ganglia handle movement.", "The hippocampus sits in the limbic system, but the book names the hippocampus.", "Correct. Tangles concentrate in the medial temporal lobe and hippocampus, key places for memory formation."], "m": false, "b": "Ch 19 #10", "x": false, "r": false, "d": 0.4, "t": "ad.where", "ev": "These neurofibrillary tangles accumulate initially in the temporal lobe and then become densely concentrated in the medial temporal lobe and hippocampus, important locations for memory formation."}, {"id": "q-a-theory-02", "s": "a-theory", "k": "bank", "q": "Which statement shows the student understands the stochastic theories of aging?", "o": ["\"My genes are programmed to switch off at a set age.\"", "\"Damage to my cells adds up over time.\"", "\"My telomeres are timed to shorten.\"", "\"Hormone changes in my brain cause aging.\""], "a": [1], "w": ["That is a developmental (genetic program) idea.", "Correct. Stochastic = random cellular damage that accumulates.", "Telomere shortening is a developmental (programmed) idea.", "That is the neuroendocrine theory, a developmental theory."], "m": false, "b": null, "x": false, "r": false, "d": 0.3, "t": "theory.stoch", "ev": "STOCHASTIC THEORIES Stochastic theories suggest that random accumulated cellular damage leads to aging."}, {"id": "q-a-theory-03", "s": "a-theory", "k": "bank", "q": "The free radical theory says which organelle is especially at risk for age-related damage?", "o": ["Nucleus", "Mitochondria", "Golgi apparatus", "Lysosomes"], "a": [1], "w": ["DNA is a target, but the book singles out mitochondria for ROS damage.", "Correct. ROS byproducts of the electron transport chain damage mitochondria and mitochondrial DNA.", "Not named.", "Lysosomes make lipofuscin, but they aren't the ROS target in this theory."], "m": false, "b": null, "x": false, "r": false, "d": 0.4, "t": "theory.stoch", "ev": "Mitochondria are especially at risk for damage from ROS because of byproducts produced in the electron transport chain that produce energy in the form of adenosine triphosphate (ATP)."}, {"id": "q-a-theory-04", "s": "a-theory", "k": "bank", "q": "A gene helps a person reproduce successfully when young but causes harm in old age. Which theory is this?", "o": ["Immunologic theory", "Neuroendocrine theory", "Antagonistic pleiotropy theory", "Somatic mutation theory"], "a": [2], "w": ["Immunologic theory = immune function declines with age.", "Neuroendocrine = hypothalamic–pituitary changes drive aging.", "Correct. Antagonistic pleiotropy: genes have good effects early but harmful effects later.", "Somatic mutation = poor DNA repair and protein errors."], "m": false, "b": null, "x": false, "r": false, "d": 0.4, "t": "theory.dev", "ev": "Another theory, the antagonistic pleiotropy theory, suggests that genes may have beneficial effects during early life but harmful effects as the individual ages."}, {"id": "q-a-theory-05", "s": "a-theory", "k": "bank", "q": "Which is the book's example of the neuroendocrine theory of aging?", "o": ["Menopause", "Wrinkled skin", "Cataracts", "Sarcopenia"], "a": [0], "w": ["Correct. Menopause is altered neuroendocrine responsiveness in older females.", "Skin change is a general manifestation.", "Not given as the example.", "Muscle loss is a general manifestation."], "m": false, "b": null, "x": false, "r": false, "d": 0.3, "t": "theory.dev", "ev": "Menopause is an example of altered neuroendocrine responsiveness in females with advanced age."}, {"id": "q-a-theory-06", "s": "a-theory", "k": "bank", "q": "What does the book say caloric restriction does in experiments?", "o": ["Speeds up aging", "Prolongs life expectancy", "Causes osteoporosis", "Has no effect"], "a": [1], "w": ["Opposite.", "Correct. Energy may shift from growth and reproduction toward repair and maintenance of body cells.", "Not stated.", "It had an effect."], "m": false, "b": null, "x": false, "r": false, "d": 0.3, "t": "a-theory", "ev": "Caloric restriction has been shown experimentally to prolong life expectancy."}, {"id": "q-a-theory-07", "s": "a-theory", "k": "bank", "q": "Which terms are matched correctly? Select all that apply.", "o": ["Life span: maximum length of time a person lives (about 100 years)", "Life expectancy: age at which 50% of a population is expected to survive", "Senescence: postmaturational processes that lower homeostasis and raise vulnerability", "Lipofuscin: a protein that stabilizes microtubules", "Sarcopenia: calcification of cartilage"], "a": [0, 1, 2], "w": ["True.", "True.", "True.", "False. Lipofuscin is a brown \"wear-and-tear\" age pigment; tau stabilizes microtubules.", "False. Sarcopenia is loss of skeletal muscle; chondrocalcinosis is calcified cartilage."], "m": true, "b": null, "x": false, "r": false, "d": 0.4, "t": "theory.terms", "ev": "Life span, which appears to be fixed around 100 years, is the maximum length of time a person lives."}, {"id": "q-a-systems-05", "s": "a-systems", "k": "bank", "q": "Which change in thyroid labs is typical in older adults?", "o": ["High T3, low TSH", "Low T3, high TSH", "High T3, high TSH", "No change"], "a": [1], "w": ["That pattern suggests hyperthyroidism, which does not increase with age.", "Correct. Decreased T3 and elevated TSH are typical; hypothyroidism becomes more common with age.", "Not the typical pattern.", "Thyroid labs do change."], "m": false, "b": null, "x": false, "r": false, "d": 0.4, "t": "sys.thyroid", "ev": "Decreased T3 levels and elevated thyroid-stimulating hormone (TSH) levels characterize typical thyroid function alterations in older populations."}, {"id": "q-a-systems-06", "s": "a-systems", "k": "case", "q": "During a heat wave, why is an 88-year-old at higher risk for heat stress?", "o": ["Shivering is stronger", "Fewer, smaller, less active sweat glands", "More body water", "Faster heart rate"], "a": [1], "w": ["Shivering is a cold response and is blunted.", "Correct. The ability to cool by sweating drops because sweat glands decrease in number, size and activity.", "Total body water decreases.", "Not the reason given."], "m": false, "b": null, "x": false, "r": false, "d": 0.3, "t": "sys.temp", "ev": "The ability to cool the body via sweating is impaired because of a decrease in the number, size, and activity of sweat glands, making older people particularly susceptible to heat stress.", "c": "Home health visit in July. An 88-year-old lives alone with no air conditioning. The room is 33 °C (91.4 °F). She is confused, skin hot and dry.", "cn": "Heat wave, confused, not sweating"}, {"id": "q-a-systems-07", "s": "a-systems", "k": "bank", "q": "Why are frail older adults at risk for hypothermia? Select all that apply.", "o": ["Diminished cold perception", "Blunted vasoconstriction and shivering", "Limited ability to produce heat", "More sweat glands", "More subcutaneous fat in the limbs"], "a": [0, 1, 2], "w": ["True.", "True (less response to catecholamines).", "True.", "False. Sweat glands decrease.", "False. Subcutaneous fat is lost."], "m": true, "b": null, "x": false, "r": false, "d": 0.4, "t": "sys.temp", "ev": "Frail individuals are especially at risk for hypothermia because of diminished cold perception, altered responsiveness to catecholamine-induced vasoconstriction and shivering, and limited ability to produce heat."}, {"id": "q-a-systems-08", "s": "a-systems", "k": "bank", "q": "An 84-year-old on a renally cleared drug becomes confused and drowsy. What should the nurse suspect first?", "o": ["Drug toxicity from slower kidney excretion", "Normal aging", "A sudden rise in kidney function", "Too much total body water"], "a": [0], "w": ["Correct. GFR and renal blood flow fall with age, so excretion slows and toxicity risk rises.", "New confusion isn't normal.", "Function declines.", "Total body water falls."], "m": false, "b": null, "x": false, "r": false, "d": 0.4, "t": "sys.renal", "ev": "Drug excretion may be impaired, increasing the risk of toxicity."}, {"id": "q-a-systems-09", "s": "a-systems", "k": "bank", "q": "Which infections increase in older adults because acquired immunity is lost? Select all that apply.", "o": ["Herpes zoster (shingles)", "Tuberculosis", "Pneumonia and influenza deaths", "Allergic asthma attacks", "Nosocomial (hospital) infections"], "a": [0, 1, 2, 4], "w": ["True: reactivation.", "True: reactivation.", "True: mortality rises.", "False. IgE (allergy) responses decrease.", "True."], "m": true, "b": null, "x": false, "r": false, "d": 0.4, "t": "sys.immune", "ev": "The incidence of herpes zoster and tuberculosis infection increases in older populations."}, {"id": "q-a-systems-10", "s": "a-systems", "k": "bank", "q": "Which changes predispose older adults to constipation? Select all that apply.", "o": ["Increased rectal compliance", "Impaired rectal sensation", "Faster peristalsis", "Decreased rectal compliance", "Higher fluid intake"], "a": [0, 1], "w": ["Correct. A more distensible rectum holds more stool before signaling.", "Correct. The urge is felt less.", "Not an age change.", "Compliance increases.", "Fluids help prevent it."], "m": true, "b": null, "x": false, "r": false, "d": 0.5, "t": "sys.gi", "ev": "Increased rectal compliance (increased distensibility) and impaired rectal sensation represent age-related changes that predispose older individuals to constipation."}, {"id": "q-a-systems-11", "s": "a-systems", "k": "bank", "q": "Which bone-loss phase is cytokine (IL-6) driven and affects women after menopause?", "o": ["Menopausal bone loss", "Senescent bone loss", "Secondary osteoporosis", "Chondrocalcinosis"], "a": [0], "w": ["Correct. Low ovarian hormones → IL-6 → osteoclasts live longer, osteoblasts die sooner.", "Senescent loss is slower, affects both sexes, and comes from less bone formation.", "Secondary osteoporosis comes from other diseases or drugs.", "That is calcified cartilage."], "m": false, "b": null, "x": false, "r": false, "d": 0.5, "t": "bone.phase", "ev": "Menopausal bone loss is cytokine induced (interleukin-6 [IL-6]), occurring due to inadequate levels of protective ovarian hormones."}, {"id": "q-a-systems-12", "s": "a-systems", "k": "bank", "q": "Which muscle fibers are lost fastest in sarcopenia?", "o": ["Type I (slow-contracting)", "Type II (fast-contracting)", "Cardiac fibers", "Smooth muscle"], "a": [1], "w": ["Slow fibers are lost more slowly.", "Correct. Fast type II fibers go first, so isometric force drops.", "Not part of sarcopenia.", "Not part of sarcopenia."], "m": false, "b": null, "x": false, "r": false, "d": 0.5, "t": "sys.muscle", "ev": "Causes of sarcopenia include: Decreased physical activity Changes in the nervous system (central and peripheral) Protein undernutrition Faster-contracting muscle fibers (type II) are lost more quickly compared to the slower-contracting fibers (type I), leading to loss of isometric contractile force."}, {"id": "q-a-bone-03", "s": "a-bone", "k": "bank", "q": "Which DEXA result shows the highest fracture risk?", "o": ["T score −3.1", "T score −1.2", "T score −0.5", "T score +0.8"], "a": [0], "w": ["Correct. Below −2.5 is osteoporosis; −3.1 is the lowest bone density here.", "Osteopenia.", "Normal.", "Normal."], "m": false, "b": null, "x": false, "r": false, "d": 0.3, "t": "bone.tscore", "ev": "…re −1.0 to −2.5 Osteoporosis Bone mass less than 648 mg/cm2 T score less than −2.5 A comparison of an individual T score to persons of the same age, sex, and weight is documented using a Z score.…"}, {"id": "q-a-bone-04", "s": "a-bone", "k": "bank", "q": "A client's T score is −1.8. What is the nurse's best response?", "o": ["“Your bone density is lower than normal (osteopenia), so prevention matters now.”", "“You have osteoporosis.”", "“Your bones are normal.”", "“The test must be repeated tomorrow.”"], "a": [0], "w": ["Correct. −1.0 to −2.5 is osteopenia.", "That's below −2.5.", "Normal is above −1.0.", "No need to repeat."], "m": false, "b": null, "x": false, "r": false, "d": 0.3, "t": "bone.tscore", "ev": "…re −1.0 to −2.5 Osteoporosis Bone mass less than 648 mg/cm2 T score less than −2.5 A comparison of an individual T score to persons of the same age, sex, and weight is documented using a Z score.…"}, {"id": "q-a-bone-05", "s": "a-bone", "k": "bank", "q": "A DEXA report shows a Z score of −2.0. What should the nurse expect next?", "o": ["No further testing", "Labs to look for a secondary cause", "Immediate surgery", "A heel ultrasound instead"], "a": [1], "w": ["A low Z score needs a workup.", "Correct. A Z score below −1.5 suggests a secondary rather than primary cause (CBC, calcium, TSH, vitamin D, PTH, cortisol).", "No fracture is described.", "QUS may not be as accurate as DEXA."], "m": false, "b": null, "x": false, "r": false, "d": 0.5, "t": "bone.zscore", "ev": "Report of a Z score of less than −1.5 suggests a secondary, rather than primary, cause for osteoporosis."}, {"id": "q-a-bone-06", "s": "a-bone", "k": "bank", "q": "Which are risk factors for osteoporosis? Select all that apply.", "o": ["BMI less than 25", "Cigarette smoking", "Loss of estrogen", "Regular weight-bearing exercise", "Low calcium and vitamin D intake", "Obesity (BMI over 30)"], "a": [0, 1, 2, 4], "w": ["True.", "True.", "True.", "False. Weight bearing builds bone.", "True.", "False. The book lists BMI below 25 as the risk."], "m": true, "b": null, "x": false, "r": false, "d": 0.4, "t": "bone.risk", "ev": "…bone mass Reduced maximal amount of bone in a given person Body mass index less than 25 Loss of estrogen Aging Inadequate calcium and vitamin D intake Cigarette smoking Excessive alcohol Sedentary lifestyle Secondary osteoporosis, a less common form, results from secondary causes, including hormonal or genetic disease…"}, {"id": "q-a-bone-07", "s": "a-bone", "k": "bank", "q": "A 70-year-old woman feels fine and says she doesn't need a bone density scan. What is the nurse's best response?", "o": ["“Osteoporosis shows no signs until a fracture, so the scan finds it early.”", "“You're right; no symptoms means healthy bones.”", "“Only men need the scan.”", "“It's only found at autopsy.”"], "a": [0], "w": ["Correct. It's the 'silent disease': no signs until fracture, deformity or height loss.", "Silence doesn't mean healthy bone.", "Postmenopausal women are high risk.", "DEXA finds it in life."], "m": false, "b": null, "x": false, "r": false, "d": 0.2, "t": "bone.silent", "ev": "CLINICAL MANIFESTATIONS Often known as the “silent disease,” osteoporosis is not manifested until fracture, spinal deformity, or loss of height occurs."}, {"id": "q-a-bone-08", "s": "a-bone", "k": "bank", "q": "A postmenopausal woman takes 1,200 mg of calcium all at once at bedtime. What should the nurse teach first?", "o": ["Split it into divided doses for better absorption", "Double the dose", "Stop calcium; it isn't needed", "Take it only with coffee"], "a": [0], "w": ["Correct. The book recommends 1,200 mg/day in divided doses for best absorption.", "The amount is right; the timing isn't.", "Calcium protects bone.", "Not the teaching."], "m": false, "b": null, "x": false, "r": false, "d": 0.4, "t": "bone.ca", "ev": "Having a bone density test and taking medication when appropriate Calcium intake recommendations include 1,200 mg/day for postmenopausal women and older men in divided doses for best absorption."}, {"id": "q-a-bone-09", "s": "a-bone", "k": "bank", "q": "Which drugs are approved to treat osteoporosis? Select all that apply.", "o": ["Alendronate", "Calcitonin", "Raloxifene", "Teriparatide (a PTH drug)", "Donepezil"], "a": [0, 1, 2, 3], "w": ["Correct. A bisphosphonate.", "Correct. Approved.", "Correct. Approved.", "Correct. PTH is approved, and teriparatide builds new bone.", "That's an Alzheimer drug."], "m": true, "b": null, "x": false, "r": false, "d": 0.4, "t": "bone.drug", "ev": "Bisphosphonates (alendronate and risedronate), calcitonin, estrogen, PTH, and raloxifene are drugs currently approved by the U.S."}, {"id": "q-a-bone-10", "s": "a-bone", "k": "bank", "q": "A client starting alendronate asks how to take it. Which instruction is most important?", "o": ["Take it at bedtime with milk", "Take it first thing in the morning with a full glass of plain water and stay upright at least 30 minutes", "Take it with breakfast and lie down after", "Crush it into applesauce"], "a": [1], "w": ["Food and milk block absorption, and lying down risks esophageal injury.", "Correct. Empty stomach, plain water, upright, wait before eating: protects the esophagus.", "Lying down can burn the esophagus.", "Not recommended."], "m": false, "b": null, "x": false, "r": false, "d": 0.5, "t": "bone.drug", "ev": "Bisphosphonates (alendronate and risedronate), calcitonin, estrogen, PTH, and raloxifene are drugs currently approved by the U.S. Food and Drug Administration (FDA) for use to prevent or treat osteoporosis. (Dosing teaching from your notes, Merck Manual.)"}, {"id": "q-a-bone-11", "s": "a-bone", "k": "bank", "q": "Which hormone is the major source of bone-protecting signals from the thyroid's parafollicular cells?", "o": ["PTH", "Calcitonin", "Cortisol", "TSH"], "a": [1], "w": ["PTH comes from the parathyroid and pulls calcium out of bone.", "Correct. Calcitonin inhibits osteoclasts and promotes calcium deposition in bone.", "Cortisol harms bone.", "TSH controls thyroid hormone, not bone."], "m": false, "b": null, "x": false, "r": false, "d": 0.4, "t": "bone.ca", "ev": "Although a variety of tissues produce calcitonin, the major source of calcitonin is the parafollicular cells of the thyroid gland."}, {"id": "q-a-ad-02", "s": "a-ad", "k": "bank", "q": "Where do senile plaques form, and what are they made of?", "o": ["Outside neurons; amyloid beta protein", "Inside neurons; tau protein", "Inside neurons; lipofuscin", "Outside neurons; myelin"], "a": [0], "w": ["Correct. Plaques are dense amyloid beta deposits outside neurons in the hippocampus and cortex.", "That describes neurofibrillary tangles.", "Lipofuscin is age pigment, not plaques.", "Not myelin."], "m": false, "b": null, "x": false, "r": false, "d": 0.4, "t": "ad.plaque", "ev": "Senile plaques are dense deposits of amyloid beta protein found outside of neurons."}, {"id": "q-a-ad-03", "s": "a-ad", "k": "bank", "q": "What does tau normally do in a healthy neuron?", "o": ["Breaks down acetylcholine", "Binds microtubules and keeps them stable, like a backbone", "Makes amyloid beta", "Builds myelin"], "a": [1], "w": ["Cholinesterase does that.", "Correct. In AD, tau becomes \"sticky\" and tangles, so microtubules can't carry nutrients and the neuron dies.", "Enzymes cut APP into amyloid beta.", "Not tau's job."], "m": false, "b": null, "x": false, "r": false, "d": 0.4, "t": "ad.tau", "ev": "Tau, a unique protein, binds to microtubules and provides stability, like a backbone."}, {"id": "q-a-ad-04", "s": "a-ad", "k": "bank", "q": "Put the steps of plaque formation in order. Which sequence is right?", "o": ["APP cut by secretases → oligomers → fibrils → beta-sheets → senile plaque", "Fibrils → oligomers → APP → plaque", "Tau tangles → APP → plaque", "Beta-sheets → fibrils → oligomers → plaque"], "a": [0], "w": ["Correct. Small clusters (oligomers) → chains (fibrils) → fibers (beta-sheets).", "Backwards.", "Tangles are a separate process.", "Backwards."], "m": false, "b": null, "x": false, "r": false, "d": 0.5, "t": "ad.plaque", "ev": "The amyloid beta protein accumulates to form plaques beginning in small clusters (oligomers), followed by formation into chains (fibrils), and then finally into fibers organized as beta-sheets (β-sheets).", "fx": 1}, {"id": "q-a-ad-05", "s": "a-ad", "k": "bank", "q": "Dementia severity in Alzheimer disease best matches:", "o": ["The number of senile plaques", "The number and location of neurofibrillary tangles", "Total brain weight at birth", "Serum amyloid levels"], "a": [1], "w": ["The link between plaques and dementia isn't clear.", "Correct. Severity appears to correlate with the number and location of tangles.", "Not stated.", "Not a test in the book."], "m": false, "b": null, "x": false, "r": false, "d": 0.5, "t": "ad.tau", "ev": "However, dementia severity appears to correlate with the number and location of neurofibrillary tangles (Fig."}, {"id": "q-a-ad-06", "s": "a-ad", "k": "bank", "q": "A family asks whether a brain scan will confirm their mother's Alzheimer disease. What is the nurse's best response?", "o": ["“A definite diagnosis is only made at autopsy; tests and history support it now.”", "“An MRI confirms it.”", "“A blood test for APP confirms it.”", "“A memory test alone confirms it.”"], "a": [0], "w": ["Correct. Definitive diagnosis needs autopsy showing plaques and tangles.", "Imaging supports, doesn't confirm.", "No such confirming blood test.", "Supports, doesn't confirm."], "m": false, "b": null, "x": false, "r": false, "d": 0.3, "t": "ad.dx", "ev": "…Impaired swallowing, positioning, and reflexes DIAGNOSIS A definitive diagnosis of Alzheimer disease can be made only with an autopsy when typical characteristics of senile plaques and neurofibrillary tangles can be seen.…"}, {"id": "q-a-ad-07", "s": "a-ad", "k": "bank", "q": "What is the mainstay drug class for Alzheimer disease, and why?", "o": ["Antipsychotics, to stop plaques", "Cholinesterase inhibitors, to make up for lost acetylcholine", "Bisphosphonates, to protect neurons", "Dopamine agonists, to fix movement"], "a": [1], "w": ["Antipsychotics treat secondary symptoms only.", "Correct. ChEIs compensate for ACh depletion in the cortex and hippocampus.", "Used for bone.", "Used for Parkinson disease."], "m": false, "b": null, "x": false, "r": false, "d": 0.4, "t": "ad.tx", "ev": "The mainstay of pharmacologic therapy for patients is the use of centrally acting cholinesterase inhibitors (ChEIs) to compensate for the depletion of acetylcholine (ACh) in the cerebral cortex and hippocampus."}, {"id": "q-a-ad-08", "s": "a-ad", "k": "case", "q": "A client with Alzheimer disease wanders, needs help toileting, has some incontinence and paranoia, and sometimes forgets the spouse's name. Which stage is this?", "o": ["Stage 3", "Stage 4", "Stage 6", "Stage 7"], "a": [2], "w": ["Stage 3 = word-finding trouble, misplacing things.", "Stage 4 = trouble with bills and current events.", "Correct. Stage 6 = severe decline: wandering, toileting help, incontinence, paranoia.", "Stage 7 = loss of speech, movement and swallowing."], "m": false, "b": null, "x": false, "r": false, "d": 0.5, "t": "ad.stage", "ev": "…f incontinence Sense of paranoia, delusions, hallucinations May wander or become lost Stage 7 Very severe cognitive decline Loss of ability to respond to the environment, including speech and movement Loss of communication ability Requires increasing assistance with eating and toileting Impaired swallowing, positioning…", "c": "Mrs. K., 81, with Alzheimer disease, was found in the hallway at 2 a.m. trying doors. She now needs help on the toilet, has had two incontinent episodes this week, and told her daughter the staff are stealing.", "cn": "Wandering at night, new incontinence"}, {"id": "q-a-ad-09", "s": "a-ad", "k": "bank", "q": "Which are risk factors for Alzheimer disease? Select all that apply.", "o": ["Down syndrome", "Traumatic brain injury", "Hypertension and dyslipidemia", "History of depression", "Hyperthyroidism", "Young age"], "a": [0, 1, 2, 3], "w": ["True.", "True.", "True.", "True.", "False. Not listed.", "False. Later age is the risk."], "m": true, "b": null, "x": false, "r": false, "d": 0.4, "t": "ad.risk", "ev": "Several risk factors have been identified including later age, family history, obesity, dyslipidemia, hypertension, Down syndrome, history of traumatic brain injury, lead exposure, and history of depression."}, {"id": "q-a-ad-10", "s": "a-ad", "k": "bank", "q": "Which nursing action is the priority for a client with Alzheimer disease found in the stairwell?", "o": ["Teach about cholinesterase inhibitors", "Keep the client safe: door alarms, ID bracelet, supervision", "Schedule a DEXA scan", "Encourage a high-protein diet"], "a": [1], "w": ["Not the priority.", "Correct. Wandering into a stairwell is an immediate fall and injury risk.", "Not related.", "Not the priority."], "m": false, "b": null, "x": false, "r": false, "d": 0.4, "t": "ad.nurse", "ev": "…f incontinence Sense of paranoia, delusions, hallucinations May wander or become lost Stage 7 Very severe cognitive decline Loss of ability to respond to the environment, including speech and movement Loss of communication ability Requires increasing assistance with eating and toileting Impaired swallowing, positioning…"}, {"id": "q-a-progeria-03", "s": "a-progeria", "k": "bank", "q": "Which are signs of progeria? Select all that apply.", "o": ["Prominent scalp veins", "High-pitched voice", "Cataracts", "Delayed dentition", "Loss of subcutaneous fat"], "a": [0, 1, 3, 4], "w": ["True.", "True.", "False. Progeria is not linked to cataracts, tumors or senility.", "True.", "True."], "m": true, "b": null, "x": false, "r": false, "d": 0.4, "t": "prog.signs", "ev": "Prominent scalp veins Feeding difficulties Scleroderma (shiny, inelastic skin) and wrinkled (aged) skin Loss of subcutaneous fat and muscle Delayed dentition Hearing loss High-pitched voice Short stature and skeletal dysplasia Incomplete sexual maturation Affe…"}, {"id": "q-a-progeria-04", "s": "a-progeria", "k": "bank", "q": "Which are NOT features of progeria? Select all that apply.", "o": ["Senility", "Cataracts", "Extra tumors", "Atherosclerosis", "Osteoporosis"], "a": [0, 1, 2], "w": ["Correct. Progeria isn't linked to senility.", "Correct. Not linked to cataracts.", "Correct. Not linked to tumors.", "Atherosclerosis does develop.", "Osteoporosis does develop."], "m": true, "b": null, "x": false, "r": false, "d": 0.4, "t": "prog.signs", "ev": "Progeria is not associated with increased tumor formation, cataract development, or senility as may occur in aging adults."}, {"id": "q-a-progeria-05", "s": "a-progeria", "k": "bank", "q": "What is the treatment for progeria?", "o": ["Teriparatide", "No approved therapy; support feeding, activity, joint mobility, vascular monitoring and the family", "Cholinesterase inhibitors", "Bone marrow transplant"], "a": [1], "w": ["Not a progeria treatment.", "Correct. Research is testing gene therapy and rapamycin, but care is supportive.", "Used for AD.", "Not described."], "m": false, "b": null, "x": false, "r": false, "d": 0.3, "t": "prog.tx", "ev": "TREATMENT There is no approved therapy for progeria."}, {"id": "q-vision1-11", "s": "vision1", "k": "bank", "q": "Which conditions are errors of refraction? Select all that apply.", "o": ["Myopia", "Astigmatism", "Presbyopia", "Glaucoma", "Conjunctivitis"], "a": [0, 1, 2], "w": ["Correct. Nearsightedness is a common refraction error.", "Correct. Irregular corneal or lens curvature blurs focus.", "Correct. The aging lens can't accommodate for near vision.", "Glaucoma is optic nerve damage, usually from high IOP.", "Conjunctivitis is inflammation, not a focusing problem."], "m": true, "b": null, "x": false, "r": false, "d": 0.4, "t": "vision1", "ev": "One common error in refraction is myopia, commonly known as nearsightedness."}, {"id": "q-vision2-16", "s": "vision2", "k": "bank", "q": "A client in a dark movie theater develops sudden eye pain and blurred vision. Which condition should the nurse suspect first?", "o": ["Acute angle-closure glaucoma", "Open-angle glaucoma", "Presbyopia", "Viral conjunctivitis"], "a": [0], "w": ["Correct. Pupil dilation in a dark room can trigger an acute angle-closure attack, an emergency.", "Open-angle glaucoma is chronic and gradual.", "Presbyopia develops slowly with age.", "Conjunctivitis causes watering, not sudden vision loss."], "m": false, "b": null, "x": false, "r": false, "d": 0.5, "t": "vision2", "ev": "An acute episode of angle-closure glaucoma may be induced by increased pupil dilation caused by drugs or by being in a darkened room, such as a movie theater."}, {"id": "q-other-10", "s": "other", "k": "bank", "q": "Which statements about fibromyalgia are correct? Select all that apply.", "o": ["No diagnostic test confirms it", "It occurs about seven times more often in women", "Tricyclic antidepressants are first-line therapy", "A blood test confirms it", "It is more common in men"], "a": [0, 1, 2], "w": ["Correct. No lab or imaging test confirms it.", "Correct. Women are affected seven times more often.", "Correct. TCAs such as amitriptyline are first-line.", "No test confirms it.", "Women are affected far more."], "m": true, "b": null, "x": false, "r": false, "d": 0.4, "t": "other", "ev": "Fibromyalgia occurs in women seven times more frequently than in men."}, {"id": "q-somato-08", "s": "somato", "k": "bank", "q": "Which receptor gives the most highly developed sense of touch?", "o": ["Meissner corpuscle", "Pacinian corpuscle", "Ruffini ending", "Golgi tendon organ"], "a": [0], "w": ["Correct. Meissner corpuscles give a highly developed sense of touch.", "Pacinian corpuscles detect vibration.", "Ruffini endings detect heavy, continuous pressure.", "Golgi tendon organs sense position."], "m": false, "b": null, "x": false, "r": false, "d": 0.4, "t": "somato.receptors", "ev": "…lkins.) · Free nerve endings (detect touch and pressure) · Meissner corpuscle (highly developed sense of touch) · Merkel disks (movement of light objects over skin, vibration) · Pacinian corpuscles (detect vibration) · Hair follicle receptors (detect movement on the body’s surface) · Ruffini endings (detect heavy…"}, {"id": "q-somato-09", "s": "somato", "k": "bank", "q": "Which skin stretch receptors also assist proprioception? Select all that apply.", "o": ["Ruffini endings", "Pacinian corpuscles", "Merkel disks", "Rods", "Taste buds"], "a": [0, 1, 2], "w": ["Correct. Ruffini endings help.", "Correct. Pacinian corpuscles help.", "Correct. Merkel disks help.", "Rods are retinal.", "Taste buds sense taste."], "m": true, "b": null, "x": false, "r": false, "d": 0.5, "t": "somato.position", "ev": "Stretch receptors in the skin (Ruffini endings, Pacinian corpuscles, and Merkel disks) also assist in proprioception."}, {"id": "q-pain-19", "s": "pain", "k": "bank", "q": "Where does the gate control theory place the pain 'gate'?", "o": ["The substantia gelatinosa of the dorsal horn", "The thalamus", "The hippocampus", "The peripheral receptor"], "a": [0], "w": ["Correct. The substantia gelatinosa in the dorsal horn acts as the gate.", "The thalamus relays later.", "The hippocampus is memory.", "Receptors start the signal; they aren't the gate."], "m": false, "b": null, "x": false, "r": false, "d": 0.4, "t": "pain.gate", "ev": "According to the gate control theory, peripheral receptors generating impulses along the primary afferent neurons enter the spinal cord in the substantia gelatinosa of the dorsal horn, serving as a gate, regulating the transmission of pain impulses."}, {"id": "q-pain-20", "s": "pain", "k": "bank", "q": "During modulation, which substances inhibit pain transmission? Select all that apply.", "o": ["Serotonin", "Norepinephrine", "Endorphins", "Substance P", "Bradykinin"], "a": [0, 1, 2], "w": ["Correct. Serotonin slows the release of nociceptive neurotransmitters.", "Correct. Norepinephrine does too.", "Correct. Endorphins do too.", "Substance P is algesic; it causes pain.", "Bradykinin is algesic."], "m": true, "b": null, "x": false, "r": false, "d": 0.5, "t": "pain.opioid", "ev": "…stimuli result from activation of inhibitory processes · Serotonin, norepinephrine, and endorphins · Inhibit the transmission of the pain impulse by slowing the release of nociceptive neurotransmitters · Perception of the pain response · Involves the sensory (primary somatosensory cortex), emotional (limbic system…"}, {"id": "q-pain-21", "s": "pain", "k": "bank", "q": "Which steps belong to the processes of nociception? Select all that apply.", "o": ["Transduction", "Transmission", "Perception", "Modulation", "Accommodation"], "a": [0, 1, 2, 3], "w": ["Correct. Transduction converts the stimulus to a nerve impulse.", "Correct. Transmission carries it to the brain.", "Correct. Perception is awareness of pain.", "Correct. Modulation changes the signal.", "Accommodation is a lens term."], "m": true, "b": null, "x": false, "r": false, "d": 0.4, "t": "pain.nociception", "ev": "BOX 12.1 Processes of Nociception · Transduction of noxious stimuli into a nerve impulse and depolarization of the nerve stimulates the conduction of the sensory impulse · The electrical impulses promote the release of algesic (pain-causing) substances, including substa…"}, {"id": "q-pain-22", "s": "pain", "k": "bank", "q": "An infant needs an immunization. Which comfort measures have the best evidence? Select all that apply.", "o": ["Swaddling", "Rocking and holding", "Nonnutritive sucking on a pacifier", "Leaving the infant alone to settle", "Ice on the skin for 10 minutes"], "a": [0, 1, 2], "w": ["Correct. Swaddling is on the evidence list.", "Correct. Rocking and holding are on the list.", "Correct. Nonnutritive sucking is on the list.", "Not a comfort measure.", "Not on the book's list."], "m": true, "b": null, "x": false, "r": false, "d": 0.4, "t": "pain.newborn", "ev": "The nonpharmacologic interventions with the best evidence in the reduction of pain in infants include the behavioral strategies of nonnutritive sucking (e.g., pacifier), swaddling, rocking, and holding."}, {"id": "q-pain-23", "s": "pain", "k": "bank", "q": "Which drug classes are mainstays for fibromyalgia pain? Select all that apply.", "o": ["Analgesics", "Antidepressants", "Anticonvulsants", "Muscle relaxants", "Antibiotics"], "a": [0, 1, 2, 3], "w": ["Correct. Analgesics are a mainstay.", "Correct. Antidepressants are a mainstay.", "Correct. Anticonvulsants are a mainstay.", "Correct. Muscle relaxants are a mainstay.", "There's no infection to treat."], "m": true, "b": null, "x": false, "r": false, "d": 0.4, "t": "pain.drugs", "ev": "Treatment with analgesics, antidepressants, anticonvulsants, and muscle relaxants are the mainstays of pharmacologic management of fibromyalgia."}, {"id": "q-pain-24", "s": "pain", "k": "bank", "q": "Rubbing a bumped elbow eases the pain. Which fibers 'close the gate'?", "o": ["Large type A-beta and A-alpha fibers", "Type C fibers", "Type A-delta fibers", "Autonomic fibers"], "a": [0], "w": ["Correct. Large A-beta and A-alpha fibers inhibit pain transmission at the gate.", "C fibers carry slow pain.", "A-delta fibers carry fast, sharp pain.", "Not the gate fibers."], "m": false, "b": null, "x": false, "r": false, "d": 0.5, "t": "pain.fibers", "ev": "The gate control theory proposes that stimulation of the large type A-beta and type A-alpha inhibitory fibers “close the gate” at the substantia gelatinosa, preventing crossover and inhibiting pain impulse conduction along with type A-delta and type C fibers, diminishing pain perception."}, {"id": "q-pain-25", "s": "pain", "k": "bank", "q": "A client with an amputated leg feels pain in the missing foot. What happens in the spinal cord?", "o": ["Spinal cord sensory neurons become hyperactive", "The gate stays closed", "Endorphins are overproduced", "Nociception stops completely"], "a": [0], "w": ["Correct. With phantom pain, spinal sensory neurons are hyperactive.", "An open, overactive signal drives it.", "Not the book's mechanism.", "Pain is still produced."], "m": false, "b": null, "x": false, "r": false, "d": 0.5, "t": "pain.theory", "ev": "With phantom pain, spinal cord sensory neurons are hyperactive."}, {"id": "q-vision1-12", "s": "vision1", "k": "bank", "q": "Which part of the retina handles central vision, color and fine detail?", "o": ["The macula", "The peripheral retina", "The optic disc", "The iris"], "a": [0], "w": ["Correct. The macula handles central vision, color and detail.", "The periphery is rod-rich for low light.", "The optic disc has no photoreceptors.", "The iris sets pupil size."], "m": false, "b": null, "x": false, "r": false, "d": 0.3, "t": "vision1.retina", "ev": "The center of the retina, the macula, is the area responsible for central vision, color vision, and fine detail."}, {"id": "q-vision1-13", "s": "vision1", "k": "bank", "q": "In most glaucoma, why does IOP rise?", "o": ["The trabecular network that drains aqueous humor becomes clogged", "Too little aqueous humor is made", "The lens becomes cloudy", "The retina detaches"], "a": [0], "w": ["Correct. An obstructed trabecular network keeps aqueous humor from draining.", "Under-production would lower IOP.", "That's a cataract.", "Not the IOP mechanism."], "m": false, "b": null, "x": false, "r": false, "d": 0.4, "t": "vision1.aqueous", "ev": "The trabecular network draining the aqueous humor becomes obstructed or “clogged,” causing an increase in IOP in most cases."}, {"id": "q-vision1-14", "s": "vision1", "k": "bank", "q": "Both of a child's eyes are red with thick, sticky discharge. Which type of conjunctivitis is most likely?", "o": ["Bacterial", "Viral", "Allergic", "Glaucoma"], "a": [0], "w": ["Correct. Bacterial conjunctivitis usually affects both eyes with heavy discharge.", "Viral usually affects one eye with watering.", "Allergic also hits both eyes, but with itching and tearing, not heavy discharge.", "Glaucoma isn't conjunctivitis."], "m": false, "b": null, "x": false, "r": false, "d": 0.5, "t": "vision1.protect", "ev": "…th excessive eye watering and a small amount of discharge · Bacterial conjunctivitis · Usually affects both eyes · Associated with heavy discharge · Allergic conjunctivitis · Usually affects both eyes · Associated with itching, redness, and excessive tearing · A cataract is a medical condition characterized by progress…"}, {"id": "q-vision2-17", "s": "vision2", "k": "bank", "q": "Which chart does the book name for testing distance vision?", "o": ["Snellen chart or E chart", "Amsler grid", "Ishihara plates", "Tonometer"], "a": [0], "w": ["Correct. Far vision is tested with a Snellen or E chart.", "An Amsler grid tests macular vision.", "Ishihara tests color.", "Tonometry measures IOP."], "m": false, "b": null, "x": false, "r": false, "d": 0.3, "t": "vision2.screen", "ev": "Evaluation of far distances is accomplished by using a standardized eye chart, such as the Snellen chart or E chart."}, {"id": "q-hearing-19", "s": "hearing", "k": "bank", "q": "A client's hearing loss can't be helped by a hearing aid. What does the book say about cochlear implants?", "o": ["They are surgically placed behind the ear", "They amplify sound like a hearing aid", "They are worn only at night", "They replace the tympanic membrane"], "a": [0], "w": ["Correct. Cochlear implants are surgically placed behind the ear and stimulate the nerve directly.", "Hearing aids amplify; implants bypass damaged hair cells.", "Not how they're used.", "They don't replace the eardrum."], "m": false, "b": null, "x": false, "r": false, "d": 0.3, "t": "hearing.tx", "ev": "Cochlear implants are artificial devices surgically placed behind the ear."}, {"id": "q-hearing-20", "s": "hearing", "k": "bank", "q": "A child's otoscope exam shows a gray tympanic membrane with fluid behind it. What is this?", "o": ["Otitis media with effusion", "Barotrauma", "Ménière disease", "Presbycusis"], "a": [0], "w": ["Correct. Middle ear fluid with a gray TM is otitis media with effusion.", "Barotrauma follows pressure change.", "Ménière affects the inner ear.", "Presbycusis is age-related hearing loss."], "m": false, "b": null, "x": false, "r": false, "d": 0.4, "t": "hearing.mid", "ev": "B.Otitis media with effusion reveals middle ear fluid with a gray tympanic membrane."}, {"id": "q-other-11", "s": "other", "k": "bank", "q": "A client has lost her sense of smell after a cold. What should the nurse expect her to report first?", "o": ["Food tastes bland, since smell drives most of flavor", "Ringing in the ears", "Double vision", "Loss of balance"], "a": [0], "w": ["Correct. Smell has the greatest influence on flavor, so food tastes flat.", "That's tinnitus.", "Not linked.", "Not linked."], "m": false, "b": null, "x": false, "r": false, "d": 0.4, "t": "other.smell", "ev": "Of these, the olfactory stimulation of the sense of smell has the greatest influence."}, {"id": "q-other-12", "s": "other", "k": "bank", "q": "Which are basic taste qualities? Select all that apply.", "o": ["Savory (umami)", "Sweet", "Salty", "Spicy", "Cold"], "a": [0, 1, 2], "w": ["Correct. Umami is a taste quality.", "Correct. Sweet is a taste quality.", "Correct. Salty is a taste quality.", "Spicy is pain/heat, not taste.", "Temperature isn't a taste."], "m": true, "b": null, "x": false, "r": false, "d": 0.3, "t": "other.taste", "ev": "Savory (umami) · Substances must be dissolved in saliva to stimulate a taste response."}, {"id": "q-basics-16", "s": "basics", "k": "bank", "q": "Which client is most at risk for excess circulating hormone because it isn't cleared?", "o": ["A client with kidney disease", "A healthy 20-year-old", "A client on a low-salt diet", "A client with myopia"], "a": [0], "w": ["Correct. Liver or kidney disease impairs hormone metabolism or elimination.", "Normal clearance.", "Not related.", "Not related."], "m": false, "b": null, "x": false, "r": false, "d": 0.4, "t": "basics.metab", "ev": "Impaired ability to metabolize or eliminate hormones, such as with liver or kidney disease, will result in excess circulating hormone."}, {"id": "q-basics-17", "s": "basics", "k": "bank", "q": "The menstrual cycle's monthly hormone rhythm is an example of which secretion pattern?", "o": ["A 28-day cyclic pattern", "A 24-hour diurnal pattern", "Constant secretion", "Ectopic secretion"], "a": [0], "w": ["Correct. Estrogens, progesterone, LH and FSH follow a 28-day cycle.", "Diurnal is a 24-hour pattern, like GH in sleep.", "These hormones swing.", "Ectopic means made by the wrong tissue."], "m": false, "b": null, "x": false, "r": false, "d": 0.3, "t": "basics.patterns", "ev": "For example, a 28-day cyclic secretion of estrogens (estrone, estradiol, and estriol), progesterone, luteinizing hormone, and follicle-stimulating hormone (FSH) regulates the female menstrual cycle."}, {"id": "q-stress-07", "s": "stress", "k": "bank", "q": "Which hormones rise in the stress response? Select all that apply.", "o": ["Cortisol", "Catecholamines (epinephrine, norepinephrine)", "ACTH", "Insulin only", "Melatonin"], "a": [0, 1, 2], "w": ["Correct. Cortisol rises via the HPA axis.", "Correct. Catecholamines rise.", "Correct. ACTH drives cortisol release.", "Insulin isn't the stress hormone.", "Not part of the stress cascade."], "m": true, "b": null, "x": false, "r": false, "d": 0.4, "t": "stress.hpa", "ev": "Stimulation of cortisol and catecholamines in the stress response."}, {"id": "q-thyroid-16", "s": "thyroid", "k": "bank", "q": "A client with Graves disease gets sudden fever, agitation and a racing heart after surgery. What is the priority?", "o": ["Treat it as thyroid storm, a life-threatening emergency, and get help now", "Recheck in 4 hours", "Give a sedative and let her rest", "Start a low-iodine diet"], "a": [0], "w": ["Correct. Thyroid storm is a sudden, severe worsening of hyperthyroidism that may cause death.", "Waiting is unsafe.", "Sedation hides an emergency.", "Diet isn't urgent care."], "m": false, "b": null, "x": false, "r": false, "d": 0.5, "t": "thyroid.graves", "ev": "Thyrotoxic crisis, or thyroid storm, is a sudden, severe worsening of hyperthyroidism that may result in death."}, {"id": "q-r-ovary-14", "s": "r-ovary", "k": "bank", "q": "Matching: which description goes with “menopause”?", "o": ["Ovaries stop responding, estrogen falls, and FSH and LH rise", "Inability to get or keep an erection", "Nonmalignant overgrowth of prostate tissue", "Germ cell tumor of a young man's testis"], "a": [0], "w": ["Correct. Menopause is ovarian failure: estrogen falls and, without negative feedback, FSH and LH climb.", "That's erectile dysfunction.", "That's BPH.", "That's testicular cancer."], "m": false, "b": "Ch 14 #10–14 (matching, rebuilt)", "x": false, "r": false, "d": 0.3, "t": "meno.patho", "ev": "FSH levels rise higher than LH levels; however, both increase at a rate greater than seen during the surge of the menstrual cycle."}, {"id": "q-r-male-11", "s": "r-male", "k": "bank", "q": "Matching: which description goes with “erectile dysfunction”?", "o": ["Inability to achieve or maintain an erection sufficient for satisfactory sexual performance", "Hard, asymmetric, cobblestone prostate", "Absent menstrual periods", "Undescended testis"], "a": [0], "w": ["Correct. That's the book's definition of ED.", "That's prostate cancer on DRE.", "That's amenorrhea.", "That's cryptorchidism."], "m": false, "b": "Ch 14 #10–14 (matching, rebuilt)", "x": false, "r": false, "d": 0.2, "t": "male.ed", "ev": "Erectile dysfunction (ED) is the inability to achieve or maintain an erection sufficient for satisfactory sexual performance."}, {"id": "q-r-male-12", "s": "r-male", "k": "bank", "q": "Matching: which description goes with “benign prostatic hypertrophy (hyperplasia)”?", "o": ["Nonmalignant prostate overgrowth, felt as a soft, enlarged gland", "Malignant germ cells resembling primitive sperm", "Endometrial tissue outside the uterus", "Hard, cobblestone prostate"], "a": [0], "w": ["Correct. BPH is benign overgrowth; benign enlargement feels soft.", "That's a seminoma.", "That's endometriosis.", "That texture points to cancer."], "m": false, "b": "Ch 14 #10–14 (matching, rebuilt)", "x": false, "r": false, "d": 0.2, "t": "male.dre", "ev": "Benign prostatic hyperplasia (BPH) is nonmalignant overgrowth of prostate tissue."}, {"id": "q-r-mcancer-11", "s": "r-mcancer", "k": "bank", "q": "Matching: which description goes with “prostate cancer”?", "o": ["A slow-growing tumor, often found later in life, graded with the Gleason system", "Benign overgrowth in nearly all men over 50", "A fast-growing tumor of men 15 to 35", "Ovarian tumor marked by CA-125"], "a": [0], "w": ["Correct. Prostate cancer is slow-growing, usually diagnosed late in life, and graded by Gleason.", "That's BPH.", "That's testicular cancer.", "That's ovarian cancer."], "m": false, "b": "Ch 14 #10–14 (matching, rebuilt)", "x": false, "r": false, "d": 0.3, "t": "mca.pctx", "ev": "Because prostate cancer is considered a slow-growing tumor and is typically diagnosed later in life, “watchful waiting” may be the treatment of choice in those without clinical symptoms."}, {"id": "q-r-mcancer-12", "s": "r-mcancer", "k": "bank", "q": "Matching: which description goes with “testicular cancer”?", "o": ["A germ cell tumor, most often a seminoma, with cryptorchidism as a major risk", "Benign prostate enlargement", "Excess androgen production from the ovaries", "Loss of estrogen after age 50"], "a": [0], "w": ["Correct. Most testicular cancers are germ cell tumors; seminomas are the most common, and cryptorchidism is a major risk.", "That's BPH.", "That's PCOS.", "That's menopause."], "m": false, "b": "Ch 14 #10–14 (matching, rebuilt)", "x": false, "r": false, "d": 0.3, "t": "mca.tctype", "ev": "Seminomas are the most common type of testicular cancer."}, {"id": "q-r-ovary-15", "s": "r-ovary", "k": "bank", "q": "Which measures from the book help with menopausal hot flashes? Select all that apply.", "o": ["Dress in layers", "Avoid caffeine and alcohol", "Start deep breathing when a hot flash begins", "Eat more spicy food", "Avoid soy products"], "a": [0, 1, 2], "w": ["Correct. Layers let her cool off quickly.", "Correct. Caffeine and alcohol can trigger flashes.", "Correct. Deep breathing at onset is on the book's list.", "The book says avoid spicy foods.", "The book suggests adding soy (phytoestrogens), not avoiding it."], "m": true, "b": null, "x": false, "r": false, "d": 0.3, "t": "meno.nonpharm", "ev": "…ess associated with many common menopause-related concerns: Dress in layers Avoid spicy foods Avoid caffeine and alcohol Initiate deep breathing measures at the start of a hot flash Use relaxation techniques Incorporate soy products containing phytoestrogens in the diet Perform pelvic floor exercises to strengthen musc…"}, {"id": "q-r-basics-12", "s": "r-basics", "k": "bank", "q": "What are the three jobs of the ovaries? Select all that apply.", "o": ["Produce oocytes", "Secrete estrogens and progesterone", "Secrete inhibin for FSH and LH feedback", "Produce testosterone in Leydig cells", "Secrete hCG"], "a": [0, 1, 2], "w": ["Correct. Ovaries make the female gametes.", "Correct. They secrete progesterone and estrogens.", "Correct. Inhibin feeds back on pituitary LH and FSH.", "Leydig cells are in the testes.", "hCG comes from the zygote and placenta."], "m": true, "b": null, "x": false, "r": false, "d": 0.4, "t": "basics.ovary", "ev": "When gonadotropin (FSH, LH) levels increase, FSH acts on the nurse cells (Sertoli cells) within the seminiferous tubules to secrete inhibin, a hormone that alerts the pituitary to suppress secretion of the gonadotropins."}, {"id": "q-r-basics-13", "s": "r-basics", "k": "bank", "q": "Which effects belong to testosterone? Select all that apply.", "o": ["Muscle mass promotion", "Sebaceous gland activity", "Deeper voice from larynx maturation", "Growth of chest and facial hair", "Thinner skin"], "a": [0, 1, 2, 3], "w": ["Correct. Testosterone builds muscle.", "Correct. It drives oil glands, which is why low testosterone means clear skin.", "Correct. It matures the larynx.", "Correct. It drives pubic, chest and facial hair.", "It promotes skin thickness."], "m": true, "b": null, "x": false, "r": false, "d": 0.4, "t": "basics.testo", "ev": "…n metabolism Muscle mass promotion Skin thickness promotion Sebaceous gland activity Growth of pubic, chest, and facial hair Maturation of the larynx, resulting in a deeper voice tone Excess testosterone levels alert the hypothalamus to decrease GnRH secretion and the pituitary to decrease LH production.…"}, {"id": "q-r-basics-14", "s": "r-basics", "k": "bank", "q": "In early pregnancy, which hormone keeps the corpus luteum making estrogen and progesterone?", "o": ["hCG", "FSH", "Inhibin", "Prolactin"], "a": [0], "w": ["Correct. The zygote makes hCG, which keeps the corpus luteum secreting.", "FSH drives follicle growth.", "Inhibin feeds back on FSH.", "Prolactin drives milk production."], "m": false, "b": null, "x": false, "r": false, "d": 0.4, "t": "basics.prog", "ev": "The zygote produces hCG and acts on the corpus luteum to maintain its estrogen and progesterone-secreting functions."}, {"id": "q-r-basics-15", "s": "r-basics", "k": "bank", "q": "Besides a hot tub, which condition does the book say impairs spermatogenesis through scrotal temperature?", "o": ["Cryptorchidism", "Vasectomy", "Hypothyroidism", "BPH"], "a": [0], "w": ["Correct. Undescended testes sit at core temperature, which impairs sperm production.", "A vasectomy blocks transport; it doesn't change heat.", "Not the heat mechanism the book names.", "BPH is a prostate problem."], "m": false, "b": null, "x": false, "r": false, "d": 0.3, "t": "basics.heat", "ev": "Cryptorchidism (failure of the testes to descend into the scrotum) or excessive heat to the scrotum, such as occurs when sitting in a hot tub, can impair spermatogenesis."}, {"id": "q-r-fert-10", "s": "r-fert", "k": "bank", "q": "A couple has had no pregnancy after 18 months. Which finding is a motility (transport) problem rather than an ovulation problem?", "o": ["Adhesions from endometriosis distorting the uterine tubes", "Anovulation from PCOS", "Low FSH", "Menopause"], "a": [0], "w": ["Correct. Adhesions and distorted pelvic structures block egg and sperm transport.", "Anovulation is an ovulation problem.", "Low FSH stops follicle growth; that's ovulation.", "Menopause ends ovulation."], "m": false, "b": null, "x": false, "r": false, "d": 0.6, "t": "fert.cause", "ev": "Endometriosis, a condition involving endometrial tissue that is located outside of the uterus, can result in pelvic adhesions, distortion of pelvic structures, and dysmenorrhea (Fig."}, {"id": "q-r-basics-16", "s": "r-basics", "k": "bank", "q": "A client took a home pregnancy test one day after implantation and it was negative. What should the nurse explain first?", "o": ["hCG appears 2 to 3 days after implantation, so retest in a few days", "She is definitely not pregnant", "Home tests measure progesterone", "She needs an ultrasound today"], "a": [0], "w": ["Correct. hCG shows up 2 to 3 days after implantation, so a test the day after can be falsely negative.", "Too early to rule it out.", "They measure hCG in urine.", "Retesting comes first."], "m": false, "b": null, "x": false, "r": false, "d": 0.5, "t": "basics.preg", "ev": "Human chorionic gonadotropin (hCG) appears within 2 to 3 days after the zygote implants into the endometrium."}, {"id": "q-r-basics-17", "s": "r-basics", "k": "bank", "q": "Which endometrial phase runs from the end of menstruation to ovulation?", "o": ["Proliferative", "Secretory", "Menstrual", "Luteal"], "a": [0], "w": ["Correct. Proliferative runs from the end of menstruation to ovulation, as estrogen rebuilds the lining.", "Secretory runs from ovulation to menstruation.", "Menstrual is the shedding phase.", "Luteal names the ovarian phase, not the endometrial one."], "m": false, "b": null, "x": false, "r": false, "d": 0.3, "t": "basics.endo", "ev": "Wolters Kluwer.) Proliferative (end of menstruation to ovulation) phase: At the end of menstruation, the endometrium is thin."}, {"id": "q-r-basics-18", "s": "r-basics", "k": "bank", "q": "A woman's basal body temperature rises slightly after ovulation. Which hormone causes the rise?", "o": ["Progesterone", "Estrogen", "FSH", "hCG"], "a": [0], "w": ["Correct. The rise at ovulation comes as progesterone levels rise; estrogen doesn't raise temperature.", "Estrogen thins cervical mucus and slows bone resorption, but it doesn't cause the rise.", "FSH drives follicle growth.", "hCG appears only after implantation."], "m": false, "b": null, "x": false, "r": false, "d": 0.4, "t": "basics.estro", "ev": "…months (noting the 0.3 °C (0.5 °F) increase at the time of ovulation as progesterone levels rise), or using a home ovulation predictor kit, which measures the LH surge just prior to ovulation.…"}, {"id": "q-r-fert-11", "s": "r-fert", "k": "bank", "q": "A healthy couple in their late 20s has tried to conceive for 7 months and fears infertility. What should the nurse explain first?", "o": ["Infertility means no pregnancy after 1 year of regular unprotected intercourse, so they don't meet it yet", "They are infertile and need IVF", "Start clomiphene now", "Infertility means no pregnancy after 3 months"], "a": [0], "w": ["Correct. By definition they haven't reached 1 year, so teaching comes before a workup.", "They don't meet the definition yet.", "Drugs aren't the first step.", "The definition is 1 year."], "m": false, "b": null, "x": false, "r": false, "d": 0.4, "t": "fert.def", "ev": "Infertility, defined as the inability to achieve pregnancy after 1 year of unprotected regular intercourse, can result from problems in any of these steps."}, {"id": "q-r-fert-12", "s": "r-fert", "k": "bank", "q": "How can a woman find out when she ovulates? Select all that apply.", "o": ["Watch for cervical mucus changes", "Chart basal body temperature over 2 to 3 months", "Use a home kit that detects the LH surge", "Measure hCG in urine", "Check CA-125"], "a": [0, 1, 2], "w": ["Correct. Cervical mucus changes at ovulation.", "Correct. Basal body temperature rises slightly at ovulation as progesterone rises.", "Correct. Ovulation kits detect the LH surge.", "hCG detects pregnancy, not ovulation.", "CA-125 is an ovarian cancer marker."], "m": true, "b": null, "x": false, "r": false, "d": 0.4, "t": "fert.teach", "ev": "…time of ovulation as progesterone levels rise), or using a home ovulation predictor kit, which measures the LH surge just prior to ovulation.…"}, {"id": "q-r-fert-13", "s": "r-fert", "k": "bank", "q": "Clomiphene hasn't worked. What does the book say may be tried next to induce ovulation?", "o": ["Injectable FSH and LH (gonadotropins)", "Testosterone", "Raloxifene", "Sildenafil"], "a": [0], "w": ["Correct. If clomiphene fails, injectable gonadotropins may be used.", "Testosterone doesn't induce ovulation.", "Raloxifene is for bone.", "Sildenafil treats ED."], "m": false, "b": null, "x": false, "r": false, "d": 0.4, "t": "fert.tx", "ev": "If unsuccessful, injectable FSH and LH (gonadotropins) may be used."}, {"id": "q-r-pelvic-12", "s": "r-pelvic", "k": "bank", "q": "A client with endometriosis has severe pain with her periods. What is this called?", "o": ["Dysmenorrhea", "Dyspareunia", "Amenorrhea", "Menorrhagia"], "a": [0], "w": ["Correct. Dysmenorrhea is severe pain with menstrual periods.", "Dyspareunia is pain with intercourse.", "Amenorrhea is absent periods.", "Menorrhagia is heavy bleeding."], "m": false, "b": null, "x": false, "r": false, "d": 0.3, "t": "pel.endo", "ev": "Dysmenorrhea, or severe pain with menstrual periods, dyspareunia, or pain with intercourse, and other forms of pelvic pain may be present with infections or structural impairment in females."}, {"id": "q-r-ovary-16", "s": "r-ovary", "k": "bank", "q": "A 58-year-old reports weeks of vague abdominal bloating. Why should the nurse take this seriously first?", "o": ["Ovarian cancer is often silent early, and vague bloating may be its only sign", "Bloating is always benign after menopause", "It confirms irritable bowel", "It means she is pregnant"], "a": [0], "w": ["Correct. Ovarian cancer often gives only vague symptoms like bloating, so it is found late.", "Don't dismiss it.", "Nothing confirms IBS.", "Pregnancy is unlikely at 58 and isn't the concern."], "m": false, "b": null, "x": false, "r": false, "d": 0.5, "t": "ov.late", "ev": "Vague abdominal bloating may be noticed in some."}, {"id": "q-r-ovary-17", "s": "r-ovary", "k": "bank", "q": "A client's CA-125 is high at diagnosis. Which statement is correct?", "o": ["It points to epithelial ovarian cancer but has no prognostic value at diagnosis", "It predicts her survival", "It rules out ovarian cancer", "It is a screening test for every woman"], "a": [0], "w": ["Correct. CA-125 suggests epithelial ovarian cancer, but at diagnosis it says nothing about prognosis.", "It has no prognostic significance at diagnosis.", "A high level points toward cancer.", "It's not a general screen."], "m": false, "b": null, "x": false, "r": false, "d": 0.5, "t": "ov.ca125", "ev": "However, CA-125 has no prognostic significance when measured at diagnosis."}, {"id": "q-r-ovary-18", "s": "r-ovary", "k": "bank", "q": "Serous adenocarcinoma, the most common ovarian cancer, resembles which tissue?", "o": ["The epithelium of the uterine tube", "Primitive sperm cells", "Ovarian stromal cells", "Endometrial glands only"], "a": [0], "w": ["Correct. It is an epithelial tumor that resembles uterine tube epithelium.", "That's a seminoma.", "Stromal (sex cord) tumors are a different type.", "Not the book's description."], "m": false, "b": null, "x": false, "r": false, "d": 0.5, "t": "ov.type", "ev": "Serous adenocarcinoma, an epithelial tumor that resembles the epithelial tissue of the uterine tube, is the most common type."}, {"id": "q-r-ovary-19", "s": "r-ovary", "k": "bank", "q": "Which are effects of estrogen deprivation after menopause? Select all that apply.", "o": ["Hot flashes (vasomotor instability)", "Sleep disruption", "Bone demineralization", "Moodiness", "More cervical mucus"], "a": [0, 1, 2, 3], "w": ["Correct. Vasomotor instability is the classic symptom.", "Correct. Sleep is disrupted.", "Correct. Bone demineralizes.", "Correct. Moodiness is listed.", "Vaginal tissues get drier."], "m": true, "b": null, "x": false, "r": false, "d": 0.3, "t": "meno.effects", "ev": "The full effects of estrogen deprivation may not be detected for many years but include menstrual cycle cessation, breast tenderness, moodiness, vasomotor instability (hot flashes), vaginal dryness, sleep disruption, and bone demineralization."}, {"id": "q-r-ovary-20", "s": "r-ovary", "k": "bank", "q": "Which drug does the book say is often used to prevent osteoporosis after menopause?", "o": ["Raloxifene", "Clomiphene", "Sildenafil", "Finasteride"], "a": [0], "w": ["Correct. Raloxifene is a SERM used to prevent postmeno
