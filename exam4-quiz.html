pausal osteoporosis.", "Clomiphene induces ovulation.", "Sildenafil treats ED.", "Not the book's answer."], "m": false, "b": null, "x": false, "r": false, "d": 0.2, "t": "meno.serm", "ev": "The drug raloxifene is often used to prevent osteoporosis in postmenopausal women."}, {"id": "q-r-male-13", "s": "r-male", "k": "bank", "q": "A 60-year-old started a new blood pressure drug a month ago and now reports erectile dysfunction. Which cause should the nurse consider first?", "o": ["The antihypertensive medication", "Testicular cancer", "Cryptorchidism", "Normal aging, no follow-up needed"], "a": [0], "w": ["Correct. Antihypertensives are a listed cause of ED, and the timing fits; report it so the drug can be reviewed.", "Nothing points to a tumor.", "That's a childhood condition and a cancer risk.", "New ED after a new drug deserves follow-up."], "m": false, "b": null, "x": false, "r": false, "d": 0.5, "t": "male.edcause", "ev": "…rap blood within the corpora cavernosa Certain medications: Antihypertensives can inhibit hormone and erectile function DIAGNOSTIC CRITERIA Diagnosis of ED is based on a comprehensive history and physical examination to identify the potential cause.…"}, {"id": "q-r-male-14", "s": "r-male", "k": "bank", "q": "In the research note on lifestyle and ED, how did the researchers explain obesity's effect?", "o": ["Obesity causes chronic oxidative stress and inflammation", "Obesity raises testosterone", "Obesity blocks the urethra", "Obesity has no effect"], "a": [0], "w": ["Correct. They suggested obesity creates chronic oxidative stress and inflammation throughout the body.", "Not their explanation.", "Not their explanation.", "Weight loss and exercise improved erectile function."], "m": false, "b": null, "x": false, "r": false, "d": 0.5, "t": "male.edlife", "ev": "The researchers suggested that obesity resulted in a state of chronic oxidative stress and inflammation throughout the body."}, {"id": "q-r-male-15", "s": "r-male", "k": "bank", "q": "A man with BPH reports frequency, dribbling and hesitancy, and now cannot void at all. What is the nurse's priority?", "o": ["Report it now: complete obstruction causes acute retention", "Encourage more fluids and recheck tomorrow", "Teach pelvic floor exercises", "Reassure him that BPH is benign"], "a": [0], "w": ["Correct. Complete obstruction means acute retention and an absolute inability to urinate; it needs urgent relief.", "More fluid with no outflow worsens it.", "Not the priority with acute retention.", "Benign tissue can still cause a dangerous obstruction."], "m": false, "b": null, "x": false, "r": false, "d": 0.5, "t": "male.bphret", "ev": "Complete obstruction leads to acute urinary retention and an absolute inability to urinate."}, {"id": "q-r-mcancer-13", "s": "r-mcancer", "k": "bank", "q": "A 62-year-old asks what habits raise his prostate cancer risk. Which should the nurse name? Select all that apply.", "o": ["Smoking", "High dietary calcium", "Low fruit intake", "High lycopene intake", "Young age"], "a": [0, 1, 2], "w": ["Correct. Smoking is on the list.", "Correct. High dietary calcium is on the list.", "Correct. Low intake of fruit is on the list.", "Low lycopene is the risk; lycopene protects.", "Risk rises with advancing age."], "m": true, "b": null, "x": false, "r": false, "d": 0.4, "t": "mca.pcrisk", "ev": "Risk factors for prostate cancer include advancing age, family history of prostate cancer, and smoking along with nutritional factors, such as high intake of fats and meat, low intake of lycopene (found primarily in tomato-based products) and fruit, and high dietary calcium."}, {"id": "q-r-mcancer-14", "s": "r-mcancer", "k": "bank", "q": "In the Gleason system, grade 1 cells are:", "o": ["Closest to normal prostate cells", "The most abnormal", "Always metastatic", "Not prostate cells"], "a": [0], "w": ["Correct. Grade 1 resembles normal prostate cells; grade 5 is the most abnormal.", "That's grade 5.", "Grade doesn't prove spread.", "They are prostate cells."], "m": false, "b": null, "x": false, "r": false, "d": 0.3, "t": "mca.gleason", "ev": "Donald Gleason, cells are graded from 1 to 5, with grade 1 cells resembling normal prostate cells and grade 5 cells being the most abnormal."}, {"id": "q-r-mcancer-15", "s": "r-mcancer", "k": "bank", "q": "What does a free PSA test measure?", "o": ["Only unbound PSA", "Only bound PSA", "Total PSA plus CA-125", "Testosterone"], "a": [0], "w": ["Correct. Free PSA measures only the unbound form.", "Bound PSA is the other fraction.", "CA-125 is an ovarian marker.", "Not a hormone test."], "m": false, "b": null, "x": false, "r": false, "d": 0.3, "t": "mca.psa", "ev": "Free PSA measures only the levels of unbound PSA."}, {"id": "q-r-mcancer-16", "s": "r-mcancer", "k": "bank", "q": "A 24-year-old finds a firm testicular lump. Which test confirms the primary tumor?", "o": ["Radical orchiectomy (removal of the testicle)", "Transscrotal needle biopsy", "PSA level", "Watchful waiting"], "a": [0], "w": ["Correct. The book says diagnosis is by exam and radical orchiectomy.", "Needle biopsy through the scrotum is avoided.", "PSA is for prostate.", "Not with a suspected testicular tumor."], "m": false, "b": null, "x": false, "r": false, "d": 0.5, "t": "mca.tc", "ev": "Diagnosis of the primary tumor is through physical examination and radical orchiectomy (removal of the testicle)."}, {"id": "q-r-mcancer-17", "s": "r-mcancer", "k": "bank", "q": "A client had cryptorchidism as a child. How does that change his testicular cancer risk?", "o": ["About 20 to 40 times more likely", "No change", "Slightly lower", "About twice as likely"], "a": [0], "w": ["Correct. The book says 20 to 40 times more likely.", "Cryptorchidism is a major risk factor.", "Risk goes up, not down.", "Much higher than double."], "m": false, "b": null, "x": false, "r": false, "d": 0.4, "t": "mca.tcrisk", "ev": "Those with cryptorchidism are 20 to 40 times more likely to develop testicular cancer."}, {"id": "q-r-mcancer-18", "s": "r-mcancer", "k": "bank", "q": "A 19-year-old asks how to catch testicular cancer early. What should the nurse teach first?", "o": ["Do a testicular self-exam every month and report any lump", "Get a yearly PSA", "Wait for pain before seeing anyone", "Screening only starts at 50"], "a": [0], "w": ["Correct. Monthly self-exam is the teaching; a painless lump is the usual first sign.", "PSA is for prostate.", "Testicular tumors are often painless.", "Peak risk is in young men."], "m": false, "b": null, "x": false, "r": false, "d": 0.3, "t": "mca.tcteach", "ev": "DIAGNOSTIC CRITERIA Self-testicular examination is an important aspect of early detection and should be practiced by all males on a monthly basis."}, {"id": "q-a-systems-13", "s": "a-systems", "k": "bank", "q": "An 86-year-old is on IV fluids and diuretics. Body composition explains why she dehydrates fast. Which changes does the book link to lower total body water? Select all that apply.", "o": ["Less muscle mass", "More fat mass", "Weaker kidney control of sodium and water", "More lean body mass", "Higher total body water from fat"], "a": [0, 1, 2], "w": ["Correct. Muscle holds water, and muscle mass falls with age.", "Correct. Fat rises with age, and fat holds little water.", "Correct. The kidney's sodium and water regulation weakens, which adds to the loss.", "Lean body mass falls with age; it doesn't rise.", "Fat raises body mass, not body water."], "m": true, "b": null, "x": false, "r": false, "d": 0.5, "t": "sys.water", "ev": "These changes contribute to a decrease in total body water, further enhanced by the kidney’s diminished sodium and water balance regulation, which is important for maintaining extracellular fluid volume and tonicity."}, {"id": "q-a-systems-14", "s": "a-systems", "k": "bank", "q": "Which structural brain changes are typical of aging? Select all that apply.", "o": ["Decreased brain mass", "Enlarged cerebral ventricles", "Fewer dendrites and synapses", "Decreased myelin", "Faster nerve conduction"], "a": [0, 1, 2, 3], "w": ["Correct. Brain mass decreases.", "Correct. Ventricles enlarge as tissue shrinks.", "Correct. Neurons, dendritic processes and synapses all decrease.", "Correct. Myelin decreases.", "Conduction slows; it doesn't speed up."], "m": true, "b": null, "x": false, "r": false, "d": 0.4, "t": "sys.neuro", "ev": "Typical structural changes include: Decrease in brain mass Enlargement of cerebral ventricles Decrease in number of neurons, dendritic processes, and synapses Decrease in myelin Altered production of neurotransmitters Histologically, in the brain, findings of lipofuscin pigment in nerve cells and amyloid in the vascul…"}, {"id": "q-a-systems-15", "s": "a-systems", "k": "bank", "q": "An older adult on long-term prednisone has a slow-healing skin tear. Which factors from the book explain the delay? Select all that apply.", "o": ["Steroid medication lowering immune function", "Loss of subcutaneous fat", "Less elastic collagen", "Thicker epidermis", "More dermal capillaries"], "a": [0, 1, 2], "w": ["Correct. Steroids for chronic illness reduce immune function and slow healing.", "Correct. Lost subcutaneous fat is a typical change that impairs healing.", "Correct. Collagen elasticity decreases.", "The epidermis atrophies; it doesn't thicken.", "Supporting capillaries atrophy."], "m": true, "b": null, "x": false, "r": false, "d": 0.5, "t": "sys.heal", "ev": "Impaired wound healing may result as a response to altered immune function due to aging or from decreased function induced by medications for chronic illness, such as steroids."}, {"id": "q-a-progeria-06", "s": "a-progeria", "k": "bank", "q": "Children with progeria develop which conditions usually seen in older adults? Select all that apply.", "o": ["Atherosclerosis", "Osteoporosis", "Hypertension", "Senility", "Cataracts"], "a": [0, 1, 2], "w": ["Correct. Atherosclerosis develops, and it drives the early deaths.", "Correct. Osteoporosis develops.", "Correct. Hypertension develops.", "Progeria is not linked to senility.", "Progeria is not linked to cataracts or extra tumors."], "m": true, "b": null, "x": false, "r": false, "d": 0.5, "t": "prog.death", "ev": "…al dysplasia Incomplete sexual maturation Affected children often develop osteoporosis, atherosclerosis, fibrosis, hypertension, and arthritis.…"}, {"id": "q-a-progeria-07", "s": "a-progeria", "k": "bank", "q": "How is progeria diagnosed?", "o": ["History and physical exam showing the characteristic signs", "Brain biopsy", "A high thyroxine level", "Chest x-ray"], "a": [0], "w": ["Correct. The diagnosis rests on history and exam findings; hyaluronic acid levels can give clues.", "Biopsy isn't how it's diagnosed.", "Thyroxine isn't the marker; hyaluronic acid is.", "Imaging isn't diagnostic."], "m": false, "b": null, "x": false, "r": false, "d": 0.4, "t": "prog.dx", "ev": "DIAGNOSIS The diagnosis of progeria is based on history and physical exam noting the characteristic signs and symptoms."}, {"id": "q-a-ad-11", "s": "a-ad", "k": "bank", "q": "Where do senile plaques form in Alzheimer disease?", "o": ["Hippocampus and cerebral cortex", "Cerebellum and pons", "Spinal cord", "Basal ganglia only"], "a": [0], "w": ["Correct. Plaques form in the hippocampus and cortex, which hits memory and decision-making.", "Those aren't the sites the book names.", "Not the spinal cord.", "Not the basal ganglia."], "m": false, "b": null, "x": false, "r": false, "d": 0.3, "t": "ad.where", "ev": "In Alzheimer disease, senile plaques form in the hippocampus and cerebral cortex and impact memory and decision-making."}, {"id": "q-a-theory-08", "s": "a-theory", "k": "bank", "q": "Which theory links aging to cell damage from reactive oxygen species?", "o": ["Free radical theory", "Developmental theory", "Immunologic theory", "Caloric restriction theory"], "a": [0], "w": ["Correct. Free radical theory ties ROS production to cell damage and life expectancy.", "Developmental theories point to genetics.", "Immunologic theory points to falling immune function.", "Caloric restriction is an experimental finding, not this theory."], "m": false, "b": null, "x": false, "r": false, "d": 0.3, "t": "a-theory", "ev": "The free radical theory of aging links cellular damage with the production of reactive oxygen species (ROS)."}, {"id": "q-a-theory-09", "s": "a-theory", "k": "bank", "q": "Which statement matches the book's definition of senescence?", "o": ["Postmaturational processes that lessen homeostasis and raise vulnerability", "The maximum length of time a person lives", "The age at which 50% of a population survives", "Accelerated aging in children"], "a": [0], "w": ["Correct. Senescence means the processes after maturity that reduce homeostasis.", "That's life span.", "That's life expectancy.", "That's progeria."], "m": false, "b": null, "x": false, "r": false, "d": 0.4, "t": "theory.terms", "ev": "Senescence is often used interchangeably with aging and refers to postmaturational processes that lead to diminished homeostasis and increased vulnerability."}, {"id": "q-a-systems-16", "s": "a-systems", "k": "bank", "q": "An older adult's labs show a low T3 and an elevated TSH. What should the nurse do first?", "o": ["Recognize it as a typical age-related pattern and report it with the full picture", "Hold all medications", "Expect hyperthyroidism", "Give a dose of levothyroxine"], "a": [0], "w": ["Correct. Low T3 with high TSH is the typical thyroid change in older adults; report it with symptoms for the provider to judge.", "Nothing here calls for holding every drug.", "Low T3 with high TSH is not a hyperthyroid picture.", "A nurse doesn't start thyroid hormone without an order."], "m": false, "b": null, "x": false, "r": false, "d": 0.5, "t": "sys.thyroid", "ev": "Decreased T3 levels and elevated thyroid-stimulating hormone (TSH) levels characterize typical thyroid function alterations in older populations."}, {"id": "q-a-systems-17", "s": "a-systems", "k": "bank", "q": "Which renal changes are characteristic of aging? Select all that apply.", "o": ["Reduced renal blood flow", "Decreased glomerular filtration rate", "Reduced renin and aldosterone", "Increased renal mass", "Improved proximal tubule function"], "a": [0, 1, 2], "w": ["Correct. Renal blood flow falls.", "Correct. GFR falls, so drugs clear more slowly.", "Correct. Renin and aldosterone fall.", "Renal mass is reduced.", "Proximal tubule function decreases."], "m": true, "b": null, "x": false, "r": false, "d": 0.4, "t": "sys.renal", "ev": "…rate Reduced renal mass Decreased proximal tubule function Reduced renin and aldosterone levels Reduction in nephron number may alter urine concentration, placing additional importance on the regulation of total water balance.…"}, {"id": "q-a-systems-18", "s": "a-systems", "k": "bank", "q": "Which measure from the book may lessen constipation in an older adult?", "o": ["Adequate fluid intake", "Restricting fluids", "Increasing rectal compliance", "Bed rest"], "a": [0], "w": ["Correct. Adequate fluid intake supports volume and may lessen constipation.", "Restricting fluids makes stool harder.", "Higher rectal compliance is a cause, not a fix.", "Inactivity worsens constipation."], "m": false, "b": null, "x": false, "r": false, "d": 0.3, "t": "sys.gi", "ev": "Assurance of adequate fluid intake is essential to volume regulation and may lessen the incidence of constipation."}, {"id": "q-a-bone-12", "s": "a-bone", "k": "bank", "q": "A 68-year-old woman is losing bone. Which description fits menopausal (not senile) bone loss?", "o": ["Driven by IL-6 because protective ovarian hormones fall", "Caused by too much osteoblast activity", "Seen only in men over 80", "Caused by high estrogen"], "a": [0], "w": ["Correct. Menopausal bone loss is cytokine (IL-6) induced from low ovarian hormones.", "Osteoblasts build bone.", "Menopausal loss affects women after menopause.", "It's the loss of estrogen that drives it."], "m": false, "b": null, "x": false, "r": false, "d": 0.5, "t": "bone.phase", "ev": "Menopausal bone loss is cytokine induced (interleukin-6 [IL-6]), occurring due to inadequate levels of protective ovarian hormones."}, {"id": "q-a-systems-19", "s": "a-systems", "k": "bank", "q": "Which are causes of sarcopenia? Select all that apply.", "o": ["Decreased physical activity", "Nervous system changes", "Protein undernutrition", "Gaining type II fibers", "High-protein diet"], "a": [0, 1, 2], "w": ["Correct. Inactivity drives muscle loss.", "Correct. Central and peripheral nervous system changes contribute.", "Correct. Protein undernutrition contributes.", "Type II fibers are lost, not gained.", "Protein protects muscle."], "m": true, "b": null, "x": false, "r": false, "d": 0.4, "t": "sys.muscle", "ev": "Causes of sarcopenia include: Decreased physical activity Changes in the nervous system (central and peripheral) Protein undernutrition Faster-contracting muscle fibers (type II) are lost more quickly compared to the slower-contracting fibers (type I), leading to loss of isometric contractile force."}, {"id": "q-a-bone-13", "s": "a-bone", "k": "bank", "q": "A DEXA T score is −2.8. How does the nurse read it?", "o": ["Osteoporosis", "Normal bone density", "Osteopenia", "A secondary cause is proven"], "a": [0], "w": ["Correct. Under the WHO guidelines, a T score below −2.5 is osteoporosis.", "Normal is above −1.0.", "Osteopenia is −1.0 to −2.5.", "That's what a low Z score suggests, not a T score."], "m": false, "b": null, "x": false, "r": false, "d": 0.4, "t": "bone.zscore", "ev": "…e than −1.0 Osteopenia Bone mass between 833 and 648 mg/cm2 T score −1.0 to −2.5 Osteoporosis Bone mass less than 648 mg/cm2 T score less than −2.5 A comparison of an individual T score to persons of the same age, sex, and weight is documented using a Z score.…"}, {"id": "q-a-bone-14", "s": "a-bone", "k": "bank", "q": "A client with osteoporosis asks what helps prevent more bone loss. What should the nurse teach first?", "o": ["Regular weight-bearing exercise with enough calcium and vitamin D", "Strict bed rest", "Stop all calcium", "Avoid all exercise"], "a": [0], "w": ["Correct. Weight-bearing exercise plus calcium and vitamin D are core prevention steps.", "Immobility speeds bone loss.", "Calcium protects bone.", "Inactivity speeds bone loss."], "m": false, "b": null, "x": false, "r": false, "d": 0.4, "t": "bone.risk", "ev": "Engaging in regular weight-bearing exercise 3."}, {"id": "q-a-bone-15", "s": "a-bone", "k": "bank", "q": "A client with known osteoporosis reports new back pain and is shorter than last year. What is the priority concern?", "o": ["A vertebral fracture", "Normal aging, no action", "Muscle strain only", "Hyperthyroidism"], "a": [0], "w": ["Correct. Spongy bone in the vertebrae makes spinal fractures a key sequela; height loss and pain flag one.", "Pain with height loss needs follow-up.", "Don't assume strain when fracture is likely.", "Nothing points to thyroid disease."], "m": false, "b": null, "x": false, "r": false, "d": 0.5, "t": "bone.silent", "ev": "Because of the high quantity of spongy bone in the vertebrae, spinal fractures represent significant sequelae of osteoporosis."}, {"id": "q-a-ad-12", "s": "a-ad", "k": "bank", "q": "Which findings support a diagnosis of Alzheimer disease while the client is alive?", "o": ["Clinical presentation and history combined with other testing", "A single blood test that confirms it", "A normal memory exam", "Chest x-ray"], "a": [0], "w": ["Correct. In life, testing plus presentation and history support the diagnosis; definitive proof needs autopsy.", "No single blood test confirms it.", "Normal memory doesn't support it.", "Imaging of the chest is irrelevant."], "m": false, "b": null, "x": false, "r": false, "d": 0.5, "t": "ad.dx", "ev": "Other testing can be done that, when combined with clinical presentation and history, may support a diagnosis of Alzheimer disease."}, {"id": "q-a-ad-13", "s": "a-ad", "k": "bank", "q": "A client starts a cholinesterase inhibitor for Alzheimer disease. Which neurotransmitter is the drug protecting?", "o": ["Acetylcholine", "Dopamine", "Serotonin", "GABA"], "a": [0], "w": ["Correct. ChEIs make up for depleted acetylcholine in the cortex and hippocampus.", "Dopamine loss is Parkinson's, not this drug's target.", "Not serotonin.", "Not GABA."], "m": false, "b": null, "x": false, "r": false, "d": 0.3, "t": "ad.tx", "ev": "The mainstay of pharmacologic therapy for patients is the use of centrally acting cholinesterase inhibitors (ChEIs) to compensate for the depletion of acetylcholine (ACh) in the cerebral cortex and hippocampus."}, {"id": "q-a-ad-14", "s": "a-ad", "k": "bank", "q": "A client forgets familiar words and where everyday objects are, but only the client notices. Which stage is this?", "o": ["Stage 2", "Stage 4", "Stage 6", "Stage 7"], "a": [0], "w": ["Correct. Stage 2 is mild impairment evident only to self: memory lapses and forgotten words.", "Stage 4 is moderate decline others clearly see.", "Stage 6 involves wandering and help with toileting.", "Stage 7 is very severe decline."], "m": false, "b": null, "x": false, "r": false, "d": 0.5, "t": "ad.stage", "ev": "…Institutes of Health.) Stage 1 Minimal cognitive impairment Stage 2 Mild cognitive impairment (evident only to self) Memory lapse Forgetfulness of familiar words Altered memory of location of everyday objects Stage 3 Mild cognitive impairment (evident among friends, family, coworkers) Difficulty with word or name findi…"}, {"id": "q-a-ad-15", "s": "a-ad", "k": "bank", "q": "Which genes are definitively linked to Alzheimer disease? Select all that apply.", "o": ["Amyloid precursor protein (APP)", "Presenilin-1 (PS1)", "Presenilin-2 (PS2)", "BRCA1", "LMNA"], "a": [0, 1, 2], "w": ["Correct. APP is a definite AD gene.", "Correct. PS1 is a definite AD gene.", "Correct. PS2 is a definite AD gene.", "BRCA1 is a breast/ovarian cancer gene.", "LMNA is the progeria gene."], "m": true, "b": null, "x": false, "r": false, "d": 0.5, "t": "ad.risk", "ev": "…myloid precursor protein (APP) gene Presenilin-1 (PS1) gene Presenilin-2 (PS2) gene Mutations in these genes result in proteins that have neurotoxic properties and promote neuronal death, synapse loss, and the formation of neurofibrillary tangles and senile plaques.…"}, {"id": "q-a-ad-16", "s": "a-ad", "k": "bank", "q": "A caregiver of a client with moderate Alzheimer disease asks how to make the home safer. What should the nurse suggest first?", "o": ["A careful home evaluation to prevent falls, burns and accidents", "Rearrange the furniture often to keep the client alert", "Leave the client alone to build independence", "Use restraints at night"], "a": [0], "w": ["Correct. The book says a home evaluation helps prevent falls, burns and accidents.", "Changes in layout raise confusion and falls.", "Unsupervised time is unsafe.", "Restraints raise injury risk."], "m": false, "b": null, "x": false, "r": false, "d": 0.4, "t": "ad.nurse", "ev": "A careful evaluation of the home environment can help with preventing falls, burns, and other household accidents."}, {"id": "q-a-progeria-08", "s": "a-progeria", "k": "bank", "q": "Which therapy goals does the book list for progeria? Select all that apply.", "o": ["Improve feeding and nutrition", "Increase activity and joint mobility", "Monitor vascular disease", "Support the family", "Cure it with a bone marrow transplant"], "a": [0, 1, 2, 3], "w": ["Correct. Feeding and nutrition are a goal.", "Correct. Activity and joint mobility are a goal.", "Correct. Vascular disease is monitored, since it drives mortality.", "Correct. Family support is part of care.", "There's no curative transplant."], "m": true, "b": null, "x": false, "r": false, "d": 0.4, "t": "prog.tx", "ev": "Therapy is aimed at improving feeding and nutritional intake, increasing, activity and joint mobility, monitoring of vascular disease, and providing family support."}], "cards": [{"id": "cd-dz-c12-fibro-etiology", "ch": "12", "s": "other", "topic": "Fibromyalgia", "f": "Fibromyalgia · causes?", "b": "No well-defined cause; Mix of genetics, development, triggering events, nervous-system and emotional factors; Runs in families (genetic predisposition); Possible epigenetic link: DNA methylation changes in women", "k": "table"}, {"id": "cd-dz-c12-fibro-patho", "ch": "12", "s": "other", "topic": "Fibromyalgia", "f": "Fibromyalgia · what goes wrong?", "b": "No proven muscle damage or inflammation; Nervous system becomes over-sensitive to painful (noxious) stimuli; Serotonin ↓ in some people → pain, poor sleep, depression, anxiety; Brain changes: altered gray-matter volume and cerebral blood flow (cause or effect unknown); Ropy muscle bands may press on vessels and nerves → referred pain", "k": "table"}, {"id": "cd-dz-c12-fibro-signs", "ch": "12", "s": "other", "topic": "Fibromyalgia", "f": "Fibromyalgia · signs (objective)?", "b": "Tender points: pain at ≥ 12 of 18 sites on exam; Trigger points / ropy bands (tight, tender muscle bands); Stiffness in the neck, shoulders, back and hips", "k": "table"}, {"id": "cd-dz-c12-fibro-symptoms", "ch": "12", "s": "other", "topic": "Fibromyalgia", "f": "Fibromyalgia · symptoms (what they report)?", "b": "Widespread chronic pain; Fatigue; Nonrestorative sleep; Trouble concentrating; Depression, anxiety", "k": "table"}, {"id": "cd-dz-c12-fibro-labs", "ch": "12", "s": "other", "topic": "Fibromyalgia", "f": "Fibromyalgia · labs & diagnosis?", "b": "No diagnostic test; it's a diagnosis of exclusion; Pain at ≥ 12 of 18 tender points; Pain and fatigue ≥ 3 months; Tests to rule out hypothyroidism and hyperparathyroidism", "k": "table"}, {"id": "cd-dz-c12-fibro-risk", "ch": "12", "s": "other", "topic": "Fibromyalgia", "f": "Fibromyalgia · risk factors?", "b": "Women: 7× more often than men; Highest prevalence in women in their 60s–70s; Family history", "k": "table"}, {"id": "cd-dz-c12-fibro-comp", "ch": "12", "s": "other", "topic": "Fibromyalgia", "f": "Fibromyalgia · complications?", "b": "Depression and anxiety; Disrupted daily life from chronic pain and fatigue", "k": "table"}, {"id": "cd-dz-c12-fibro-tx", "ch": "12", "s": "other", "topic": "Fibromyalgia", "f": "Fibromyalgia · treatment?", "b": "CBT + stress reduction + sleep medication work best together; Gentle exercise and stretching; Tricyclic antidepressants (amitriptyline, cyclobenzaprine) are first-line; SNRIs (serotonin–norepinephrine reuptake inhibitors); Antiseizure drugs: gabapentin, pregabalin; NSAIDs help mainly when combined with a tricyclic; Heat, cold, massage, acupuncture, yoga, biofeedback", "k": "table"}, {"id": "cd-dz-c12-fibro-nurse", "ch": "12", "s": "other", "topic": "Fibromyalgia", "f": "Fibromyalgia · nursing priorities?", "b": "Assess pain, sleep quality and mood together; Teach daily gentle stretching and exercise; Hold stretches about 30 seconds, repeated about 5 times, daily; Screen for sleep problems (eg, sleep apnea) and teach good sleep hygiene", "k": "table"}, {"id": "cd-dz-c12-migraine-etiology", "ch": "12", "s": "other", "topic": "Migraine headache", "f": "Migraine headache · causes?", "b": "Exact cause unclear; strong genetic focus; Triggers: hormone changes, anxiety, stress, missed meals, lack of sleep; Fluctuating estrogen is a potent trigger (menstrual migraine)", "k": "table"}, {"id": "cd-dz-c12-migraine-patho", "ch": "12", "s": "other", "topic": "Migraine headache", "f": "Migraine headache · what goes wrong?", "b": "Cortical spreading depression: wave of depolarization across the cortex → aura; Pain fibers in the meninges fire along the trigeminovascular pathway; Serotonin ↓ → trigeminal nerve releases mediators → blood-vessel changes; CGRP (calcitonin gene–related peptide) drives the pain; Repeated attacks sensitize neurons → episodic can become chronic", "k": "table"}, {"id": "cd-dz-c12-migraine-signs", "ch": "12", "s": "other", "topic": "Migraine headache", "f": "Migraine headache · signs (objective)?", "b": "Vomiting; Focal neuro signs during aura (visual, motor); Exam usually normal between attacks", "k": "table"}, {"id": "cd-dz-c12-migraine-symptoms", "ch": "12", "s": "other", "topic": "Migraine headache", "f": "Migraine headache · symptoms (what they report)?", "b": "One-sided, pulsing, throbbing headache, 4–72 h; Light and sound sensitivity; Nausea; Prodrome: mood change, food cravings, yawning, neck stiffness; Aura 15–30 min before (about 15% of people); Postdrome: fatigue, poor concentration, mood change", "k": "table"}, {"id": "cd-dz-c12-migraine-labs", "ch": "12", "s": "other", "topic": "Migraine headache", "f": "Migraine headache · labs & diagnosis?", "b": "Diagnosed by history and physical; ≥ 5 attacks lasting 4–72 h (migraine without aura); CT or MRI if onset is sudden, to rule out meningitis, tumor or high ICP; Thunderclap headache (peaks within seconds) is a red flag, not migraine", "k": "table"}, {"id": "cd-dz-c12-migraine-risk", "ch": "12", "s": "other", "topic": "Migraine headache", "f": "Migraine headache · risk factors?", "b": "Women; Family/genetic predisposition; Stress, hormone shifts, missed meals or sleep", "k": "table"}, {"id": "cd-dz-c12-migraine-comp", "ch": "12", "s": "other", "topic": "Migraine headache", "f": "Migraine headache · complications?", "b": "Episodic migraines can transform into chronic migraine; Major loss of productivity and quality of life; Using acute meds > 2 days/week leads to medication-overuse headache", "k": "table"}, {"id": "cd-dz-c12-migraine-tx", "ch": "12", "s": "other", "topic": "Migraine headache", "f": "Migraine headache · treatment?", "b": "Mild: acetaminophen, NSAIDs, aspirin (first-line); Moderate–severe: triptans (serotonin agonists); nasal/injection work within 15 min; Ergots: dihydroergotamine (DHE-45), ergotamine; Prevention: CGRP inhibitors, topiramate, Botox for chronic; Antiemetics for nausea; Avoid triggers, exercise, quit smoking", "k": "table"}, {"id": "cd-dz-c12-migraine-nurse", "ch": "12", "s": "other", "topic": "Migraine headache", "f": "Migraine headache · nursing priorities?", "b": "Give treatment early, at prodrome or aura, when triptans work best; Dark, quiet room; Teach a trigger diary: food, sleep, stress, cycle; Prevention is indicated with ≥ 2 migraines a month or analgesics > 2×/week; A new or different headache isn't automatically migraine; report thunderclap onset", "k": "table"}, {"id": "cd-dz-c12-om-etiology", "ch": "12", "s": "hearing", "topic": "Otitis media (AOM vs OME)", "f": "Otitis media (AOM vs OME) · causes?", "b": "Usually follows a respiratory infection; Upper-airway viruses and bacteria grow in trapped middle-ear secretions; OME: fluid trapped by auditory-tube blockage, no infection", "k": "table"}, {"id": "cd-dz-c12-om-patho", "ch": "12", "s": "hearing", "topic": "Otitis media (AOM vs OME)", "f": "Otitis media (AOM vs OME) · what goes wrong?", "b": "Respiratory infection → inflamed middle-ear lining → secretions; Auditory (eustachian) tube blocked → negative pressure → fluid (effusion); Trapped fluid = growth medium → infection (AOM); Fluid stops the eardrum vibrating → hearing loss; Pressure can rupture the eardrum", "k": "table"}, {"id": "cd-dz-c12-om-signs", "ch": "12", "s": "hearing", "topic": "Otitis media (AOM vs OME)", "f": "Otitis media (AOM vs OME) · signs (objective)?", "b": "AOM: red, bulging eardrum (tympanic membrane, TM); OME: gray eardrum with fluid behind it; Fever; Swollen lymph nodes around the ear; runny nose; Discharge in canal = possible perforation; white patches = old scars", "k": "table"}, {"id": "cd-dz-c12-om-symptoms", "ch": "12", "s": "hearing", "topic": "Otitis media (AOM vs OME)", "f": "Otitis media (AOM vs OME) · symptoms (what they report)?", "b": "Acute ear pain; Impaired hearing; Infants may just be cranky or have trouble feeding or sleeping", "k": "table"}, {"id": "cd-dz-c12-om-labs", "ch": "12", "s": "hearing", "topic": "Otitis media (AOM vs OME)", "f": "Otitis media (AOM vs OME) · labs & diagnosis?", "b": "Diagnosed by history + otoscope exam; Moderate–severe TM bulging; Mild bulging + new ear pain or red TM; New ear drainage (otorrhea)", "k": "table"}, {"id": "cd-dz-c12-om-risk", "ch": "12", "s": "hearing", "topic": "Otitis media (AOM vs OME)", "f": "Otitis media (AOM vs OME) · risk factors?", "b": "Infants and young children: 75% have ≥ 1 episode by age 3; Recent respiratory infection; Household smoking; Sleeping with a bottle", "k": "table"}, {"id": "cd-dz-c12-om-comp", "ch": "12", "s": "hearing", "topic": "Otitis media (AOM vs OME)", "f": "Otitis media (AOM vs OME) · complications?", "b": "Eardrum perforation (most frequent); Mastoiditis → meningitis, brain abscess, facial palsy; Recurrent AOM: ≥ 3 in 6 months or ≥ 4 in a year; Hearing loss from scarring", "k": "table"}, {"id": "cd-dz-c12-om-tx", "ch": "12", "s": "hearing", "topic": "Otitis media (AOM vs OME)", "f": "Otitis media (AOM vs OME) · treatment?", "b": "Pain management for everyone; Amoxicillin first-line if antibiotics are needed and none in the past 30 days; Switch antibiotics if no response in 48–72 h; OME: no antibiotics (not an infection); Antibiotics: age ≥ 6 mo with severe signs (pain ≥ 48 h or temp ≥ 39 °C (102.2 °F); Ages 6–23 mo, not severe: antibiotics or watchful waiting (shared decision)", "k": "table"}, {"id": "cd-dz-c12-om-nurse", "ch": "12", "s": "hearing", "topic": "Otitis media (AOM vs OME)", "f": "Otitis media (AOM vs OME) · nursing priorities?", "b": "Teach the family the watchful-waiting plan and when to call back (48–72 h); Give acetaminophen or ibuprofen, dosed by weight; Teach: no bottle in bed, smoke-free home, keep vaccines (pneumococcal, flu) current; Report ear drainage (possible perforation) or swelling behind the ear (mastoiditis)", "k": "table"}, {"id": "cd-dz-c12-meniere-etiology", "ch": "12", "s": "hearing", "topic": "Ménière disease", "f": "Ménière disease · causes?", "b": "Too much endolymph (overproduction or poor absorption); Also called endolymphatic hydrops", "k": "table"}, {"id": "cd-dz-c12-meniere-patho", "ch": "12", "s": "hearing", "topic": "Ménière disease", "f": "Ménière disease · what goes wrong?", "b": "Excess endolymph swells the membranous labyrinth (cochlea + vestibular system); Swelling disturbs hearing and balance; Hair cells in cochlea and vestibule progressively degenerate → sensorineural hearing loss; A small rupture of the labyrinth relieves symptoms", "k": "table"}, {"id": "cd-dz-c12-meniere-signs", "ch": "12", "s": "hearing", "topic": "Ménière disease", "f": "Ménière disease · signs (objective)?", "b": "Nystagmus (jerky eye movements); Vomiting; Sensorineural hearing loss on testing, usually one ear", "k": "table"}, {"id": "cd-dz-c12-meniere-symptoms", "ch": "12", "s": "hearing", "topic": "Ménière disease", "f": "Ménière disease · symptoms (what they report)?", "b": "Episodic vertigo (spinning), the hallmark; Tinnitus (ringing); Ear fullness and pain; Nausea; Attacks typically last 20 minutes to 12 hours", "k": "table"}, {"id": "cd-dz-c12-meniere-labs", "ch": "12", "s": "hearing", "topic": "Ménière disease", "f": "Ménière disease · labs & diagnosis?", "b": "Hearing test shows sensorineural loss; Auditory brainstem response; Electrocochleography (ECOG); Videonystagmography (VNG) / electronystagmography (ENG); Caloric test: warm/cool water induces nystagmus", "k": "table"}, {"id": "cd-dz-c12-meniere-risk", "ch": "12", "s": "hearing", "topic": "Ménière disease", "f": "Ménière disease · risk factors?", "b": "Onset usually ages 20–60; Smoking and stress may trigger attacks", "k": "table"}, {"id": "cd-dz-c12-meniere-comp", "ch": "12", "s": "hearing", "topic": "Ménière disease", "f": "Ménière disease · complications?", "b": "Progressive, permanent hearing loss; Unpredictable, debilitating attacks (daily to yearly); Destructive treatments can cost hearing", "k": "table"}, {"id": "cd-dz-c12-meniere-tx", "ch": "12", "s": "hearing", "topic": "Ménière disease", "f": "Ménière disease · treatment?", "b": "Low-salt diet or diuretics to reduce fluid; Betahistine first-line to cut attack frequency; Antiemetics; vestibular suppressants for acute attacks; Gentamicin into the middle ear (may lose hearing); Vestibular neurectomy (hearing kept) or labyrinthectomy (hearing lost); Endolymphatic sac decompression/shunt", "k": "table"}, {"id": "cd-dz-c12-meniere-nurse", "ch": "12", "s": "hearing", "topic": "Ménière disease", "f": "Ménière disease · nursing priorities?", "b": "Fall precautions during vertigo; lie still in a dark, quiet room; Teach low-salt diet (< 1.5 g/day), less caffeine, no alcohol; Encourage smoking cessation and stress reduction; Give antiemetics for nausea", "k": "table"}, {"id": "cd-dz-c12-amd-etiology", "ch": "12", "s": "vision2", "topic": "Macular degeneration (age-related; dry vs wet)", "f": "Macular degeneration (age-related; dry vs wet) · causes?", "b": "Aging, inflammation, injury, infection; Gene–gene and gene–environment interactions", "k": "table"}, {"id": "cd-dz-c12-amd-patho", "ch": "12", "s": "vision2", "topic": "Macular degeneration (age-related; dry vs wet)", "f": "Macular degeneration (age-related; dry vs wet) · what goes wrong?", "b": "Dry (most cases): yellow drusen deposit under the macula; Drusen thin and dry out the macula → slow loss of function; Wet: new leaky vessels grow under the macula (choroidal neovascularization); Leaking fluid and blood distort the macula → central vision lost fast; Wet in one eye → likely in the other", "k": "table"}, {"id": "cd-dz-c12-amd-signs", "ch": "12", "s": "vision2", "topic": "Macular degeneration (age-related; dry vs wet)", "f": "Macular degeneration (age-related; dry vs wet) · signs (objective)?", "b": "Drusen, leakage or bulging macula on dilated eye exam; Distorted lines on the Amsler grid; Wet classical: vision 6/75–6/240 (US: 20/250–20/800); occult: 6/24–6/60 (US: 20/80–20/200)", "k": "table"}, {"id": "cd-dz-c12-amd-symptoms", "ch": "12", "s": "vision2", "topic": "Macular degeneration (age-related; dry vs wet)", "f": "Macular degeneration (age-related; dry vs wet) · symptoms (what they report)?", "b": "Loss or distortion of central vision; Dark central spot; Trouble reading, recognizing faces or colors; Poor night vision (dry form)", "k": "table"}, {"id": "cd-dz-c12-amd-labs", "ch": "12", "s": "vision2", "topic": "Macular degeneration (age-related; dry vs wet)", "f": "Macular degeneration (age-related; dry vs wet) · labs & diagnosis?", "b": "Dilated retinal exam; Amsler grid; Fluorescein angiography (dye in a vein); Optical coherence tomography", "k": "table"}, {"id": "cd-dz-c12-amd-risk", "ch": "12", "s": "vision2", "topic": "Macular degeneration (age-related; dry vs wet)", "f": "Macular degeneration (age-related; dry vs wet) · risk factors?", "b": "Age over 60; Smoking; Hypertension; Overweight/obesity; Family history", "k": "table"}, {"id": "cd-dz-c12-amd-comp", "ch": "12", "s": "vision2", "topic": "Macular degeneration (age-related; dry vs wet)", "f": "Macular degeneration (age-related; dry vs wet) · complications?", "b": "Leading cause of blindness in older Americans; Loss of driving and reading ability; Wet form causes far more vision loss than dry", "k": "table"}, {"id": "cd-dz-c12-amd-tx", "ch": "12", "s": "vision2", "topic": "Macular degeneration (age-related; dry vs wet)", "f": "Macular degeneration (age-related; dry vs wet) · treatment?", "b": "Dry: no treatment; progresses slowly; Wet: anti-VEGF drugs injected into the eye; Laser photocoagulation (may reduce vision); Photodynamic therapy; Dry: daily vitamin/zinc supplements (eg, zinc, vitamins C & E, lutein) cut the risk of advanced disease by about 25%", "k": "table"}, {"id": "cd-dz-c12-amd-nurse", "ch": "12", "s": "vision2", "topic": "Macular degeneration (age-related; dry vs wet)", "f": "Macular degeneration (age-related; dry vs wet) · nursing priorities?", "b": "Encourage regular dilated eye exams for older adults; Teach home Amsler-grid checks; report new wavy lines; Smoking cessation and BP control; Home safety and low-vision aids: lighting, large print; Smokers shouldn't take beta-carotene (lung cancer risk); lutein is the substitute", "k": "table"}, {"id": "cd-dz-c12-glaucoma-etiology", "ch": "12", "s": "vision2", "topic": "Glaucoma (open-angle vs angle-closure)", "f": "Glaucoma (open-angle vs angle-closure) · causes?", "b": "Open-angle (most common): clogged trabecular meshwork; likely hereditary; Angle-closure: the iris–cornea angle narrows or closes; inherited trait; Normal-tension: poor blood flow to the optic nerve", "k": "table"}, {"id": "cd-dz-c12-glaucoma-patho", "ch": "12", "s": "vision2", "topic": "Glaucoma (open-angle vs angle-closure)", "f": "Glaucoma (open-angle vs angle-closure) · what goes wrong?", "b": "Fluid (aqueous humor) can't drain → eye pressure (IOP) ↑; High pressure damages the optic nerve and ganglion cells; Open-angle: slow, painless; the cornea adapts so there are no symptoms; Angle-closure: pressure rises fast; fluid buildup narrows the angle further; Vision loss is permanent", "k": "table"}, {"id": "cd-dz-c12-glaucoma-signs", "ch": "12", "s": "vision2", "topic": "Glaucoma (open-angle vs angle-closure)", "f": "Glaucoma (open-angle vs angle-closure) · signs (objective)?", "b": "IOP ≥ 22 mm Hg (normal 14–16); Optic-disc cupping, pallor, hemorrhage; Visual field defects (blind spots)", "k": "table"}, {"id": "cd-dz-c12-glaucoma-symptoms", "ch": "12", "s": "vision2", "topic": "Glaucoma (open-angle vs angle-closure)", "f": "Glaucoma (open-angle vs angle-closure) · symptoms (what they report)?", "b": "Open-angle: none early; peripheral blind spots later; Angle-closure: sudden eye pain, headache, nausea; Blurred vision; rainbows/halos around lights", "k": "table"}, {"id": "cd-dz-c12-glaucoma-labs", "ch": "12", "s": "vision2", "topic": "Glaucoma (open-angle vs angle-closure)", "f": "Glaucoma (open-angle vs angle-closure) · labs & diagnosis?", "b": "Tonometry; Ophthalmoscopy: cupping; Visual field testing; Gonioscopy: open or closed angle; Laser optical coherence imaging", "k": "table"}, {"id": "cd-dz-c12-glaucoma-risk", "ch": "12", "s": "vision2", "topic": "Glaucoma (open-angle vs angle-closure)", "f": "Glaucoma (open-angle vs angle-closure) · risk factors?", "b": "Age over 60; Family history; Diabetes, hypertension, sickle-cell anemia; Eye trauma; Long-term steroids; Farsightedness (hyperopia) → angle-closure", "k": "table"}, {"id": "cd-dz-c12-glaucoma-comp", "ch": "12", "s": "vision2", "topic": "Glaucoma (open-angle vs angle-closure)", "f": "Glaucoma (open-angle vs angle-closure) · complications?", "b": "Irreversible blindness: leading preventable cause in the US; Angle-closure: chronic glaucoma, cataracts; Peripheral loss spreads to central vision", "k": "table"}, {"id": "cd-dz-c12-glaucoma-tx", "ch": "12", "s": "vision2", "topic": "Glaucoma (open-angle vs angle-closure)", "f": "Glaucoma (open-angle vs angle-closure) · treatment?", "b": "Goal: lower IOP (less fluid made, more drained); Drops: miotics, beta blockers, prostaglandin analogs, carbonic anhydrase inhibitors, alpha-agonists; Open-angle: laser trabeculoplasty; trabeculectomy; Angle-closure: laser iridotomy; Acute angle-closure is an emergency: timolol, pilocarpine, brimonidine drops + oral acetazolamide right away; Prostaglandin analogs (latanoprost) are the most popular drops", "k": "table"}, {"id": "cd-dz-c12-glaucoma-nurse", "ch": "12", "s": "vision2", "topic": "Glaucoma (open-angle vs angle-closure)", "f": "Glaucoma (open-angle vs angle-closure) · nursing priorities?", "b": "Treat acute eye pain + halos + nausea as an emergency; Avoid darkened rooms and pupil-dilating drugs in at-risk people; Teach that drops are lifelong; silent disease, so adherence matters; Teach eyelid closure / pressing the inner corner after drops to cut systemic absorption; Encourage screening for at-risk adults", "k": "table"}, {"id": "cd-dz-c12-rop-etiology", "ch": "12", "s": "vision2", "topic": "Retinopathy of prematurity (ROP)", "f": "Retinopathy of prematurity (ROP) · causes?", "b": "Premature birth interrupts retinal vessel growth; High-oxygen environment outside the womb; Supplemental oxygen for immature lungs", "k": "table"}, {"id": "cd-dz-c12-rop-patho", "ch": "12", "s": "vision2", "topic": "Retinopathy of prematurity (ROP)", "f": "Retinopathy of prematurity (ROP) · what goes wrong?", "b": "Retinal vessels normally finish growing by 38–40 weeks in low-oxygen womb; Early birth + high oxygen → vessel growth stops (phase 1); Then VEGF drives wild, leaky vessel growth into the vitreous (phase 2); Bleeding and scar contraction pull the retina → detachment; Stages I–V: mild abnormal growth → complete detachment", "k": "table"}, {"id": "cd-dz-c12-rop-signs", "ch": "12", "s": "vision2", "topic": "Retinopathy of prematurity (ROP)", "f": "Retinopathy of prematurity (ROP) · signs (objective)?", "b": "Leukocoria (white pupil); Nystagmus; Strabismus (crossed eyes); Severe myopia; Dilated, twisted vessels; venous congestion on exam", "k": "table"}, {"id": "cd-dz-c12-rop-symptoms", "ch": "12", "s": "vision2", "topic": "Retinopathy of prematurity (ROP)", "f": "Retinopathy of prematurity (ROP) · symptoms (what they report)?", "b": "Infants can't report symptoms; signs come from the eye exam; Later: poor vision or blindness", "k": "table"}, {"id": "cd-dz-c12-rop-labs", "ch": "12", "s": "vision2", "topic": "Retinopathy of prematurity (ROP)", "f": "Retinopathy of prematurity (ROP) · labs & diagnosis?", "b": "Dilated retinal exam by ophthalmologist; Twisted, dilated vessels in severe ROP; Screen all infants < 1500 g (3 lb 5 oz) or < 30 weeks' gestation; Screening begins around 31 weeks' gestational age", "k": "table"}, {"id": "cd-dz-c12-rop-risk", "ch": "12", "s": "vision2", "topic": "Retinopathy of prematurity (ROP)", "f": "Retinopathy of prematurity (ROP) · risk factors?", "b": "≤ 28 weeks' gestation; Birth weight: 68% develop ROP; High concentrations of supplemental oxygen", "k": "table"}, {"id": "cd-dz-c12-rop-comp", "ch": "12", "s": "vision2", "topic": "Retinopathy of prematurity (ROP)", "f": "Retinopathy of prematurity (ROP) · complications?", "b": "Leading cause of childhood blindness; Retinal detachment; About ⅓ progress to severe, permanent vision loss", "k": "table"}, {"id": "cd-dz-c12-rop-tx", "ch": "12", "s": "vision2", "topic": "Retinopathy of prematurity (ROP)", "f": "Retinopathy of prematurity (ROP) · treatment?", "b": "Prevention: give only as much oxygen as the infant needs; Stages I–II: usually resolve on their own; Stage III plus to V: laser or cryotherapy; Scleral buckle; vitrectomy for stage V; Bevacizumab (anti-VEGF) injection can stop progression", "k": "table"}, {"id": "cd-dz-c12-rop-nurse", "ch": "12", "s": "vision2", "topic": "Retinopathy of prematurity (ROP)", "f": "Retinopathy of prematurity (ROP) · nursing priorities?", "b": "Titrate O₂ to target; avoid more oxygen than needed; Make sure screening eye exams are scheduled for at-risk infants; Teach parents about follow-up eye exams; Report leukocoria (white pupil)", "k": "table"}, {"id": "cd-dz-c12-cataract-etiology", "ch": "12", "s": "vision2", "topic": "Cataract", "f": "Cataract · causes?", "b": "Lens proteins clump (aggregate); Aging (nuclear sclerotic type); Smoking, diabetes, glucocorticoids, chronic UV light", "k": "table"}, {"id": "cd-dz-c12-cataract-patho", "ch": "12", "s": "vision2", "topic": "Cataract", "f": "Cataract · what goes wrong?", "b": "Lens proteins clump → lens turns cloudy (opaque); Cloudy lens scatters incoming light on the retina; Bigger opaque area → worse vision; Types: nuclear sclerotic (center), cortical (outer edge in), posterior subcapsular (back)", "k": "table"}, {"id": "cd-dz-c12-cataract-signs", "ch": "12", "s": "vision2", "topic": "Cataract", "f": "Cataract · signs (objective)?", "b": "Clouded, opaque lens; Visual acuity ↓, distance more than near (nuclear)", "k": "table"}, {"id": "cd-dz-c12-cataract-symptoms", "ch": "12", "s": "vision2", "topic": "Cataract", "f": "Cataract · symptoms (what they report)?", "b": "Blurry, cloudy vision; Glare and halos around lights (posterior subcapsular); Loss of contrast; needing more light to see", "k": "table"}, {"id": "cd-dz-c12-cataract-labs", "ch": "12", "s": "vision2", "topic": "Cataract", "f": "Cataract · labs & diagnosis?", "b": "Eye exam showing lens opacity; Visual acuity reduced", "k": "table"}, {"id": "cd-dz-c12-cataract-risk", "ch": "12", "s": "vision2", "topic": "Cataract", "f": "Cataract · risk factors?", "b": "Aging; Smoking; Diabetes; Long-term glucocorticoids; Chronic UV exposure", "k": "table"}, {"id": "cd-dz-c12-cataract-comp", "ch": "12", "s": "vision2", "topic": "Cataract", "f": "Cataract · complications?", "b": "Progressive vision loss; Nuclear: slow (years); posterior subcapsular: fast (months); Limits daily activities such as driving and reading", "k": "table"}, {"id": "cd-dz-c12-cataract-tx", "ch": "12", "s": "vision2", "topic": "Cataract", "f": "Cataract · treatment?", "b": "Surgical removal + clear artificial lens; Phacoemulsification is the preferred procedure", "k": "table"}, {"id": "cd-dz-c12-cataract-nurse", "ch": "12", "s": "vision2", "topic": "Cataract", "f": "Cataract · nursing priorities?", "b": "Fall-risk and home-safety assessment for older adults; Ask whether vision limits driving, reading or work (that's when surgery is indicated); Teach UV protection (sunglasses) and smoking cessation", "k": "table"}, {"id": "cd-dz-c12-conj-etiology", "ch": "12", "s": "vision2", "topic": "Conjunctivitis (viral · bacterial · allergic)", "f": "Conjunctivitis (viral · bacterial · allergic) · causes?", "b": "Viral; Bacterial; Allergic", "k": "table"}, {"id": "cd-dz-c12-conj-patho", "ch": "12", "s": "vision2", "topic": "Conjunctivitis (viral · bacterial · allergic)", "f": "Conjunctivitis (viral · bacterial · allergic) · what goes wrong?", "b": "Inflammation of the mucous membrane lining the eye (conjunctiva); Commonly called pink eye; Infectious types spread by droplets, objects and hand-to-eye contact", "k": "table"}, {"id": "cd-dz-c12-conj-signs", "ch": "12", "s": "vision2", "topic": "Conjunctivitis (viral · bacterial · allergic)", "f": "Conjunctivitis (viral · bacterial · allergic) · signs (objective)?", "b": "Redness; Viral: one eye, heavy watering, little discharge; Bacterial: both eyes, heavy discharge; Allergic: both eyes, excessive tearing", "k": "table"}, {"id": "cd-dz-c12-conj-symptoms", "ch": "12", "s": "vision2", "topic": "Conjunctivitis (viral · bacterial · allergic)", "f": "Conjunctivitis (viral · bacterial · allergic) · symptoms (what they report)?", "b": "Itching (allergic); Eye discomfort", "k": "table"}, {"id": "cd-dz-c12-conj-labs", "ch": "12", "s": "vision2", "topic": "Conjunctivitis (viral · bacterial · allergic)", "f": "Conjunctivitis (viral · bacterial · allergic) · labs & diagnosis?", "b": "Diagnosed clinically; cultures only sometimes", "k": "table"}, {"id": "cd-dz-c12-conj-risk", "ch": "12", "s": "vision2", "topic": "Conjunctivitis (viral · bacterial · allergic)", "f": "Conjunctivitis (viral · bacterial · allergic) · risk factors?", "b": "Contact with infected people or shared towels/pillows; Allergens (allergic type)", "k": "table"}, {"id": "cd-dz-c12-conj-comp", "ch": "12", "s": "vision2", "topic": "Conjunctivitis (viral · bacterial · allergic)", "f": "Conjunctivitis (viral · bacterial · allergic) · complications?", "b": "Highly contagious; spreads to others; Gonococcal or chlamydial causes need systemic antibiotics", "k": "table"}, {"id": "cd-dz-c12-conj-tx", "ch": "12", "s": "vision2", "topic": "Conjunctivitis (viral · bacterial · allergic)", "f": "Conjunctivitis (viral · bacterial · allergic) · treatment?", "b": "Bacterial: antibiotic drops; Viral: no antibiotics initially; Allergic: antihistamine or mast-cell stabilizer drops", "k": "table"}, {"id": "cd-dz-c12-conj-nurse", "ch": "12", "s": "vision2", "topic": "Conjunctivitis (viral · bacterial · allergic)", "f": "Conjunctivitis (viral · bacterial · allergic) · nursing priorities?", "b": "Tell the type apart: one eye + watery (viral), both + heavy discharge (bacterial), both + itch (allergic); Teach handwashing for at least 20 seconds; No sharing towels or pillows", "k": "table"}, {"id": "cd-dz-c12-oe-etiology", "ch": "12", "s": "hearing", "topic": "Otitis externa (swimmer's ear)", "f": "Otitis externa (swimmer's ear) · causes?", "b": "Moisture in the ear canal; Broken skin in the ear canal; Pseudomonas is the most common bacterial cause", "k": "table"}, {"id": "cd-dz-c12-oe-patho", "ch": "12", "s": "hearing", "topic": "Otitis externa (swimmer's ear)", "f": "Otitis externa (swimmer's ear) · what goes wrong?", "b": "Moisture or skin break → inflamed outer ear canal; Swelling narrows the canal; Drainage + narrow canal → mild hearing loss; Earwax (cerumen) normally forms an acidic, water-repellent barrier; disrupting it allows infection", "k": "table"}, {"id": "cd-dz-c12-oe-signs", "ch": "12", "s": "hearing", "topic": "Otitis externa (swimmer's ear)", "f": "Otitis externa (swimmer's ear) · signs (objective)?", "b": "Redness and swelling; narrowed canal; Drainage; Pain when the outer ear is pulled (pinna) or the tragus is pressed", "k": "table"}, {"id": "cd-dz-c12-oe-symptoms", "ch": "12", "s": "hearing", "topic": "Otitis externa (swimmer's ear)", "f": "Otitis externa (swimmer's ear) · symptoms (what they report)?", "b": "Ear pain and tenderness; Itching; Mild hearing loss", "k": "table"}, {"id": "cd-dz-c12-oe-labs", "ch": "12", "s": "hearing", "topic": "Otitis externa (swimmer's ear)", "f": "Otitis externa (swimmer's ear) · labs & diagnosis?", "b": "Otoscopy: red, swollen canal; Tragus or pinna tug pain", "k": "table"}, {"id": "cd-dz-c12-oe-risk", "ch": "12", "s": "hearing", "topic": "Otitis externa (swimmer's ear)", "f": "Otitis externa (swimmer's ear) · risk factors?", "b": "Swimming; Cleaning ears with cotton swabs or objects", "k": "table"}, {"id": "cd-dz-c12-oe-comp", "ch": "12", "s": "hearing", "topic": "Otitis externa (swimmer's ear)", "f": "Otitis externa (swimmer's ear) · complications?", "b": "Hearing loss from canal swelling; Malignant (necrotizing) external otitis can develop", "k": "table"}, {"id": "cd-dz-c12-oe-tx", "ch": "12", "s": "hearing", "topic": "Otitis externa (swimmer's ear)", "f": "Otitis externa (swimmer's ear) · treatment?", "b": "Antibiotic ear drops for bacterial infection", "k": "table"}, {"id": "cd-dz-c12-oe-nurse", "ch": "12", "s": "hearing", "topic": "Otitis externa (swimmer's ear)", "f": "Otitis externa (swimmer's ear) · nursing priorities?", "b": "Teach keeping ears dry; No cotton swabs in the ear canal; Check the eardrum is intact before irrigation", "k": "table"}, {"id": "cd-dz-c12-otoscl-etiology", "ch": "12", "s": "hearing", "topic": "Otosclerosis", "f": "Otosclerosis · causes?", "b": "Autosomal-dominant genetic condition; Family history common", "k": "table"}, {"id": "cd-dz-c12-otoscl-patho", "ch": "12", "s": "hearing", "topic": "Otosclerosis", "f": "Otosclerosis · what goes wrong?", "b": "Slow formation of spongy bone at the oval window; New bone locks the stapes footplate; Vibration can't be conducted → conductive hearing loss; Chronic and progressive", "k": "table"}, {"id": "cd-dz-c12-otoscl-signs", "ch": "12", "s": "hearing", "topic": "Otosclerosis", "f": "Otosclerosis · signs (objective)?", "b": "Conductive hearing loss on testing; Abnormal new bone in the otic capsule", "k": "table"}, {"id": "cd-dz-c12-otoscl-symptoms", "ch": "12", "s": "hearing", "topic": "Otosclerosis", "f": "Otosclerosis · symptoms (what they report)?", "b": "Gradually worsening hearing", "k": "table"}, {"id": "cd-dz-c12-otoscl-labs", "ch": "12", "s": "hearing", "topic": "Otosclerosis", "f": "Otosclerosis · labs & diagnosis?", "b": "Hearing testing shows conductive loss", "k": "table"}, {"id": "cd-dz-c12-otoscl-risk", "ch": "12", "s": "hearing", "topic": "Otosclerosis", "f": "Otosclerosis · risk factors?", "b": "Females aged 15–30; Family history", "k": "table"}, {"id": "cd-dz-c12-otoscl-comp", "ch": "12", "s": "hearing", "topic": "Otosclerosis", "f": "Otosclerosis · complications?", "b": "Most common cause of chronic, progressive conductive hearing loss", "k": "table"}, {"id": "cd-dz-c12-otoscl-tx", "ch": "12", "s": "hearing", "topic": "Otosclerosis", "f": "Otosclerosis · treatment?", "b": "Stapes removed and replaced with a prosthesis (stapedectomy); Hearing aid may help", "k": "table"}, {"id": "cd-dz-c12-otoscl-nurse", "ch": "12", "s": "hearing", "topic": "Otosclerosis", "f": "Otosclerosis · nursing priorities?", "b": "Ask about family history in young women with gradual hearing loss; Use communication strategies: face the patient, speak clearly; Discuss hearing-aid vs surgery options", "k": "table"}, {"id": "cd-dz-c13-siadh-etiology", "ch": "13", "s": "pituitary", "topic": "SIADH (syndrome of inappropriate ADH)", "f": "SIADH (syndrome of inappropriate ADH) · causes?", "b": "Most common cause: a tumor somewhere in the body secreting extra (ectopic) ADH; Diagnosis is kept for people without a normal ADH trigger (meds, trauma, pain, surgery, infection, temperature extremes); Medications linked to it include thiazides, carbamazepine, opioids, vincristine and MDMA (ecstasy)", "k": "table"}, {"id": "cd-dz-c13-siadh-patho", "ch": "13", "s": "pituitary", "topic": "SIADH (syndrome of inappropriate ADH)", "f": "SIADH (syndrome of inappropriate ADH) · what goes wrong?", "b": "ADH keeps being released even when blood is already dilute; ADH makes the nephrons more permeable → kidneys hold on to water; Most of the extra water goes inside cells, so edema and vascular overload are uncommon; Total body water ↑ → sodium in the blood is diluted (hypotonic hyponatremia); Brain cells are the most sensitive to swelling → neuro symptoms", "k": "table"}, {"id": "cd-dz-c13-siadh-signs", "ch": "13", "s": "pituitary", "topic": "SIADH (syndrome of inappropriate ADH)", "f": "SIADH (syndrome of inappropriate ADH) · signs (objective)?", "b": "Low, concentrated urine output; Usually no edema (water stays inside cells); Vomiting, disorientation, muscle weakness; Na below 110: gait problems, seizures, coma, psychosis", "k": "table"}, {"id": "cd-dz-c13-siadh-symptoms", "ch": "13", "s": "pituitary", "topic": "SIADH (syndrome of inappropriate ADH)", "f": "SIADH (syndrome of inappropriate ADH) · symptoms (what they report)?", "b": "Loss of appetite (anorexia) and nausea; Headache; Irritability; Muscle cramps and feeling weak", "k": "table"}, {"id": "cd-dz-c13-siadh-labs", "ch": "13", "s": "pituitary", "topic": "SIADH (syndrome of inappropriate ADH)", "f": "SIADH (syndrome of inappropriate ADH) · labs & diagnosis?", "b": "Serum sodium ↓; Plasma osmolality ↓; Urine volume ↓; Urine highly concentrated; Urine sodium high; Kidney, adrenal and thyroid problems ruled out first", "k": "table"}, {"id": "cd-dz-c13-siadh-risk", "ch": "13", "s": "pituitary", "topic": "SIADH (syndrome of inappropriate ADH)", "f": "SIADH (syndrome of inappropriate ADH) · risk factors?", "b": "Tumors that make ectopic ADH (book's most common cause); Recent trauma, surgery, pain, infection or temperature extremes can raise ADH for a while; Drugs such as thiazides, carbamazepine, opioids and vincristine", "k": "table"}, {"id": "cd-dz-c13-siadh-comp", "ch": "13", "s": "pituitary", "topic": "SIADH (syndrome of inappropriate ADH)", "f": "SIADH (syndrome of inappropriate ADH) · complications?", "b": "Seizures and coma when sodium drops below 110 mEq/L; Faster drop = worse symptoms; Low sodium is linked to later osteoporosis and fragility fractures (research note); Fixing sodium too fast can cause osmotic demyelination syndrome (brain damage)", "k": "table"}, {"id": "cd-dz-c13-siadh-tx", "ch": "13", "s": "pituitary", "topic": "SIADH (syndrome of inappropriate ADH)", "f": "SIADH (syndrome of inappropriate ADH) · treatment?", "b": "Treat or remove the cause; Mild: fluid (water) restriction, often the only therapy; Severe: IV isotonic or hypertonic saline; hypertonic only if mental status is changing; Drugs that block ADH or increase urine output if the cause can't be removed; Severe restriction is often 250–500 mL per 24 hours", "k": "table"}, {"id": "cd-dz-c13-siadh-nurse", "ch": "13", "s": "pituitary", "topic": "SIADH (syndrome of inappropriate ADH)", "f": "SIADH (syndrome of inappropriate ADH) · nursing priorities?", "b": "Frequent neuro checks: confusion, irritability and headache are early clues; Seizure precautions when sodium is falling or very low; Track urine output and enforce the fluid restriction; Raise sodium no more than 8 mEq/L in the first 24 h and ≤ 0.5 mEq/L per hour (after the first few hours of severe cases)", "k": "table"}, {"id": "cd-dz-c13-di-etiology", "ch": "13", "s": "pituitary", "topic": "Diabetes insipidus (central vs nephrogenic)", "f": "Diabetes insipidus (central vs nephrogenic) · causes?", "b": "Central: hypothalamus doesn't make enough ADH, or the posterior pituitary doesn't release it; Most common cause: trauma or surgery at or near the hypothalamus; Nephrogenic: the kidney's collecting duct ignores ADH; Nephrogenic causes: chronic renal insufficiency, lithium toxicity, hypercalcemia, hypokalemia, renal tubule disease; rarely X-linked; Drinking huge volumes of fluid (sometimes psychiatric) lowers ADH", "k": "table"}, {"id": "cd-dz-c13-di-patho", "ch": "13", "s": "pituitary", "topic": "Diabetes insipidus (central vs nephrogenic)", "f": "Diabetes insipidus (central vs nephrogenic) · what goes wrong?", "b": "No ADH, or no kidney response to ADH; Kidney can't concentrate urine or hold water; Huge volume of dilute urine (polyuria) → excessive thirst (polydipsia); Fluid loss → blood becomes concentrated (serum hyperosmolality) → severe dehydration", "k": "table"}, {"id": "cd-dz-c13-di-signs", "ch": "13", "s": "pituitary", "topic": "Diabetes insipidus (central vs nephrogenic)", "f": "Diabetes insipidus (central vs nephrogenic) · signs (objective)?", "b": "Polyuria: very large volumes of pale, dilute urine; Signs of dehydration; Bladder may be enlarged from constant overfilling; Shock if untreated", "k": "table"}, {"id": "cd-dz-c13-di-symptoms", "ch": "13", "s": "pituitary", "topic": "Diabetes insipidus (central vs nephrogenic)", "f": "Diabetes insipidus (central vs nephrogenic) · symptoms (what they report)?", "b": "Intense thirst (polydipsia); Recent head injury or brain surgery is common in the history", "k": "table"}, {"id": "cd-dz-c13-di-labs", "ch": "13", "s": "pituitary", "topic": "Diabetes insipidus (central vs nephrogenic)", "f": "Diabetes insipidus (central vs nephrogenic) · labs & diagnosis?", "b": "Urine specific gravity ≤ 1.005; Urine osmolality < 200 mOsm/kg; Serum solute concentration ↑ (hyperosmolality); ADH level measured: low in central DI; Water deprivation test is the simplest, most reliable test; done under constant supervision", "k": "table"}, {"id": "cd-dz-c13-di-risk", "ch": "13", "s": "pituitary", "topic": "Diabetes insipidus (central vs nephrogenic)", "f": "Diabetes insipidus (central vs nephrogenic) · risk factors?", "b": "Brain tumor removal, other cranial surgery or head trauma; Lithium use (nephrogenic); Chronic kidney disease, high calcium or low potassium (nephrogenic)", "k": "table"}, {"id": "cd-dz-c13-di-comp", "ch": "13", "s": "pituitary", "topic": "Diabetes insipidus (central vs nephrogenic)", "f": "Diabetes insipidus (central vs nephrogenic) · complications?", "b": "Severe dehydration; Shock and death if untreated; Serious dehydration can develop during a water deprivation test", "k": "table"}, {"id": "cd-dz-c13-di-tx", "ch": "13", "s": "pituitary", "topic": "Diabetes insipidus (central vs nephrogenic)", "f": "Diabetes insipidus (central vs nephrogenic) · treatment?", "b": "Replace fluids: most patients can drink enough; IV hypotonic fluid if thirst is inadequate; Desmopressin (DDAVP): synthetic ADH; may be lifelong if the cause can't be fixed; Thiazide diuretics paradoxically reduce urine volume; NSAIDs (eg, indomethacin) help modestly in nephrogenic DI", "k": "table"}, {"id": "cd-dz-c13-di-nurse", "ch": "13", "s": "pituitary", "topic": "Diabetes insipidus (central vs nephrogenic)", "f": "Diabetes insipidus (central vs nephrogenic) · nursing priorities?", "b": "Strict intake and output; watch urine specific gravity; Keep water within reach, and give IV fluid if the patient can't drink enough; Watch for dehydration and shock after head injury or brain surgery; Monitor constantly during a water deprivation test", "k": "table"}, {"id": "cd-dz-c13-graves-etiology", "ch": "13", "s": "thyroid", "topic": "Hyperthyroidism · Graves disease", "f": "Hyperthyroidism · Graves disease · causes?", "b": "Graves disease (autoimmune) is the most common cause; Thyroid gland disease, or TSH-making pituitary adenoma; Large iodine loads: cough expectorants, seaweed supplements, iodinated contrast dye", "k": "table"}, {"id": "cd-dz-c13-graves-patho", "ch": "13", "s": "thyroid", "topic": "Hyperthyroidism · Graves disease", "f": "Hyperthyroidism · Graves disease · what goes wrong?", "b": "IgG antibodies bind the TSH receptor and switch it on; Thyroid makes too much T3/T4 → thyrotoxicosis; Gland grows from overstimulation (hyperplasia) → goiter; Metabolism speeds up all over the body; High T3/T4 suppresses TSH by negative feedback; Antibodies also act on eye-muscle fibroblasts → swelling pushes the eyes forward (exophthalmos)", "k": "table"}, {"id": "cd-dz-c13-graves-signs", "ch": "13", "s": "thyroid", "topic": "Hyperthyroidism · Graves disease", "f": "Hyperthyroidism · Graves disease · signs (objective)?", "b": "Exophthalmos (bulging eyes, usually both); Goiter: enlarged, slightly firm thyroid; Tachycardia, weight loss, sweating, tremors; Fine hair, oily skin; Widened pulse pressure and possible atrial fibrillation", "k": "table"}, {"id": "cd-dz-c13-graves-symptoms", "ch": "13", "s": "thyroid", "topic": "Hyperthyroidism · Graves disease", "f": "Hyperthyroidism · Graves disease · symptoms (what they report)?", "b": "Heat intolerance; Palpitations; Agitation, restlessness; Diarrhea; Weakness; irregular periods", "k": "table"}, {"id": "cd-dz-c13-graves-labs", "ch": "13", "s": "thyroid", "topic": "Hyperthyroidism · Graves disease", "f": "Hyperthyroidism · Graves disease · labs & diagnosis?", "b": "TSH greatly suppressed; Free T4 ↑ confirms the diagnosis; T3 ↑; Radioactive iodine uptake ↑ confirms", "k": "table"}, {"id": "cd-dz-c13-graves-risk", "ch": "13", "s": "thyroid", "topic": "Hyperthyroidism · Graves disease", "f": "Hyperthyroidism · Graves disease · risk factors?", "b": "Women: 7–10× more likely; Family history of autoimmune or thyroid disease; Stress, smoking; Emigrating from an iodine-deficient area", "k": "table"}, {"id": "cd-dz-c13-graves-comp", "ch": "13", "s": "thyroid", "topic": "Hyperthyroidism · Graves disease", "f": "Hyperthyroidism · Graves disease · complications?", "b": "Thyroid storm: sudden severe worsening; can be fatal; Can burn out into hypothyroidism; Exophthalmos often persists after treatment; Atrial fibrillation, especially in older patients", "k": "table"}, {"id": "cd-dz-c13-graves-tx", "ch": "13", "s": "thyroid", "topic": "Hyperthyroidism · Graves disease", "f": "Hyperthyroidism · Graves disease · treatment?", "b": "Radioactive iodine to destroy gland tissue; Antithyroid drugs that block hormone production; Surgery (less common); full removal = lifelong thyroid hormone; Methimazole preferred; propylthiouracil (PTU) is the alternative; Beta-blockers (eg, propranolol) control tachycardia and tremor", "k": "table"}, {"id": "cd-dz-c13-graves-nurse", "ch": "13", "s": "thyroid", "topic": "Hyperthyroidism · Graves disease", "f": "Hyperthyroidism · Graves disease · nursing priorities?", "b": "Watch heart rate and rhythm, temperature and weight; Watch for thyroid storm: fever, confusion and a racing heart signal it; Teach lifelong hormone replacement after full ablation; On methimazole or PTU, watch for agranulocytosis (very low white cells) and liver injury", "k": "table"}, {"id": "cd-dz-c13-hypothyroid-etiology", "ch": "13", "s": "thyroid", "topic": "Hypothyroidism · Hashimoto thyroiditis", "f": "Hypothyroidism · Hashimoto thyroiditis · causes?", "b": "Hashimoto thyroiditis: autoimmune destruction of the gland; Iodine deficiency; Thyroid surgery or radiation; drugs that destroy the gland; Low TSH or TRH (pituitary or hypothalamus cause); Congenital: underdeveloped gland in the fetus", "k": "table"}, {"id": "cd-dz-c13-hypothyroid-patho", "ch": "13", "s": "thyroid", "topic": "Hypothyroidism · Hashimoto thyroiditis", "f": "Hypothyroidism · Hashimoto thyroiditis · what goes wrong?", "b": "Gland destroyed or hormone synthesis blocked → T3/T4 ↓; Metabolism slows everywhere; Low hormone takes the brake off the pituitary → TSH ↑; Gland may enlarge trying to work harder → goiter; Protein–carbohydrate complexes pull water into tissues → myxedema", "k": "table"}, {"id": "cd-dz-c13-hypothyroid-signs", "ch": "13", "s": "thyroid", "topic": "Hypothyroidism · Hashimoto thyroiditis", "f": "Hypothyroidism · Hashimoto thyroiditis · signs (objective)?", "b": "Myxedema: boggy, nonpitting swelling of face, hands, feet and mucous membranes; Weight gain; Dry skin, coarse hair; Goiter may be present", "k": "table"}, {"id": "cd-dz-c13-hypothyroid-symptoms", "ch": "13", "s": "thyroid", "topic": "Hypothyroidism · Hashimoto thyroiditis", "f": "Hypothyroidism · Hashimoto thyroiditis · symptoms (what they report)?", "b": "Cold intolerance; Fatigue, weakness, lethargy; Constipation; Impaired memory", "k": "table"}, {"id": "cd-dz-c13-hypothyroid-labs", "ch": "13", "s": "thyroid", "topic": "Hypothyroidism · Hashimoto thyroiditis", "f": "Hypothyroidism · Hashimoto thyroiditis · labs & diagnosis?", "b": "TSH often ↑; Free T4 / total T4 ↓; Thyroid autoantibodies / antithyroglobulin positive in autoimmune cause; Newborn screening detects congenital hypothyroidism", "k": "table"}, {"id": "cd-dz-c13-hypothyroid-risk", "ch": "13", "s": "thyroid", "topic": "Hypothyroidism · Hashimoto thyroiditis", "f": "Hypothyroidism · Hashimoto thyroiditis · risk factors?", "b": "Women up to 10× more likely (Hashimoto); Age over 80: 5× higher risk; Past thyroid surgery or radiation", "k": "table"}, {"id": "cd-dz-c13-hypothyroid-comp", "ch": "13", "s": "thyroid", "topic": "Hypothyroidism · Hashimoto thyroiditis", "f": "Hypothyroidism · Hashimoto thyroiditis · complications?", "b": "Untreated in infants: intellectual disability and impaired growth; Impaired reproduction; Myxedema coma: extreme hypothermia, seizures, slowed breathing with CO₂ retention; life-threatening", "k": "table"}, {"id": "cd-dz-c13-hypothyroid-tx", "ch": "13", "s": "thyroid", "topic": "Hypothyroidism · Hashimoto thyroiditis", "f": "Hypothyroidism · Hashimoto thyroiditis · treatment?", "b": "Levothyroxine (Synthroid, Levoxyl), synthetic T4, for life; Increase the dose gradually until TSH, T4 and T3 normalize; Older or heart-disease patients start low (about 25 mcg daily), adjusted every 6 weeks; Myxedema coma: IV T4 plus glucocorticoids", "k": "table"}, {"id": "cd-dz-c13-hypothyroid-nurse", "ch": "13", "s": "thyroid", "topic": "Hypothyroidism · Hashimoto thyroiditis", "f": "Hypothyroidism · Hashimoto thyroiditis · nursing priorities?", "b": "Teach that levothyroxine is lifelong; don't stop when feeling better; Check that newborn screening was done; Start low and titrate slowly in older or cardiac patients; watch for chest pain; Annual TSH and free T4 to check the dose", "k": "table"}, {"id": "cd-dz-c13-cushing-etiology", "ch": "13", "s": "adrenal", "topic": "Cushing syndrome (too much cortisol)", "f": "Cushing syndrome (too much cortisol) · causes?", "b": "Long-term corticosteroid drugs (eg, prednisone); Pituitary tumor making excess ACTH; Adrenal tumor making excess cortisol; Ectopic ACTH/CRH from a distant tumor (eg, small cell lung cancer)", "k": "table"}, {"id": "cd-dz-c13-cushing-patho", "ch": "13", "s": "adrenal", "topic": "Cushing syndrome (too much cortisol)", "f": "Cushing syndrome (too much cortisol) · what goes wrong?", "b": "Prolonged high glucocorticoid (cortisol) exposure; ACTH-driven causes: adrenal hyperplasia; adrenal tumors make cortisol without ACTH; Glucose ↑ and tissue use ↓ → glucose intolerance; Fat redistributed; protein broken down; bone formation inhibited; Immune and inflammatory responses suppressed; Other cortex hormones may rise: aldosterone (HTN, K ↓), androgens (hirsutism)", "k": "table"}, {"id": "cd-dz-c13-cushing-signs", "ch": "13", "s": "adrenal", "topic": "Cushing syndrome (too much cortisol)", "f": "Cushing syndrome (too much cortisol) · signs (objective)?", "b": "Moon face, buffalo hump, truncal obesity; Striae (stretch marks); Thin atrophic skin, muscle wasting; Poor wound healing, skin ulcers; Hypertension; hirsutism", "k": "table"}, {"id": "cd-dz-c13-cushing-symptoms", "ch": "13", "s": "adrenal", "topic": "Cushing syndrome (too much cortisol)", "f": "Cushing syndrome (too much cortisol) · symptoms (what they report)?", "b": "Extremity weakness; Mood changes: euphoria to emotional disturbance to psychosis", "k": "table"}, {"id": "cd-dz-c13-cushing-labs", "ch": "13", "s": "adrenal", "topic": "Cushing syndrome (too much cortisol)", "f": "Cushing syndrome (too much cortisol) · labs & diagnosis?", "b": "24-hour urine cortisol ↑; Blood glucose ↑; Potassium ↓ if aldosterone also rises; Imaging to locate the tumor; Dexamethasone suppression test: cortisol fails to suppress; False positives: obesity, alcoholism, chronic renal failure, anorexia, bulimia", "k": "table"}, {"id": "cd-dz-c13-cushing-risk", "ch": "13", "s": "adrenal", "topic": "Cushing syndrome (too much cortisol)", "f": "Cushing syndrome (too much cortisol) · risk factors?", "b": "Long-term steroid therapy for asthma, autoimmune or inflammatory disease; Pituitary, adrenal or lung tumors", "k": "table"}, {"id": "cd-dz-c13-cushing-comp", "ch": "13", "s": "adrenal", "topic": "Cushing syndrome (too much cortisol)", "f": "Cushing syndrome (too much cortisol) · complications?", "b": "Diabetes mellitus; Osteoporosis; Infections; Psychosis; Stopping steroids abruptly → adrenal crisis; Kidney stones", "k": "table"}, {"id": "cd-dz-c13-cushing-tx", "ch": "13", "s": "adrenal", "topic": "Cushing syndrome (too much cortisol)", "f": "Cushing syndrome (too much cortisol) · treatment?", "b": "Remove the cause: surgery or radiation for tumors; Taper steroid drugs; never stop abruptly; Steroids may be needed during acute illness to avert crisis; Adrenal inhibitors: metyrapone, ketoconazole; High-protein intake and potassium replacement", "k": "table"}, {"id": "cd-dz-c13-cushing-nurse", "ch": "13", "s": "adrenal", "topic": "Cushing syndrome (too much cortisol)", "f": "Cushing syndrome (too much cortisol) · nursing priorities?", "b": "Teach never stop steroids abruptly; Monitor glucose and blood pressure; Protect from infection; watch wounds and skin; Fall and fracture precautions (osteoporosis, weak muscles)", "k": "table"}, {"id": "cd-dz-c13-addison-etiology", "ch": "13", "s": "adrenal", "topic": "Addison disease (primary adrenal insufficiency)", "f": "Addison disease (primary adrenal insufficiency) · causes?", "b": "Autoimmune destruction of the adrenal cortex (most common); Granuloma, tumors, or drugs that block steroid synthesis; Tuberculosis can destroy the adrenals", "k": "table"}, {"id": "cd-dz-c13-addison-patho", "ch": "13", "s": "adrenal", "topic": "Addison disease (primary adrenal insufficiency)", "f": "Addison disease (primary adrenal insufficiency) · what goes wrong?", "b": "Cortex destroyed (symptoms when ≥ 90% is lost); No glucocorticoids, mineralocorticoids or androgens; Low aldosterone → sodium lost, potassium kept, dehydration; Low cortisol → hypoglycemia and a poor stress response; Pituitary raises ACTH trying to compensate → ACTH stimulates melanocytes → hyperpigmentation", "k": "table"}, {"id": "cd-dz-c13-addison-signs", "ch": "13", "s": "adrenal", "topic": "Addison disease (primary adrenal insufficiency)", "f": "Addison disease (primary adrenal insufficiency) · signs (objective)?", "b": "Hyperpigmentation: darkened skin and mucous membranes; Hypotension, dehydration, possible shock; Weight loss, vomiting; Sparse axillary and pubic hair", "k": "table"}, {"id": "cd-dz-c13-addison-symptoms", "ch": "13", "s": "adrenal", "topic": "Addison disease (primary adrenal insufficiency)", "f": "Addison disease (primary adrenal insufficiency) · symptoms (what they report)?", "b": "Fatigue and weakness; Anorexia, nausea; Personality changes", "k": "table"}, {"id": "cd-dz-c13-addison-labs", "ch": "13", "s": "adrenal", "topic": "Addison disease (primary adrenal insufficiency)", "f": "Addison disease (primary adrenal insufficiency) · labs & diagnosis?", "b": "Serum sodium ↓; Serum potassium ↑; Glucose ↓; Cortisol stays low after ACTH is given; Cosyntropin test: peak cortisol < 18 mcg/dL suggests adrenal insufficiency; ACTH ↑ (the pituitary is pushing)", "k": "table"}, {"id": "cd-dz-c13-addison-risk", "ch": "13", "s": "adrenal", "topic": "Addison disease (primary adrenal insufficiency)", "f": "Addison disease (primary adrenal insufficiency) · risk factors?", "b": "Other autoimmune disease; Tuberculosis; Severe HIV infection", "k": "table"}, {"id": "cd-dz-c13-addison-comp", "ch": "13", "s": "adrenal", "topic": "Addison disease (primary adrenal insufficiency)", "f": "Addison disease (primary adrenal insufficiency) · complications?", "b": "Adrenal crisis: severe hypotension, shock, death; Crisis is often triggered by infection, trauma, surgery or heavy sweating", "k": "table"}, {"id": "cd-dz-c13-addison-tx", "ch": "13", "s": "adrenal", "topic": "Addison disease (primary adrenal insufficiency)", "f": "Addison disease (primary adrenal insufficiency) · treatment?", "b": "Crisis: isotonic IV fluids + IV hydrocortisone; BP should improve in 4–6 h; Lifelong oral glucocorticoid and mineralocorticoid replacement; More salt in hot weather; TB cause: antibiotics; function can return; Fludrocortisone replaces aldosterone; hydrocortisone in divided daily doses", "k": "table"}, {"id": "cd-dz-c13-addison-nurse", "ch": "13", "s": "adrenal", "topic": "Addison disease (primary adrenal insufficiency)", "f": "Addison disease (primary adrenal insufficiency) · nursing priorities?", "b": "Monitor BP, sodium, potassium and glucose; Teach extra salt in hot weather; Teach double the hydrocortisone dose during illness; IV route if vomiting; Watch for signs of crisis during illness or stress", "k": "table"}, {"id": "cd-dz-c14-infert-patho", "ch": "14", "s": "r-fert", "topic": "Infertility", "f": "Infertility · what goes wrong?", "b": "Pregnancy needs every step to work: ovulation, sperm making, intercourse, ejaculation, fertilization, implantation, embryo growth; A problem at any one step breaks the chain; Hormone imbalance → no ovulation or rare ovulation; low testosterone → fewer sperm; Motility impairment → adhesions or blockage from cervix to ovary stop egg and sperm from meeting (Fig 14.10); Immune problem → antibodies destroy sperm before they reach the egg", "k": "table"}, {"id": "cd-dz-c14-infert-etiology", "ch": "14", "s": "r-fert", "topic": "Infertility", "f": "Infertility · causes?", "b": "Male, female, or both partners; Often no exact cause is found; Examples: anovulation, hyperprolactinemia from a pituitary adenoma, infections (PID), leiomyomas (fibroids), endometriosis, thick or hostile cervical mucus, varicocele (Case Study 14.1)", "k": "table"}, {"id": "cd-dz-c14-infert-signs", "ch": "14", "s": "r-fert", "topic": "Infertility", "f": "Infertility · signs (objective)?", "b": "Irregular periods or amenorrhea on history; Pelvic findings; In males often no signs", "k": "table"}, {"id": "cd-dz-c14-infert-symptoms", "ch": "14", "s": "r-fert", "topic": "Infertility", "f": "Infertility · symptoms (what they report)?", "b": "Cannot get pregnant; May have pelvic pain; Dysmenorrhea; Dyspareunia; Testicular/scrotal pain", "k": "table"}, {"id": "cd-dz-c
