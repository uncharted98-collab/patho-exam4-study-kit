<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Patho Exam 4 Quiz</title>
<script>document.documentElement.lang = "en";</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>:root{--bfont:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--hfont:var(--bfont);--bg:#EDF1F5;--surface:#FFFFFF;--surface2:#F5F8FA;--ink:#13202A;--muted:#566674;--line:#D2DBE3;--accent:#0B7A75;--accent-ink:#FFFFFF;
--good:#1A7442;--good-bg:#E2F4E9;--bad:#BF2E46;--bad-bg:#FBE5E9;--lucky:#8A5900;--lucky-bg:#FFF0D2;--focus:#3D4DB7;--shadow:0 1px 2px rgba(19,32,42,.08)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D141A;--surface:#152029;--surface2:#1B2834;--ink:#E6EEF4;--muted:#98A9B6;--line:#28394A;--accent:#39B8AF;--accent-ink:#04201D;
--good:#52C98A;--good-bg:#11301F;--bad:#FF7F93;--bad-bg:#3A1620;--lucky:#F1BA4E;--lucky-bg:#3A2A09;--focus:#8FA0FF;--shadow:none}}
:root[data-theme="dark"]{--bg:#0D141A;--surface:#152029;--surface2:#1B2834;--ink:#E6EEF4;--muted:#98A9B6;--line:#28394A;--accent:#39B8AF;--accent-ink:#04201D;
--good:#52C98A;--good-bg:#11301F;--bad:#FF7F93;--bad-bg:#3A1620;--lucky:#F1BA4E;--lucky-bg:#3A2A09;--focus:#8FA0FF;--shadow:none}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background-color:var(--bg);background-image:var(--bgimg,none);background-size:var(--bgsize,auto);background-attachment:fixed;color:var(--ink);font-family:var(--bfont);font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:10px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 16px;background-color:var(--top-bg,var(--bg));background-image:var(--top-img,none);background-size:var(--top-isz,auto);background-repeat:repeat-x;background-position:left bottom;border-bottom:var(--top-bw,1px) solid var(--top-bd,var(--line))}
.brand{display:flex;align-items:center;gap:8px;background:none;border:0;font-weight:700;font-size:18px;cursor:pointer;padding:6px 0}
.brand .dot{width:14px;height:14px;border-radius:50%;background:conic-gradient(var(--accent) 0 70%,var(--line) 70% 100%)}
.links{display:flex;gap:14px;font-size:15px;font-weight:700}
.links a{text-decoration:none}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 60px}
h1{font-size:28px;line-height:1.15;margin:6px 0 6px}
h2{font-size:20px;margin:22px 0 10px}
h3{font-size:17px;margin:14px 0 8px}
.sub{color:var(--muted);margin:0 0 16px}
.small{font-size:14.5px}.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:10px 18px;border-radius:var(--r-btn,14px);border:var(--btn-bw,2px) solid var(--btn-bd,var(--accent));background:var(--btn-bg,var(--accent));color:var(--btn-ink,var(--accent-ink));font-weight:700;cursor:pointer;text-decoration:none;box-shadow:var(--btn-sh,none);transition:transform .08s ease,box-shadow .08s ease}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--ghost-bd,var(--line));box-shadow:var(--ghost-sh,none)}
.btn.good{background:var(--good);border-color:var(--good);color:#fff}
.btn.lucky{background:transparent;border-color:var(--lucky);color:var(--lucky);box-shadow:var(--ghost-sh,none)}
.btn.block{width:100%}
.btn.sm{min-height:40px;padding:6px 12px;font-size:15px;border-radius:var(--r-btn-sm,11px)}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.cta{display:block;width:100%;text-align:left;border:var(--cta-bd,0);border-radius:var(--r-cta,20px);padding:18px 18px 16px;background:var(--cta-bg,var(--accent));color:var(--btn-ink,var(--accent-ink));cursor:pointer;margin:6px 0 8px;box-shadow:var(--cta-sh,none);transition:transform .08s ease,box-shadow .08s ease}
.cta b{display:block;font-size:22px;line-height:1.2}
.cta span{display:block;font-size:15px;opacity:.92;margin-top:4px}
.cta-note{font-size:14.5px;color:var(--muted);margin:0 2px 18px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{display:grid;gap:2px;text-align:left;background:var(--surface);border:var(--bw,1.5px) solid var(--card-bd,var(--line));border-radius:var(--r-card,16px);padding:12px 14px;cursor:pointer;box-shadow:var(--card-sh,var(--shadow));transition:transform .08s ease}
.mode .mi{font-size:22px;line-height:1}
.mode b{font-size:16.5px}
.mode span{font-size:13.5px;color:var(--muted)}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:8px}
.tile{position:relative;overflow:hidden;text-align:left;border:var(--bw,1.5px) solid var(--card-bd,var(--line));border-radius:var(--r-opt,14px);padding:10px 12px;background:var(--surface);cursor:pointer;min-height:66px}
.tile::before{content:"";position:absolute;inset:auto 0 0 0;height:5px;background:var(--c)}
.tile b{display:block;font-size:15px;line-height:1.25}
.tile .pc{font-size:22px;font-weight:700}
.tile .pc.new{font-size:14px;color:var(--muted)}
.tile.lo{background:var(--bad-bg)}.tile.mid{background:var(--lucky-bg)}.tile.hi{background:var(--good-bg)}
.tile.new{border-style:dashed}
.tile .n{font-size:12.5px;color:var(--muted)}
.set{display:grid;gap:12px;background:var(--surface);border:var(--bw,1.5px) solid var(--card-bd,var(--line));border-radius:var(--r-card,16px);padding:12px 14px;box-shadow:var(--card-sh,var(--shadow))}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:var(--bw,1.5px) solid var(--line);background:var(--surface);border-radius:var(--r-chip,99px);padding:7px 13px;cursor:pointer;font-weight:700;font-size:15px;min-height:40px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* question */
.qbar{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;margin:2px 0 12px}
.x{width:42px;height:42px;border-radius:var(--r-btn-sm,12px);border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-size:18px}
.segs{display:flex;gap:3px}
.segs i{flex:1;height:8px;border-radius:99px;background:var(--line)}
.segs i.ok{background:var(--good)}.segs i.lucky{background:var(--lucky)}.segs i.wrong{background:var(--bad)}.segs i.skip{background:var(--muted)}.segs i.cur{background:var(--ink)}
.qn{font-size:14px;font-weight:700;color:var(--muted);white-space:nowrap}
.why-chip{display:flex;gap:8px;align-items:flex-start;font-size:14.5px;background:var(--surface2);border:var(--bw,1.5px) solid var(--line);border-radius:var(--r-opt,12px);padding:8px 11px;margin:0 0 12px}
.why-chip .ic{font-weight:700;color:var(--accent)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px}
.tag{font-size:12.5px;font-weight:700;border-radius:99px;padding:2px 9px;border:1px solid var(--line);color:var(--muted);background:var(--surface)}
.tag.book{color:#2446A8;background:#E3EBFF;border-color:#B6C7F5}
@media (prefers-color-scheme:dark){.tag.book{color:#B9CBFF;background:#1B2A55;border-color:#34509E}}
.tag.sata{color:var(--bad);border-color:var(--bad)}
.case{background:var(--surface);border:var(--bw,1.5px) solid var(--card-bd,var(--line));border-left:5px solid var(--accent);border-radius:var(--r-opt,14px);padding:10px 12px;margin:0 0 12px;font-size:15.5px}
.case b{display:block;font-size:13px;color:var(--muted);margin-bottom:2px}
.labtbl{width:100%;border-collapse:collapse;margin:8px 0 2px;font-size:15px}
.labtbl td{padding:5px 8px;border-top:1px solid var(--line)}
.labtbl td:nth-child(2){text-align:right;font-weight:700}
.labtbl td:nth-child(3){color:var(--muted);font-size:13px}
.stem{font-size:19px;font-weight:700;line-height:1.4;margin:0 0 12px}
.lead{background:var(--lucky-bg);border:1.5px solid var(--lucky);border-radius:12px;padding:9px 12px;margin:0 0 12px}
.opts{display:grid;gap:9px}
.opt{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;text-align:left;width:100%;min-height:56px;padding:11px 12px;border-radius:var(--r-opt,14px);border:var(--opt-bw,2px) solid var(--opt-bd,var(--line));background:var(--surface);cursor:pointer;box-shadow:var(--opt-sh,var(--shadow));transition:transform .08s ease,box-shadow .08s ease}
.opt .k{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;border:2px solid var(--line);font-weight:700;font-size:15px}
.opt.sq .k{border-radius:8px}
.opt[aria-pressed="true"]{border-color:var(--ink)}
.opt[aria-pressed="true"] .k{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.right .k{background:var(--good);border-color:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.missed{border-style:dashed;border-color:var(--good)}
.opt .rat{display:block;font-size:14.5px;color:var(--muted);margin-top:4px;font-weight:400}
.opt.right .rat,.opt.wrong .rat{color:var(--ink)}
.opt[disabled]{cursor:default}
.conf{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 6px}
.skip{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:10px 4px;font-size:15px}
.verdict{border-radius:var(--r-opt,14px);padding:11px 13px;margin:14px 0 8px;font-weight:700}
.verdict.ok{background:var(--good-bg);color:var(--good)}.verdict.lucky{background:var(--lucky-bg);color:var(--lucky)}.verdict.wrong{background:var(--bad-bg);color:var(--bad)}
.verdict p{margin:4px 0 0;font-weight:400;color:var(--ink)}
details.others{margin:6px 0 0}
details.others summary{cursor:pointer;font-weight:700;color:var(--accent);padding:8px 0}
.next{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));margin-top:14px}
.streak{font-size:14px;font-weight:700;color:var(--lucky)}
/* summary + stats */
.score{display:flex;align-items:baseline;gap:10px;margin:4px 0}
.score b{font-size:44px;line-height:1}
.card{background:var(--surface);border:var(--bw,1.5px) solid var(--card-bd,var(--line));border-radius:var(--r-card,16px);padding:12px 14px;margin:0 0 12px;box-shadow:var(--card-sh,var(--shadow))}
.card h3{margin-top:0}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:120px 1fr 44px;gap:8px;align-items:center;font-size:14.5px}
.bar i{display:block;height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i u{display:block;height:100%;background:var(--c,var(--accent));text-decoration:none}
.bar em{font-style:normal;font-weight:700;text-align:right}
.delta.up{color:var(--good)}.delta.down{color:var(--bad)}
.blur{border-left:4px solid var(--bad);padding:4px 0 4px 10px;margin:8px 0;font-size:15px}
.blur small{display:block;color:var(--muted)}
ul.plain{padding-left:18px;margin:6px 0}
textarea.rep{width:100%;min-height:180px;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;border:1.5px solid var(--line);border-radius:12px;padding:10px;background:var(--surface2);color:var(--ink)}
.spark{width:100%;height:70px;display:block}
/* exam */
.ebar{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;margin:2px 0 12px}
.timer{font-weight:700;font-variant-numeric:tabular-nums;padding:6px 10px;border-radius:10px;background:var(--surface);border:1.5px solid var(--line)}
.timer.low{color:var(--bad);border-color:var(--bad)}
.flagb[aria-pressed="true"]{background:var(--lucky-bg);border-color:var(--lucky);color:var(--lucky)}
.enav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.sheet{position:fixed;inset:0;z-index:40;background:rgba(8,14,20,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet .in{width:100%;max-width:640px;max-height:82vh;overflow:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:7px;margin:10px 0 14px}
.qgrid button{min-height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer}
.qgrid button.ans{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.qgrid button.fl{box-shadow:inset 0 -5px 0 var(--lucky)}
.qgrid button.cur{outline:3px solid var(--accent);outline-offset:1px}
.rev{border:var(--bw,1.5px) solid var(--line);border-radius:var(--r-opt,14px);background:var(--surface);margin:8px 0;padding:0 12px}
.rev summary{cursor:pointer;padding:10px 0;font-weight:700;list-style:none;display:grid;grid-template-columns:26px 1fr;gap:8px}
.rev summary::-webkit-details-marker{display:none}
.rev .mk{font-weight:700}.rev .mk.ok{color:var(--good)}.rev .mk.no{color:var(--bad)}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;max-width:90vw;text-align:center}
@media (prefers-reduced-motion:no-preference){.pop{animation:pop .22s ease-out}@keyframes pop{from{transform:translateY(6px);opacity:.4}to{transform:none;opacity:1}}}
@media (max-width:380px){.modes{grid-template-columns:1fr}.bar{grid-template-columns:96px 1fr 40px}}
.verdict{margin:0 0 12px}
.timer{min-width:64px;text-align:center}
.tag.lec{border-color:#D9A400;background:#FFF1B8;color:#5A3D00}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tag.lec{background:#3A2E00;color:#FFE9A8;border-color:#E0B000}}
:root[data-theme="dark"] .tag.lec{background:#3A2E00;color:#FFE9A8;border-color:#E0B000}
.tag.fix{color:var(--lucky);background:var(--lucky-bg);border-color:var(--lucky)}
.chsel{display:grid;gap:6px;margin:0 0 14px}
.chh{margin:18px 0 8px;font-size:16px;color:var(--muted)}
.newcard{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.newcard p{margin:0}
.newcard .btn{margin-top:10px}
.tag.fig{color:#5A2E8C;background:#F0E6FF;border-color:#C9B0EE}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tag.fig{color:#E3D2FF;background:#2E1F4A;border-color:#6B4FA8}}
:root[data-theme="dark"] .tag.fig{color:#E3D2FF;background:#2E1F4A;border-color:#6B4FA8}
.qfig{margin:0 0 12px;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:6px;color-scheme:light}
.qfig-sc{overflow-x:auto;overflow-y:hidden;border-radius:9px;overscroll-behavior-x:contain}
.qfig img{display:block;width:100%;height:auto}
.qfig:not(.zoomed) img{max-height:62vh;object-fit:contain}
.qfig.zoomed img{width:220%;max-width:none}
.qfig figcaption{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 4px 0;font-size:14px;font-weight:700;color:#3A4A57}
.qfig .btn.ghost{color:#13202A;border-color:#C9D3DC;background:#fff;min-height:40px}
.hook{margin:12px 0 2px;padding:10px 13px 11px;border-radius:var(--r-opt,14px);background:var(--surface);border:1.5px solid var(--line);border-left:6px solid #7A3E9D}
.hook b{display:block;font-size:15px;color:#5A2E8C}
.hook p{margin:3px 0 0}
details.rev .hook{margin:8px 0 4px;font-size:15.5px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hook{border-left-color:#A47BD0}:root:not([data-theme="light"]) .hook b{color:#C9A8F0}}
:root[data-theme="dark"] .hook{border-left-color:#A47BD0}
:root[data-theme="dark"] .hook b{color:#C9A8F0}
.newlist{margin:6px 0 0;padding-left:20px;font-size:15.5px}
.newlist li{margin:2px 0}
.plan{border:2px solid var(--accent);padding:14px}
.pl-set p{margin:4px 0 8px}
.pl-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pl-row input[type=date]{font:inherit;padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);min-height:44px;color-scheme:light dark}
.pl-head{display:flex;gap:12px;align-items:center}
.pl-cd{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:66px;height:66px;border-radius:var(--r-card,16px);background:var(--btn-bg,var(--accent));color:var(--btn-ink,var(--accent-ink))}
.pl-cd b{font-size:27px;line-height:1}
.pl-cd small{font-size:11.5px;font-weight:700}
.pl-txt{flex:1;min-width:0}
.pl-txt b{display:block;font-size:18px}
.pl-txt span{display:block;color:var(--muted);font-size:15px}
.pl-phase{margin:10px 0 0;font-size:15px}
.pl-edit{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;min-width:44px;min-height:44px;cursor:pointer;font-size:17px}
.pl-today{margin:12px 0 10px}
.pl-tt{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:15.5px}
.pbar{display:block;height:12px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px}
.pbar u{display:block;height:100%;background:var(--good);text-decoration:none;border-radius:99px}
.pl-warn{color:var(--lucky);margin:6px 0 0;font-weight:700}
.cta.today{margin:4px 0 0}
.cta.alt{background:var(--surface);color:var(--ink);border:2px solid var(--accent);box-shadow:var(--card-sh,var(--shadow))}
.cta.alt b{font-size:19px}
.cta.alt span{color:var(--muted);opacity:1}
.nextbest{margin:10px 2px 0;font-weight:700;font-size:15.5px}
.modes .mode:last-child:nth-child(odd){grid-column:1/-1}
.opt.tfrow{cursor:default}
.tfrow .tf-txt{padding-top:4px}
.tfrow .tf-btns{grid-column:1/-1;display:flex;gap:8px}
.tfb{flex:1;min-height:44px;border-radius:var(--r-btn-sm,10px);border:2px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:700;font-size:15px;cursor:pointer}
.tfb.t[aria-pressed="true"]{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.tfb.f[aria-pressed="true"]{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.opt.tf-t{border-color:var(--good)}
.opt.tf-f{border-color:var(--bad)}
.tfhint{margin:10px 2px 0;color:var(--muted)}
.tfnote{margin:10px 2px 0}
.ai{margin:12px 0 4px;padding:12px 13px;border-radius:14px;background:var(--surface);border:1.5px dashed #7A3E9D}
.card.ai{border-style:dashed}
.ai-h{display:flex;flex-direction:column;gap:2px;margin-bottom:8px}
.ai-h b{color:#5A2E8C;font-size:16px}

, "nav": "Hearing & balance", "title": "Hearing, balance, otitis media, Ménière", "color": "#B8860B", "ch": "12"}, {"id": "other", "nav": "Taste, smell & models", "title": "Taste, smell, fibromyalgia, migraine", "color": "#7A5C2E", "ch": "12"}, {"id": "basics", "nav": "Hormone regulation", "title": "How hormones are controlled", "color": "#1F7A8C", "ch": "13"}, {"id": "stress", "nav": "Stress response", "title": "Stress response & general adaptation syndrome", "color": "#C05621", "ch": "13"}, {"id": "pituitary", "nav": "Pituitary & water", "title": "Pituitary, SIADH & diabetes insipidus", "color": "#3949AB", "ch": "13"}, {"id": "thyroid", "nav": "Thyroid", "title": "Hyperthyroidism (Graves) & hypothyroidism", "color": "#7B3FA0", "ch": "13"}, {"id": "adrenal", "nav": "Adrenal & cortisol", "title": "Cushing syndrome & Addison disease", "color": "#B5562B", "ch": "13"}, {"id": "r-basics", "nav": "Reproductive basics", "title": "Anatomy, hormones, the cycle & sperm", "color": "#B03A6E", "ch": "14"}, {"id": "r-fert", "nav": "Infertility", "title": "Infertility: causes, tests & treatment", "color": "#8E3B8C", "ch": "14"}, {"id": "r-pelvic", "nav": "Endometriosis, PID & PCOS", "title": "Endometriosis, pelvic inflammatory disease, PCOS", "color": "#C2413B", "ch": "14"}, {"id": "r-ovary", "nav": "Ovarian cancer & menopause", "title": "Ovarian cancer, menopause & HRT", "color": "#9C4A1A", "ch": "14"}, {"id": "r-male", "nav": "ED & BPH", "title": "Erectile dysfunction & benign prostatic hyperplasia", "color": "#1E6A9E", "ch": "14"}, {"id": "r-mcancer", "nav": "Prostate & testicular cancer", "title": "Prostate cancer & testicular cancer", "color": "#2C5F5D", "ch": "14"}, {"id": "a-theory", "nav": "Theories of aging", "title": "Developmental & stochastic theories", "color": "#5E6B2E", "ch": "19"}, {"id": "a-systems", "nav": "Body changes with age", "title": "Fluid, immunity, nerves, temperature, kidneys, gut", "color": "#47648A", "ch": "19"}, {"id": "a-bone", "nav": "Osteoporosis", "title": "Osteoporosis: DEXA, risks & drugs", "color": "#8A6A3B", "ch": "19"}, {"id": "a-ad", "nav": "Alzheimer disease", "title": "Plaques, tangles, 7 stages & care", "color": "#6A4C93", "ch": "19"}, {"id": "a-progeria", "nav": "Progeria", "title": "Hutchinson-Gilford progeria syndrome", "color": "#A0522D", "ch": "19"}], "items": [{"id": "q-somato-01", "s": "somato", "k": "bank", "q": "Which sensory receptor is responsible for impulses resulting in the sensation of touch?", "o": ["Mechanoreceptor", "Chemoreceptor", "Nociceptor", "Osmoreceptor"], "a": [0], "w": ["Correct. Mechanoreceptors respond to mechanical forces such as touch, pressure and vibration.", "Chemoreceptors detect chemicals (taste, smell, blood chemistry), not touch.", "Nociceptors detect tissue damage and signal pain.", "Osmoreceptors sense changes in fluid concentration."], "m": false, "b": "Ch 12 #1", "x": false, "r": false, "d": 0.3, "t": "somato", "ev": "For example, when the mechanoreceptor is stimulated, the impulse is transmitted on dedicated primary afferent neurons projecting to mechanoreceptor second-order neurons that synapse onto specific mechanoreceptive areas in the brain."}, {"id": "q-somato-02", "s": "somato", "k": "bank", "q": "Which somatosensory neurons carry sensory information from the thalamus to the cerebral cortex and are present in the greatest quantity?", "o": ["First order", "Second order", "Third order", "Interneuron"], "a": [2], "w": ["First-order neurons carry information from the periphery to the CNS.", "Second-order neurons relay input to the thalamus.", "Correct. Third-order neurons run thalamus → somatosensory cortex. Numbers increase with each order, so they are the most numerous.", "Interneurons modify signals throughout the network but are not the thalamus-to-cortex relay."], "m": false, "b": "Ch 12 #2", "x": false, "r": false, "d": 0.5, "t": "somato", "ev": "The numbers of neurons increase consistent with their order; third-order neurons are present in the greatest quantity."}, {"id": "q-hearing-01", "s": "hearing", "k": "bank", "q": "The most likely site of pathology leading to alterations in balance is the:", "o": ["external ear.", "middle ear.", "internal ear.", "tympanic membrane."], "a": [2], "w": ["The external ear collects sound; it has no balance organs.", "The middle ear conducts sound through the ossicles; balance organs are not there.", "Correct. The vestibular apparatus (semicircular canals, utricle, saccule) sits in the inner ear.", "The eardrum vibrates with sound and does not sense head position."], "m": false, "b": "Ch 12 #3", "x": false, "r": false, "d": 0.4, "t": "hearing", "ev": "The perilymph in the semicircular canals senses motion caused by body movement, stimulating the hair cells lining the vestibular apparatus."}, {"id": "q-pain-01", "s": "pain", "k": "bank", "q": "Which type of pain involves a typical pattern of impulse conduction and originates outside of the nervous system?", "o": ["Neurogenic", "Nociceptive", "Neuropathic", "Analgesic"], "a": [1], "w": ["Neurogenic pain arises from the nervous system itself.", "Correct. Nociceptive pain uses normal receptors and pathways, triggered by tissue injury outside the nervous system.", "Neuropathic pain comes from damage or dysfunction in the nervous system, with abnormal processing.", "Analgesia is pain relief, not a pain type."], "m": false, "b": "Ch 12 #4", "x": false, "r": false, "d": 0.5, "t": "pain", "ev": "Nociceptive pain involves specific receptors and pathways resulting in the sensation of pain."}, {"id": "q-vision1-01", "s": "vision1", "k": "bank", "q": "Hyperopia is a condition characterized by:", "o": ["alterations in eye movement.", "infection of the conjunctiva.", "increased sensitivity to light.", "error in refraction."], "a": [3], "w": ["Eye-movement problems are strabismus or nystagmus.", "Conjunctival infection is conjunctivitis.", "Light sensitivity is photophobia.", "Correct. Hyperopia (farsightedness) is a refractive error: the image focuses behind the retina."], "m": false, "b": "Ch 12 #5", "x": false, "r": false, "d": 0.3, "t": "vision1", "ev": "Hyperopia, commonly referred to as farsightedness, is caused by the focusing of an image behind the retina, which alters the transmission of light."}, {"id": "q-hearing-02", "s": "hearing", "k": "bank", "q": "Infection of the middle ear is also known as:", "o": ["mastoiditis.", "vestibulitis.", "otitis media.", "labyrinthitis."], "a": [2], "w": ["Mastoiditis is infection of the mastoid bone, a possible complication of otitis media.", "Vestibulitis is not a middle-ear infection.", "Correct. Otitis media = infection of the middle ear.", "Labyrinthitis involves the inner ear."], "m": false, "b": "Ch 12 #6", "x": false, "r": false, "d": 0.2, "t": "hearing", "ev": "Otitis media, infection of the middle ear, is one of the most common disorders of the middle ear."}, {"id": "q-hearing-03", "s": "hearing", "k": "bank", "q": "Sensorineural hearing loss is:", "o": ["often permanent, resulting from disease, trauma, or genetic defect.", "localized to the middle ear and is often temporary.", "caused by alteration in auditory signal processing in the brain.", "a response to immobility of the tympanic membrane."], "a": [0], "w": ["Correct. Sensorineural loss involves the cochlear hair cells or auditory nerve and is often permanent.", "That describes conductive loss (outer/middle ear), which is often temporary.", "That describes a central auditory processing problem.", "An immobile eardrum causes conductive loss."], "m": false, "b": "Ch 12 #7", "x": false, "r": false, "d": 0.5, "t": "hearing", "ev": "The internal ear or the cochlear nerve is usually involved in sensorineural hearing loss."}, {"id": "q-pain-02", "s": "pain", "k": "bank", "q": "The mechanism of action of opioid analgesics is:", "o": ["blockade of serotonin reuptake at the synaptic cleft.", "inhibition of cyclooxygenase enzymes and prostaglandin production.", "stimulation of large fibers to modulate pain transmission.", "pain modulation at the level of the spinal cord by binding to mu, delta, and kappa receptors."], "a": [3], "w": ["Blocking serotonin reuptake is how tricyclic antidepressants help chronic pain.", "COX inhibition is how aspirin and NSAIDs work.", "Large-fiber stimulation is how TENS and massage close the gate.", "Correct. Opioids bind mu, delta and kappa receptors and modulate pain at the spinal cord."], "m": false, "b": "Ch 12 #8", "x": false, "r": false, "d": 0.4, "t": "pain", "ev": "…ics (e.g., morphine, codeine) · Bind to mu, delta, and kappa receptors, modulating pain at the level of the spinal cord · Stimulate release of endogenous opioids, including enkephalins, endorphins, and dynorphins · Adjuvant analgesics (tricyclic antidepressants) · Block reuptake of serotonin from the…"}, {"id": "q-vision2-01", "s": "vision2", "k": "bank", "q": "Which one of the following eye conditions is the result of increased intraocular pressure?", "o": ["Retinopathy of prematurity (ROP)", "Glaucoma", "Wet macular degeneration", "Dry macular degeneration"], "a": [1], "w": ["ROP is abnormal retinal vessel growth in premature infants.", "Correct. Glaucoma = optic nerve damage from increased intraocular pressure.", "Wet MD is new vessel growth under the macula.", "Dry MD is breakdown of macular cells."], "m": false, "b": "Ch 12 #9", "x": false, "r": false, "d": 0.2, "t": "vision2", "ev": "PATHOPHYSIOLOGY · Glaucoma, a group of eye conditions that damage the optic nerve, is associated with increased intraocular pressure (IOP)."}, {"id": "q-hearing-04", "s": "hearing", "k": "bank", "q": "Balance and body position are the function of:", "o": ["the utricle.", "the saccule.", "the semicircular canals.", "all of the above."], "a": [3], "w": ["The utricle helps, but so do the other two.", "The saccule helps, but so do the other two.", "The canals help (rotation), but so do the utricle and saccule.", "Correct. All three make up the vestibular apparatus, which senses head position and movement."], "m": false, "b": "Ch 12 #10", "x": false, "r": false, "d": 0.4, "t": "hearing", "ev": "The utricle senses change in horizontal head position while the saccule is responsive to vertical acceleration.", "fx": 1}, {"id": "q-hearing-05", "s": "hearing", "k": "bank", "q": "Damage to the cochlear hair cells may result in:", "o": ["hearing loss.", "loss of balance.", "lack of proprioception.", "none of the above."], "a": [0], "w": ["Correct. Cochlear hair cells in the organ of Corti create the nerve impulse for hearing; damage → sensorineural hearing loss.", "Balance depends on vestibular hair cells, not cochlear ones.", "Proprioception comes from muscle spindles, Golgi tendon organs and joint receptors.", "Hearing loss is the result."], "m": false, "b": "Ch 12 #11", "x": false, "r": false, "d": 0.3, "t": "hearing", "ev": "Within the cochlea, the organ of Corti (spiral organ) contains hair cells, the receptors responsible for the neural impulse that allows hearing.", "fx": 1}, {"id": "q-other-01", "s": "other", "k": "bank", "q": "Fibromyalgia is diagnosed by:", "o": ["loss of bone mass.", "muscle inflammation.", "weight loss.", "multiple tender points."], "a": [3], "w": ["Bone loss is osteoporosis.", "Fibromyalgia is not an inflammatory muscle disease.", "Weight loss is not a criterion.", "Correct. The book lists 18 tender point sites used in recognizing fibromyalgia."], "m": false, "b": "Ch 12 #12", "x": false, "r": false, "d": 0.3, "t": "other", "ev": "Pain must be present in 12 of the 18 tender point sites for diagnosis."}, {"id": "q-pain-03", "s": "pain", "k": "bank", "q": "Which of the following is a symptom?", "o": ["Pain", "Hearing loss", "Loss of proprioception", "None of the above"], "a": [0], "w": ["Correct. A symptom is subjective: only the patient can report it. Pain evaluation centers on the patient's subjective perception.", "Hearing loss can be measured objectively (audiometry), so it is a sign.", "Proprioception can be tested on exam, so its loss is a sign.", "Pain is a symptom."], "m": false, "b": "Ch 12 #13", "x": false, "r": false, "d": 0.5, "t": "pain", "ev": "MANIFESTATIONS AND EVALUATION OF PAIN · Pain management includes a careful evaluation of the subjective perception of pain.", "fx": 1}, {"id": "q-pain-04", "s": "pain", "k": "bank", "q": "Which report of pain level (0 to 10) is considered moderate, requiring medications?", "o": ["1", "2", "3", "4"], "a": [3], "w": ["1 is mild.", "2 is mild.", "3 is mild.", "Correct. On the 0–10 scale, 4 begins the moderate range."], "m": false, "b": "Ch 12 #14", "x": false, "r": false, "d": 0.4, "t": "pain", "ev": "End-of-chapter question; the chapter text doesn't print the scale. Standard 0–10 bands: 1–3 mild, 4–6 moderate, 7–10 severe."}, {"id": "q-pain-05", "s": "pain", "k": "bank", "q": "The neuromatrix theory of pain states:", "o": ["specific stimuli cause predictable pain responses.", "specific stimuli results in prevention of impulse crossing in spinal cord.", "neural network integration of multiple inputs determines pain perception.", "pain perception is determined by duration of impulse and amount of tissue involved."], "a": [2], "w": ["That is specificity theory.", "That is gate control theory.", "Correct. Pain comes from a widely distributed brain network (body-self neuromatrix) integrating many inputs.", "Not a theory from the chapter."], "m": false, "b": "Ch 12 #15", "x": false, "r": false, "d": 0.5, "t": "pain", "ev": "Pain perception is the result of impulses generated along a widely distributed neural network in the brain (body-self neuromatrix), triggered either by sensory inputs or independent of identified stimulation."}, {"id": "q-somato-03", "s": "somato", "k": "bank", "q": "Which sensations travel on the anterolateral (spinothalamic) pathway? Select all that apply.", "o": ["Pain", "Temperature", "Crude touch", "Vibration", "Two-point discrimination"], "a": [0, 1, 2], "w": ["True. Pain travels the anterolateral pathway.", "True. Temperature travels the anterolateral pathway.", "True. Crude touch that doesn't need exact location travels here.", "False. Vibration is carried by the discriminative (posterior column) pathway.", "False. Fine, localized touch like two-point discrimination is discriminative."], "m": true, "b": null, "x": false, "r": false, "d": 0.6, "t": "somato.paths", "ev": "The anterolateral pathway involves both the anterior and lateral spinothalamic pathways and is characterized by multiple synapses and slow conduction."}, {"id": "q-somato-04", "s": "somato", "k": "bank", "q": "A patient with a posterior column lesion would most likely have trouble with which task?", "o": ["Feeling a pinprick", "Telling hot from cold water", "Identifying a key in the hand with eyes closed", "Noticing a deep ache"], "a": [2], "w": ["Pinprick (pain) travels the anterolateral pathway.", "Temperature travels the anterolateral pathway.", "Correct. Identifying an object by touch needs fine touch and position sense, carried by the discriminative (posterior column) pathway.", "Aching pain is anterolateral."], "m": false, "b": null, "x": false, "r": false, "d": 0.6, "t": "somato.paths", "ev": "The discriminative pathway communicates sensory information, including discriminative touch and spatial orientation."}, {"id": "q-somato-05", "s": "somato", "k": "bank", "q": "Which receptor detects heavy, continuous touch and pressure?", "o": ["Meissner corpuscle", "Merkel disk", "Pacinian corpuscle", "Ruffini ending"], "a": [3], "w": ["Meissner corpuscles give a highly developed sense of touch.", "Merkel disks detect light objects moving over the skin.", "Pacinian corpuscles detect vibration.", "Correct. Ruffini endings respond to heavy, continuous touch and pressure."], "m": false, "b": null, "x": false, "r": false, "d": 0.5, "t": "somato.receptors", "ev": "…llicle receptors (detect movement on the body’s surface) · Ruffini endings (detect heavy and continuous touch and pressure) · Thermal Sensation · Thermoreceptors (receptors that recognize temperature sensation) are located under the skin and include cold, warmth, and pain receptors (discussed later in this chapter).…"}, {"id": "q-somato-06", "s": "somato", "k": "bank", "q": "Which structures provide position sense (proprioception)? Select all that apply.", "o": ["Muscle spindles", "Golgi tendon organs", "Proprioceptors in joints", "Cochlear hair cells", "Free nerve endings for pain"], "a": [0, 1, 2], "w": ["True. Muscle spindles sense muscle stretch.", "True. Golgi tendon organs sense tendon tension.", "True. Proprioceptors are the main position sensors.", "False. Cochlear hair cells are for hearing.", "False. These are nociceptors."], "m": true, "b": null, "x": false, "r": false, "d": 0.5, "t": "somato.position", "ev": "Position Sensation · Limb/body movement and position sensation, independent of vision, are mediated by proprioceptors, muscle spindles, and Golgi tendon organs."}, {"id": "q-somato-07", "s": "somato", "k": "bank", "q": "A nurse tests sensation by touching a patient's fingertip with two points at once. What is being tested?", "o": ["Proprioception", "Two-point discrimination", "Crude touch", "Nociception"], "a": [1], "w": ["Proprioception is position sense.", "Correct. Telling two touched spots apart is two-point discrimination, a discriminative-pathway function.", "Crude touch can't separate two close points.", "Nociception is pain detection."], "m": false, "b": null, "x": false, "r": false, "d": 0.4, "t": "somato.paths", "ev": "The discriminative pathway identifies an object based on touch or the location of skin touch in two different areas, known as two-point discrimination."}, {"id": "q-pain-06", "s": "pain", "k": "bank", "q": "A client's lower back pain eased with a back rub, and he asks why. What is the nurse's best response?", "o": ["“Rubbing stimulates large nerve fibers that close the pain gate in your spinal cord.”", "“Each pain has its own dedicated nerve.”", "“It changes the pattern of nerve firing.”", "“Your brain builds pain from memory.”"], "a": [0], "w": ["Correct. That's the gate control theory.", "That's specificity theory.", "That's pattern theory.", "That's the neuromatrix theory, which explains phantom pain."], "m": false, "b": null, "x": false, "r": false, "d": 0.4, "t": "pain.gate", "ev": "Gate Control Theory · The gate control theory is one of the most well-known theories on the physiologic basis of pain, representing an explanation for pain that unites the contrasting principles underlying pattern and specificity theory."}, {"id": "q-pain-07", "s": "pain", "k": "bank", "q": "Which of these are endogenous opioids? Select all that apply.", "o": ["Endorphins", "Enkephalins", "Dynorphins", "Prostaglandins", "Substance P"], "a": [0, 1, 2], "w": ["True.", "True.", "True.", "False. Prostaglandins promote pain; NSAIDs block them.", "False. Substance P is an algesic (pain-causing) substance."], "m": true, "b": null, "x": false, "r": false, "d": 0.5, "t": "pain.opioid", "ev": "…endogenous opioids, including enkephalins, endorphins, and dynorphins · Adjuvant analgesics (tricyclic antidepressants) · Block reuptake of serotonin from the synaptic cleft · Particularly useful in chronic pain · Module 2 Alterations in Vision · Vision is an important sensory function that informs us abo…"}, {"id": "q-pain-08", "s": "pain", "k": "bank", "q": "Which substances are released at injury and promote pain (algesic)? Select all that apply.", "o": ["Substance P", "Prostaglandins", "Bradykinin", "Endorphins", "Enkephalins"], "a": [0, 1, 2], "w": ["True.", "True.", "True. Bradykinin is an algesic substance.", "False. Endorphins relieve pain.", "False. Enkephalins relieve pain."], "m": true, "b": null, "x": false, "r": false, "d": 0.6, "t": "pain.nociception", "ev": "…d potassium ions, serotonin, histamine, prostaglandins, and bradykinin · Transmission of nerve impulses from tissues to the CNS · Occurs along type A-delta and type C fibers · Rapidly conducting type A fibers · Produce sensations of sharp, stinging, or pin-prick–type local sensations · Induced by mechanical…"}, {"id": "q-pain-09", "s": "pain", "k": "bank", "q": "A client reports a heavy ache in the left arm and jaw. What should the nurse do first?", "o": ["Treat it as possible referred cardiac pain and get help now", "Apply heat to the arm", "Give an NSAID and recheck in an hour", "Document it as a muscle strain"], "a": [0], "w": ["Correct. Pain felt far from its source can be referred from the heart; rule out a heart attack first.", "Heat could delay a cardiac workup.", "Waiting is unsafe.", "Don't assume a benign cause."], "m": false, "b": null, "x": false, "r": false, "d": 0.3, "t": "pain.types", "ev": "Referred pain is pain that is felt in an area that is distant from the pain’s actual source."}, {"id": "q-pain-10", "s": "pain", "k": "bank", "q": "A newborn needs a heel-stick. What should the nurse do first to reduce pain?", "o": ["Offer a pacifier for nonnutritive sucking", "Wait until the infant cries", "Give an opioid before every heel-stick", "Lay the infant flat without holding"], "a": [0], "w": ["Correct. Nonnutritive sucking has some of the best evidence for infant pain.", "Comfort should start before the pain.", "Opioids aren't routine for a heel-stick.", "Holding and swaddling help; leaving the infant alone doesn't."], "m": false, "b": null, "x": false, "r": false, "d": 0.5, "t": "pain.newborn", "ev": "The nonpharmacologic interventions with the best evidence in the reduction of pain in infants include the behavioral strategies of nonnutritive sucking (e.g., pacifier), swaddling, rocking, and holding."}, {"id": "q-pain-11", "s": "pain", "k": "bank", "q": "A client with neuropathic pain asks why he was given an antidepressant when he isn't depressed. What is the nurse's best response?", "o": ["“It blocks serotonin reuptake, which helps block pain signals.”", "“It blocks the COX enzymes like ibuprofen does.”", "“It binds opioid receptors.”", "“It numbs the skin over the painful area.”"], "a": [0], "w": ["Correct. Tricyclics help neuropathic pain by blocking serotonin reuptake.", "That's NSAIDs.", "That's opioids.", "That's a topical anesthetic."], "m": false, "b": null, "x": false, "r": false, "d": 0.5, "t": "pain.drugs", "ev": "…Block reuptake of serotonin from the synaptic cleft · Particularly useful in chronic pain · Module 2 Alterations in Vision · Vision is an important sensory function that informs us about the world around us.…"}, {"id": "q-pain-12", "s": "pain", "k": "bank", "q": "Which pain-control approach for acute pain matches the book's comfort measures? Select all that apply.", "o": ["Cold to reduce swelling", "Heat to increase local circulation", "Distraction", "Withholding analgesia so the patient can report true pain", "Telling the patient pain is expected and must be tolerated"], "a": [0, 1, 2], "w": ["True. Cold vasoconstricts and reduces swelling.", "True. Heat raises circulation and lowers ischemia.", "True. Distraction is a cognitive-behavioral method.", "False. Pain should be treated, not withheld.", "False. Pain is whatever the patient says it is and should be treated."], "m": true, "b": null, "x": false, "r": false, "d": 0.5, "t": "pain.nonpharm", "ev": "…welling and stimulation of nociceptive pain fibers · Reduced afferent activity · Transcutaneous electrical nerve stimulation (TENS) · Transmission of electrical impulses across the skin to peripheral nerve fibers · Stimulation of large fibers to modulate pain transmission · Acupuncture · Ins…"}, {"id": "q-pain-13", "s": "pain", "k": "case", "q": "Which finding is most consistent with this patient's type of pain?", "o": ["Burning, shooting pain from nerve damage", "Pain from inflamed skin only", "Referred pain from the heart", "Psychogenic pain with no cause"], "a": [0], "w": ["Correct. Post-herpetic pain after shingles is neuropathic: damaged nerves fire abnormally.", "The rash has healed, so this is not skin inflammation.", "The pattern follows a dermatome, not the heart.", "There is a clear nerve cause."], "m": false, "b": null, "x": false, "r": false, "d": 0.6, "t": "pain.types", "ev": "Pain originating within the CNS is termed neurogenic or neuropathic.", "c": "A 72-year-old had shingles on her right trunk 3 months ago. The rash is gone, but she reports burning, electric pain in the same band and can't stand her shirt touching the skin.", "cn": "Burning band after shingles"}, {"id": "q-pain-14", "s": "pain", "k": "case", "q": "What is the nurse's best first action?", "o": ["Tell him the foot is gone so the pain is not real", "Accept the report as real pain and assess it fully", "Document it as confusion", "Give a placebo"], "a": [1], "w": ["Phantom pain is real to the patient.", "Correct. Phantom pain is a real experience; pain is what the person says it is.", "It's not confusion.", "Placebos deceive the patient and aren't appropriate."], "m": false, "b": null, "x": false, "r": false, "d": 0.4, "t": "pain.types", "ev": "The neuromatrix theory of pain can help explain phantom and chronic pain.", "c": "Two weeks after a below-knee amputation, a 58-year-old man says his missing foot is cramping and burning. He seems embarrassed and asks if he is \"going crazy.\"", "cn": "Pain in a missing foot"}, {"id": "q-pain-15", "s": "pain", "k": "bank", "q": "Which non-drug methods does the book say modulate pain by stimulating large fibers? Select all that apply.", "o": ["TENS", "Acupuncture", "Guided imagery", "Biofeedback", "Opioid injection"], "a": [0, 1], "w": ["True. TENS sends impulses across the skin to stimulate large fibers.", "True. Acupuncture stimulates large fibers and endorphin secretion.", "False. Imagery is a cognitive-behavioral method.", "False. Biofeedback is cognitive awareness of body function.", "False. Opioids bind mu, delta, kappa receptors."], "m": true, "b": null, "x": false, "r": false, "d": 0.6, "t": "pain.nonpharm", "ev": "…ibers to modulate pain transmission · Acupuncture · Insertion of needles at specific points on the body surface · Stimulates secretion of endorphins · Stimulates large fibers to modulate pain transmission · Pharmacologic · Non-narcotic analgesia (e.g., aspirin, nonsteroidal anti-inflammatories, or…"}, {"id": "q-pain-16", "s": "pain", "k": "bank", "q": "A patient describes a sharp, stinging, pinprick pain right where a needle went in. Which fibers carry this?", "o": ["Type A-delta fibers", "Type C fibers", "Third-order neurons only", "Vestibular fibers"], "a": [0], "w": ["Correct. Fast type A fibers carry sharp, stinging, localized pain from mechanical or thermal stimuli.", "C fibers carry dull, aching, burning, poorly localized pain, triggered chemically.", "Not a fiber type.", "Unrelated to pain."], "m": false, "b": null, "x": false, "r": false, "d": 0.5, "t": "pain.fibers", "ev": "…the CNS · Occurs along type A-delta and type C fibers · Rapidly conducting type A fibers · Produce sensations of sharp, stinging, or pin-prick–type local sensations · Induced by mechanical or thermal stimuli · Impulses along type C fibers producing a dull ache or burning general response · Induced…"}, {"id": "q-pain-17", "s": "pain", "k": "bank", "q": "Which theory helps explain phantom and chronic pain?", "o": ["Specificity theory", "Pattern theory", "Gate control theory", "Neuromatrix theory"], "a": [3], "w": ["Specificity ties specific stimuli to specific pain.", "Pattern theory says intense stimulation of any modality causes pain.", "Gate control explains spinal modulation.", "Correct. Pain can be generated by the brain's network even without stimulus, which fits phantom and chronic pain."], "m": false, "b": null, "x": false, "r": false, "d": 0.5, "t": "pain.theory", "ev": "The neuromatrix theory of pain can help explain phantom and chronic pain."}, {"id": "q-pain-18", "s": "pain", "k": "case", "q": "Which type of pain is most likely in this patient?", "o": ["Dull C-fiber pain only", "Referred pain", "Phantom pain", "Neuropathic pain"], "a": [1], "w": ["The key feature is location, not quality.", "Correct. Pain felt far from its source (shoulder from the gallbladder/diaphragm) is referred: nociceptors from several areas converge in one tract.", "Nothing was amputated.", "No nerve damage is described."], "m": false, "b": null, "x": false, "r": false, "d": 0.5, "t": "pain.types", "ev": "Referred pain may result because nociceptors from several areas converge in a single ascending tract in the spinal cord.", "c": "A 45-year-old with gallbladder inflammation reports aching pain in the right shoulder. The shoulder exam is normal.", "cn": "Shoulder pain, normal shoulder"}, {"id": "q-vision1-02", "s": "vision1", "k": "bank", "q": "A patient reads well up close but sees road signs blurry. The image is focusing:", "o": ["in front of the retina (myopia)", "behind the retina (hyperopia)", "on an irregular cornea (astigmatism)", "normally; this is a retinal problem"], "a": [0], "w": ["Correct. Myopia (nearsightedness): image falls in front of the retina, so distance is blurred.", "Hyperopia blurs near vision.", "Astigmatism blurs at all distances.", "Blurred distance with clear near vision is a refraction error."], "m": false, "b": null, "x": false, "r": false, "d": 0.4, "t": "vision1.refraction", "ev": "One common error in refraction is myopia, commonly known as nearsightedness."}, {"id": "q-vision1-03", "s": "vision1", "k": "bank", "q": "Which lens corrects myopia?", "o": ["Convex lens", "Concave lens", "Cylindrical lens only", "No lens; myopia is treated with eye drops"], "a": [1], "w": ["Convex lenses converge light and correct hyperopia.", "Correct. A concave lens makes light diverge, pushing the focus back onto the retina.", "Not the book's correction for myopia.", "Myopia is corrected with lenses or LASIK."], "m": false, "b": null, "x": false, "r": false, "d": 0.5, "t": "vision1.refraction", "ev": "A concave lens causes light to diverge, providing correction of myopia.", "h": "Myopia → Minus (concave). Hyperopia → Plus (convex).", "hc": "Lens trick"}, {"id": "q-vision1-04", "s": "vision1", "k": "bank", "q": "A 52-year-old now holds menus at arm's length to read and asks if something is wrong. What is the nurse's best response?", "o": ["“This is presbyopia: with age the lens can't focus up close as well.”", "“Your eyeball is getting longer.”", "“This is early glaucoma.”", "“Your retina is detaching.”"], "a": [0], "w": ["Correct. Presbyopia is age-related loss of near accommodation.", "A long eyeball causes myopia.", "Glaucoma damages peripheral vision.", "Detachment is sudden and urgent."], "m": false, "b": null, "x": false, "r": false, "d": 0.4, "t": "vision1.refraction", "ev": "Presbyopia, a condition of farsightedness associated with aging, results from the inability of the ciliary muscle and lens to accommodate for near vision."}, {"id": "q-vision1-05", "s": "vision1", "k": "bank", "q": "Blurring at all distances from an irregularly curved cornea is:", "o": ["Myopia", "Hyperopia", "Astigmatism", "Presbyopia"], "a": [2], "w": ["Myopia blurs distance only.", "Hyperopia blurs near.", "Correct. Astigmatism = irregular curvature of cornea or lens, preventing a clear focus.", "Presbyopia is age-related near blur."], "m": false, "b": null, "x": false, "r": false, "d": 0.3, "t": "vision1.refraction", "ev": "Astigmatism, caused by irregular curvature of the cornea or lens, prevents the focusing of images, blurring vision."}, {"id": "q-vision1-06", "s": "vision1", "k": "bank", "q": "Which statements about rods and cones are correct? Select all that apply.", "o": ["Rods are concentrated in the peripheral retina", "Rods support night vision", "Cones are most dense in the fovea", "Cones give peripheral night vision", "Rods are most dense in the macula"], "a": [0, 1, 2], "w": ["True.", "True. Rods promote peripheral and night vision.", "True. The fovea, in the macula, has the densest cones.", "False. That is rods.", "False. The macula/fovea is cone-rich."], "m": true, "b": null, "x": false, "r": false, "d": 0.5, "t": "vision1.retina", "ev": "Rods are most highly concentrated in the peripheral retina, promoting peripheral and night vision."}, {"id": "q-vision1-07", "s": "vision1", "k": "bank", "q": "Fluid drains from the anterior chamber through the trabecular network into the:", "o": ["Lacrimal sac", "Canal of Schlemm", "Vitreous cavity", "Optic disk"], "a": [1], "w": ["The lacrimal sac drains tears, not aqueous humor.", "Correct. Aqueous humor reabsorbs through the trabecular network into the canal of Schlemm and then the venous system.", "Vitreous is behind the lens.", "The optic disk is where the optic nerve leaves."], "m": false, "b": null, "x": false, "r": false, "d": 0.4, "t": "vision1.aqueous", "ev": "Reabsorption occurs through the trabecular network(a meshlike structure) into the canal of Schlemm (scleral venous sinus), promoting movement into the venous system."}, {"id": "q-vision1-08", "s": "vision1", "k": "bank", "q": "Which describe eye movement types from the chapter? Select all that apply.", "o": ["Saccades: jumping from object A to object B", "Pursuit: smoothly following a moving object", "Convergence: both eyes turning inward", "Accommodation: eyes moving apart", "Nystagmus: normal smooth tracking"], "a": [0, 1, 2], "w": ["True.", "True.", "True.", "False. Accommodation is the lens changing shape.", "False. Nystagmus is abnormal, involuntary eye movement."], "m": true, "b": null, "x": false, "r": false, "d": 0.5, "t": "vision1.movement", "ev": "….) · Table 12.3 Extraocular Muscle Function · ![][image10] · Saccades: looking from object A to object B · Pursuit: smoothly following a moving object · Convergence/divergence: both eyes turning inward/both eyes turning outward · Vestibular: eyes sensing and adjusting to head movement via connections with nerves in t…"}, {"id": "q-vision1-09", "s": "vision1", "k": "bank", "q": "A child's eyes don't line up in the same direction, and the brain begins ignoring one eye. Which pair matches?", "o": ["Strabismus leading to amblyopia", "Amblyopia leading to strabismus", "Nystagmus leading to myopia", "Conjunctivitis leading to amblyopia"], "a": [0], "w": ["Correct. Strabismus (uncoordinated eye muscles) can cause amblyopia (lazy eye), lost visual detail that may not be fully correctable.", "Reversed: strabismus causes amblyopia.", "Not linked this way.", "Pink eye doesn't cause lazy eye."], "m": false, "b": null, "x": false, "r": false, "d": 0.5, "t": "vision1.movement", "ev": "Amblyopia, commonly known as “lazy eye,” may result from strabismus, leading to the loss of visual detail from uncoordinated eye movement and focus."}, {"id": "q-vision1-10", "s": "vision1", "k": "bank", "q": "Which describes viral conjunctivitis?", "o": ["Usually one eye, lots of watering, small amount of discharge", "Thick yellow-green discharge in both eyes", "Itching in both eyes after pollen exposure", "Painless loss of central vision"], "a": [0], "w": ["Correct. ", "Thick purulent discharge suggests bacterial.", "Allergic conjunctivitis is itchy and bilateral.", "That is macular degeneration."], "m": false, "b": null, "x": false, "r": false, "d": 0.5, "t": "vision1.protect", "ev": "…unctivitis are linked to the following causative factors: · Viral conjunctivitis · Usually affects only one eye · Associated with excessive eye watering and a small amount of discharge · Bacterial conjunctivitis · Usually affects both eyes · Associated with heavy discharge · Allergic conjunctivitis · Usually affects bo…"}, {"id": "q-vision2-02", "s": "vision2", "k": "bank", "q": "Which features fit open-angle glaucoma? Select all that apply.", "o": ["Painless", "Gradual onset", "Loss starts in the peripheral field", "Damage is irreversible", "Sudden eye pain with halos"], "a": [0, 1, 2, 3], "w": ["Correct. It doesn't hurt.", "Correct. It develops slowly.", "Correct. Peripheral vision goes first.", "Correct. Lost vision doesn't return.", "That's acute angle-closure glaucoma."], "m": true, "b": null, "x": false, "r": false, "d": 0.4, "t": "vision2.glaucoma", "ev": "If untreated, open-angle glaucoma can result in gradual, but irreversible, vision loss."}, {"id": "q-vision2-03", "s": "vision2", "k": "bank", "q": "Which findings fit an acute angle-closure glaucoma attack? Select all that apply.", "o": ["Eye pain and headache", "Nausea", "Rainbows around lights", "Blurred vision", "Slow painless peripheral loss over years"], "a": [0, 1, 2, 3], "w": ["True.", "True.", "True.", "True.", "False. That is open-angle glaucoma."], "m": true, "b": null, "x": false, "r": false, "d": 0.5, "t": "vision2.glaucoma", "ev": "Symptoms may include eye pain, headache, nausea, blurred vision, and “rainbows” around lights at night."}, {"id": "q-vision2-04", "s": "vision2", "k": "case", "q": "What is the priority concern?", "o": ["Allergic conjunctivitis; give antihistamine drops", "Acute angle-closure glaucoma; needs emergency care to prevent permanent vision loss", "Migraine with aura; dim the lights and wait", "Presbyopia; refer for reading glasses"], "a": [1], "w": ["Allergy doesn't cause severe pain with halos and nausea.", "Correct. A dark room dilates the pupil and can close the angle; IOP rises fast and optic nerve damage can be permanent.", "Halos plus a red, painful eye point to glaucoma, not migraine.", "Not an emergency refractive issue."], "m": false, "b": null, "x": false, "r": false, "d": 0.6, "t": "vision2.glaucoma", "ev": "An acute episode of angle-closure glaucoma may be induced by increased pupil dilation caused by drugs or by being in a darkened room, such as a movie theater.", "c": "A 67-year-old leaves a movie theater with sudden right eye pain, headache and nausea. She sees rainbows around lights and her vision is blurred.", "cn": "Eye pain after a movie"}, {"id": "q-vision2-05", "s": "vision2", "k": "bank", "q": "Which risk factors for glaucoma are listed in the chapter? Select all that apply.", "o": ["Age over 60", "Family history", "Long-term steroid use", "Diabetes and hypertension", "Myopia correction with contacts"], "a": [0, 1, 2, 3], "w": ["True.", "True.", "True.", "True.", "False. Not a listed risk factor."], "m": true, "b": null, "x": false, "r": false, "d": 0.5, "t": "vision2.glaucoma", "ev": "Long-term steroid use · In primary open-angle glaucoma, the cornea adapts to the increasing pressure without swelling, thereby not causing symptoms."}, {"id": "q-vision2-06", "s": "vision2", "k": "bank", "q": "How do glaucoma eye drops lower pressure? Match the correct mechanism.", "o": ["Miotics contract the pupil to increase fluid outflow", "Miotics dilate the pupil to decrease fluid", "Beta blockers increase fluid outflow", "Carbonic anhydrase inhibitors increase fluid production"], "a": [0], "w": ["Correct. Miotics constrict the pupil, opening the drainage angle.", "Dilation can trigger angle closure.", "Beta blockers decrease fluid levels.", "Carbonic anhydrase inhibitors decrease fluid."], "m": false, "b": null, "x": false, "r": false, "d": 0.6, "t": "vision2.glaucoma", "ev": "Pharmacologic · Miotics: drugs that contract the pupil, thereby increasing the outflow of fluid · Epinephrine-based: increase the outflow of fluid · Beta blockers: decrease fluid levels · Carbonic anhydrase inhibitors: decrease fluid levels · Alpha-adrenergic agon…"}, {"id": "q-vision2-07", "s": "vision2", "k": "bank", "q": "Which risk factors for macular degeneration does the chapter list? Select all that apply.", "o": ["Age older than 60", "Smoking", "Hypertension", "Obesity", "Long-term steroid use"], "a": [0, 1, 2, 3], "w": ["True.", "True.", "True.", "True.", "False. Steroids are listed for glaucoma, not MD."], "m": true, "b": null, "x": false, "r": false, "d": 0.5, "t": "vision2.md", "ev": "Risk factors for development of MD include: 1. Age older than 60 years 2. Smoking cigarettes 3. Hypertension 4. Being overweight or obese 5. Family history"}, {"id": "q-vision2-08", "s": "vision2", "k": "bank", "q": "Which client with macular degeneration needs follow-up most urgently?", "o": ["A client with wet MD whose central vision is worsening fast", "A client with dry MD and stable, fluctuating vision", "A client with presbyopia", "A client with mild myopia"], "a": [0], "w": ["Correct. Wet MD involves new leaky vessels and causes rapid loss.", "Dry MD progresses slowly.", "Presbyopia isn't urgent.", "Myopia isn't urgent."], "m": false, "b": null, "x": false, "r": false, "d": 0.5, "t": "vision2.md", "ev": "(Courtesy of Anatomical Chart Company.) · Wet macular degeneration, also called exudative macular degeneration is characterized by new blood vessel formation under the retina and macula, known as choroidal neovascularization; it causes far more vision loss than dry MD."}, {"id": "q-vision2-09", "s": "vision2", "k": "bank", "q": "The primary drug treatment for wet macular degeneration works by:", "o": ["blocking VEGF to stop new vessel growth", "lowering intraocular pressure", "replacing the lens", "contracting the pupil"], "a": [0], "w": ["Correct. Intraocular anti-VEGF drugs block formation of new blood vessels.", "That is glaucoma treatment.", "That is cataract surgery.", "That is a miotic."], "m": false, "b": null, "x": false, "r": false, "d": 0.5, "t": "vision2.md", "ev": "Intraocular use of drugs that block vascular endothelial growth factor (VEGF) is the primary pharmacologic treatment effective in blocking the formation of new blood vessels."}, {"id": "q-vision2-10", "s": "vision2", "k": "bank", "q": "A client with dry macular degeneration says the lines on her Amsler grid now look wavy. What should the nurse do first?", "o": ["Report it promptly as a sign of progressing MD", "Tell her to recheck in a year", "Test her distance vision with a Snellen chart instead", "Measure her eye pressure"], "a": [0], "w": ["Correct. The Amsler grid detects changes consistent with progressive MD.", "Waiting risks more vision loss.", "Snellen tests distance, not central distortion.", "Tonometry is a glaucoma test."], "m": false, "b": null, "x": false, "r": false, "d": 0.4, "t": "vision2.md", "ev": "If MD is suspected, further evaluation may include: · Amsler chart evaluation · Uses a grid (10 × 10 cm, about 4 × 4 in) containing 20.5-mm squares to a side, with white lines on a black background containing a central black spot · Evaluates changes in vision consistent with progressive MD · Fluorescein angiography · C…"}, {"id": "q-vision2-11", "s": "vision2", "k": "case", "q": "Which assessment finding is most expected?", "o": ["Loss of peripheral vision with normal central vision", "Trouble reading and recognizing faces from distorted central vision", "Painful red eye with halos", "Ear fullness and vertigo"], "a": [1], "w": ["Peripheral loss fits glaucoma.", "Correct. MD distorts central vision, making reading and face recognition hard.", "That is angle-closure glaucoma.", "That is Ménière disease."], "m": false, "b": null, "x": false, "r": false, "d": 0.4, "t": "vision2.md", "ev": "Consequences of MD include distortion of central vision; decreased ability to read, recognize faces or colors, or drive cars; and blindness.", "c": "A 74-year-old former smoker with hypertension says straight door frames look wavy and there's a dark spot in the center when she reads.", "cn": "Wavy lines, dark center spot"}, {"id": "q-vision2-12", "s": "vision2", "k": "bank", "q": "Which infant is at highest risk for retinopathy of prematurity?", "o": ["A 26-week preterm infant receiving supplemental oxygen", "A term infant in room air", "A term infant with jaundice", "A 4-year-old with myopia"], "a": [0], "w": ["Correct. Prematurity plus high oxygen raises ROP risk.", "Term birth in room air is low risk.", "Jaundice isn't an ROP risk.", "ROP is a disease of premature infants."], "m": false, "b": null, "x": false, "r": false, "d": 0.5, "t": "vision2.rop", "ev": "As the name implies, infants born prematurely have the highest risk for developing ROP."}, {"id": "q-vision2-13", "s": "vision2", "k": "bank", "q": "Which are manifestations of severe ROP? Select all that apply.", "o": ["Leukocoria (white pupils)", "Nystagmus", "Strabismus", "Severe myopia", "Rainbows around lights"], "a": [0, 1, 2, 3], "w": ["True.", "True.", "True.", "True.", "False. That is angle-closure glaucoma."], "m": true, "b": null, "x": false, "r": false, "d": 0.6, "t": "vision2.rop", "ev": "Manifestations of severe ROP may include: · Leukocoria (white pupils) · Nystagmus (abnormal eye movements) · Strabismus (crossed eyes) · Myopia (severe nearsightedness) · DIAGNOSIS · Ophthalmologic examination targets retinal blood vessels."}, {"id": "q-vision2-14", "s": "vision2", "k": "bank", "q": "Which ROP stage includes a completely detached retina?", "o": ["Stage II", "Stage III", "Stage IV", "Stage V"], "a": [3], "w": ["Moderately abnormal vessel growth.", "Severely abnormal growth.", "Partial detachment.", "Correct. "], "m": false, "b": null, "x": false, "r": false, "d": 0.5, "t": "vision2.rop", "ev": "…ood vessel growth and partially detached retina · Stage V: Completely detached retina · CLINICAL MANIFESTATIONS · Identifying clinical manifestations is challenging.…"}, {"id": "q-vision2-15", "s": "vision2", "k": "bank", "q": "A Snellen result of 6/12 (US: 20/40) means:", "o": ["the patient sees at 6 m (20 ft) what an average eye sees at 12 m (40 ft)", "the patient sees at 12 m (40 ft) what others see at 6 m (20 ft)", "40% vision loss", "near vision is impaired"], "a": [0], "w": ["Correct. ", "Reversed.", "Not a percentage.", "Snellen is a distance test."], "m": false, "b": null, "x": false, "r": false, "d": 0.4, "t": "vision2.screen", "ev": "A report of 6/6 (US: 20/20) means that a person can see clearly at 6 m (20 ft) what should be seen at 6 m (20 ft)."}, {"id": "q-hearing-06", "s": "hearing", "k": "bank", "q": "Conductive hearing loss is localized to the:", "o": ["outer or middle ear", "cochlea", "auditory nerve", "auditory cortex"], "a": [0], "w": ["Correct. Something blocks sound before it reaches the inner ear (cerumen, fluid, a stiff eardrum).", "Cochlear problems are sensorineural.", "Nerve problems are sensorineural.", "Brain problems are central auditory processing."], "m": false, "b": null, "x": false, "r": false, "d": 0.3, "t": "hearing.loss", "ev": "Conductive hearing loss is localized to the outer or middle ear, and it may be temporary or permanent."}, {"id": "q-hearing-07", "s": "hearing", "k": "bank", "q": "Which causes fit conductive hearing loss? Select all that apply.", "o": ["Cerumen impaction", "Middle ear fluid from otitis media", "Tumor obstructing the canal", "Presbycusis", "Noise damage to cochlear hair cells"], "a": [0, 1, 2], "w": ["True.", "True.", "True.", "False. Presbycusis is sensorineural.", "False. Hair-cell damage is sensorineural."], "m": true, "b": null, "x": false, "r": false, "d": 0.5, "t": "hearing.loss", "ev": "Obstruction can result from cerumen accumulation or a tumor, which diminishes sound movement to the middle ear."}, {"id": "q-hearing-08", "s": "hearing", "k": "bank", "q": "Which statements about acute otitis media are true? Select all that apply.", "o": ["It's the most frequent diagnosis in febrile children", "It often follows a respiratory infection", "Otoscopy shows a red, possibly bulging tympanic membrane", "A gray eardrum means acute infection", "It is an inner-ear disorder"], "a": [0, 1, 2], "w": ["True.", "True.", "True.", "False. Gray suggests otitis media with effusion.", "False. It's the middle ear."], "m": true, "b": null, "x": false, "r": false, "d": 0.5, "t": "hearing.om", "ev": "PATHOPHYSIOLOGY · Acute otitis media (AOM), infection in the middle ear, is the most frequent diagnosis in febrile children in the United States and the world."}, {"id": "q-hearing-09", "s": "hearing", "k": "bank", "q": "Which client is at highest risk for otitis media?", "o": ["A toddler", "A 16-year-old", "A 40-year-old", "A 70-year-old"], "a": [0], "w": ["Correct. Young children's auditory tubes are shorter and narrower, so fluid and germs reach the middle ear easily.", "Older children's tubes have matured.", "Adults are lower risk.", "Not the highest-risk group."], "m": false, "b": null, "x": false, "r": false, "d": 0.5, "t": "hearing.om", "ev": "The auditory tube is shorter and narrower in children, increasing the likelihood of auditory tube blockage and pressure."}, {"id": "q-hearing-10", "s": "hearing", "k": "case", "q": "Which findings fit otitis media? Select all that apply.", "o": ["Ear pain and fever", "Enlarged periauricular lymph nodes", "Runny nose", "Impaired hearing", "Leukocoria"], "a": [0, 1, 2, 3], "w": ["True.", "True.", "True. Rhinorrhea is listed.", "True.", "False. Leukocoria is ROP."], "m": true, "b": null, "x": false, "r": false, "d": 0.4, "t": "hearing.om", "ev": "CLINICAL MANIFESTATIONS · Clinical manifestations of otitis media include: · Acute ear pain · Enlarged periauricular lymph nodes · Rhinorrhea (runny nose) · Fever · Impaired hearing · Examination of the ears using an otoscope may reveal gray or red tympanic membrane in OME and AOM, respectively (Fig.", "c": "A 2-year-old has tugged at his right ear for a day after a cold. Temp 39.2 °C (102.6 °F). He is fussy and not responding to his name as usual.", "cn": "Toddler pulling his ear"}, {"id": "q-hearing-11", "s": "hearing", "k": "bank", "q": "A child with otitis media suddenly has drainage from the ear and less pain. What should the nurse do first?", "o": ["Report a likely perforated tympanic membrane", "Tell the parents the infection is cured", "Clean deep in the canal with a cotton swab", "Irrigate the ear"], "a": [0], "w": ["Correct. Sudden drainage with pain relief suggests the eardrum ruptured.", "The infection isn't resolved.", "Don't put anything deep in the canal.", "Never irrigate a possibly perforated ear."], "m": false, "b": null, "x": false, "r": false, "d": 0.6, "t": "hearing.om", "ev": "White areas on the tympanic membrane may be scarring from previous perforations. Discharge in the ear canal indicates possible acute perforation."}, {"id": "q-hearing-12", "s": "hearing", "k": "bank", "q": "Ménière disease is caused by:", "o": ["increased endolymph swelling the membranous labyrinth", "middle-ear infection", "cerumen impaction", "optic nerve compression"], "a": [0], "w": ["Correct. Endolymphatic hydrops dilates the membranous labyrinth, disrupting hearing and balance.", "Otitis media is middle ear.", "Conductive cause.", "Unrelated."], "m": false, "b": null, "x": false, "r": false, "d": 0.5, "t": "hearing.meniere", "ev": "The increased volume of endolymph (endolymph hydrops) causes dilation of the membranous labyrinth, altering hearing and balance."}, {"id": "q-hearing-13", "s": "hearing", "k": "bank", "q": "Which findings should the nurse expect in Ménière disease? Select all that apply.", "o": ["Episodic vertigo", "Sensorineural hearing loss", "Tinnitus", "Ear fullness or pressure", "Fever with a red eardrum"], "a": [0, 1, 2, 3], "w": ["Correct. Vertigo comes in episodes.", "Correct. Hearing loss is sensorineural.", "Correct. Tinnitus is part of the picture.", "Correct. Fullness or pressure is common.", "That's otitis media."], "m": true, "b": null, "x": false, "r": false, "d": 0.4, "t": "hearing.meniere", "ev": "Vertigo, a feeling of spinning, is a hallmark of Ménière disease and is often associated with nausea and vomiting."}, {"id": "q-hearing-14", "s": "hearing", "k": "bank", "q": "Which teaching fits Ménière disease? Select all that apply.", "o": ["Reduce salt intake", "Stop smoking", "Take antiemetics and vertigo drugs as prescribed", "Increase daily salt to raise fluid volume", "Stop all fluids"], "a": [0, 1, 2], "w": ["True. Regulating body fluid can reduce attacks.", "True.", "True.", "False. Less salt, not more.", "False. Fluid restriction this extreme is not advised."], "m": true, "b": null, "x": false, "r": false, "d": 0.5, "t": "hearing.meniere", "ev": "Regulation of body fluid through reduced salt intake or diuretic therapy, smoking cessation, and stress reduction may decrease symptom occurrence."}, {"id": "q-hearing-15", "s": "hearing", "k": "bank", "q": "First-line drug to reduce frequency and severity of Ménière attacks:", "o": ["Betahistine", "Amoxicillin", "A miotic", "A triptan"], "a": [0], "w": ["Correct. Betahistine, a histamine analog, is first-line.", "Antibiotics treat bacterial AOM.", "Miotics are for glaucoma.", "Triptans are for migraine."], "m": false, "b": null, "x": false, "r": false, "d": 0.5, "t": "hearing.meniere", "ev": "Betahistine, a histamine analog, is the first-line treatment to reduce the frequency and severity of symptoms."}, {"id": "q-hearing-16", "s": "hearing", "k": "bank", "q": "A cochlear implant is best described as:", "o": ["an electrode device that stimulates the cochlear nerve, giving a sense of sound but not normal hearing", "a hearing aid that amplifies sound into the canal", "surgery to clear middle-ear fluid", "a cure that restores normal hearing"], "a": [0], "w": ["Correct. ", "Hearing aids amplify; implants bypass the damaged parts.", "That is not what an implant does.", "It does not restore normal hearing."], "m": false, "b": null, "x": false, "r": false, "d": 0.4, "t": "hearing.tx", "ev": "Cochlear implants are artificial devices surgically placed behind the ear."}, {"id": "q-hearing-17", "s": "hearing", "k": "bank", "q": "Which conditions does the chapter link to tinnitus? Select all that apply.", "o": ["Noise-induced hearing loss", "Presbycusis", "Hypertension", "Atherosclerosis", "A cerumen-free ear canal"], "a": [0, 1, 2, 3], "w": ["Correct. Noise damage is a cause.", "Correct. Age-related hearing loss is a cause.", "Correct. Hypertension is listed.", "Correct. Atherosclerosis is listed.", "That isn't a cause."], "m": true, "b": null, "x": false, "r": false, "d": 0.4, "t": "hearing.loss", "ev": "Tinnitus (ringing or whistling in the ears) may be caused by noise-induced hearing loss, sensorineural hearing loss consistent with aging (presbycusis), hypertension, atherosclerosis, head injury, or cochlear infection/inflammation."}, {"id": "q-hearing-18", "s": "hearing", "k": "bank", "q": "A congested client reports ear pressure and pain as the plane descends. What should the nurse suspect first?", "o": ["Barotrauma", "Presbycusis", "Ménière disease", "Otosclerosis"], "a": [0], "w": ["Correct. Barotrauma is the ear's failure to equalize pressure, most often in air travel.", "Presbycusis is age-related hearing loss.", "Ménière is an inner-ear fluid problem.", "Otosclerosis is bone growth in the middle ear."], "m": false, "b": null, "x": false, "r": false, "d": 0.4, "t": "hearing.mid", "ev": "Most commonly seen in air travel and sea diving, barotrauma results from middle ear pressure in parallel with atmospheric pressure."}, {"id": "q-other-02", "s": "other", "k": "bank", "q": "Which sense has the greatest influence on flavor?", "o": ["Taste", "Smell", "Touch", "Hearing"], "a": [1], "w": ["Taste contributes but smell dominates.", "Correct. Olfactory stimulation has the greatest influence on flavor.", "Texture helps but isn't the biggest factor.", "No."], "m": false, "b": null, "x": false, "r": false, "d": 0.4, "t": "other.smell", "ev": "Of these, the olfactory stimulation of the sense of smell has the greatest influence."}, {"id": "q-other-03", "s": "other", "k": "bank", "q": "A patient describes a lingering, unpleasant taste with nothing in the mouth. This is:", "o": ["Phantom taste perception", "Anosmia", "Aura", "Tinnitus"], "a": [0], "w": ["Correct. ", "Anosmia is loss of smell.", "Aura is a migraine warning.", "Tinnitus is ear ringing."], "m": false, "b": null, "x": false, "r": false, "d": 0.3, "t": "other.taste", "ev": "Conditions of taste disorders include phantom taste perception (lingering, unpleasant taste), reduced ability to taste one or all of the five basic tastes, or distortion of flavor such as persistent metallic taste."}, {"id": "q-other-04", "s": "other", "k": "bank", "q": "Which are diagnostic criteria for fibromyalgia? Select all that apply.", "o": ["Chronic musculoskeletal pain for at least 3 months", "Pain in 12 of 18 tender point sites", "Fatigue", "Elevated inflammatory markers", "Loss of bone mass on x-ray"], "a": [0, 1, 2], "w": ["True.", "True.", "True.", "False. There's no definitive evidence of inflammation.", "False. Bone loss isn't part of fibromyalgia; x-rays and labs are normal."], "m": true, "b": null, "x": false, "r": false, "d": 0.5, "t": "other.fibro", "ev": "Diagnostic criteria include subjective findings of fatigue and chronic musculoskeletal pain of at least 3 months’ duration… Pain must be present in 12 of the 18 tender point sites for diagnosis."}, {"id": "q-other-05", "s": "other", "k": "case", "q": "Which finding is consistent with fibromyalgia?", "o": ["Nonrestorative sleep, fatigue and low mood", "Swollen, warm joints", "Fever and weight loss", "Muscle biopsy showing inflammation"], "a": [0], "w": ["Correct. Sleep problems, fatigue, depression and anxiety often coexist; serotonin may be low.", "Joint inflammation suggests arthritis.", "Systemic signs suggest another cause.", "No muscle inflammation is found."], "m": false, "b": null, "x": false, "r": false, "d": 0.4, "t": "other.fibro", "ev": "Nonrestorative sleep, consistent with manifestations of fatigue, often accompanies fibromyalgia.", "c": "A 58-year-old woman reports 6 months of aching in her neck, shoulders and hips. She wakes up tired, has trouble concentrating, and says light pressure on certain spots \"really hurts.\" Labs are normal.", "cn": "Widespread aching, normal labs"}, {"id": "q-other-06", "s": "other", "k": "bank", "q": "Which drug class is first-line for fibromyalgia symptoms?", "o": ["Tricyclic antidepressants", "Opioids", "Antibiotics", "Anti-VEGF injections"], "a": [0], "w": ["Correct. TCAs (amitriptyline, cyclobenzaprine) are first-line.", "Not first-line.", "No infection.", "That is wet MD."], "m": false, "b": null, "x": false, "r": false, "d": 0.5, "t": "other.fibro", "ev": "Tricyclic antidepressants (e.g., amitriptyline, cyclobenzaprine) are used as first-line therapy to manage symptoms."}, {"id": "q-other-07", "s": "other", "k": "bank", "q": "Migraine aura is best described as:", "o": ["short focal neurologic events (visual, auditory, sensory or motor) before the headache", "the headache itself", "nausea after the headache", "a ringing in the ears"], "a": [0], "w": ["Correct. ", "The headache is a separate phase.", "Postdrome/associated symptoms.", "That is tinnitus."], "m": false, "b": null, "x": false, "r": false, "d": 0.4, "t": "other.migraine", "ev": "Migraine aura includes short-duration, focal neurologic events including visual, auditory, somatosensory, or motor symptoms."}, {"id": "q-other-08", "s": "other", "k": "bank", "q": "Which features fit migraine without aura criteria? Select all that apply.", "o": ["Lasts 4 to 72 hours", "Unilateral and pulsating", "Moderate or severe intensity", "Worsened by routine physical activity", "Always preceded by visual aura"], "a": [0, 1, 2, 3], "w": ["True.", "True.", "True.", "True.", "False. By definition, no aura."], "m": true, "b": null, "x": false, "r": false, "d": 0.6, "t": "other.migraine", "ev": "Migraine phases include prodrome (few hours to days), aura (5 to 60 minutes), headache (4 to 72 hours), and postdrome (24 to 48 hours)."}, {"id": "q-other-09", "s": "other", "k": "bank", "q": "Moderate-to-severe migraine symptoms persist after simple analgesics. What's recommended next?", "o": ["A triptan", "Betahistine", "Antibiotics", "Miotic drops"], "a": [0], "w": ["Correct. If symptoms persist and are moderate to severe, triptans are recommended.", "For Ménière.", "No infection.", "For glaucoma."], "m": false, "b": null, "x": false, "r": false, "d": 0.5, "t": "other.migraine", "ev": "If symptoms persist and are moderate to severe, triptans are recommended."}, {"id": "q-basics-01", "s": "basics", "k": "bank", "q": "Which of the following is not a maj
